version: "2"
sql:
  - engine: postgresql
    schema: internal/migrations/sql/schema-swift.sql
    queries: internal/modules/projects/queries.sql
    gen:
      go:
        package: db
        out: internal/modules/projects/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
          - db_type: pg_catalog.timestamptz
            nullable: true
            go_type:
              type: time.Time
