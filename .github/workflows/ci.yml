name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # parity/stubs/llm as a deployable image, for hermes-stub on staging
  # (wave-5-plan.md, "G2 for chat"). Built on every PR, pushed from main, tagged by
  # commit. Nothing deploys it: the Deployment is an infra PR, pinned to a tag.
  stub-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: ${{ github.event_name == 'push' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: parity/stubs/llm/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/luminavault/lumina-hermes-stub:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha,scope=stub-image
          cache-to: type=gha,mode=max,scope=stub-image

  # Prints how many Swift test files have no Go test, parity scenario or waiver. Not a
  # gate yet (`make swift-test-coverage` is): it fails until the end of the migration.
  # The Swift repo is public, so the default token can read it at the pinned commit.
  swift-test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - id: swift
        run: |
          echo "sha=$(cut -d: -f2 parity/SWIFT_IMAGE)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: LuminaVault/LuminaVaultServer
          ref: ${{ steps.swift.outputs.sha }}
          path: swift-checkout
          sparse-checkout: Tests/AppTests
      - run: python3 scripts/swift-test-coverage.py --swift-tests swift-checkout/Tests/AppTests --count | tee -a "$GITHUB_STEP_SUMMARY"

  # Gate G1 (roadmap): every scenario under parity/scenarios must show zero
  # differences between the Swift image pinned in parity/SWIFT_IMAGE and this
  # commit's Go server. Swift transcripts are kept for the G2 staging smoke.
  # Needs the LuminaVaultServer GHCR package to grant this repo read access.
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bring up Swift, Go and Postgres
        run: PARITY_SWIFT_IMAGE="$(cat parity/SWIFT_IMAGE)" scripts/parity-up.sh
      - name: Bundled skills are byte-identical with the Swift image
        run: scripts/check-skills-sync.sh
      - name: Self-test (Swift vs Swift, proves scenarios are deterministic)
        run: |
          go run ./parity/cmd/parity compare \
            --swift http://localhost:18080 --swift-db postgres://lv:lv@localhost:15432/parity_swift \
            --go http://localhost:18082 --go-db postgres://lv:lv@localhost:15432/parity_swift2 \
            --swift-files docker:lvparity-swift-1:/tmp/luminavault \
            --go-files docker:lvparity-swift2-1:/tmp/luminavault
      - name: Reset databases for the Go comparison
        run: PARITY_SWIFT_IMAGE="$(cat parity/SWIFT_IMAGE)" scripts/parity-up.sh
      - name: Compare
        run: |
          go run ./parity/cmd/parity compare \
            --swift http://localhost:18080 --swift-db postgres://lv:lv@localhost:15432/parity_swift \
            --go http://localhost:18081 --go-db postgres://lv:lv@localhost:15432/parity_go \
            --swift-files docker:lvparity-swift-1:/tmp/luminavault \
            --go-files docker:lvparity-go-1:/tmp/luminavault \
            --save-swift-transcripts swift-transcripts
      - name: Compare the switch states
        run: PARITY_SWIFT_IMAGE="$(cat parity/SWIFT_IMAGE)" scripts/parity-switches.sh
      - name: Server logs on failure
        if: failure()
        run: docker compose -f docker-compose.parity.yml -p lvparity --profile servers --profile switched logs --tail 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-transcripts
          path: swift-transcripts
          if-no-files-found: ignore
