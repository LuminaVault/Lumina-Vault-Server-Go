name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Gate G1 (roadmap): every scenario under parity/scenarios must show zero
  # differences between the Swift image pinned in parity/SWIFT_IMAGE and this
  # commit's Go server. Swift transcripts are kept for the G2 staging smoke.
  # Needs the LuminaVaultServer GHCR package to grant this repo read access.
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bring up Swift, Go and Postgres
        run: PARITY_SWIFT_IMAGE="$(cat parity/SWIFT_IMAGE)" scripts/parity-up.sh
      - name: Self-test (Swift vs Swift, proves scenarios are deterministic)
        run: |
          go run ./parity/cmd/parity compare \
            --swift http://localhost:18080 --swift-db postgres://lv:lv@localhost:15432/parity_swift \
            --go http://localhost:18082 --go-db postgres://lv:lv@localhost:15432/parity_swift2
      - name: Reset databases for the Go comparison
        run: PARITY_SWIFT_IMAGE="$(cat parity/SWIFT_IMAGE)" scripts/parity-up.sh
      - name: Compare
        run: |
          go run ./parity/cmd/parity compare \
            --swift http://localhost:18080 --swift-db postgres://lv:lv@localhost:15432/parity_swift \
            --go http://localhost:18081 --go-db postgres://lv:lv@localhost:15432/parity_go \
            --save-swift-transcripts swift-transcripts
      - name: Server logs on failure
        if: failure()
        run: docker compose -f docker-compose.parity.yml -p lvparity --profile servers logs --tail 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-transcripts
          path: swift-transcripts
          if-no-files-found: ignore
