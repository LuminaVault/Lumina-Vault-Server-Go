# GitOps release, mirroring LuminaVaultServer's release.yml: after CI passes
# on main, build + push the image to GHCR, then commit the new tag into
# LuminaVaultInfra's api staging values. ArgoCD auto-syncs staging.
# Production stays human-gated: the api production tag moves only through the
# infra repo's promote workflow and a reviewed PR.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_REPOSITORY: ghcr.io/luminavault/luminavaultserver-go
  INFRA_REPO: LuminaVault/LuminaVaultInfra
  # Space-separated. Each file is bumped only while it runs the Go image (see the
  # bump step). apps/api-go was retired in LuminaVaultInfra#622 (D1 step 10).
  STAGING_VALUES: apps/api/values-staging.yaml

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.refs.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: refs
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "tag=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ steps.refs.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.refs.outputs.tag }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-staging:
    name: Bump api staging tag in LuminaVaultInfra
    runs-on: ubuntu-latest
    needs: build
    # One bump at a time: two runs racing can still interleave their pushes.
    concurrency:
      group: bump-api-go-staging
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Validate infra token
        env:
          INFRA_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          if [ -z "$INFRA_TOKEN" ]; then
            echo "::error::INFRA_REPO_TOKEN secret is not set (fine-grained PAT, contents read/write on ${INFRA_REPO})."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra
      - name: Commit staging tag bump
        working-directory: infra
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GO_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Never move staging backwards. CI runs for two main commits can finish
          # out of order, and a last-writer-wins bump then rewinds staging to the
          # older image (2026-11-12: cf7fb73 replaced 261f359 and crash-looped
          # api-go-staging on LV_GO_JOBS=*). Bump only when TAG is ahead of what
          # staging runs; a tag the compare API can't place (e.g. a manual
          # dispatch from a branch) is bumped as before.
          #
          # Each file in STAGING_VALUES is bumped only while it runs the Go image
          # (D5 step 2): apps/api/values-staging.yaml joins once the api-staging
          # release swaps to Go (D1 step 7), and a Go SHA is never written onto
          # the Swift repository.
          files_to_bump() {
            for f in $STAGING_VALUES; do
              [ -f "$f" ] || { echo "::notice::${f} does not exist; skipping" >&2; continue; }
              repo="$(yq '.image.repository // ""' "$f")"
              if [ -n "$repo" ] && [ "$repo" != "$IMAGE_REPOSITORY" ]; then
                echo "::notice::${f} runs ${repo}, not ${IMAGE_REPOSITORY}; skipping" >&2
                continue
              fi
              if [ -z "$repo" ]; then
                echo "::notice::${f} sets no image.repository; skipping" >&2
                continue
              fi
              current="$(yq '.image.tag' "$f")"
              if [ "$current" = "$TAG" ]; then
                echo "${f} already at ${TAG}" >&2
                continue
              fi
              status="$(gh api "repos/${GO_REPO}/compare/${TAG}...${current}" --jq .status 2>/dev/null || echo unknown)"
              if [ "$status" = "ahead" ]; then
                echo "::notice::${f} runs ${current}, which is newer than ${TAG}; not bumping backwards" >&2
                continue
              fi
              echo "$f"
            done
          }
          bump() {
            files="$(files_to_bump)"
            [ -n "$files" ] || return 1
            for f in $files; do
              yq -i ".image.tag = \"${TAG}\"" "$f"
              git add "$f"
            done
            git commit -m "api staging → ${TAG:0:12} (Lumina-Vault-Server-Go@${TAG})"
          }
          git config user.name "lumina-ci"
          git config user.email "ci@luminavault.fyi"
          bump || exit 0
          git push origin HEAD:main || {
            git reset -q --hard HEAD~1
            git pull -q --rebase origin main
            bump || exit 0
            git push origin HEAD:main
          }
