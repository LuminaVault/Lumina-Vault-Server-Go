# GitOps release, mirroring LuminaVaultServer's release.yml: after CI passes
# on main, build + push the image to GHCR, then commit the new tag into
# LuminaVaultInfra's api-go staging values. ArgoCD auto-syncs staging.
# Production stays human-gated: the api-go production tag and every
# ingress.extraPaths flip go through reviewed infra PRs (roadmap, recipe step 7).
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_REPOSITORY: ghcr.io/luminavault/luminavaultserver-go
  INFRA_REPO: LuminaVault/LuminaVaultInfra
  STAGING_VALUES: apps/api-go/values-staging.yaml

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.refs.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: refs
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "tag=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ steps.refs.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.refs.outputs.tag }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-staging:
    name: Bump api-go staging tag in LuminaVaultInfra
    runs-on: ubuntu-latest
    needs: build
    # One bump at a time: two runs racing can still interleave their pushes.
    concurrency:
      group: bump-api-go-staging
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Validate infra token
        env:
          INFRA_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          if [ -z "$INFRA_TOKEN" ]; then
            echo "::error::INFRA_REPO_TOKEN secret is not set (fine-grained PAT, contents read/write on ${INFRA_REPO})."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra
      - name: Commit staging tag bump
        working-directory: infra
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GO_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f "$STAGING_VALUES" ]; then
            echo "::notice::${STAGING_VALUES} does not exist yet (Phase 3 Task 3.2); skipping bump"
            exit 0
          fi
          # Never move staging backwards. CI runs for two main commits can finish
          # out of order, and a last-writer-wins bump then rewinds staging to the
          # older image (2026-11-12: cf7fb73 replaced 261f359 and crash-looped
          # api-go-staging on LV_GO_JOBS=*). Bump only when TAG is ahead of what
          # staging runs; a tag the compare API can't place (e.g. a manual
          # dispatch from a branch) is bumped as before.
          should_bump() {
            current="$(yq '.image.tag' "$STAGING_VALUES")"
            if [ "$current" = "$TAG" ]; then
              echo "staging already at ${TAG}"
              return 1
            fi
            status="$(gh api "repos/${GO_REPO}/compare/${TAG}...${current}" --jq .status 2>/dev/null || echo unknown)"
            if [ "$status" = "ahead" ]; then
              echo "::notice::staging runs ${current}, which is newer than ${TAG}; not bumping backwards"
              return 1
            fi
            return 0
          }
          should_bump || exit 0
          yq -i ".image.tag = \"${TAG}\"" "$STAGING_VALUES"
          git config user.name "lumina-ci"
          git config user.email "ci@luminavault.fyi"
          git add "$STAGING_VALUES"
          git commit -m "api-go staging → ${TAG:0:12} (Lumina-Vault-Server-Go@${TAG})"
          git push origin HEAD:main || {
            git reset -q --hard HEAD~1
            git pull -q --rebase origin main
            should_bump || exit 0
            yq -i ".image.tag = \"${TAG}\"" "$STAGING_VALUES"
            git add "$STAGING_VALUES"
            git commit -m "api-go staging → ${TAG:0:12} (Lumina-Vault-Server-Go@${TAG})"
            git push origin HEAD:main
          }
