# Models only (decisions.md D2); handlers are hand-written on Echo v5.
# include-operation-ids = this module's routes in docs/migration/routes.json.
package: community
output: internal/modules/community/models.gen.go
generate:
  models: true
output-options:
  include-operation-ids: [adminCommunityDailyRun, communityAdminDecision, communityAdminSuspend, communityAdminQueue, communityListBlocks, communityBlock, communityUnblock, communityTodayDaily, communityMe, communityListThreads, communityCreateThread, communityDeletePost, communityGetPost, communityListReplies, communityCreateReply, communityReportPost, communityUpsertProfile]
  type-mapping:
    string:
      formats:
        uuid: { type: wire.UUID, import: lumina/internal/wire }
        date-time: { type: wire.Time, import: lumina/internal/wire }
        date: { type: string }
