# Models only (decisions.md D2); handlers are hand-written on Echo v5.
# include-operation-ids = this module's routes in docs/migration/routes.json.
package: marketplace
output: internal/modules/marketplace/models.gen.go
generate:
  models: true
output-options:
  include-operation-ids: [marketplaceAdminPublishers, marketplaceAdminPublisherDecision, marketplaceAdminSubmissions, marketplaceAdminDecision, marketplaceAdminRevokeVersion, marketplaceList, marketplaceDetail, marketplaceInstall, marketplaceRate, marketplaceReviews, marketplaceRunTool, marketplaceUpgrade, marketplacePublisherGet, marketplacePublisherApply, marketplacePublisherCreatePlugin, marketplacePublisherUploadArtifact, marketplacePublisherCreateVersion, marketplacePublisherSubmitVersion, marketplacePublisherSubmissions]
  type-mapping:
    string:
      formats:
        uuid: { type: wire.UUID, import: lumina/internal/wire }
        date-time: { type: wire.Time, import: lumina/internal/wire }
