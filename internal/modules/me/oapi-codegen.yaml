# Models only (decisions.md D2); handlers are hand-written on Echo v5.
# include-operation-ids = this module's routes in docs/migration/routes.json.
package: me
output: internal/modules/me/models.gen.go
generate:
  models: true
output-options:
  include-operation-ids: [meToday, meBrief, meBriefCardFeedback, meRecap, mePeriodRecap, meResurface, meLearned, meCommitmentsList, meCommitmentUpdate, meLastKnownLocation, meForgetLastKnownLocation, apnsPrefsGet, apnsPrefsPut]
  type-mapping:
    string:
      formats:
        uuid: { type: wire.UUID, import: lumina/internal/wire }
        date-time: { type: wire.Time, import: lumina/internal/wire }
        date: { type: string }
