# Models only (decisions.md D2); handlers are hand-written on Echo v5.
# include-operation-ids = this module's routes in docs/migration/routes.json.
package: calendar
output: internal/modules/calendar/models.gen.go
generate:
  models: true
output-options:
  include-operation-ids: [calendarConnect, calendarDisconnect, calendarEvents, calendarCreateEvent, calendarEventBrief, calendarOAuthCallback, calendarStatus, appleCalendarSync]
  type-mapping:
    string:
      formats:
        uuid: { type: wire.UUID, import: lumina/internal/wire }
        date-time: { type: wire.Time, import: lumina/internal/wire }
        date: { type: string }
