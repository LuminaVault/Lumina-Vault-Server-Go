# Models only (decisions.md D2); handlers are hand-written on Echo v5.
# include-operation-ids = this module's routes in docs/migration/routes.json.
package: vault
output: internal/modules/vault/models.gen.go
generate:
  models: true
output-options:
  include-operation-ids: [vaultUpload, vaultList, vaultMove, vaultRead, vaultDelete, vaultExport, vaultCreate, vaultIndexStatus, vaultLint, vaultContext, vaultDocumentLinks, vaultStatus]
  type-mapping:
    string:
      formats:
        uuid: { type: wire.UUID, import: lumina/internal/wire }
        date-time: { type: wire.Time, import: lumina/internal/wire }
