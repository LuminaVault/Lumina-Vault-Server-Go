# Models only (decisions.md D2); handlers are hand-written on Echo v5.
# include-operation-ids = this module's routes in docs/migration/routes.json.
package: meproviders
output: internal/modules/meproviders/models.gen.go
generate:
  models: true
output-options:
  include-operation-ids: [providersCatalog, providersList, providerCredentialPut, providerCredentialDelete, providerCredentialTest, providerModelsList, providerPoolList, providerPoolAdd, providerPoolDelete, llmPreferencesGet, llmPreferencesPut, connectionsSummary, connectionsTestAll, connectionDiagnosticEvents]
  type-mapping:
    string:
      formats:
        uuid: { type: wire.UUID, import: lumina/internal/wire }
        date-time: { type: wire.Time, import: lumina/internal/wire }
