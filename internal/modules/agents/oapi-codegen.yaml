# Models only (decisions.md D2); handlers are hand-written on Echo v5.
# include-operation-ids = this module's routes in docs/migration/routes.json.
package: agents
output: internal/modules/agents/models.gen.go
generate:
  models: true
output-options:
  include-operation-ids:
    - agentsInstances
    - agentsSessions
    - agentsSessionMessages
    - agentsRoomCandidates
    - agentsRoomsList
    - agentsRoomsCreate
    - agentsRoomsGet
    - agentsRoomsDelete
    - agentsRoomsPost
    - agentsRoomsStop
  type-mapping:
    string:
      formats:
        uuid: { type: wire.UUID, import: lumina/internal/wire }
        date-time: { type: wire.Time, import: lumina/internal/wire }
