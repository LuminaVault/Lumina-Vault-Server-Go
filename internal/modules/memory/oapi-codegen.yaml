# Models only (decisions.md D2); handlers are hand-written on Echo v5.
# include-operation-ids = this module's routes in docs/migration/routes.json.
# memorySearch is held on Swift (modules.yaml heldPaths) and left out.
package: memory
output: internal/modules/memory/models.gen.go
generate:
  models: true
output-options:
  include-operation-ids:
    - meSuggestions
    - memoryList
    - memoryFacets
    - memoryGraph
    - localMemorySync
    - memoryUpsert
    - memoryDelete
    - memoryGet
    - memoryPatch
    - memoryLineage
    - memoryProvenance
    - memoryRelated
    - memoryReview
  type-mapping:
    string:
      formats:
        uuid: { type: wire.UUID, import: lumina/internal/wire }
        date-time: { type: wire.Time, import: lumina/internal/wire }
