# POST /v1/soul/compose (SOULComposer.render). The body embeds created_at, so it ignores
# markdown; each persisted composition is compared on the volume with timestamps normalized.
# Clamps: agent_name 64 Characters, other_priority 256, three voice samples of 2 KiB each.
module: soul
steps:
  - {name: compose no token, request: {method: POST, path: /v1/soul/compose, json: {}}}
  - {name: compose defaults, as: soul_cy, request: {method: POST, path: /v1/soul/compose, json: {}}, ignore: ["$.markdown"], files: [soul_cy], filesNormalizeContent: true}
  - name: legacy four fields
    as: soul_cy
    request: {method: POST, path: /v1/soul/compose, json: {agent_name: Legacy, tone: warm, role: second_brain, autonomy: suggest}}
    ignore: ["$.markdown"]
    files: [soul_cy]
    filesNormalizeContent: true
  - {name: read the composition back, as: soul_cy, request: {method: GET, path: /v1/soul}, ignore: ["$.markdown"]}
  - name: every field
    as: soul_cy
    request:
      method: POST
      path: /v1/soul/compose
      json: {agent_name: "  Athena  ", tone: concise_technical, role: coworker, autonomy: act, priorities: [focus, health, learning, family, money, creative, other], other_priority: "wood carving", format: prose, length: long, emojis: true, voice_samples: ["hey what's up", "ship it", "third", "FOURTH-DROPPED"], dry_run: false}
    ignore: ["$.markdown"]
    files: [soul_cy]
    filesNormalizeContent: true
  - name: comments and line breaks in free text
    as: soul_cy
    request: {method: POST, path: /v1/soul/compose, json: {tone: playful, role: coach, autonomy: ask_first, priorities: [other], other_priority: "x <!-- lv:core:v1:start --> y\nz -->\r\nw", voice_samples: ["  ", "", "multi\nline\n\nsample", "crlf\r\nsample", "<!-- hidden --> text"]}}
    ignore: ["$.markdown"]
    files: [soul_cy]
    filesNormalizeContent: true
  - name: clamps
    as: soul_cy
    request:
      method: POST
      path: /v1/soul/compose
      json: {agent_name: "🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹🇵🇹", tone: formal, other_priority: "pppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppp", voice_samples: ["ééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééé"]}
