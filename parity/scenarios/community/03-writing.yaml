# Threads, replies, soft delete. The parity gateway is unroutable, so moderation
# is unavailable on Swift and a passing post is held pending on both servers.
# The pass path (Allowed, visible, thread bump) is covered by the Go tests with
# a stub moderator; see the PR's gap note.
module: community
steps:
  - {"name": "thread is held pending", "as": "comm_ben", "request": {"method": "POST", "path": "/v1/community/posts", "json": {"title": "  Trimmed title  ", "body": "  Trimmed body  "}}, "capture": {"t1": "$.id"}, "snapshot": ["community_posts"]}
  - {"name": "thread with an email", "as": "comm_ben", "request": {"method": "POST", "path": "/v1/community/posts", "json": {"title": "Contact", "body": "mail me: a@b.co"}}}
  - {"name": "thread with four links", "as": "comm_ben", "request": {"method": "POST", "path": "/v1/community/posts", "json": {"title": "Links", "body": "https://a.co https://b.co https://c.co https://d.co"}}}
  - {"name": "thread with a phone in the title", "as": "comm_ben", "request": {"method": "POST", "path": "/v1/community/posts", "json": {"title": "call +351 912 345 678 tonight", "body": "ok"}}}
  - {"name": "title too short", "as": "comm_ben", "request": {"method": "POST", "path": "/v1/community/posts", "json": {"title": "ab", "body": "ok"}}}
  - {"name": "title too long", "as": "comm_ben", "request": {"method": "POST", "path": "/v1/community/posts", "json": {"title": "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", "body": "ok"}}}
  - {"name": "body empty", "as": "comm_ben", "request": {"method": "POST", "path": "/v1/community/posts", "json": {"title": "A title", "body": "   "}}}
  - {"name": "body too long", "as": "comm_ben", "request": {"method": "POST", "path": "/v1/community/posts", "json": {"title": "A title", "body": ""}}}
  - {"name": "reply is held pending", "as": "comm_ben", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000001/replies", "json": {"body": "  A reply  "}}, "snapshot": ["community_posts"]}
  - {"name": "author reads the pending thread", "as": "comm_ben", "request": {"method": "GET", "path": "/v1/community/posts/{{t1}}"}}
  - {"name": "reply under a reply", "as": "comm_ben", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000004/replies", "json": {"body": "Nested"}}}
  - {"name": "reply under a hidden thread", "as": "comm_cid", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000006/replies", "json": {"body": "Hello"}}}
  - {"name": "reply under someone elses pending", "as": "comm_cid", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000007/replies", "json": {"body": "Hello"}}}
  - {"name": "reply under unknown", "as": "comm_cid", "request": {"method": "POST", "path": "/v1/community/posts/00000000-0000-4000-8000-000000000000/replies", "json": {"body": "Hello"}}}
  - {"name": "reply bad id", "as": "comm_cid", "request": {"method": "POST", "path": "/v1/community/posts/nope/replies", "json": {"body": "Hello"}}}
  - {"name": "reply empty body", "as": "comm_cid", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000001/replies", "json": {"body": "  "}}}
  - {"name": "reply with an email", "as": "comm_cid", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000001/replies", "json": {"body": "a@b.co"}}}
  - {"name": "reply too long", "as": "comm_cid", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000001/replies", "json": {"body": ""}}}
  - {"name": "reply under own pending thread", "as": "comm_ann", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000007/replies", "json": {"body": "Hello"}}}
  - {"name": "thread no profile", "as": "comm_dee", "request": {"method": "POST", "path": "/v1/community/posts", "json": {"title": "A good title", "body": "A good body"}}}
  - {"name": "reply no profile", "as": "comm_dee", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000001/replies", "json": {"body": "Hello"}}}
  - {"name": "thread old terms", "as": "comm_old", "request": {"method": "POST", "path": "/v1/community/posts", "json": {"title": "A good title", "body": "A good body"}}}
  - {"name": "reply old terms", "as": "comm_old", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000001/replies", "json": {"body": "Hello"}}}
  - {"name": "thread suspended", "as": "comm_sus", "request": {"method": "POST", "path": "/v1/community/posts", "json": {"title": "A good title", "body": "A good body"}}}
  - {"name": "reply suspended", "as": "comm_sus", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000001/replies", "json": {"body": "Hello"}}}
  - {"name": "thread at the daily cap", "as": "comm_cap", "request": {"method": "POST", "path": "/v1/community/posts", "json": {"title": "A good title", "body": "A good body"}}}
  - {"name": "reply still allowed at the thread cap", "as": "comm_cap", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000002/replies", "json": {"body": "Hello"}}}
  - {"name": "reply at the daily cap", "as": "comm_cap2", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000002/replies", "json": {"body": "Hello"}}}
  - {"name": "thread still allowed at the reply cap", "as": "comm_cap2", "request": {"method": "POST", "path": "/v1/community/posts", "json": {"title": "A good title", "body": "A good body"}}}
  - {"name": "delete own reply recounts the thread", "as": "comm_post", "request": {"method": "DELETE", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000011"}, "snapshot": ["community_posts"]}
  - {"name": "thread after the reply went", "as": "comm_post", "request": {"method": "GET", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000010"}}
  - {"name": "delete own thread", "as": "comm_post", "request": {"method": "DELETE", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000010"}, "snapshot": ["community_posts"]}
  - {"name": "delete again", "as": "comm_post", "request": {"method": "DELETE", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000010"}}
  - {"name": "delete someone elses", "as": "comm_post", "request": {"method": "DELETE", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000002"}}
  - {"name": "delete unknown", "as": "comm_post", "request": {"method": "DELETE", "path": "/v1/community/posts/00000000-0000-4000-8000-000000000000"}}
  - {"name": "delete bad id", "as": "comm_post", "request": {"method": "DELETE", "path": "/v1/community/posts/nope"}}
  - {"name": "delete with no profile", "as": "comm_dee", "request": {"method": "DELETE", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000002"}}
