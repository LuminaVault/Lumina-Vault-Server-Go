# Reports: three distinct open ones hide a post, a duplicate is a no-op.
module: community
steps:
  - {"name": "first report", "as": "comm_rep1", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-00000000000a/report", "json": {"reason": "spam", "note": "  Looks like spam  "}}, "snapshot": ["community_reports"]}
  - {"name": "same reporter again is a no-op", "as": "comm_rep1", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-00000000000a/report", "json": {"reason": "hate"}}, "snapshot": ["community_reports"]}
  - {"name": "second report with an unknown reason", "as": "comm_rep2", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-00000000000a/report", "json": {"reason": "made_up", "note": ""}}, "snapshot": ["community_reports"]}
  - {"name": "still on the board after two", "as": "comm_read", "request": {"method": "GET", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-00000000000a"}}
  - {"name": "third distinct report hides it", "as": "comm_rep3", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-00000000000a/report", "json": {"reason": "harassment"}}, "snapshot": ["community_posts", "community_reports"]}
  - {"name": "gone from the board", "as": "comm_read", "request": {"method": "GET", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-00000000000a"}}
  - {"name": "reporting the hidden post is 404", "as": "comm_rep1", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-00000000000a/report", "json": {"reason": "spam"}}}
  - {"name": "cannot report own", "as": "comm_cid", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000005/report", "json": {"reason": "spam"}}}
  - {"name": "report unknown", "as": "comm_rep2", "request": {"method": "POST", "path": "/v1/community/posts/00000000-0000-4000-8000-000000000000/report", "json": {"reason": "spam"}}}
  - {"name": "report bad id", "as": "comm_rep2", "request": {"method": "POST", "path": "/v1/community/posts/nope/report", "json": {"reason": "spam"}}}
  - {"name": "report with no profile", "as": "comm_dee", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000002/report", "json": {"reason": "spam"}}}
  - {"name": "report with an empty note", "as": "comm_rep3", "request": {"method": "POST", "path": "/v1/community/posts/C0AC0000-0000-4000-8000-000000000002/report", "json": {"reason": "other", "note": "   "}}, "snapshot": ["community_reports"]}
