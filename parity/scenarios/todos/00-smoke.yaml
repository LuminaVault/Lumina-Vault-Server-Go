module: todos
smoke: true
steps:
  - {name: create, as: todo_tom, request: {method: POST, path: /v1/todos, json: {title: "Smoke todo"}}, capture: {id: $.id}}
  - {name: list, as: todo_tom, request: {method: GET, path: /v1/todos}}
  - {name: done, as: todo_tom, request: {method: PATCH, path: "/v1/todos/{{id}}", json: {done: true}}}
  - {name: open only, as: todo_tom, request: {method: GET, path: "/v1/todos?done=false"}}
  - {name: delete, as: todo_tom, request: {method: DELETE, path: "/v1/todos/{{id}}"}}
  - {name: gone, as: todo_tom, request: {method: PATCH, path: "/v1/todos/{{id}}", json: {done: true}}}
