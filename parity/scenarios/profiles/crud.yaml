module: profiles
steps:
  - {name: "list seeded", as: alice, request: {method: GET, path: "/v1/profiles"}}
  - {name: "get default", as: alice, request: {method: GET, path: "/v1/profiles/assistant"}}
  - {name: "get row with null timestamps", as: alice, request: {method: GET, path: "/v1/profiles/legacy"}}
  - {name: "create from template keeps duplicate skills", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "stocks", "label": "Stocks", "templateSlug": "stocks-tracker", "skillsEnabled": ["kb-ask", "kb-ask"]}}, snapshot: [user_hermes_profiles]}
  - {name: "create with default seed", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "plain", "label": "Plain"}}, snapshot: [user_hermes_profiles]}
  - {name: "empty templateSlug uses systemPrompt", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "explicit", "label": "Explicit", "systemPrompt": "Be brief.", "templateSlug": ""}}}
  - {name: "template wins over systemPrompt", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "news", "label": "News", "systemPrompt": "ignored", "templateSlug": "news-curator"}}}
  - {name: "template tv-and-movies", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "tv", "label": "TV", "templateSlug": "tv-and-movies"}}}
  - {name: "template tech-and-programming", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "tech", "label": "Tech", "templateSlug": "tech-and-programming"}}}
  - {name: "template personal-assistant", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "pa", "label": "PA", "templateSlug": "personal-assistant"}}}
  - {name: "label stored untrimmed", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "spaced", "label": "  Spaced  "}}}
  - {name: "slug of 32 chars", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "abbbbbbbbbbbbbbbbbbbbbbbbbbbbbb9", "label": "Long slug"}}}
  - {name: "slug of one digit", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "9", "label": "Nine"}}}
  - {name: "slug with trailing hyphen", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "x--", "label": "Hyphens"}}}
  - {name: "label of 80 combining graphemes", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "graphemes", "label": "e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301e\u0301"}}}
  - {name: "label of 80 flags", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "flags", "label": "\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9\U0001F1F5\U0001F1F9"}}}
  - {name: "system prompt of exactly 8192 bytes", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "maxprompt", "label": "Max", "systemPrompt": ""}}}
  - {name: "explicit empty system prompt", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "emptyprompt", "label": "Empty", "systemPrompt": ""}}}
  - {name: "null optionals", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "nulls", "label": "Nulls", "systemPrompt": null, "templateSlug": null, "skillsEnabled": null}}, snapshot: [user_hermes_profiles]}
  - {name: "list after creates", as: alice, request: {method: GET, path: "/v1/profiles"}}
  - {name: "patch label and prompt", as: alice, request: {method: PATCH, path: "/v1/profiles/stocks", json: {"label": "Stocks Pro", "systemPrompt": "Focus on options flow."}}, snapshot: [user_hermes_profiles]}
  - {name: "patch skills to empty", as: alice, request: {method: PATCH, path: "/v1/profiles/stocks", json: {"skillsEnabled": []}}}
  - {name: "patch skills", as: alice, request: {method: PATCH, path: "/v1/profiles/stocks", json: {"skillsEnabled": ["b", "a"]}}, snapshot: [user_hermes_profiles]}
  - {name: "patch empty object changes nothing", as: alice, request: {method: PATCH, path: "/v1/profiles/assistant", json: {}}, snapshot: [user_hermes_profiles]}
  - {name: "patch null fields changes nothing", as: alice, request: {method: PATCH, path: "/v1/profiles/assistant", json: {"label": null, "systemPrompt": null, "skillsEnabled": null}}}
  - {name: "patch label untrimmed", as: alice, request: {method: PATCH, path: "/v1/profiles/plain", json: {"label": "  Plain 2  "}}}
  - {name: "patch same label still saves", as: alice, request: {method: PATCH, path: "/v1/profiles/research", json: {"label": "Research"}}, snapshot: [user_hermes_profiles]}
  - {name: "patch prompt to empty", as: alice, request: {method: PATCH, path: "/v1/profiles/plain", json: {"systemPrompt": ""}}}
  - {name: "activate research", as: alice, request: {method: POST, path: "/v1/profiles/research/activate"}, snapshot: [user_hermes_profiles]}
  - {name: "activate research again is idempotent", as: alice, request: {method: POST, path: "/v1/profiles/research/activate"}, snapshot: [user_hermes_profiles]}
  - {name: "list shows new active", as: alice, request: {method: GET, path: "/v1/profiles"}}
  - {name: "activate row with null timestamps", as: alice, request: {method: POST, path: "/v1/profiles/legacy/activate"}, snapshot: [user_hermes_profiles]}
  - {name: "get activated legacy", as: alice, request: {method: GET, path: "/v1/profiles/legacy"}}
  - {name: "activate assistant back", as: alice, request: {method: POST, path: "/v1/profiles/assistant/activate"}, snapshot: [user_hermes_profiles]}
  - {name: "delete non-default", as: alice, request: {method: DELETE, path: "/v1/profiles/research"}, snapshot: [user_hermes_profiles]}
  - {name: "delete again is 404", as: alice, request: {method: DELETE, path: "/v1/profiles/research"}}
  - {name: "get deleted is 404", as: alice, request: {method: GET, path: "/v1/profiles/research"}}
  - {name: "list final", as: alice, request: {method: GET, path: "/v1/profiles"}}
