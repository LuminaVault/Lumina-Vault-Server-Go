module: profiles
steps:
  - {name: "GET /v1/profiles no token", request: {method: GET, path: "/v1/profiles"}}
  - {name: "POST /v1/profiles no token", request: {method: POST, path: "/v1/profiles", json: {"label": "x"}}}
  - {name: "GET /v1/profiles/assistant no token", request: {method: GET, path: "/v1/profiles/assistant"}}
  - {name: "PATCH /v1/profiles/assistant no token", request: {method: PATCH, path: "/v1/profiles/assistant", json: {"label": "x"}}}
  - {name: "DELETE /v1/profiles/assistant no token", request: {method: DELETE, path: "/v1/profiles/assistant"}}
  - {name: "POST /v1/profiles/assistant/activate no token", request: {method: POST, path: "/v1/profiles/assistant/activate"}}
  - {name: bad token, request: {method: GET, path: /v1/profiles, headers: {Authorization: "Bearer not.a.jwt"}}}
  - {name: bad token on activate, request: {method: POST, path: /v1/profiles/assistant/activate, headers: {Authorization: "Bearer not.a.jwt"}}}
  - {name: "malformed json", as: alice, request: {method: POST, path: "/v1/profiles", raw: "{\"slug\":"}}
  - {name: "empty body", as: alice, request: {method: POST, path: "/v1/profiles", raw: ""}}
  - {name: "array body", as: alice, request: {method: POST, path: "/v1/profiles", raw: "[]"}}
  - {name: "string body", as: alice, request: {method: POST, path: "/v1/profiles", raw: "\"x\""}}
  - {name: "missing slug", as: alice, request: {method: POST, path: "/v1/profiles", json: {}}}
  - {name: "missing slug reported before label type", as: alice, request: {method: POST, path: "/v1/profiles", json: {"label": 42}}}
  - {name: "missing label", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "x"}}}
  - {name: "null slug", as: alice, request: {method: POST, path: "/v1/profiles", raw: "{\"slug\":null,\"label\":\"x\"}"}}
  - {name: "null label", as: alice, request: {method: POST, path: "/v1/profiles", raw: "{\"slug\":\"x\",\"label\":null}"}}
  - {name: "slug wrong type", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": 42, "label": 42}}}
  - {name: "label wrong type", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "x", "label": true}}}
  - {name: "systemPrompt wrong type", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "x", "label": "x", "systemPrompt": 7}}}
  - {name: "templateSlug wrong type", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "x", "label": "x", "templateSlug": false}}}
  - {name: "skillsEnabled string", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "x", "label": "x", "skillsEnabled": "kb-ask"}}}
  - {name: "skillsEnabled object", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "x", "label": "x", "skillsEnabled": {"a": 1}}}}
  - {name: "skillsEnabled number element", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "x", "label": "x", "skillsEnabled": ["a", 1]}}}
  - {name: "skillsEnabled null element", as: alice, request: {method: POST, path: "/v1/profiles", json: {"slug": "x", "label": "x", "skillsEnabled": ["a", null]}}}
