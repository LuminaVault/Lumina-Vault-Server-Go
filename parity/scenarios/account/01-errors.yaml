    request: {method: DELETE, path: /v1/account, json: {password: Correct horse battery staple}, headers: {Authorization: "Bearer eyJhbGciOiJIUzI1NiIsImtpZCI6InBhcml0eSIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJBQ0M3MDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwQzMiLCJpYXQiOjE3NjcyMjU2MDAsImV4cCI6NDEwMjQ0NDgwMCwianRpIjoiQUNDNzAwMDAtMDAwMC00MDAwLTgwMDAtMDAwMDAwMDBGRkMzIn0.CwAAaqQJ-Diqaj5nZGmj1DADyrm3BIl_ZF4StsTY2zQ"}}
  - name: future iat
    request: {method: DELETE, path: /v1/account, json: {}, headers: {Authorization: "Bearer eyJhbGciOiJIUzI1NiIsImtpZCI6InBhcml0eSIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJBQ0M3MDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwQzMiLCJpYXQiOjQxMDI0NDQwMDAsImV4cCI6NDEwMjQ0NDgwMCwianRpIjoiQUNDNzAwMDAtMDAwMC00MDAwLTgwMDAtMDAwMDAwMDBGRkM0In0.bYMKYGa9VxkApMeWafDtrkader1nGtPjrBdiqQM57d8"}}
  - name: no iat
    request: {method: DELETE, path: /v1/account, json: {}, headers: {Authorization: "Bearer eyJhbGciOiJIUzI1NiIsImtpZCI6InBhcml0eSIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJBQ0M3MDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwQzMiLCJleHAiOjQxMDI0NDQ4MDAsImp0aSI6IkFDQzcwMDAwLTAwMDAtNDAwMC04MDAwLTAwMDAwMDAwRkZDNSJ9.eINbrFzTlh_LibipEpcAiWJWwzDgSwE6jQv7PikrvuI"}}
    snapshot: [users]
  # A wrong password loses even with a fresh token: the password is checked first.
  - {name: fresh token wrong password, as: acct_wrong, request: {method: DELETE, path: /v1/account, json: {password: wrong}}, snapshot: [users]}
  - {name: still signed in, as: acct_wrong, request: {method: GET, path: /v1/onboarding}}
