module: account
# Requests that must not delete anything. acct_stale's tokens are hand-minted
# (kid "parity", HS256, exp 2100): iat 2026-01-01 (stale), iat 2100 (future,
# so now - iat < 0) and no iat at all. None of them passes the fresh-JWT gate.
steps:
  - {name: no token, request: {method: DELETE, path: /v1/account}}
  - {name: bad token, request: {method: DELETE, path: /v1/account, headers: {Authorization: "Bearer not.a.jwt"}}}
  - {name: no token with password, request: {method: DELETE, path: /v1/account, json: {password: correct horse battery staple}}}
  - name: stale token no body
    request: {method: DELETE, path: /v1/account, headers: {Authorization: "Bearer eyJhbGciOiJIUzI1NiIsImtpZCI6InBhcml0eSIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJBQ0M3MDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwQzMiLCJpYXQiOjE3NjcyMjU2MDAsImV4cCI6NDEwMjQ0NDgwMCwianRpIjoiQUNDNzAwMDAtMDAwMC00MDAwLTgwMDAtMDAwMDAwMDBGRkMzIn0.CwAAaqQJ-Diqaj5nZGmj1DADyrm3BIl_ZF4StsTY2zQ"}}
  - name: stale token empty object
    request: {method: DELETE, path: /v1/account, json: {}, headers: {Authorization: "Bearer eyJhbGciOiJIUzI1NiIsImtpZCI6InBhcml0eSIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJBQ0M3MDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwQzMiLCJpYXQiOjE3NjcyMjU2MDAsImV4cCI6NDEwMjQ0NDgwMCwianRpIjoiQUNDNzAwMDAtMDAwMC00MDAwLTgwMDAtMDAwMDAwMDBGRkMzIn0.CwAAaqQJ-Diqaj5nZGmj1DADyrm3BIl_ZF4StsTY2zQ"}}
  - name: stale token empty password
    request: {method: DELETE, path: /v1/account, json: {password: ""}, headers: {Authorization: "Bearer eyJhbGciOiJIUzI1NiIsImtpZCI6InBhcml0eSIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJBQ0M3MDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwQzMiLCJpYXQiOjE3NjcyMjU2MDAsImV4cCI6NDEwMjQ0NDgwMCwianRpIjoiQUNDNzAwMDAtMDAwMC00MDAwLTgwMDAtMDAwMDAwMDBGRkMzIn0.CwAAaqQJ-Diqaj5nZGmj1DADyrm3BIl_ZF4StsTY2zQ"}}
  - name: stale token null password
    request: {method: DELETE, path: /v1/account, raw: "{\"password\":null}", headers: {Authorization: "Bearer eyJhbGciOiJIUzI1NiIsImtpZCI6InBhcml0eSIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJBQ0M3MDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwQzMiLCJpYXQiOjE3NjcyMjU2MDAsImV4cCI6NDEwMjQ0NDgwMCwianRpIjoiQUNDNzAwMDAtMDAwMC00MDAwLTgwMDAtMDAwMDAwMDBGRkMzIn0.CwAAaqQJ-Diqaj5nZGmj1DADyrm3BIl_ZF4StsTY2zQ"}}
  - name: stale token wrong password
    request: {method: DELETE, path: /v1/account, json: {password: nope}, headers: {Authorization: "Bearer eyJhbGciOiJIUzI1NiIsImtpZCI6InBhcml0eSIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJBQ0M3MDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwQzMiLCJpYXQiOjE3NjcyMjU2MDAsImV4cCI6NDEwMjQ0NDgwMCwianRpIjoiQUNDNzAwMDAtMDAwMC00MDAwLTgwMDAtMDAwMDAwMDBGRkMzIn0.CwAAaqQJ-Diqaj5nZGmj1DADyrm3BIl_ZF4StsTY2zQ"}}
  - name: stale token password wrong type
    request: {method: DELETE, path: /v1/account, json: {password: 42}, headers: {Authorization: "Bearer eyJhbGciOiJIUzI1NiIsImtpZCI6InBhcml0eSIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJBQ0M3MDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwQzMiLCJpYXQiOjE3NjcyMjU2MDAsImV4cCI6NDEwMjQ0NDgwMCwianRpIjoiQUNDNzAwMDAtMDAwMC00MDAwLTgwMDAtMDAwMDAwMDBGRkMzIn0.CwAAaqQJ-Diqaj5nZGmj1DADyrm3BIl_ZF4StsTY2zQ"}}
