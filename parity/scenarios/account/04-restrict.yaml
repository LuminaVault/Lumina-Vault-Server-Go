module: account
# Team ownership: Postgres refuses the delete, the eraser's deletes in the same
# transaction roll back, and Swift answers a bare 500. Then a row two FK actions
# reach at once, which only succeeds on some trigger orders if the eraser has
# written to it first (see AnonymizeVaultActivity in queries.sql).
steps:
  - {name: team owner cannot be deleted, as: acct_owner, request: {method: DELETE, path: /v1/account, json: {password: correct horse battery staple}}, snapshot: [users, teams, device_command_queue]}
  - {name: owner still signed in, as: acct_owner, request: {method: GET, path: /v1/onboarding}}
  - {name: own-vault activity cascades, as: acct_self, request: {method: DELETE, path: /v1/account, json: {password: correct horse battery staple}}, snapshot: [users, vaults, vault_activity_events]}
