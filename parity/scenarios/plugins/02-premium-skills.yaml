# Premium installs for a pro user, and LV skills installed as plugins (skills_state).
module: plugins
steps:
  - {name: premium for pro, as: pl_bo, request: {method: POST, path: /v1/plugins/installs, json: {pluginSlug: byok-embeddings, config: {access_token: sk-parity}}}, capture: {be: $.id}, snapshot: [parity_pl_installs]}
  - {name: memory plugin is not a connector, as: pl_bo, request: {method: POST, path: "/v1/plugins/installs/{{be}}/sync"}}
  - {name: unknown skill, as: pl_fox, request: {method: POST, path: /v1/plugins/installs, json: {pluginSlug: skill-no-such-skill, config: {}}}}
  - {name: bare skill prefix, as: pl_fox, request: {method: POST, path: /v1/plugins/installs, json: {pluginSlug: "skill-", config: {}}}}
  - name: install a skill
    as: pl_fox
    request: {method: POST, path: /v1/plugins/installs, json: {pluginSlug: skill-daily-brief, config: {ignored: yes}}}
    capture: {sk: $.id}
    snapshot: [parity_pl_installs, parity_pl_skills]
  - {name: install a second skill, as: pl_fox, request: {method: POST, path: /v1/plugins/installs, json: {pluginSlug: skill-pattern-detector, config: {}}}, capture: {sk2: $.id}, snapshot: [parity_pl_skills]}
  - {name: disable the first skill, as: pl_fox, request: {method: PATCH, path: "/v1/plugins/installs/{{sk}}", json: {status: disabled}}, snapshot: [parity_pl_installs, parity_pl_skills]}
  - {name: config on a skill is ignored, as: pl_fox, request: {method: PATCH, path: "/v1/plugins/installs/{{sk2}}", json: {config: {nope: x}}}, snapshot: [parity_pl_installs]}
  - {name: skill sync, as: pl_fox, request: {method: POST, path: "/v1/plugins/installs/{{sk2}}/sync"}}
  - {name: uninstall a skill, as: pl_fox, request: {method: DELETE, path: "/v1/plugins/installs/{{sk2}}"}, snapshot: [parity_pl_installs, parity_pl_skills]}
