module: apple
steps:
  - {name: sync no token, request: {method: POST, path: /v1/reminders/sync, json: {reminders: []}}}
  - name: bob without consent is forbidden
    as: bob
    request: {method: POST, path: /v1/reminders/sync, json: {reminders: [{externalID: r-1, title: Buy milk, completed: false}]}}
  - {name: consent is checked before the body is decoded, as: bob, request: {method: POST, path: /v1/reminders/sync, raw: "not json"}}
  - {name: alice grants reminders, as: alice, request: {method: PUT, path: /v1/apple/consent, json: {domain: reminders, allowed: true}}}
  - name: inserts two and skips blank id and blank title
    as: alice
    request:
      method: POST
      path: /v1/reminders/sync
      json:
        reminders:
          - {externalID: " r-1 ", title: " Buy milk ", completed: false, remoteUpdatedAt: "2026-03-01T10:00:00Z"}
          - {externalID: r-2, title: Call mom, notes: before 6, dueAt: "2026-03-02T18:00:00.250Z", completed: true, completedAt: "2026-03-02T19:00:00+02:00", listName: Family, priority: 5, remoteUpdatedAt: "2026-03-01T10:00:00Z"}
          - {externalID: "  ", title: No id, completed: false}
          - {externalID: r-3, title: "   ", completed: false}
    snapshot: [apple_reminders]
  - name: newer timestamp updates
    as: alice
    request:
      method: POST
      path: /v1/reminders/sync
      json:
        reminders:
          - {externalID: r-1, title: Buy oat milk, completed: false, remoteUpdatedAt: "2026-03-01T11:00:00Z"}
          - {externalID: seed-1, title: Seeded edit, completed: true, remoteUpdatedAt: "2026-01-11T00:00:00Z"}
    snapshot: [apple_reminders]
  - name: older timestamp and missing timestamp are stale
    as: alice
    request:
      method: POST
      path: /v1/reminders/sync
      json:
        reminders:
          - {externalID: r-1, title: Stale edit, completed: false, remoteUpdatedAt: "2026-03-01T09:00:00Z"}
          - {externalID: r-2, title: No stamp, completed: false}
    snapshot: [apple_reminders]
  - name: equal timestamp still wins
    as: alice
    request:
      method: POST
      path: /v1/reminders/sync
      json: {reminders: [{externalID: r-1, title: Same stamp, completed: false, remoteUpdatedAt: "2026-03-01T11:00:00Z"}]}
  - name: new row without a timestamp, then a stamped edit
    as: alice
    request:
      method: POST
      path: /v1/reminders/sync
      json:
        reminders:
          - {externalID: r-4, title: Unstamped, completed: false}
          - {externalID: r-4, title: Stamped, completed: false, remoteUpdatedAt: "2026-03-05T00:00:00Z"}
          - {externalID: r-4, title: Unstamped again, completed: false}
    snapshot: [apple_reminders]
  - {name: bob grants reminders, as: bob, request: {method: PUT, path: /v1/apple/consent, json: {domain: reminders, allowed: true}}}
  - name: bob's same externalID is his own insert
    as: bob
    request: {method: POST, path: /v1/reminders/sync, json: {reminders: [{externalID: r-1, title: Bob milk, completed: false, remoteUpdatedAt: "2026-03-01T12:00:00Z"}]}}
    snapshot: [apple_reminders]
  - {name: empty array, as: alice, request: {method: POST, path: /v1/reminders/sync, json: {reminders: []}}}
  - {name: missing reminders, as: alice, request: {method: POST, path: /v1/reminders/sync, json: {}}}
  - {name: null reminders, as: alice, request: {method: POST, path: /v1/reminders/sync, raw: "{\"reminders\":null}"}}
  - {name: reminders not an array, as: alice, request: {method: POST, path: /v1/reminders/sync, json: {reminders: {externalID: x}}}}
  - {name: element not an object, as: alice, request: {method: POST, path: /v1/reminders/sync, json: {reminders: [1]}}}
  - {name: element missing completed, as: alice, request: {method: POST, path: /v1/reminders/sync, json: {reminders: [{externalID: x, title: t}]}}}
  - {name: element missing externalID, as: alice, request: {method: POST, path: /v1/reminders/sync, json: {reminders: [{title: t, completed: false}]}}}
  - {name: element title wrong type, as: alice, request: {method: POST, path: /v1/reminders/sync, json: {reminders: [{externalID: x, title: 7, completed: false}]}}}
  - {name: element title null, as: alice, request: {method: POST, path: /v1/reminders/sync, raw: "{\"reminders\":[{\"externalID\":\"x\",\"title\":null,\"completed\":false}]}"}}
  - name: second element priority wrong type
    as: alice
    request: {method: POST, path: /v1/reminders/sync, json: {reminders: [{externalID: x, title: t, completed: false}, {externalID: y, title: u, completed: false, priority: high}]}}
  - {name: element completed wrong type, as: alice, request: {method: POST, path: /v1/reminders/sync, json: {reminders: [{externalID: x, title: t, completed: "no"}]}}}
  - {name: element bad dueAt, as: alice, request: {method: POST, path: /v1/reminders/sync, json: {reminders: [{externalID: x, title: t, completed: false, dueAt: tomorrow}]}}}
  - {name: element null in array, as: alice, request: {method: POST, path: /v1/reminders/sync, raw: "{\"reminders\":[null]}"}}
  - {name: malformed json, as: alice, request: {method: POST, path: /v1/reminders/sync, raw: "{\"reminders\":["}}
  - {name: empty body, as: alice, request: {method: POST, path: /v1/reminders/sync, raw: ""}}
  - {name: array body, as: alice, request: {method: POST, path: /v1/reminders/sync, raw: "[]"}}
