# Validation and error paths. Every stream step stops before the model.
module: chat
steps:
  - {name: no token, request: {method: GET, path: /v1/conversations}}
  - {name: bad token, request: {method: GET, path: /v1/conversations, headers: {Authorization: Bearer not.a.jwt}}}
  - {name: bad id, as: chat_ben, request: {method: GET, path: /v1/conversations/nope}}
  - {name: bad id on traces, as: chat_ben, request: {method: GET, path: /v1/conversations/nope/traces}}
  - {name: bad id on delete, as: chat_ben, request: {method: DELETE, path: /v1/conversations/nope}}
  - {name: unknown id, as: chat_ben, request: {method: GET, path: /v1/conversations/C4A70000-0000-4000-8000-00000000FFFF}}
  - {name: someone else's, as: chat_ben, request: {method: GET, path: /v1/conversations/C4A70000-0000-4000-8000-0000000001A8}}
  - {name: someone else's traces, as: chat_ben, request: {method: GET, path: /v1/conversations/C4A70000-0000-4000-8000-0000000001A8/traces}}
  - {name: delete someone else's, as: chat_ben, request: {method: DELETE, path: /v1/conversations/C4A70000-0000-4000-8000-0000000001A8}}
  - {name: create malformed json, as: chat_ben, request: {method: POST, path: /v1/conversations, raw: '{"title":'}}
  - {name: create empty body, as: chat_ben, request: {method: POST, path: /v1/conversations, raw: ''}}
  - {name: create array body, as: chat_ben, request: {method: POST, path: /v1/conversations, raw: '[]'}}
  - {name: create title wrong type, as: chat_ben, request: {method: POST, path: /v1/conversations, raw: '{"title":7}'}}
  - {name: create bad pinned id, as: chat_ben, request: {method: POST, path: /v1/conversations, raw: '{"pinnedMemoryIDs":["nope"]}'}}
  - {name: create route missing model, as: chat_ben, request: {method: POST, path: /v1/conversations, raw: '{"routeOverride":{"provider":"openRouter"}}'}}
  - {name: create foreign vault, as: chat_ben, request: {method: POST, path: /v1/conversations, json: {title: x}, headers: {X-Vault-ID: C4A70000-0000-4000-8000-0000000000A1}}}
  - {name: create bad vault header, as: chat_ben, request: {method: POST, path: /v1/conversations, json: {title: x}, headers: {X-Vault-ID: nope}}}
  - {name: stream unknown conversation, as: chat_ben, request: {method: POST, path: /v1/conversations/C4A70000-0000-4000-8000-00000000FFFF/messages/stream, json: {content: hi}}}
  - {name: stream bad id, as: chat_ben, request: {method: POST, path: /v1/conversations/nope/messages/stream, json: {content: hi}}}
  - {name: stream malformed json, as: chat_ben, request: {method: POST, path: /v1/conversations/C4A70000-0000-4000-8000-0000000001B1/messages/stream, raw: '{"content":'}}
  - {name: stream missing content, as: chat_ben, request: {method: POST, path: /v1/conversations/C4A70000-0000-4000-8000-0000000001B1/messages/stream, json: {}}}
  - {name: stream empty content, as: chat_ben, request: {method: POST, path: /v1/conversations/C4A70000-0000-4000-8000-0000000001B1/messages/stream, json: {content: ""}}}
  - {name: stream whitespace content, as: chat_ben, request: {method: POST, path: /v1/conversations/C4A70000-0000-4000-8000-0000000001B1/messages/stream, json: {content: "  \n "}}}
  - {name: stream empty content with an empty attachment, as: chat_ben, request: {method: POST, path: /v1/conversations/C4A70000-0000-4000-8000-0000000001B1/messages/stream, json: {content: "", attachments: [{kind: text, name: a, text: " "}]}}}
  - {name: stream bad attachment kind, as: chat_ben, request: {method: POST, path: /v1/conversations/C4A70000-0000-4000-8000-0000000001B1/messages/stream, json: {content: hi, attachments: [{kind: video, name: a}]}}}
  - {name: stream bad agent mode, as: chat_ben, request: {method: POST, path: /v1/conversations/C4A70000-0000-4000-8000-0000000001B1/messages/stream, json: {content: hi, agentMode: always}}}
  - {name: stream bad strategy, as: chat_ben, request: {method: POST, path: /v1/conversations/C4A70000-0000-4000-8000-0000000001B1/messages/stream, json: {content: hi, multiModel: {enabled: true, strategy: vote}}}}
  - name: multi-model on trial is refused before anything is written
    as: chat_ben
    request: {method: POST, path: /v1/conversations/C4A70000-0000-4000-8000-0000000001B1/messages/stream, json: {content: hi, multiModel: {enabled: true, strategy: auto}}}
    snapshot: [conversation_messages]
  - {name: wrong method, as: chat_ben, request: {method: PUT, path: /v1/conversations}}
  - {name: prepare empty content, as: chat_ben, request: {method: POST, path: /v1/conversations/C4A70000-0000-4000-8000-0000000001B1/messages/prepare, json: {content: " "}}}
  - {name: prepare unknown conversation, as: chat_ben, request: {method: POST, path: /v1/conversations/C4A70000-0000-4000-8000-00000000FFFF/messages/prepare, json: {content: hi}}}
