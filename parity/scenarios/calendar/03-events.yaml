# GET /v1/calendar/events: cached upcoming events, oldest start first.
module: calendar
steps:
  - {name: events no token, request: {method: GET, path: /v1/calendar/events}}
  - {name: events, as: cal_ann, request: {method: GET, path: /v1/calendar/events}}
  - {name: events other tenant is empty, as: cal_ben, request: {method: GET, path: /v1/calendar/events}}
  - {name: limit 1, as: cal_ann, request: {method: GET, path: "/v1/calendar/events?limit=1"}}
  - {name: limit 2, as: cal_ann, request: {method: GET, path: "/v1/calendar/events?limit=2"}}
  - {name: limit 0 clamps up, as: cal_ann, request: {method: GET, path: "/v1/calendar/events?limit=0"}}
  - {name: limit negative clamps up, as: cal_ann, request: {method: GET, path: "/v1/calendar/events?limit=-5"}}
  - {name: limit over the cap, as: cal_ann, request: {method: GET, path: "/v1/calendar/events?limit=1000"}}
  - {name: limit not a number, as: cal_ann, request: {method: GET, path: "/v1/calendar/events?limit=abc"}}
  - {name: limit empty, as: cal_ann, request: {method: GET, path: "/v1/calendar/events?limit="}}
  - {name: limit fractional, as: cal_ann, request: {method: GET, path: "/v1/calendar/events?limit=1.5"}}
  - {name: limit encoded plus, as: cal_ann, request: {method: GET, path: "/v1/calendar/events?limit=%2B1"}}
  - {name: limit literal plus, as: cal_ann, request: {method: GET, path: "/v1/calendar/events?limit=+1"}}
  - {name: limit too big for an int, as: cal_ann, request: {method: GET, path: "/v1/calendar/events?limit=99999999999999999999"}}
  - {name: first limit wins, as: cal_ann, request: {method: GET, path: "/v1/calendar/events?limit=1&limit=2"}}
