# POST /v1/calendar/sync: EventKit deltas. No Google involved, so this route is
# fully compared.
module: calendar
steps:
  - {name: sync no token, request: {method: POST, path: /v1/calendar/sync, json: {events: []}}}
  - {name: sync bad token, request: {method: POST, path: /v1/calendar/sync, headers: {Authorization: Bearer nope}, json: {events: []}}}
  - {name: sync empty body, as: cal_syn, request: {method: POST, path: /v1/calendar/sync}}
  - {name: sync not json, as: cal_syn, request: {method: POST, path: /v1/calendar/sync, raw: "not json"}}
  - {name: sync array body, as: cal_syn, request: {method: POST, path: /v1/calendar/sync, raw: "[]"}}
  - {name: sync missing events, as: cal_syn, request: {method: POST, path: /v1/calendar/sync, raw: "{}"}}
  - {name: sync events null, as: cal_syn, request: {method: POST, path: /v1/calendar/sync, raw: "{\"events\":null}"}}
  - {name: sync events wrong type, as: cal_syn, request: {method: POST, path: /v1/calendar/sync, json: {events: 1}}}
  - {name: sync empty events, as: cal_syn, request: {method: POST, path: /v1/calendar/sync, json: {events: []}}}
  - {name: sync element wrong type, as: cal_syn, request: {method: POST, path: /v1/calendar/sync, json: {events: [1]}}}
  - {name: sync missing external id, as: cal_syn, request: {method: POST, path: /v1/calendar/sync, json: {events: [{title: t, startsAt: "2026-05-01T10:00:00Z", endsAt: "2026-05-01T11:00:00Z", allDay: false}]}}}
  - {name: sync missing title, as: cal_syn, request: {method: POST, path: /v1/calendar/sync, json: {events: [{externalID: e, startsAt: "2026-05-01T10:00:00Z", endsAt: "2026-05-01T11:00:00Z", allDay: false}]}}}
  - {name: sync missing all day, as: cal_syn, request: {method: POST, path: /v1/calendar/sync, json: {events: [{externalID: e, title: t, startsAt: "2026-05-01T10:00:00Z", endsAt: "2026-05-01T11:00:00Z"}]}}}
  - {name: sync all day null, as: cal_syn, request: {method: POST, path: /v1/calendar/sync, raw: "{\"events\":[{\"externalID\":\"e\",\"title\":\"t\",\"startsAt\":\"2026-05-01T10:00:00Z\",\"endsAt\":\"2026-05-01T11:00:00Z\",\"allDay\":null}]}"}}
  - {name: sync title null second element, as: cal_syn, request: {method: POST, path: /v1/calendar/sync, raw: "{\"events\":[{\"externalID\":\"e\",\"title\":\"t\",\"startsAt\":\"2026-05-01T10:00:00Z\",\"endsAt\":\"2026-05-01T11:00:00Z\",\"allDay\":false},{\"externalID\":\"e\",\"title\":null}]}"}}
  - {name: sync bad date, as: cal_syn, request: {method: POST, path: /v1/calendar/sync, json: {events: [{externalID: e, title: t, startsAt: soon, endsAt: "2026-05-01T11:00:00Z", allDay: false}]}}}
  - {name: sync bad remote date, as: cal_syn, request: {method: POST, path: /v1/calendar/sync, json: {events: [{externalID: e, title: t, startsAt: "2026-05-01T10:00:00Z", endsAt: "2026-05-01T11:00:00Z", allDay: false, remoteUpdatedAt: nope}]}}}
  - {name: sync attendees wrong type, as: cal_syn, request: {method: POST, path: /v1/calendar/sync, json: {events: [{externalID: e, title: t, startsAt: "2026-05-01T10:00:00Z", endsAt: "2026-05-01T11:00:00Z", allDay: false, attendees: nope}]}}}
  - {name: sync attendee name wrong type, as: cal_syn, request: {method: POST, path: /v1/calendar/sync, json: {events: [{externalID: e, title: t, startsAt: "2026-05-01T10:00:00Z", endsAt: "2026-05-01T11:00:00Z", allDay: false, attendees: [{name: 1}]}]}}}
  - name: sync no consent row is forbidden after the body
    as: cal_ben
    request: {method: POST, path: /v1/calendar/sync, json: {events: [{externalID: e, title: t, startsAt: "2026-05-01T10:00:00Z", endsAt: "2026-05-01T11:00:00Z", allDay: false}]}}
  - {name: sync a bad body beats no consent, as: cal_ben, request: {method: POST, path: /v1/calendar/sync, raw: "not json"}}
  - {name: sync empty events beats no consent, as: cal_ben, request: {method: POST, path: /v1/calendar/sync, json: {events: []}}}
  - name: sync consent says no
    as: cal_off
    request: {method: POST, path: /v1/calendar/sync, json: {events: [{externalID: e, title: t, startsAt: "2026-05-01T10:00:00Z", endsAt: "2026-05-01T11:00:00Z", allDay: false}]}}
    snapshot: [apple_consent]
  - name: sync inserts and skips
    as: cal_syn
    request:
      method: POST
      path: /v1/calendar/sync
      json:
        events:
          - {externalID: " ek-1 ", calendarID: work, title: " Standup ", notes: n, location: l, startsAt: "2026-05-02T10:00:00Z", endsAt: "2026-05-02T10:30:00.250Z", allDay: false, organizer: boss@x.test, remoteUpdatedAt: "2026-03-01T10:00:00Z"}
          - {externalID: ek-2, title: "", startsAt: "2026-05-03T12:00:00+02:00", endsAt: "2026-05-03T09:00:00Z", allDay: true, status: cancelled}
          - {externalID: ek-3, title: Upper, startsAt: "2026-05-04T10:00:00Z", endsAt: "2026-05-04T11:00:00Z", allDay: false, status: " CANCELLED\t"}
          - {externalID: ek-4, title: Newline not trimmed, startsAt: "2026-05-05T10:00:00Z", endsAt: "2026-05-05T11:00:00Z", allDay: false, status: "cancelled\n"}
          - {externalID: ek-5, title: Unknown status, startsAt: "2026-05-06T10:00:00Z", endsAt: "2026-05-06T11:00:00Z", allDay: false, status: tentative}
          - {externalID: "   ", title: No id, startsAt: "2026-05-07T10:00:00Z", endsAt: "2026-05-07T11:00:00Z", allDay: false}
          - externalID: ek-attendees
            title: Attendees
            startsAt: "2026-05-08T10:00:00Z"
            endsAt: "2026-05-08T11:00:00Z"
            allDay: false
            attendees:
              - {name: "  Ana ", email: " "}
              - {name: null, email: null}
              - {email: rui@x.test}
              - {name: "", email: "  sam@x.test\n"}
    snapshot: [calendar_events, apple_consent]
  - name: sync at the length caps
    as: cal_syn
    request:
      method: POST
      path: /v1/calendar/sync
      raw: '{"events": [{"externalID": "", "title": "t", "startsAt": "2026-07-01T10:00:00Z", "endsAt": "2026-07-01T11:00:00Z", "allDay": false}, {"externalID": "title-1024", "title": "", "startsAt": "2026-07-01T10:00:00Z", "endsAt": "2026-07-01T11:00:00Z", "allDay": false}]}'
  - name: sync past the length caps, counted in characters
    as: cal_syn
    request:
      method: POST
      path: /v1/calendar/sync
      raw: '{"events": [{"externalID": "", "title": "t", "startsAt": "2026-07-01T10:00:00Z", "endsAt": "2026-07-01T11:00:00Z", "allDay": false}, {"externalID": "title-1025", "title": "", "startsAt": "2026-07-01T10:00:00Z", "endsAt": "2026-07-01T11:00:00Z", "allDay": false}, {"externalID": "éééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééé", "title": "t", "startsAt": "2026-07-01T10:00:00Z", "endsAt": "2026-07-01T11:00:00Z", "allDay": false}]}'
  - name: sync caps attendees and their fields
    as: cal_syn
    request:
      method: POST
      path: /v1/calendar/sync
      raw: '{"events": [{"externalID": "many", "title": "t", "startsAt": "2026-07-01T10:00:00Z", "endsAt": "2026-07-01T11:00:00Z", "allDay": false, "attendees": [{"name": "P0"}, {"name": "P1"}, {"name": "P2"}, {"name": "P3"}, {"name": "P4"}, {"name": "P5"}, {"name": "P6"}, {"name": "P7"}, {"name": "P8"}, {"name": "P9"}, {"name": "P10"}, {"name": "P11"}, {"name": "P12"}, {"name": "P13"}, {"name": "P14"}, {"name": "P15"}, {"name": "P16"}, {"name": "P17"}, {"name": "P18"}, {"name": "P19"}, {"name": "P20"}, {"name": "P21"}, {"name": "P22"}, {"name": "P23"}, {"name": "P24"}, {"name": "P25"}, {"name": "P26"}, {"name": "P27"}, {"name": "P28"}, {"name": "P29"}, {"name": "P30"}, {"name": "P31"}, {"name": "P32"}, {"name": "P33"}, {"name": "P34"}, {"name": "P35"}, {"name": "P36"}, {"name": "P37"}, {"name": "P38"}, {"name": "P39"}, {"name": "P40"}, {"name": "P41"}, {"name": "P42"}, {"name": "P43"}, {"name": "P44"}, {"name": "P45"}, {"name": "P46"}, {"name": "P47"}, {"name": "P48"}, {"name": "P49"}, {"name": "P50"}, {"name": "P51"}, {"name": "P52"}, {"name": "P53"}, {"name": "P54"}, {"name": "P55"}, {"name": "P56"}, {"name": "P57"}, {"name": "P58"}, {"name": "P59"}, {"name": "P60"}, {"name": "P61"}, {"name": "P62"}, {"name": "P63"}, {"name": "P64"}, {"name": "P65"}, {"name": "P66"}, {"name": "P67"}, {"name": "P68"}, {"name": "P69"}, {"name": "P70"}, {"name": "P71"}, {"name": "P72"}, {"name": "P73"}, {"name": "P74"}, {"name": "P75"}, {"name": "P76"}, {"name": "P77"}, {"name": "P78"}, {"name": "P79"}, {"name": "P80"}, {"name": "P81"}, {"name": "P82"}, {"name": "P83"}, {"name": "P84"}, {"name": "P85"}, {"name": "P86"}, {"name": "P87"}, {"name": "P88"}, {"name": "P89"}, {"name": "P90"}, {"name": "P91"}, {"name": "P92"}, {"name": "P93"}, {"name": "P94"}, {"name": "P95"}, {"name": "P96"}, {"name": "P97"}, {"name": "P98"}, {"name": "P99"}, {"name": "P100"}, {"name": "P101"}, {"name": "P102"}, {"name": "P103"}, {"name": "P104"}, {"name": "P105"}, {"name": "P106"}, {"name": "P107"}, {"name": "P108"}, {"name": "P109"}, {"name": "P110"}, {"name": "P111"}, {"name": "P112"}, {"name": "P113"}, {"name": "P114"}, {"name": "P115"}, {"name": "P116"}, {"name": "P117"}, {"name": "P118"}, {"name": "P119"}, {"name": "P120"}, {"name": "P121"}, {"name": "P122"}, {"name": "P123"}, {"name": "P124"}, {"name": "P125"}, {"name": "P126"}, {"name": "P127"}, {"name": "P128"}, {"name": "P129"}, {"name": "P130"}, {"name": "P131"}, {"name": "P132"}, {"name": "P133"}, {"name": "P134"}, {"name": "P135"}, {"name": "P136"}, {"name": "P137"}, {"name": "P138"}, {"name": "P139"}, {"name": "P140"}, {"name": "P141"}, {"name": "P142"}, {"name": "P143"}, {"name": "P144"}, {"name": "P145"}, {"name": "P146"}, {"name": "P147"}, {"name": "P148"}, {"name": "P149"}]}, {"externalID": "long-att", "title": "t", "startsAt": "2026-07-01T10:00:00Z", "endsAt": "2026-07-01T11:00:00Z", "allDay": false, "attendees": [{"name": "", "email": ""}]}]}'
    snapshot: [calendar_events]
  - name: older delta is skipped and keeps the row
    as: cal_syn
    request: {method: POST, path: /v1/calendar/sync, json: {events: [{externalID: seed-1, title: Stale, startsAt: "2026-05-01T10:00:00Z", endsAt: "2026-05-01T11:00:00Z", allDay: false, remoteUpdatedAt: "2026-03-01T09:00:00Z"}]}}
    snapshot: [calendar_events]
  - name: equal stamp wins and absent attendees are kept
    as: cal_syn
    request: {method: POST, path: /v1/calendar/sync, json: {events: [{externalID: seed-1, title: Equal, startsAt: "2026-05-01T10:00:00Z", endsAt: "2026-05-01T11:00:00Z", allDay: false, remoteUpdatedAt: "2026-03-01T10:00:00Z"}]}}
    snapshot: [calendar_events]
  - name: newer stamp and nulled fields overwrite
    as: cal_syn
    request: {method: POST, path: /v1/calendar/sync, json: {events: [{externalID: seed-1, title: Newer, startsAt: "2026-05-01T12:00:00Z", endsAt: "2026-05-01T13:00:00Z", allDay: true, remoteUpdatedAt: "2026-03-01T11:00:00Z", status: cancelled}]}}
    snapshot: [calendar_events]
  - name: no stamp counts as now and wins
    as: cal_syn
    request: {method: POST, path: /v1/calendar/sync, json: {events: [{externalID: seed-1, title: Unstamped, startsAt: "2026-05-01T12:00:00Z", endsAt: "2026-05-01T13:00:00Z", allDay: false, attendees: [{name: Ana}]}]}}
    snapshot: [calendar_events]
  - name: an empty attendees array clears them
    as: cal_syn
    request: {method: POST, path: /v1/calendar/sync, json: {events: [{externalID: seed-1, title: Cleared, startsAt: "2026-05-01T12:00:00Z", endsAt: "2026-05-01T13:00:00Z", allDay: false, attendees: []}]}}
    snapshot: [calendar_events]
  - name: a stale old stamp after an unstamped write is skipped
    as: cal_syn
    request: {method: POST, path: /v1/calendar/sync, json: {events: [{externalID: seed-1, title: Too old, startsAt: "2026-05-01T12:00:00Z", endsAt: "2026-05-01T13:00:00Z", allDay: false, remoteUpdatedAt: "2026-03-01T12:00:00Z"}]}}
  - name: the same id twice in a batch inserts then updates
    as: cal_syn
    request:
      method: POST
      path: /v1/calendar/sync
      json:
        events:
          - {externalID: twice, title: One, startsAt: "2026-06-01T10:00:00Z", endsAt: "2026-06-01T11:00:00Z", allDay: false, remoteUpdatedAt: "2026-03-01T10:00:00Z"}
          - {externalID: twice, title: Two, startsAt: "2026-06-01T10:00:00Z", endsAt: "2026-06-01T11:00:00Z", allDay: false, remoteUpdatedAt: "2026-03-01T10:00:01Z"}
    snapshot: [calendar_events]
  - name: other tenants id does not collide
    as: cal_ann
    request: {method: POST, path: /v1/calendar/sync, json: {events: [{externalID: twice, title: Anns, startsAt: "2026-06-01T10:00:00Z", endsAt: "2026-06-01T11:00:00Z", allDay: false}]}}
  - {name: synced events are listed by source, as: cal_syn, request: {method: GET, path: /v1/calendar/events}}
  # Aliases, because a batch cap needs a batch: one event repeated.
  - name: sync 1001 events is too large
    as: cal_syn
    request:
      method: POST
      path: /v1/calendar/sync
