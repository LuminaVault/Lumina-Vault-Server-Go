module: memory-agent
steps:
  - {"name": "no token", "request": {"method": "POST", "path": "/v1/query/stream", "json": {"query": "x"}}}
  - {"name": "bad token", "request": {"method": "POST", "path": "/v1/query/stream", "json": {"query": "x"}, "headers": {"Authorization": "Bearer not.a.jwt"}}}
  - {"name": "malformed json", "as": "ma_upd", "request": {"method": "POST", "path": "/v1/query/stream", "raw": "{\"query\":"}}
  - {"name": "empty body", "as": "ma_upd", "request": {"method": "POST", "path": "/v1/query/stream", "raw": ""}}
  - {"name": "array body", "as": "ma_upd", "request": {"method": "POST", "path": "/v1/query/stream", "raw": "[]"}}
  - {"name": "missing field", "as": "ma_upd", "request": {"method": "POST", "path": "/v1/query/stream", "json": {}}}
  - {"name": "null query", "as": "ma_upd", "request": {"method": "POST", "path": "/v1/query/stream", "raw": "{\"query\":null}"}}
  - {"name": "query wrong type", "as": "ma_upd", "request": {"method": "POST", "path": "/v1/query/stream", "raw": "{\"query\":7}"}}
  - {"name": "limit wrong type", "as": "ma_upd", "request": {"method": "POST", "path": "/v1/query/stream", "raw": "{\"query\":\"x\",\"limit\":\"5\"}"}}
  - {"name": "empty query", "as": "ma_upd", "request": {"method": "POST", "path": "/v1/query/stream", "raw": "{\"query\":\"\"}"}}
  - {"name": "bad vault header", "as": "ma_upd", "request": {"method": "POST", "path": "/v1/query/stream", "json": {"query": "x"}, "headers": {"X-Vault-ID": "nope"}}}
  - {"name": "foreign vault", "as": "ma_upd", "request": {"method": "POST", "path": "/v1/query/stream", "json": {"query": "x"}, "headers": {"X-Vault-ID": "3A000000-0000-4000-8000-0000000000A1"}}}
  - {"name": "gateway down: an error frame after a 200", "as": "ma_upd", "request": {"method": "POST", "path": "/v1/query/stream", "json": {"query": "hello"}}, "stream": true, "frames": 5, "framesTimeout": "20s"}
  - {"name": "wrong method", "as": "ma_upd", "request": {"method": "GET", "path": "/v1/query/stream"}}
