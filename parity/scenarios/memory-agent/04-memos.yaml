module: memory-agent
steps:
  - {"name": "no token", "request": {"method": "POST", "path": "/v1/memos", "json": {"topic": "x"}}}
  - {"name": "bad token", "request": {"method": "POST", "path": "/v1/memos", "json": {"topic": "x"}, "headers": {"Authorization": "Bearer not.a.jwt"}}}
  - {"name": "malformed json", "as": "ma_ben", "request": {"method": "POST", "path": "/v1/memos", "raw": "{\"query\":"}}
  - {"name": "empty body", "as": "ma_ben", "request": {"method": "POST", "path": "/v1/memos", "raw": ""}}
  - {"name": "array body", "as": "ma_ben", "request": {"method": "POST", "path": "/v1/memos", "raw": "[]"}}
  - {"name": "missing field", "as": "ma_ben", "request": {"method": "POST", "path": "/v1/memos", "json": {}}}
  - {"name": "null topic", "as": "ma_ben", "request": {"method": "POST", "path": "/v1/memos", "raw": "{\"topic\":null}"}}
  - {"name": "topic wrong type", "as": "ma_ben", "request": {"method": "POST", "path": "/v1/memos", "raw": "{\"topic\":7}"}}
  - {"name": "hint wrong type", "as": "ma_ben", "request": {"method": "POST", "path": "/v1/memos", "raw": "{\"topic\":\"\",\"hint\":7}"}}
  - {"name": "save wrong type", "as": "ma_ben", "request": {"method": "POST", "path": "/v1/memos", "raw": "{\"topic\":\"\",\"save\":\"yes\"}"}}
  - {"name": "empty topic", "as": "ma_ben", "request": {"method": "POST", "path": "/v1/memos", "raw": "{\"topic\":\"\"}"}}
  - {"name": "topic over 256 characters", "as": "ma_ben", "request": {"method": "POST", "path": "/v1/memos", "raw": "{\"topic\":\"xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\"}"}}
  - {"name": "topic of 257 combining clusters counts characters", "as": "ma_ben", "request": {"method": "POST", "path": "/v1/memos", "raw": "{\"topic\":\"e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301e\\u0301\"}"}}
  - {"name": "gateway down", "as": "ma_ben", "request": {"method": "POST", "path": "/v1/memos", "json": {"topic": "sleep"}}}
  - {"name": "list, no token", "request": {"method": "GET", "path": "/v1/memos"}}
  - {"name": "list, bad token", "request": {"method": "GET", "path": "/v1/memos", "headers": {"Authorization": "Bearer not.a.jwt"}}}
  - {"name": "list: only memos/, newest first", "as": "ma_amy", "request": {"method": "GET", "path": "/v1/memos"}}
  - {"name": "list: the other tenant", "as": "ma_ben", "request": {"method": "GET", "path": "/v1/memos"}}
  - {"name": "list: no memos", "as": "ma_nil", "request": {"method": "GET", "path": "/v1/memos"}}
  - {"name": "list ignores the vault header", "as": "ma_amy", "request": {"method": "GET", "path": "/v1/memos", "headers": {"X-Vault-ID": "nope"}}}
  - {"name": "delete is no route", "as": "ma_ben", "request": {"method": "DELETE", "path": "/v1/memos"}}
