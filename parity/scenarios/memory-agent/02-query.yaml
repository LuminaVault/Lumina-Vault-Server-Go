module: memory-agent
steps:
  - {"name": "no token", "request": {"method": "POST", "path": "/v1/query", "json": {"query": "x"}}}
  - {"name": "bad token", "request": {"method": "POST", "path": "/v1/query", "json": {"query": "x"}, "headers": {"Authorization": "Bearer not.a.jwt"}}}
  - {"name": "malformed json", "as": "ma_qry", "request": {"method": "POST", "path": "/v1/query", "raw": "{\"query\":"}}
  - {"name": "empty body", "as": "ma_qry", "request": {"method": "POST", "path": "/v1/query", "raw": ""}}
  - {"name": "array body", "as": "ma_qry", "request": {"method": "POST", "path": "/v1/query", "raw": "[]"}}
  - {"name": "missing field", "as": "ma_qry", "request": {"method": "POST", "path": "/v1/query", "json": {}}}
  - {"name": "null query", "as": "ma_qry", "request": {"method": "POST", "path": "/v1/query", "raw": "{\"query\":null}"}}
  - {"name": "query wrong type", "as": "ma_qry", "request": {"method": "POST", "path": "/v1/query", "raw": "{\"query\":7}"}}
  - {"name": "limit wrong type", "as": "ma_qry", "request": {"method": "POST", "path": "/v1/query", "raw": "{\"query\":\"x\",\"limit\":\"5\"}"}}
  - {"name": "session id wrong type", "as": "ma_qry", "request": {"method": "POST", "path": "/v1/query", "raw": "{\"query\":\"\",\"session_id\":5}"}}
  - {"name": "empty query", "as": "ma_qry", "request": {"method": "POST", "path": "/v1/query", "raw": "{\"query\":\"\"}"}}
  - {"name": "bad vault header", "as": "ma_qry", "request": {"method": "POST", "path": "/v1/query", "json": {"query": "x"}, "headers": {"X-Vault-ID": "nope"}}}
  - {"name": "foreign vault", "as": "ma_qry", "request": {"method": "POST", "path": "/v1/query", "json": {"query": "x"}, "headers": {"X-Vault-ID": "3A000000-0000-4000-8000-0000000000A1"}}}
  - {"name": "gateway down", "as": "ma_qry", "request": {"method": "POST", "path": "/v1/query", "json": {"query": "hello"}}}
  - {"name": "wrong method", "as": "ma_qry", "request": {"method": "GET", "path": "/v1/query"}}
  - {"name": "stream, unknown path", "as": "ma_qry", "request": {"method": "POST", "path": "/v1/query/other", "json": {"query": "x"}}}
