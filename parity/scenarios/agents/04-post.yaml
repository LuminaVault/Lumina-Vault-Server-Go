# Chains that end without a working agent: the main run has no gateway (HERMES_GATEWAY_URL
# is unroutable) and Eve has no BYO Hermes. The LLM state runs real turns
# (parity/scenarios-switched/agents).
module: agents
steps:
  - {name: spent budget, as: agents_eve, request: {method: POST, path: /v1/agents/rooms/A9E7A000-0000-4000-8000-000000000001/messages, json: {body: hi}}, stream: true, frames: 30, framesTimeout: 20s, headers: [Cache-Control, X-Accel-Buffering]}
  - {name: stop pressed ahead of the chain, as: agents_eve, request: {method: POST, path: /v1/agents/rooms/A9E7A000-0000-4000-8000-000000000002/messages, json: {body: "  hi\n"}}, stream: true, frames: 30, framesTimeout: 20s}
  - {name: own hermes no longer linked, as: agents_eve, request: {method: POST, path: /v1/agents/rooms/A9E7A000-0000-4000-8000-000000000003/messages, json: {body: "hello @MINE."}}, stream: true, frames: 30, framesTimeout: 20s}
  - {name: central agent can't answer, as: agents_eve, request: {method: POST, path: /v1/agents/rooms/A9E7A000-0000-4000-8000-000000000003/messages, json: {body: "hello"}}, stream: true, frames: 30, framesTimeout: 25s}
  - {name: a handle inside a longer word names nobody, as: agents_eve, request: {method: POST, path: /v1/agents/rooms/A9E7A000-0000-4000-8000-000000000004/messages, json: {body: "@ghostly hi"}}, stream: true, frames: 30, framesTimeout: 20s}
  - {name: an unknown instance fails its turn, as: agents_eve, request: {method: POST, path: /v1/agents/rooms/A9E7A000-0000-4000-8000-000000000004/messages, json: {body: "@ghost, hi"}}, stream: true, frames: 30, framesTimeout: 20s, snapshot: [agent_rooms, agent_room_messages]}
  - {name: the thread, as: agents_eve, request: {method: GET, path: /v1/agents/rooms/A9E7A000-0000-4000-8000-000000000003}}
  - {name: rooms by last activity, as: agents_eve, request: {method: GET, path: /v1/agents/rooms}}
  - {"name": "over-long post", "as": "agents_eve", "request": {"method": "POST", "path": "/v1/agents/rooms/A9E7A000-0000-4000-8000-000000000003/messages", "json": {"body": ""}}}
  - {name: post to a room that isn't there, as: agents_eve, request: {method: POST, path: /v1/agents/rooms/A9E7A000-0000-4000-8000-00000000DEAD/messages, json: {body: hi}}}
