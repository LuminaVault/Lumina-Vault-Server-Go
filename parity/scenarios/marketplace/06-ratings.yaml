# Ratings need a verified install and are not for the publisher.
module: marketplace
steps:
  - {"name": "rate unknown", "as": "mkt_rate", "request": {"method": "PUT", "path": "/v1/marketplace/plugins/nope/rating", "json": {"rating": 5}}}
  - {"name": "rate too low", "as": "mkt_rate", "request": {"method": "PUT", "path": "/v1/marketplace/plugins/alpha-notes/rating", "json": {"rating": 0}}}
  - {"name": "rate too high", "as": "mkt_rate", "request": {"method": "PUT", "path": "/v1/marketplace/plugins/alpha-notes/rating", "json": {"rating": 6}}}
  - {"name": "review too long", "as": "mkt_rate", "request": {"method": "PUT", "path": "/v1/marketplace/plugins/alpha-notes/rating", "json": {"rating": 5, "body": ""}}}
  - {"name": "not installed", "as": "mkt_rate", "request": {"method": "PUT", "path": "/v1/marketplace/plugins/alpha-notes/rating", "json": {"rating": 5}}}
  - {"name": "rate", "as": "mkt_inst", "request": {"method": "PUT", "path": "/v1/marketplace/plugins/alpha-notes/rating", "json": {"rating": 4, "body": "  Nice  "}}, "snapshot": ["marketplace_ratings"]}
  - {"name": "rate again updates", "as": "mkt_inst", "request": {"method": "PUT", "path": "/v1/marketplace/plugins/alpha-notes/rating", "json": {"rating": 3, "body": "   "}}, "snapshot": ["marketplace_ratings"]}
  - {"name": "reviews show it", "as": "mkt_inst", "request": {"method": "GET", "path": "/v1/marketplace/plugins/alpha-notes/reviews"}}
  - {"name": "average on detail", "as": "mkt_inst", "request": {"method": "GET", "path": "/v1/marketplace/plugins/alpha-notes"}}
  - {"name": "publisher cannot rate its own", "as": "mkt_pub", "request": {"method": "PUT", "path": "/v1/marketplace/plugins/alpha-notes/rating", "json": {"rating": 5}}}
  - {"name": "foreign rating does not change", "as": "bob", "request": {"method": "PUT", "path": "/v1/marketplace/plugins/beta-tools/rating", "json": {"rating": 1}}, "snapshot": ["marketplace_ratings"]}
