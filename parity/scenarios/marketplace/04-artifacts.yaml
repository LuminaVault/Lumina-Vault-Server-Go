# Upload, sign, version, submit, approve: a whole WASM plugin through the API, using
# the fixed PLUGIN_ARTIFACT_SIGNING_KEY. Scenario 07 runs its tools. Each file is a
# new variable scope, so 07 reads the version id back from the listing.
module: marketplace
steps:
  - {"name": "create the listing", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins", "json": {"slug": "wasm-tool", "name": "Wasm Tool", "summary": "Runs", "description": "Runs in the runner", "category": "skill"}}}
  - {"name": "not a wasm file name", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/artifacts", "json": {"fileName": "a.txt", "bytesBase64": "AGFzbQEAAAA="}}}
  - {"name": "file name with a slash", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/artifacts", "json": {"fileName": "a/b.wasm", "bytesBase64": "AGFzbQEAAAA="}}}
  - {"name": "bad base64", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/artifacts", "json": {"fileName": "a.wasm", "bytesBase64": "***"}}}
  - {"name": "base64 with a newline", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/artifacts", "json": {"fileName": "a.wasm", "bytesBase64": "AGFz\nbQEAAAA="}}}
  - {"name": "empty base64", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/artifacts", "json": {"fileName": "a.wasm", "bytesBase64": ""}}}
  - {"name": "not wasm bytes", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/artifacts", "json": {"fileName": "a.wasm", "bytesBase64": "aGVsbG8="}}}
  - {"name": "foreign listing", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/beta-tools/artifacts", "json": {"fileName": "a.wasm", "bytesBase64": "AGFzbQEAAAA="}}}
  - {"name": "upload", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/artifacts", "json": {"fileName": "TOOL.WASM", "bytesBase64": "AGFzbQEAAAA="}}, "capture": {"key": "$.artifactKey", "sha": "$.sha256", "sig": "$.signature"}}
  - {"name": "upload again is the same", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/artifacts", "json": {"fileName": "a.wasm", "bytesBase64": "AGFzbQEAAAA="}}}
  - {"name": "artifact key that escapes", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/versions", "json": {"version": "1.0.0", "runtimeKind": "wasm", "permissions": ["memory.read", "memory.write", "vault.read", "vault.write", "network.fetch", "output.emit"], "networkHosts": ["allowed.parity.test"], "configFields": [], "artifactKey": "../x.wasm", "artifactSHA256": "{{sha}}", "artifactSignature": "{{sig}}", "manifestJSON": "{\"schemaVersion\":1,\"tools\":[{\"name\":\"echo\",\"description\":\"echo tool\"},{\"name\":\"capable\",\"description\":\"capable tool\"},{\"name\":\"loop\",\"description\":\"loop tool\"},{\"name\":\"emptyreq\",\"description\":\"emptyreq tool\"},{\"name\":\"badreq\",\"description\":\"badreq tool\"},{\"name\":\"reject\",\"description\":\"reject tool\"},{\"name\":\"garbage\",\"description\":\"garbage tool\"},{\"name\":\"partial\",\"description\":\"partial tool\"},{\"name\":\"unknown-to-runner\",\"description\":\"unknown-to-runner tool\"}]}"}}}
  - {"name": "signature for another key", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/versions", "json": {"version": "1.0.0", "runtimeKind": "wasm", "permissions": ["memory.read", "memory.write", "vault.read", "vault.write", "network.fetch", "output.emit"], "networkHosts": ["allowed.parity.test"], "configFields": [], "artifactKey": "wasm-pub/wasm-tool/other.wasm", "artifactSHA256": "{{sha}}", "artifactSignature": "{{sig}}", "manifestJSON": "{\"schemaVersion\":1,\"tools\":[{\"name\":\"echo\",\"description\":\"echo tool\"},{\"name\":\"capable\",\"description\":\"capable tool\"},{\"name\":\"loop\",\"description\":\"loop tool\"},{\"name\":\"emptyreq\",\"description\":\"emptyreq tool\"},{\"name\":\"badreq\",\"description\":\"badreq tool\"},{\"name\":\"reject\",\"description\":\"reject tool\"},{\"name\":\"garbage\",\"description\":\"garbage tool\"},{\"name\":\"partial\",\"description\":\"partial tool\"},{\"name\":\"unknown-to-runner\",\"description\":\"unknown-to-runner tool\"}]}"}}}
  - {"name": "create wasm version", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/versions", "json": {"version": "1.0.0", "runtimeKind": "wasm", "permissions": ["memory.read", "memory.write", "vault.read", "vault.write", "network.fetch", "output.emit"], "networkHosts": ["allowed.parity.test"], "configFields": [], "artifactKey": "{{key}}", "artifactSHA256": "{{sha}}", "artifactSignature": "{{sig}}", "manifestJSON": "{\"schemaVersion\":1,\"tools\":[{\"name\":\"echo\",\"description\":\"echo tool\"},{\"name\":\"capable\",\"description\":\"capable tool\"},{\"name\":\"loop\",\"description\":\"loop tool\"},{\"name\":\"emptyreq\",\"description\":\"emptyreq tool\"},{\"name\":\"badreq\",\"description\":\"badreq tool\"},{\"name\":\"reject\",\"description\":\"reject tool\"},{\"name\":\"garbage\",\"description\":\"garbage tool\"},{\"name\":\"partial\",\"description\":\"partial tool\"},{\"name\":\"unknown-to-runner\",\"description\":\"unknown-to-runner tool\"}]}"}}, "capture": {"vid": "$.id"}, "snapshot": ["marketplace_versions"]}
  - {"name": "bad tools version", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/versions", "json": {"version": "1.0.1", "runtimeKind": "wasm", "permissions": ["memory.read", "memory.write", "vault.read", "vault.write", "network.fetch", "output.emit"], "networkHosts": ["allowed.parity.test"], "configFields": [], "artifactKey": "{{key}}", "artifactSHA256": "{{sha}}", "artifactSignature": "{{sig}}", "manifestJSON": "{\"schemaVersion\":2,\"tools\":[]}"}}, "capture": {"badtools": "$.id"}}
  - {"name": "dup tools version", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/versions", "json": {"version": "1.0.2", "runtimeKind": "wasm", "permissions": ["memory.read", "memory.write", "vault.read", "vault.write", "network.fetch", "output.emit"], "networkHosts": ["allowed.parity.test"], "configFields": [], "artifactKey": "{{key}}", "artifactSHA256": "{{sha}}", "artifactSignature": "{{sig}}", "manifestJSON": "{\"schemaVersion\":1,\"tools\":[{\"name\":\"Bad Name\",\"description\":\"d\"},{\"name\":\"Bad Name\",\"description\":\"d\"}]}"}}, "capture": {"duptools": "$.id"}}
  - {"name": "submit bad tools stays draft", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/versions/{{badtools}}/submit"}, "snapshot": ["marketplace_submissions"]}
  - {"name": "submit bad tools again keeps one row", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/versions/{{badtools}}/submit"}, "snapshot": ["marketplace_submissions"]}
  - {"name": "submit dup tools", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/versions/{{duptools}}/submit"}}
  - {"name": "submit bad id", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/versions/nope/submit"}}
  - {"name": "submit unknown id", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/versions/00000000-0000-4000-8000-000000000000/submit"}}
  - {"name": "submit on a foreign listing", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/alpha-notes/versions/AA7A0000-0000-4000-8000-000000000004/submit"}}
  - {"name": "submit", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/versions/{{vid}}/submit"}, "capture": {"sid": "$.id"}, "snapshot": ["marketplace_versions", "marketplace_submissions"]}
  - {"name": "submit in review is 409", "as": "mkt_wasm", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/wasm-tool/versions/{{vid}}/submit"}}
  - {"name": "own submissions", "as": "mkt_wasm", "request": {"method": "GET", "path": "/v1/marketplace/publisher/submissions"}}
  - {"name": "mkt_pub submits a seeded validation failure", "as": "mkt_pub", "request": {"method": "POST", "path": "/v1/marketplace/publisher/plugins/draft-thing/versions/AA7A0000-0000-4000-8000-000000000007/submit"}, "snapshot": ["marketplace_submissions"]}
  - {"name": "approve wasm", "as": "mkt_admin", "request": {"method": "POST", "path": "/v1/marketplace/admin/submissions/{{sid}}/decision", "json": {"approved": true, "note": "  looks fine  "}}, "snapshot": ["marketplace_versions", "marketplace_listings", "marketplace_submissions"]}
  - {"name": "decide twice", "as": "mkt_admin", "request": {"method": "POST", "path": "/v1/marketplace/admin/submissions/{{sid}}/decision", "json": {"approved": false}}}
  - {"name": "now public", "as": "mkt_up", "request": {"method": "GET", "path": "/v1/marketplace/plugins/wasm-tool"}}
