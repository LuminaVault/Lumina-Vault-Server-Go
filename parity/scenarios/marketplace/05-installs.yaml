# Install and upgrade (PluginService). parity_plugin_installs hides the sealed bytes
# but keeps their length, so a merged config shows as a longer plaintext.
module: marketplace
steps:
  - {"name": "install unknown listing", "as": "mkt_inst", "request": {"method": "POST", "path": "/v1/marketplace/plugins/nope/install", "json": {"versionId": "AA7A0000-0000-4000-8000-000000000001", "grantedPermissions": [], "config": {}}}}
  - {"name": "install a draft listing", "as": "mkt_inst", "request": {"method": "POST", "path": "/v1/marketplace/plugins/draft-thing/install", "json": {"versionId": "AA7A0000-0000-4000-8000-000000000006", "grantedPermissions": [], "config": {}}}}
  - {"name": "install a version of another listing", "as": "mkt_inst", "request": {"method": "POST", "path": "/v1/marketplace/plugins/alpha-notes/install", "json": {"versionId": "AA7A0000-0000-4000-8000-000000000005", "grantedPermissions": [], "config": {}}}}
  - {"name": "install a draft version", "as": "mkt_inst", "request": {"method": "POST", "path": "/v1/marketplace/plugins/alpha-notes/install", "json": {"versionId": "AA7A0000-0000-4000-8000-000000000004", "grantedPermissions": [], "config": {}}}}
  - {"name": "install with too few grants", "as": "mkt_inst", "request": {"method": "POST", "path": "/v1/marketplace/plugins/alpha-notes/install", "json": {"versionId": "AA7A0000-0000-4000-8000-000000000001", "grantedPermissions": [], "config": {"api_key": "k"}}}}
  - {"name": "install with too many grants", "as": "mkt_inst", "request": {"method": "POST", "path": "/v1/marketplace/plugins/alpha-notes/install", "json": {"versionId": "AA7A0000-0000-4000-8000-000000000001", "grantedPermissions": ["memory.read", "vault.read"], "config": {"api_key": "k"}}}}
  - {"name": "install with an unknown field", "as": "mkt_inst", "request": {"method": "POST", "path": "/v1/marketplace/plugins/alpha-notes/install", "json": {"versionId": "AA7A0000-0000-4000-8000-000000000001", "grantedPermissions": ["memory.read"], "config": {"api_key": "k", "nope": "x"}}}}
  - {"name": "install with no required field", "as": "mkt_inst", "request": {"method": "POST", "path": "/v1/marketplace/plugins/alpha-notes/install", "json": {"versionId": "AA7A0000-0000-4000-8000-000000000001", "grantedPermissions": ["memory.read"], "config": {"region": "eu"}}}}
  - {"name": "install with a blank required field", "as": "mkt_inst", "request": {"method": "POST", "path": "/v1/marketplace/plugins/alpha-notes/install", "json": {"versionId": "AA7A0000-0000-4000-8000-000000000001", "grantedPermissions": ["memory.read"], "config": {"api_key": "   "}}}}
  - {"name": "install", "as": "mkt_inst", "request": {"method": "POST", "path": "/v1/marketplace/plugins/alpha-notes/install", "json": {"versionId": "AA7A0000-0000-4000-8000-000000000001", "grantedPermissions": ["memory.read", "memory.read"], "config": {"api_key": "k", "region": "eu"}}}, "snapshot": ["parity_plugin_installs"]}
  - {"name": "install again merges the old config", "as": "mkt_inst", "request": {"method": "POST", "path": "/v1/marketplace/plugins/alpha-notes/install", "json": {"versionId": "AA7A0000-0000-4000-8000-000000000001", "grantedPermissions": ["memory.read"], "config": {"region": "us"}}}, "snapshot": ["parity_plugin_installs"]}
  - {"name": "install lowercase version id", "as": "mkt_inst", "request": {"method": "POST", "path": "/v1/marketplace/plugins/alpha-notes/install", "json": {"versionId": "aa7a0000-0000-4000-8000-000000000001", "grantedPermissions": ["memory.read"], "config": {}}}}
  - {"name": "count shows on detail", "as": "mkt_inst", "request": {"method": "GET", "path": "/v1/marketplace/plugins/alpha-notes"}}
  - {"name": "upgrade not installed", "as": "mkt_inst", "request": {"method": "POST", "path": "/v1/marketplace/plugins/beta-tools/upgrade", "json": {"fromVersionId": "AA7A0000-0000-4000-8000-000000000005", "toVersionId": "AA7A0000-0000-4000-8000-000000000005", "grantedPermissions": [], "config": {}}}}
  - {"name": "upgrade from the wrong version", "as": "mkt_inst", "request": {"method": "POST", "path": "/v1/marketplace/plugins/alpha-notes/upgrade", "json": {"fromVersionId": "AA7A0000-0000-4000-8000-000000000002", "toVersionId": "AA7A0000-0000-4000-8000-000000000003", "grantedPermissions": [], "config": {}}}}
  - {"name": "upgrade to the same version", "as": "mkt_inst", "request": {"method": "POST", "path": "/v1/marketplace/plugins/alpha-notes/upgrade", "json": {"fromVersionId": "AA7A0000-0000-4000-8000-000000000001", "toVersionId": "AA7A0000-0000-4000-8000-000000000001", "grantedPermissions": ["memory.read"], "config": {}}}}
  - {"name": "upgrade wrong grants", "as": "mkt_inst", "request": {"method": "POST", "path": "/v1/marketplace/plugins/alpha-notes/upgrade", "json": {"fromVersionId": "AA7A0000-0000-4000-8000-000000000001", "toVersionId": "AA7A0000-0000-4000-8000-000000000002", "grantedPermissions": ["memory.read"], "config": {}}}}
  - {"name": "upgrade where old keys are unknown", "as": "mkt_inst", "request": {"method": "POST", "path": "/v1/marketplace/plugins/alpha-notes/upgrade", "json": {"fromVersionId": "AA7A0000-0000-4000-8000-000000000001", "toVersionId": "AA7A0000-0000-4000-8000-000000000003", "grantedPermissions": [], "config": {"new_required": "x"}}}}
  - {"name": "upgrade to a draft", "as": "mkt_inst", "request": {"method": "POST", "path": "/v1/marketplace/plugins/alpha-notes/upgrade", "json": {"fromVersionId": "AA7A0000-0000-4000-8000-000000000001", "toVersionId": "AA7A0000-0000-4000-8000-000000000004", "grantedPermissions": [], "config": {}}}}
  - {"name": "upgrade", "as": "mkt_inst", "request": {"method": "POST", "path": "/v1/marketplace/plugins/alpha-notes/upgrade", "json": {"fromVersionId": "AA7A0000-0000-4000-8000-000000000001", "toVersionId": "AA7A0000-0000-4000-8000-000000000002", "grantedPermissions": ["vault.read", "memory.read"], "config": {"region": "eu"}}}, "snapshot": ["parity_plugin_installs"]}
  - {"name": "install on a row that will not open", "as": "mkt_bad", "request": {"method": "POST", "path": "/v1/marketplace/plugins/alpha-notes/install", "json": {"versionId": "AA7A0000-0000-4000-8000-000000000001", "grantedPermissions": ["memory.read"], "config": {"api_key": "k"}}}}
  - {"name": "upgrade on a row that will not open", "as": "mkt_bad", "request": {"method": "POST", "path": "/v1/marketplace/plugins/alpha-notes/upgrade", "json": {"fromVersionId": "AA7A0000-0000-4000-8000-000000000001", "toVersionId": "AA7A0000-0000-4000-8000-000000000002", "grantedPermissions": ["vault.read", "memory.read"], "config": {}}}}
  - {"name": "bob installs into his own tenant", "as": "bob", "request": {"method": "POST", "path": "/v1/marketplace/plugins/beta-tools/install", "json": {"versionId": "AA7A0000-0000-4000-8000-000000000005", "grantedPermissions": [], "config": {}}}, "snapshot": ["parity_plugin_installs"]}
