# Wave 8B sign-in flows that write nothing but a refresh token: AuthController.oauthExchange,
# XOAuthController, PhoneAuthController and EmailMagicLinkController. Google is configured with
# an unreachable JWKS and Apple is not (docker-compose.parity.yml), so the exchange can only
# answer 404, 400 or the JWKS 500; X's /2/users/me is unreachable too. Phone and magic-link
# codes are fixed (424242, 313131) and verify against parity/seed/auth.sql's two seeded
# identities, so the user is known. Challenge ids and expiries are random. Each start has its
# own X-Forwarded-For unless a step is about the limit.
module: auth
steps:
  # OAuth id_token exchange.
  - {name: apple is not configured, request: {method: POST, path: /v1/auth/oauth/apple/exchange, json: {idToken: x}}}
  - {name: unknown provider before the body, request: {method: POST, path: /v1/auth/oauth/github/exchange, raw: "not json"}}
  - {name: provider is case sensitive, request: {method: POST, path: /v1/auth/oauth/Google/exchange, json: {idToken: x}}}
  - {name: google missing idToken, request: {method: POST, path: /v1/auth/oauth/google/exchange, json: {}}}
  - {name: google idToken null, request: {method: POST, path: /v1/auth/oauth/google/exchange, raw: "{\"idToken\":null}"}}
  - {name: google not json, request: {method: POST, path: /v1/auth/oauth/google/exchange, raw: "nope"}}
  - {name: google JWKS unreachable, request: {method: POST, path: /v1/auth/oauth/google/exchange, json: {idToken: a.b.c}}}
  - {name: get on exchange, request: {method: GET, path: /v1/auth/oauth/google/exchange}}
  # X: the literal route wins over :provider.
  - {name: x empty token, request: {method: POST, path: /v1/auth/oauth/x/exchange, json: {accessToken: ""}}}
  - {name: x missing token, request: {method: POST, path: /v1/auth/oauth/x/exchange, json: {idToken: x}}}
  - {name: x token number, request: {method: POST, path: /v1/auth/oauth/x/exchange, raw: "{\"accessToken\":7}"}}
  - {name: x api unreachable, request: {method: POST, path: /v1/auth/oauth/x/exchange, json: {accessToken: parity-x-token}}}
  # Phone.
  - {name: phone start no plus, request: {method: POST, path: /v1/auth/phone/start, headers: {X-Forwarded-For: 198.51.130.1}, json: {phone: "5551234567"}}}
  - {name: phone start leading zero, request: {method: POST, path: /v1/auth/phone/start, headers: {X-Forwarded-For: 198.51.130.2}, json: {phone: "+0123456"}}}
  - {name: phone start dashes, request: {method: POST, path: /v1/auth/phone/start, headers: {X-Forwarded-For: 198.51.130.3}, json: {phone: "+1-555-123-4567"}}}
  - {name: phone start sixteen digits, request: {method: POST, path: /v1/auth/phone/start, headers: {X-Forwarded-For: 198.51.130.4}, json: {phone: "+1234567890123456"}}}
  - {name: phone start missing, request: {method: POST, path: /v1/auth/phone/start, headers: {X-Forwarded-For: 198.51.130.5}, json: {}}}
  - {name: phone verify bad phone, request: {method: POST, path: /v1/auth/phone/verify, json: {phone: "555", code: "424242"}}}
  - {name: phone verify missing code, request: {method: POST, path: /v1/auth/phone/verify, json: {phone: "+15550001001"}}}
  - {name: phone verify without start, request: {method: POST, path: /v1/auth/phone/verify, json: {phone: "+15550001001", code: "424242"}}}
  - {name: phone start padded, request: {method: POST, path: /v1/auth/phone/start, headers: {X-Forwarded-For: 198.51.130.6}, json: {phone: " +15550001001\n"}}, ignore: ["$.challengeId", "$.expiresAt"]}
  - {name: phone verify wrong code, request: {method: POST, path: /v1/auth/phone/verify, json: {phone: "+15550001001", code: "000000"}}}
  - {name: phone verify signs in to the seeded account, request: {method: POST, path: /v1/auth/phone/verify, json: {phone: "+15550001001", code: "424242"}}, ignore: ["$.accessToken", "$.refreshToken"]}
  - {name: phone code is spent, request: {method: POST, path: /v1/auth/phone/verify, json: {phone: "+15550001001", code: "424242"}}}
  - {name: phone lockout 1, request: {method: POST, path: /v1/auth/phone/start, headers: {X-Forwarded-For: 198.51.130.7}, json: {phone: "+15550001001"}}, ignore: ["$.challengeId", "$.expiresAt"]}
  - {name: phone lockout wrong 1, request: {method: POST, path: /v1/auth/phone/verify, json: {phone: "+15550001001", code: "1"}}}
  - {name: phone lockout wrong 2, request: {method: POST, path: /v1/auth/phone/verify, json: {phone: "+15550001001", code: "2"}}}
  - {name: phone lockout wrong 3, request: {method: POST, path: /v1/auth/phone/verify, json: {phone: "+15550001001", code: "3"}}}
  - {name: phone lockout wrong 4, request: {method: POST, path: /v1/auth/phone/verify, json: {phone: "+15550001001", code: "4"}}}
  - {name: phone lockout wrong 5 burns, request: {method: POST, path: /v1/auth/phone/verify, json: {phone: "+15550001001", code: "5"}}}
  - {name: phone right code after lockout, request: {method: POST, path: /v1/auth/phone/verify, json: {phone: "+15550001001", code: "424242"}}}
  - {name: phone limit 1, request: {method: POST, path: /v1/auth/phone/start, headers: {X-Forwarded-For: 198.51.130.8}, json: {phone: "+15550009001"}}, ignore: ["$.challengeId", "$.expiresAt"]}
  - {name: phone limit 2, request: {method: POST, path: /v1/auth/phone/start, headers: {X-Forwarded-For: 198.51.130.8}, json: {phone: "nope"}}}
  - {name: phone limit 3, request: {method: POST, path: /v1/auth/phone/start, headers: {X-Forwarded-For: 198.51.130.8}, raw: "{"}}
  - {name: phone limit 4 is limited, request: {method: POST, path: /v1/auth/phone/start, headers: {X-Forwarded-For: 198.51.130.8}, json: {phone: "+15550009001"}}}
  - {name: magic start has its own bucket, request: {method: POST, path: /v1/auth/email/start, headers: {X-Forwarded-For: 198.51.130.8}, json: {email: limit@parity.test}}, ignore: ["$.challengeId", "$.expiresAt"]}
  # Email magic link.
  - {name: magic start no at, request: {method: POST, path: /v1/auth/email/start, headers: {X-Forwarded-For: 198.51.130.9}, json: {email: no-at-sign}}}
  - {name: magic start four characters, request: {method: POST, path: /v1/auth/email/start, headers: {X-Forwarded-For: 198.51.130.10}, json: {email: "a@bc"}}}
  - {name: magic start five characters, request: {method: POST, path: /v1/auth/email/start, headers: {X-Forwarded-For: 198.51.130.11}, json: {email: "a@b.c"}}, ignore: ["$.challengeId", "$.expiresAt"]}
  - {name: magic start missing, request: {method: POST, path: /v1/auth/email/start, headers: {X-Forwarded-For: 198.51.130.12}, raw: "[]"}}
  - {name: magic verify bad email, request: {method: POST, path: /v1/auth/email/verify, json: {email: nope, code: "313131"}}}
  - {name: magic verify without start, request: {method: POST, path: /v1/auth/email/verify, json: {email: auth-magic@parity.test, code: "313131"}}}
  - {name: magic start mixed case, request: {method: POST, path: /v1/auth/email/start, headers: {X-Forwarded-For: 198.51.130.13}, json: {email: "  Auth-Magic@Parity.TEST "}}, ignore: ["$.challengeId", "$.expiresAt"]}
  - {name: magic verify wrong code, request: {method: POST, path: /v1/auth/email/verify, json: {email: auth-magic@parity.test, code: "000000"}}}
  - {name: magic verify signs in to the seeded account, request: {method: POST, path: /v1/auth/email/verify, json: {email: "AUTH-MAGIC@parity.test", code: "313131"}}, ignore: ["$.accessToken", "$.refreshToken"]}
  - {name: magic code is spent, request: {method: POST, path: /v1/auth/email/verify, json: {email: auth-magic@parity.test, code: "313131"}}}
  - {name: magic verify code number, request: {method: POST, path: /v1/auth/email/verify, raw: "{\"email\":\"auth-magic@parity.test\",\"code\":313131}"}}
