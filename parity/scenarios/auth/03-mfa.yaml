# POST /v1/auth/mfa/verify and /mfa/resend (MFAService). The codes Swift and Go mail are
# random, so the success path uses seeded challenges (parity/seed/auth.sql, code 333333):
# c1 valid, c2 consumed, c3 expired, c4 one failure from burnt.
module: auth
steps:
  - {name: verify c1, request: {method: POST, path: /v1/auth/mfa/verify, headers: {X-Forwarded-For: 198.51.102.1}, json: {challengeId: A07300C1-0000-4000-8000-000000000001, code: "333333"}}, ignore: ["$.accessToken", "$.refreshToken"]}
  - {name: verify c1 again, request: {method: POST, path: /v1/auth/mfa/verify, headers: {X-Forwarded-For: 198.51.102.1}, json: {challengeId: A07300C1-0000-4000-8000-000000000001, code: "333333"}}}
  - {name: verify consumed c2, request: {method: POST, path: /v1/auth/mfa/verify, headers: {X-Forwarded-For: 198.51.102.1}, json: {challengeId: a07300c2-0000-4000-8000-000000000002, code: "333333"}}}
  - {name: verify expired c3, request: {method: POST, path: /v1/auth/mfa/verify, headers: {X-Forwarded-For: 198.51.102.1}, json: {challengeId: a07300c3-0000-4000-8000-000000000003, code: "333333"}}}
  - {name: c4 fifth failure burns, request: {method: POST, path: /v1/auth/mfa/verify, headers: {X-Forwarded-For: 198.51.102.1}, json: {challengeId: a07300c4-0000-4000-8000-000000000004, code: "000000"}}}
  - {name: c4 right code after burn, request: {method: POST, path: /v1/auth/mfa/verify, headers: {X-Forwarded-For: 198.51.102.1}, json: {challengeId: a07300c4-0000-4000-8000-000000000004, code: "333333"}}}
  - {name: verify unknown challenge, request: {method: POST, path: /v1/auth/mfa/verify, headers: {X-Forwarded-For: 198.51.102.1}, json: {challengeId: 00000000-0000-4000-8000-000000000000, code: "333333"}}}
  - name: pending login
    request: {method: POST, path: /v1/auth/login, headers: {X-Forwarded-For: 198.51.102.2, mfa-auth-v1: "true"}, json: {email: auth-mfa@parity.test, password: parity-login-pass-1}}
    capture: {challenge: "$.mfaChallengeId"}
  - {name: wrong code on the live challenge, request: {method: POST, path: /v1/auth/mfa/verify, headers: {X-Forwarded-For: 198.51.102.3}, json: {challengeId: "{{challenge}}", code: "000000"}}}
  - {name: empty code, request: {method: POST, path: /v1/auth/mfa/verify, headers: {X-Forwarded-For: 198.51.102.3}, json: {challengeId: "{{challenge}}", code: ""}}}
  - {name: resend known, request: {method: POST, path: /v1/auth/mfa/resend, headers: {X-Forwarded-For: 198.51.102.4}, json: {email: AUTH-MFA@parity.test}}}
  - {name: resend unknown, request: {method: POST, path: /v1/auth/mfa/resend, headers: {X-Forwarded-For: 198.51.102.4}, json: {email: nobody@parity.test}}}
