# Every /v1/router route without a token and with a bad one. Anonymous steps send
# their own X-Forwarded-For, so their settingsByUser bucket is theirs alone.
module: llm-router
steps:
  - {name: list no token, request: {method: GET, path: /v1/router, headers: {X-Forwarded-For: 10.96.0.1}}}
  - {name: create no token, request: {method: POST, path: /v1/router, json: {}, headers: {X-Forwarded-For: 10.96.0.1}}}
  - {name: catalog no token, request: {method: GET, path: /v1/router/catalog, headers: {X-Forwarded-For: 10.96.0.1}}}
  - {name: bindings no token, request: {method: GET, path: /v1/router/bindings, headers: {X-Forwarded-For: 10.96.0.1}}}
  - {name: put binding no token, request: {method: PUT, path: /v1/router/bindings/user/me, json: {}, headers: {X-Forwarded-For: 10.96.0.1}}}
  - {name: delete binding no token, request: {method: DELETE, path: /v1/router/bindings/space/x, headers: {X-Forwarded-For: 10.96.0.1}}}
  - {name: dashboard no token, request: {method: GET, path: /v1/router/dashboard, headers: {X-Forwarded-For: 10.96.0.1}}}
  - {name: update no token, request: {method: PUT, path: /v1/router/1a7e9000-0000-4000-8000-000000000001, json: {}, headers: {X-Forwarded-For: 10.96.0.1}}}
  - {name: delete no token, request: {method: DELETE, path: /v1/router/1a7e9000-0000-4000-8000-000000000001, headers: {X-Forwarded-For: 10.96.0.1}}}
  - {name: stream no token, request: {method: POST, path: /v1/router/parallel/executions/stream, json: {}, headers: {X-Forwarded-For: 10.96.0.1}}}
  - {name: executions no token, request: {method: GET, path: /v1/router/parallel/executions, headers: {X-Forwarded-For: 10.96.0.1}}}
  - {name: execution no token, request: {method: GET, path: /v1/router/parallel/executions/1a7e4000-0000-4000-8000-000000000010, headers: {X-Forwarded-For: 10.96.0.1}}}
  - {name: delete execution no token, request: {method: DELETE, path: /v1/router/parallel/executions/1a7e4000-0000-4000-8000-000000000010, headers: {X-Forwarded-For: 10.96.0.1}}}
  - {name: presets no token, request: {method: GET, path: /v1/router/synthesis-presets, headers: {X-Forwarded-For: 10.96.0.1}}}
  - {name: create preset no token, request: {method: POST, path: /v1/router/synthesis-presets, json: {}, headers: {X-Forwarded-For: 10.96.0.1}}}
  - {name: update preset no token, request: {method: PUT, path: /v1/router/synthesis-presets/1a7e5000-0000-4000-8000-000000000001, json: {}, headers: {X-Forwarded-For: 10.96.0.1}}}
  - {name: delete preset no token, request: {method: DELETE, path: /v1/router/synthesis-presets/1a7e5000-0000-4000-8000-000000000001, headers: {X-Forwarded-For: 10.96.0.1}}}
  - {name: list bad token, request: {method: GET, path: /v1/router, headers: {Authorization: "Bearer not.a.jwt", X-Forwarded-For: 10.96.0.2}}}
  - {name: catalog bad token, request: {method: GET, path: /v1/router/catalog, headers: {Authorization: "Bearer not.a.jwt", X-Forwarded-For: 10.96.0.2}}}
  - {name: executions bad token, request: {method: GET, path: /v1/router/parallel/executions, headers: {Authorization: "Bearer not.a.jwt", X-Forwarded-For: 10.96.0.2}}}
