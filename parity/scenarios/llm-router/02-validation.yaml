# POST /v1/router refusals, in RouterController's order: decode, placeholders,
# validate, then the Auto policy check. Nothing is written.
module: llm-router
steps:
  - {name: blank name, as: lr_val, request: {method: POST, path: /v1/router, json: {name: "  \n", mode: managed, objective: {quality: 100, cost: 0, latency: 0}, budget: {}, defaultAction: {kind: sequential, routes: [{provider: openai, model: m}], retryPolicy: fast}}}}
  - {name: weights under 100, as: lr_val, request: {method: POST, path: /v1/router, json: {name: X, mode: managed, objective: {quality: 50, cost: 0, latency: 0}, budget: {}, defaultAction: {kind: sequential, routes: [{provider: openai, model: m}], retryPolicy: fast}}}}
  - {name: a negative weight, as: lr_val, request: {method: POST, path: /v1/router, json: {name: X, mode: managed, objective: {quality: 110, cost: -10, latency: 0}, budget: {}, defaultAction: {kind: sequential, routes: [{provider: openai, model: m}], retryPolicy: fast}}}}
  - {name: soft budget over hard, as: lr_val, request: {method: POST, path: /v1/router, json: {name: X, mode: managed, objective: {quality: 100, cost: 0, latency: 0}, budget: {softLimitUsdMicros: 10, hardLimitUsdMicros: 5}, defaultAction: {kind: sequential, routes: [{provider: openai, model: m}], retryPolicy: fast}}}}
  - {name: no route, as: lr_val, request: {method: POST, path: /v1/router, json: {name: X, mode: managed, objective: {quality: 100, cost: 0, latency: 0}, budget: {}, defaultAction: {kind: sequential, routes: [], retryPolicy: fast}}}}
  - {name: a rule with no route, as: lr_val, request: {method: POST, path: /v1/router, json: {name: X, mode: managed, objective: {quality: 100, cost: 0, latency: 0}, budget: {}, defaultAction: {kind: sequential, routes: [{provider: openai, model: m}], retryPolicy: fast}, rules: [{id: 1a7e9000-0000-4000-8000-0000000000c2, name: R, enabled: true, priority: 1, taskTypes: [], surfaces: [], action: {kind: sequential, routes: [], retryPolicy: fast}}]}}}
  - {name: a blank model, as: lr_val, request: {method: POST, path: /v1/router, json: {name: X, mode: managed, objective: {quality: 100, cost: 0, latency: 0}, budget: {}, defaultAction: {kind: sequential, routes: [{provider: openai, model: " "}], retryPolicy: fast}}}}
  - {name: an ensemble while parallel is off, as: lr_val, request: {method: POST, path: /v1/router, json: {name: X, mode: byok, objective: {quality: 100, cost: 0, latency: 0}, budget: {}, defaultAction: {kind: ensemble, routes: [{provider: openai, model: a}, {provider: anthropic, model: b}], synthesisRoute: {provider: openai, model: c}, retryPolicy: fast}}}}
  - {name: byok auto without an OpenRouter key, as: lr_val, request: {method: POST, path: /v1/router, json: {name: X, mode: byok, objective: {quality: 100, cost: 0, latency: 0}, budget: {}, defaultAction: {kind: sequential, routes: [{provider: openai, model: m}], retryPolicy: fast}, routingPolicy: autoSmart}}}
  - {name: managed auto needs no key, as: lr_val, request: {method: POST, path: /v1/router, json: {name: Auto, mode: managed, objective: {quality: 100, cost: 0, latency: 0}, budget: {}, defaultAction: {kind: sequential, routes: [{provider: openai, model: m}], retryPolicy: fast}, routingPolicy: autoSmart}}}

  - {name: malformed json, as: lr_val, request: {method: POST, path: /v1/router, raw: "{"}}
  - {name: empty body, as: lr_val, request: {method: POST, path: /v1/router, raw: ""}}
  - {name: array body, as: lr_val, request: {method: POST, path: /v1/router, raw: "[]"}}
  - {name: missing name, as: lr_val, request: {method: POST, path: /v1/router, json: {mode: managed, objective: {quality: 100, cost: 0, latency: 0}, budget: {}, defaultAction: {kind: sequential, routes: [{provider: openai, model: m}], retryPolicy: fast}}}}
  - {name: missing budget, as: lr_val, request: {method: POST, path: /v1/router, json: {name: X, mode: managed, objective: {quality: 100, cost: 0, latency: 0}, defaultAction: {kind: sequential, routes: [{provider: openai, model: m}], retryPolicy: fast}}}}
  - {name: null mode, as: lr_val, request: {method: POST, path: /v1/router, json: {name: X, mode: null, objective: {quality: 100, cost: 0, latency: 0}, budget: {}, defaultAction: {kind: sequential, routes: [{provider: openai, model: m}], retryPolicy: fast}}}}
  - {name: unknown mode, as: lr_val, request: {method: POST, path: /v1/router, json: {name: X, mode: auto, objective: {quality: 100, cost: 0, latency: 0}, budget: {}, defaultAction: {kind: sequential, routes: [{provider: openai, model: m}], retryPolicy: fast}}}}
  - {name: unknown action kind, as: lr_val, request: {method: POST, path: /v1/router, json: {name: X, mode: managed, objective: {quality: 100, cost: 0, latency: 0}, budget: {}, defaultAction: {kind: parallel, routes: [{provider: openai, model: m}], retryPolicy: fast}}}}
  - {name: unknown provider in a route, as: lr_val, request: {method: POST, path: /v1/router, json: {name: X, mode: managed, objective: {quality: 100, cost: 0, latency: 0}, budget: {}, defaultAction: {kind: sequential, routes: [{provider: groq, model: m}], retryPolicy: fast}}}}
  - {name: unknown task type, as: lr_val, request: {method: POST, path: /v1/router, json: {name: X, mode: managed, objective: {quality: 100, cost: 0, latency: 0}, budget: {}, defaultAction: {kind: sequential, routes: [{provider: openai, model: m}], retryPolicy: fast}, rules: [{id: 1a7e9000-0000-4000-8000-0000000000c3, name: R, enabled: true, priority: 1, taskTypes: [poetry], surfaces: [], action: {kind: sequential, routes: [{provider: openai, model: m}], retryPolicy: fast}}]}}}
  - {name: a rule id that is no uuid, as: lr_val, request: {method: POST, path: /v1/router, json: {name: X, mode: managed, objective: {quality: 100, cost: 0, latency: 0}, budget: {}, defaultAction: {kind: sequential, routes: [{provider: openai, model: m}], retryPolicy: fast}, rules: [{id: nope, name: R, enabled: true, priority: 1, taskTypes: [], surfaces: [], action: {kind: sequential, routes: [{provider: openai, model: m}], retryPolicy: fast}}]}}}
  - {name: a weight of the wrong type, as: lr_val, request: {method: POST, path: /v1/router, json: {name: X, mode: managed, objective: {quality: "100", cost: 0, latency: 0}, budget: {}, defaultAction: {kind: sequential, routes: [{provider: openai, model: m}], retryPolicy: fast}}}}
  - name: only the managed auto profile was written
    as: lr_val
    request: {method: GET, path: /v1/router/catalog}
    snapshot: [parity_lr_profiles]
