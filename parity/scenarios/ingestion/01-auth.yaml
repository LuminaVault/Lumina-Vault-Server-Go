# No token, bad token, and which checks run before identity. Every route of
# /v1/ingestions resolves vault access in the handler, so a bad X-Vault-ID beats
# the missing token; events and the other routes parse ids in different orders.
module: ingestion
steps:
  - {name: list no token, request: {method: GET, path: /v1/ingestions}}
  - {name: create no token, request: {method: POST, path: /v1/ingestions, json: {items: []}}}
  - {name: create no token and a bad body, request: {method: POST, path: /v1/ingestions, raw: "{"}}
  - {name: detail no token, request: {method: GET, path: /v1/ingestions/1A6E3000-0000-4000-8000-000000000001}}
  - {name: detail no token and a bad id, request: {method: GET, path: /v1/ingestions/nope}}
  - {name: events no token, request: {method: GET, path: /v1/ingestions/1A6E3000-0000-4000-8000-000000000001/events}}
  - {name: events bad id beats the missing token, request: {method: GET, path: /v1/ingestions/nope/events}}
  - {name: chunk no token, request: {method: PUT, path: /v1/ingestions/1A6E3000-0000-4000-8000-000000000001/items/1A6E4000-0000-4000-8000-000000000001/chunks/0, raw: x}}
  - {name: chunk no token and a bad id, request: {method: PUT, path: /v1/ingestions/nope/items/nope/chunks/x, raw: x}}
  - {name: complete no token, request: {method: POST, path: /v1/ingestions/1A6E3000-0000-4000-8000-000000000001/items/1A6E4000-0000-4000-8000-000000000001/complete}}
  - {name: retry no token, request: {method: POST, path: /v1/ingestions/1A6E3000-0000-4000-8000-000000000003/items/1A6E4000-0000-4000-8000-000000000020/retry}}
  - {name: cancel no token, request: {method: DELETE, path: /v1/ingestions/1A6E3000-0000-4000-8000-000000000001/items/1A6E4000-0000-4000-8000-000000000001}}
  - {name: bad vault header beats the missing token, request: {method: GET, path: /v1/ingestions, headers: {X-Vault-ID: nope}}}
  - {name: bad token, request: {method: GET, path: /v1/ingestions, headers: {Authorization: "Bearer not.a.jwt"}}}
  - {name: bad token on create, request: {method: POST, path: /v1/ingestions, json: {items: []}, headers: {Authorization: "Bearer not.a.jwt"}}}
  - {name: bad token on events, request: {method: GET, path: /v1/ingestions/1A6E3000-0000-4000-8000-000000000001/events, headers: {Authorization: "Bearer not.a.jwt"}}}
  # A known path with another method is a plain 404; empty segments are ignored.
  - {name: put on the collection, as: alice, request: {method: PUT, path: /v1/ingestions}}
  - {name: post on a batch, as: alice, request: {method: POST, path: /v1/ingestions/1A6E3000-0000-4000-8000-000000000001}}
  - {name: get a chunk, as: alice, request: {method: GET, path: /v1/ingestions/1A6E3000-0000-4000-8000-000000000001/items/1A6E4000-0000-4000-8000-000000000001/chunks/0}}
  - {name: trailing slash, as: alice, request: {method: GET, path: /v1/ingestions/}}
  - {name: delete a source, request: {method: DELETE, path: /v1/ingestion-sources/nope}}
  - name: nothing was written
    as: alice
    request: {method: GET, path: /v1/ingestions}
    snapshot: [ingestion_batches, ingestion_items, ingestion_events]
    files: [alice, ing_ann]
