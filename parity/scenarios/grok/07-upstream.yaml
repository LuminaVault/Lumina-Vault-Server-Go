  - {name: body cut short, as: grok_ann, request: {method: POST, path: /v1/grok/chat, json: {messages: [{role: user, content: "[[grok:short-body]]"}]}}}
  - {name: connection dropped, as: grok_ann, request: {method: POST, path: /v1/grok/chat, json: {messages: [{role: user, content: "[[grok:hangup]]"}]}}}
