# Past validation: no row or no xAI marker is 409 xai_not_connected. A row whose key
# won't open and a host that doesn't resolve are errors, not 409 or 502.
module: grok
steps:
  - {name: chat no container, as: grok_nobox, request: {method: POST, path: /v1/grok/chat, json: {messages: [{role: user, content: hi}]}}}
  - {name: search no container, as: grok_nobox, request: {method: POST, path: /v1/grok/x-search, json: {query: q}}}
  - {name: vision no container, as: grok_nobox, request: {method: POST, path: /v1/grok/vision, json: {prompt: p, imageURLs: [u]}}}
  - {name: override no container, as: grok_over, request: {method: POST, path: /v1/grok/x-search, json: {query: q}}}
  - {name: chat unlinked, as: grok_unlinked, request: {method: POST, path: /v1/grok/chat, json: {messages: [{role: user, content: hi}]}}}
  - {name: search unlinked, as: grok_unlinked, request: {method: POST, path: /v1/grok/x-search, json: {query: q}}}
  - {name: vision unlinked, as: grok_unlinked, request: {method: POST, path: /v1/grok/vision, json: {prompt: p, imageURLs: [u]}}}
  - {name: validation beats unlinked, as: grok_unlinked, request: {method: POST, path: /v1/grok/vision, json: {prompt: p, imageURLs: []}}}
  - {name: chat key does not open, as: grok_badkey, request: {method: POST, path: /v1/grok/chat, json: {messages: [{role: user, content: hi}]}}}
  - {name: search key does not open, as: grok_badkey, request: {method: POST, path: /v1/grok/x-search, json: {query: q}}}
  - {name: vision key does not open, as: grok_badkey, request: {method: POST, path: /v1/grok/vision, json: {prompt: p, imageURLs: [u]}}}
  - {name: tts never looks the container up, as: grok_badkey, request: {method: POST, path: /v1/grok/tts}}
  - {name: host does not resolve, as: grok_down, request: {method: POST, path: /v1/grok/chat, json: {messages: [{role: user, content: hi}]}}}
