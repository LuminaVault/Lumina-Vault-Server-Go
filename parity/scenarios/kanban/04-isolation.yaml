# kanban_cy reaches for alice's personal board, columns and cards.
module: kanban
steps:
  - {name: get foreign board, as: kanban_cy, request: {method: GET, path: /v1/boards/CA4BB000-0000-4000-8000-0000000000A1}}
  - {name: version of foreign board, as: kanban_cy, request: {method: GET, path: /v1/boards/CA4BB000-0000-4000-8000-0000000000A1/version}}
  - {name: patch foreign board, as: kanban_cy, request: {method: PATCH, path: /v1/boards/CA4BB000-0000-4000-8000-0000000000A1, json: {title: hijack}}}
  - {name: delete foreign board, as: kanban_cy, request: {method: DELETE, path: /v1/boards/CA4BB000-0000-4000-8000-0000000000A1}}
  - {name: column on foreign board, as: kanban_cy, request: {method: POST, path: /v1/boards/CA4BB000-0000-4000-8000-0000000000A1/columns, json: {title: x}}}
  - {name: card on foreign board, as: kanban_cy, request: {method: POST, path: /v1/boards/CA4BB000-0000-4000-8000-0000000000A1/cards, json: {columnID: CA4BC000-0000-4000-8000-0000000000A1, title: x}}}
  - {name: reorder on foreign board, as: kanban_cy, request: {method: POST, path: /v1/boards/CA4BB000-0000-4000-8000-0000000000A1/columns/reorder, json: {columnID: CA4BC000-0000-4000-8000-0000000000A1}}}
  - {name: delete foreign column, as: kanban_cy, request: {method: DELETE, path: /v1/boards/CA4BB000-0000-4000-8000-0000000000A1/columns/CA4BC000-0000-4000-8000-0000000000A1}}
  - {name: patch foreign card, as: kanban_cy, request: {method: PATCH, path: /v1/cards/CA4BD000-0000-4000-8000-0000000000A1, json: {title: hijack}}}
  - {name: move foreign card, as: kanban_cy, request: {method: POST, path: /v1/cards/CA4BD000-0000-4000-8000-0000000000A1/move, json: {toColumnID: CA4BC000-0000-4000-8000-0000000000A2}}}
  - {name: promote foreign card, as: kanban_cy, request: {method: POST, path: /v1/cards/CA4BD000-0000-4000-8000-0000000000A2/promote}}
  - {name: delete foreign card, as: kanban_cy, request: {method: DELETE, path: /v1/cards/CA4BD000-0000-4000-8000-0000000000A1}}
  - {name: shared vault without membership, as: kanban_cy, request: {method: GET, path: /v1/boards, headers: {X-Vault-ID: CA4BF000-0000-4000-8000-000000000001}}, snapshot: [kanban_boards, kanban_columns, kanban_cards]}
  - {name: alice reads her own seeded board, as: alice, request: {method: GET, path: /v1/boards/CA4BB000-0000-4000-8000-0000000000A1}}
  - {name: alice lists without the archived board, as: alice, request: {method: GET, path: /v1/boards}}
  - {name: alice cannot read bob's board, as: alice, request: {method: GET, path: /v1/boards/CA4BB000-0000-4000-8000-0000000000B1}}
  - {name: alice promotes a card with both cron and runAt, as: alice, request: {method: POST, path: /v1/cards/CA4BD000-0000-4000-8000-0000000000A2/promote}}
