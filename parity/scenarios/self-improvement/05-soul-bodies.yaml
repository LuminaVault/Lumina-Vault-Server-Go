# Real SOUL bodies through the approve path, which internal/soul had only golden vectors for.
# Each user uploads the one base document and moves it to raw/SOUL.md, so the seeded base hash
# matches. Approving then runs SOULCore.inject on the seeded proposal, and `files` hashes the
# result on both servers.
module: self-improvement
steps:
