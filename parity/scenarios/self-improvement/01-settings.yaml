# Status and settings. Swift decodes the body before requireIdentity(), and checks the range after.
module: self-improvement
steps:
  - name: "status with no token"
    request: {method: GET, path: "/v1/me/improvement"}
  - name: "status with a bad token"
    request: {method: GET, path: "/v1/me/improvement", headers: {Authorization: Bearer not-a-token}}
  - name: "wrong method"
    as: si_fresh
    request: {method: DELETE, path: "/v1/me/improvement"}
  - name: "first status creates the default row"
    as: si_fresh
    request: {method: GET, path: "/v1/me/improvement"}
    snapshot: [self_improvement_settings]
  - name: "second status reuses it"
    as: si_fresh
    request: {method: GET, path: "/v1/me/improvement"}
    snapshot: [self_improvement_settings]
  - name: "every setting and date, an unknown model mode, pending changes"
    as: si_stat
    request: {method: GET, path: "/v1/me/improvement"}
  - name: "put with no token and a good body"
    request: {method: PUT, path: "/v1/me/improvement", raw: "{\"settings\":{\"enabled\":true,\"curatorEnabled\":true,\"intervalHours\":168,\"minimumIdleHours\":2,\"consolidate\":true,\"pruneBuiltins\":false,\"backupKeep\":5,\"soulReviewEnabled\":true,\"reviewComplexSessions\":true,\"soulReviewWindowDays\":14,\"soulReviewCooldownHours\":24,\"modelMode\":\"economy\"}}"}
  - name: "put with no token and a malformed body answers the decode error first"
    request: {method: PUT, path: "/v1/me/improvement", raw: "{"}
  - name: "put with no token and settings out of range is still 401"
    request: {method: PUT, path: "/v1/me/improvement", raw: "{\"settings\":{\"enabled\":true,\"curatorEnabled\":true,\"intervalHours\":1,\"minimumIdleHours\":2,\"consolidate\":true,\"pruneBuiltins\":false,\"backupKeep\":5,\"soulReviewEnabled\":true,\"reviewComplexSessions\":true,\"soulReviewWindowDays\":14,\"soulReviewCooldownHours\":24,\"modelMode\":\"economy\"}}"}
  - name: "put with a bad token"
    request: {method: PUT, path: "/v1/me/improvement", raw: "{\"settings\":{\"enabled\":true,\"curatorEnabled\":true,\"intervalHours\":168,\"minimumIdleHours\":2,\"consolidate\":true,\"pruneBuiltins\":false,\"backupKeep\":5,\"soulReviewEnabled\":true,\"reviewComplexSessions\":true,\"soulReviewWindowDays\":14,\"soulReviewCooldownHours\":24,\"modelMode\":\"economy\"}}", headers: {Authorization: Bearer not-a-token}}
  - name: "put replaces every setting and reschedules"
    as: si_fresh
    request: {method: PUT, path: "/v1/me/improvement", raw: "{\"settings\":{\"enabled\":true,\"curatorEnabled\":false,\"intervalHours\":24,\"minimumIdleHours\":0,\"consolidate\":false,\"pruneBuiltins\":false,\"backupKeep\":1,\"soulReviewEnabled\":false,\"reviewComplexSessions\":false,\"soulReviewWindowDays\":7,\"soulReviewCooldownHours\":1,\"modelMode\":\"main\"}}"}
    snapshot: [self_improvement_settings]
  - name: "put the upper limits"
    as: si_fresh
    request: {method: PUT, path: "/v1/me/improvement", raw: "{\"settings\":{\"enabled\":true,\"curatorEnabled\":true,\"intervalHours\":720,\"minimumIdleHours\":72,\"consolidate\":true,\"pruneBuiltins\":false,\"backupKeep\":20,\"soulReviewEnabled\":true,\"reviewComplexSessions\":true,\"soulReviewWindowDays\":14,\"soulReviewCooldownHours\":168,\"modelMode\":\"economy\"}}"}
  - name: "put numbers written as floats"
    as: si_fresh
    request: {method: PUT, path: "/v1/me/improvement", raw: "{\"settings\":{\"enabled\":true,\"curatorEnabled\":true,\"intervalHours\":48.0,\"minimumIdleHours\":1e0,\"consolidate\":true,\"pruneBuiltins\":false,\"backupKeep\":5,\"soulReviewEnabled\":true,\"reviewComplexSessions\":true,\"soulReviewWindowDays\":14,\"soulReviewCooldownHours\":24,\"modelMode\":\"economy\"}}"}
  - name: "put creates the row for a new user"
    as: si_enq
    request: {method: PUT, path: "/v1/me/improvement", raw: "{\"settings\":{\"enabled\":true,\"curatorEnabled\":true,\"intervalHours\":168,\"minimumIdleHours\":2,\"consolidate\":true,\"pruneBuiltins\":false,\"backupKeep\":5,\"soulReviewEnabled\":true,\"reviewComplexSessions\":true,\"soulReviewWindowDays\":14,\"soulReviewCooldownHours\":24,\"modelMode\":\"economy\"}}"}
    snapshot: [self_improvement_settings]
  - name: "put refuses: interval low"
    as: si_fresh
    request: {method: PUT, path: "/v1/me/improvement", raw: "{\"settings\":{\"enabled\":true,\"curatorEnabled\":true,\"intervalHours\":23,\"minimumIdleHours\":2,\"consolidate\":true,\"pruneBuiltins\":false,\"backupKeep\":5,\"soulReviewEnabled\":true,\"reviewComplexSessions\":true,\"soulReviewWindowDays\":14,\"soulReviewCooldownHours\":24,\"modelMode\":\"economy\"}}"}
