# PATCH /v1/skills/{name}. A new state row is inserted; an existing one is saved by
# Fluent keyed on tenant_id alone, so the change lands on every row of the tenant
# (Swift's weakness, kept until the archive).
module: skills
steps:
  - {name: no token, request: {method: PATCH, path: /v1/skills/daily-brief, json: {enabled: false}}}
  - {name: unknown skill, as: sk_hal, request: {method: PATCH, path: /v1/skills/nope, json: {enabled: false}}}
  - {name: bad cron, as: sk_hal, request: {method: PATCH, path: /v1/skills/daily-brief, json: {scheduleOverride: "61 * * * *"}}}
  - {name: bad category, as: sk_hal, request: {method: PATCH, path: /v1/skills/daily-brief, json: {apnsCategory: loud}}}
  - {name: wrong type, as: sk_hal, request: {method: PATCH, path: /v1/skills/daily-brief, json: {enabled: "no"}}}
  - {name: malformed, as: sk_hal, request: {method: PATCH, path: /v1/skills/daily-brief, raw: '{"enabled":'}}
  - {name: create state, as: sk_hal, request: {method: PATCH, path: /v1/skills/daily-brief, json: {enabled: false, scheduleOverride: "0 7 * * *", apnsCategory: digest}}, snapshot: [skills_state]}
  - {name: second row, as: sk_hal, request: {method: PATCH, path: /v1/skills/pattern-detector, json: {}}, snapshot: [skills_state]}
  - {name: update spreads to all rows, as: sk_hal, request: {method: PATCH, path: /v1/skills/pattern-detector, json: {scheduleOverride: "", apnsCategory: runCompleted}}, snapshot: [skills_state]}
