module: vision
steps:
  - name: "no provider: search has no limit"
    as: vis_lim
    request: {method: POST, path: "/v1/vision/search", base64: "iVBORw0KGgo=", headers: {"Content-Type": "image/png"}}
  - name: "limit 1"
    as: vis_lim
    request: {method: POST, path: "/v1/vision/search?limit=1", base64: "iVBORw0KGgo=", headers: {"Content-Type": "image/png"}}
  - name: "limit 50"
    as: vis_lim
    request: {method: POST, path: "/v1/vision/search?limit=50", base64: "iVBORw0KGgo=", headers: {"Content-Type": "image/png"}}
  - name: "limit 0"
    as: vis_lim
    request: {method: POST, path: "/v1/vision/search?limit=0", base64: "iVBORw0KGgo=", headers: {"Content-Type": "image/png"}}
  - name: "limit negative"
    as: vis_lim
    request: {method: POST, path: "/v1/vision/search?limit=-1", base64: "iVBORw0KGgo=", headers: {"Content-Type": "image/png"}}
  - name: "limit 51"
    as: vis_lim
    request: {method: POST, path: "/v1/vision/search?limit=51", base64: "iVBORw0KGgo=", headers: {"Content-Type": "image/png"}}
  - name: "limit 500"
    as: vis_lim
    request: {method: POST, path: "/v1/vision/search?limit=500", base64: "iVBORw0KGgo=", headers: {"Content-Type": "image/png"}}
  - name: "limit text"
    as: vis_lim
    request: {method: POST, path: "/v1/vision/search?limit=ten", base64: "iVBORw0KGgo=", headers: {"Content-Type": "image/png"}}
  - name: "limit empty"
    as: vis_lim
    request: {method: POST, path: "/v1/vision/search?limit=", base64: "iVBORw0KGgo=", headers: {"Content-Type": "image/png"}}
  - name: "embed ignores limit"
    as: vis_lim
    request: {method: POST, path: "/v1/vision/embed?limit=0", base64: "iVBORw0KGgo=", headers: {"Content-Type": "image/png"}}
