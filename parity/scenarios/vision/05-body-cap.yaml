module: vision
steps:
  - name: "exactly the cap is read"
    as: vis_big
    request: {method: POST, path: "/v1/vision/embed", fill: {"text": "x", "size": 8388608}, headers: {"Content-Type": "image/png"}}
  - name: "one byte over, declared"
    as: vis_big
    request: {method: POST, path: "/v1/vision/embed", fill: {"text": "x", "size": 8388609}, headers: {"Content-Type": "image/png"}}
  - name: "one byte over, chunked"
    as: vis_big
    request: {method: POST, path: "/v1/vision/search", fill: {"text": "x", "size": 8388609}, chunked: true, headers: {"Content-Type": "image/png"}}
  - name: "exactly the cap, chunked"
    as: vis_big
    request: {method: POST, path: "/v1/vision/search", fill: {"text": "x", "size": 8388608}, chunked: true, headers: {"Content-Type": "image/png"}}
  - name: "bad type beats oversize"
    as: vis_big
    request: {method: POST, path: "/v1/vision/embed", fill: {"text": "x", "size": 8388609}, headers: {"Content-Type": "text/plain"}}
  - name: "bad limit with oversize declared: oversize first"
    as: vis_big
    request: {method: POST, path: "/v1/vision/search?limit=0", fill: {"text": "x", "size": 8388609}, headers: {"Content-Type": "image/png"}}
  - name: "bad limit, chunked oversize: limit first"
    as: vis_big
    request: {method: POST, path: "/v1/vision/search?limit=0", fill: {"text": "x", "size": 8388609}, chunked: true, headers: {"Content-Type": "image/png"}}
  - name: "bad indexAs, chunked oversize: the body first"
    as: vis_big
    request: {method: POST, path: "/v1/vision/embed?indexAs=bogus", fill: {"text": "x", "size": 8388609}, chunked: true, headers: {"Content-Type": "image/png"}}
  - name: "an empty body is an image too"
    as: vis_big
    request: {method: POST, path: "/v1/vision/embed", raw: "", headers: {"Content-Type": "image/png"}}
