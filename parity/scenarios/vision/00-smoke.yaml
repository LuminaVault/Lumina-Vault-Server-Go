module: vision
smoke: true
steps:
  - name: "unsupported type never reaches a provider"
    as: alice
    request: {method: POST, path: "/v1/vision/embed", base64: "iVBORw0KGgo=", headers: {"Content-Type": "text/plain"}}
  - name: "bad limit never reaches a provider"
    as: alice
    request: {method: POST, path: "/v1/vision/search?limit=0", base64: "iVBORw0KGgo=", headers: {"Content-Type": "image/png"}}
  - name: "bad indexAs never reaches a provider"
    as: alice
    request: {method: POST, path: "/v1/vision/embed?indexAs=bogus", base64: "iVBORw0KGgo=", headers: {"Content-Type": "image/png"}}
