# What each tier may do. free and lapsed can't author but can read; trial reads details
# and not lists; archived can't do either. Routes without Swift's mapErrors (limits,
# list runs, approvals) answer a bare 500 where the others say 403.
module: workflows
steps:
  - name: "wf_fay: limits"
    as: "wf_fay"
    request: {"method": "GET", "path": "/v1/workflows/limits"}
  - name: "wf_fay: list"
    as: "wf_fay"
    request: {"method": "GET", "path": "/v1/workflows"}
  - name: "wf_fay: detail"
    as: "wf_fay"
    request: {"method": "GET", "path": "/v1/workflows/F10A0000-0000-4000-8000-0000000000A4"}
  - name: "wf_fay: all runs"
    as: "wf_fay"
    request: {"method": "GET", "path": "/v1/workflows/runs"}
  - name: "wf_fay: create"
    as: "wf_fay"
    request: {"method": "POST", "path": "/v1/workflows", "json": {"name": "wf_fay made this", "definition": {"trigger": "manual", "nodes": [{"id": "F10D0000-0000-4000-8000-000000000001", "kind": "trigger", "name": "Start", "x": 0, "y": 0, "configuration": {}}, {"id": "F10D0000-0000-4000-8000-000000000002", "kind": "output", "name": "Result", "x": 200.5, "y": 10, "configuration": {"value": "{{event}}"}}], "edges": [{"id": "F10E0000-0000-4000-8000-000000000102", "sourceNodeID": "F10D0000-0000-4000-8000-000000000001", "sourcePort": "output", "targetNodeID": "F10D0000-0000-4000-8000-000000000002", "targetPort": "input"}]}}}
    snapshot: ["parity_workflows"]
  - name: "wf_fay: approvals"
    as: "wf_fay"
    request: {"method": "GET", "path": "/v1/workflows/approvals"}
  - name: "wf_fay: validate"
