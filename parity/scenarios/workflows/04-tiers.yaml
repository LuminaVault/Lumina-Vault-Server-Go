    request: {"method": "GET", "path": "/v1/workflows/F10A0000-0000-4000-8000-0000000000A4/runs"}
  - name: "wf_fay: draft"
    as: "wf_fay"
    request: {"method": "PUT", "path": "/v1/workflows/F10A0000-0000-4000-8000-0000000000A4/draft", "json": {"expectedRevision": 3, "definition": {"trigger": "manual", "nodes": [{"id": "F10D0000-0000-4000-8000-000000000001", "kind": "trigger", "name": "Start", "x": 0, "y": 0, "configuration": {}}, {"id": "F10D0000-0000-4000-8000-000000000002", "kind": "output", "name": "Result", "x": 200.5, "y": 10, "configuration": {"value": "{{event}}"}}], "edges": [{"id": "F10E0000-0000-4000-8000-000000000102", "sourceNodeID": "F10D0000-0000-4000-8000-000000000001", "sourcePort": "output", "targetNodeID": "F10D0000-0000-4000-8000-000000000002", "targetPort": "input"}]}}}
