# AudioIdentify on /v1/audio, Identify on /v1/transcribe. Scoped tokens are static, signed with the
# parity key, valid to 2100. X-Forwarded-For keeps each group in its own anonymous bucket.
module: llm-voice
steps:
  - name: "transcribe no token"
    request: {"method": "POST", "path": "/v1/transcribe", "base64": "UklGRiQAAABXQVZF", "headers": {"Content-Type": "audio/wav", "X-Forwarded-For": "10.77.0.1"}}
  - name: "transcribe bad token"
    request: {"method": "POST", "path": "/v1/transcribe", "base64": "UklGRiQAAABXQVZF", "headers": {"Content-Type": "audio/wav", "X-Forwarded-For": "10.77.0.1", "Authorization": "Bearer not.a.jwt"}}
  - name: "no token beats a bad type"
    request: {"method": "POST", "path": "/v1/transcribe", "base64": "UklGRiQAAABXQVZF", "headers": {"Content-Type": "text/plain", "X-Forwarded-For": "10.77.0.1"}}
  - name: "no token, oversize declared"
    request: {"method": "POST", "path": "/v1/transcribe", "fill": {"text": "x", "size": 10485761}, "headers": {"Content-Type": "audio/wav", "X-Forwarded-For": "10.77.0.1"}}
  - name: "audio no token is an OpenAI envelope"
    request: {"method": "POST", "path": "/v1/audio/transcriptions", "raw": "--zz\r\nContent-Disposition: form-data; name=\"file\"; filename=\"audio.ogg\"\r\nContent-Type: audio/ogg\r\n\r\nOggS\r\n--zz--\r\n", "headers": {"Content-Type": "multipart/form-data; boundary=zz", "X-Forwarded-For": "10.77.0.2"}}
  - name: "audio bad token"
    request: {"method": "POST", "path": "/v1/audio/transcriptions", "raw": "--zz\r\nContent-Disposition: form-data; name=\"file\"; filename=\"audio.ogg\"\r\nContent-Type: audio/ogg\r\n\r\nOggS\r\n--zz--\r\n", "headers": {"Content-Type": "multipart/form-data; boundary=zz", "X-Forwarded-For": "10.77.0.2", "Authorization": "Bearer not.a.jwt"}}
  - name: "no token beats no boundary"
    request: {"method": "POST", "path": "/v1/audio/transcriptions", "json": {}, "headers": {"X-Forwarded-For": "10.77.0.2"}}
  - name: "no token, oversize declared on audio"
    request: {"method": "POST", "path": "/v1/audio/transcriptions", "fill": {"text": "x", "size": 26214401}, "headers": {"Content-Type": "multipart/form-data; boundary=zz", "X-Forwarded-For": "10.77.0.2"}}
  - name: "speech no token"
    request: {"method": "POST", "path": "/v1/audio/speech", "json": {"input": "hi"}, "headers": {"X-Forwarded-For": "10.77.0.3"}}
  - name: "speech bad token"
    request: {"method": "POST", "path": "/v1/audio/speech", "json": {"input": "hi"}, "headers": {"X-Forwarded-For": "10.77.0.3", "Authorization": "Bearer not.a.jwt"}}
  - name: "an audio token is taken on speech"
    request: {"method": "POST", "path": "/v1/audio/speech", "json": {"input": "hi"}, "headers": {"Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6InBhcml0eSJ9.eyJzdWIiOiI3MENFMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwQUYiLCJleHAiOjQxMDI0NDQ4MDAsImlhdCI6MTc2NzIyNTYwMCwianRpIjoiNzBDRTAwMDAtMDAwMC00MDAwLTkwMDAtMDAwMDAwMDAwMDAxIiwic2NwIjoiYXVkaW8ifQ.qeYZ2jbPHMEjojIn80lZcLH0pwaAFwTxu7pc1sB-j0w"}}
  - name: "an audio token is taken on transcriptions"
    request: {"method": "POST", "path": "/v1/audio/transcriptions", "json": {}, "headers": {"Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6InBhcml0eSJ9.eyJzdWIiOiI3MENFMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwQUYiLCJleHAiOjQxMDI0NDQ4MDAsImlhdCI6MTc2NzIyNTYwMCwianRpIjoiNzBDRTAwMDAtMDAwMC00MDAwLTkwMDAtMDAwMDAwMDAwMDAxIiwic2NwIjoiYXVkaW8ifQ.qeYZ2jbPHMEjojIn80lZcLH0pwaAFwTxu7pc1sB-j0w"}}
  - name: "an audio token is refused on /v1/transcribe"
    request: {"method": "POST", "path": "/v1/transcribe", "base64": "UklGRiQAAABXQVZF", "headers": {"Content-Type": "audio/wav", "X-Forwarded-For": "10.77.0.4", "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6InBhcml0eSJ9.eyJzdWIiOiI3MENFMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwQUYiLCJleHAiOjQxMDI0NDQ4MDAsImlhdCI6MTc2NzIyNTYwMCwianRpIjoiNzBDRTAwMDAtMDAwMC00MDAwLTkwMDAtMDAwMDAwMDAwMDAxIiwic2NwIjoiYXVkaW8ifQ.qeYZ2jbPHMEjojIn80lZcLH0pwaAFwTxu7pc1sB-j0w"}}
