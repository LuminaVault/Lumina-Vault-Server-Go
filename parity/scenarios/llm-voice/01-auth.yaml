  - name: "expired is refused"
    request: {"method": "POST", "path": "/v1/audio/speech", "json": {}, "headers": {"X-Forwarded-For": "10.77.0.5", "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6InBhcml0eSJ9.eyJzdWIiOiI3MENFMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwQUYiLCJleHAiOjEwMDAwMDAwMDAsImlhdCI6OTk5OTk5MDAwLCJqdGkiOiI3MENFMDAwMC0wMDAwLTQwMDAtOTAwMC0wMDAwMDAwMDAwMDQiLCJzY3AiOiJhdWRpbyJ9._Xqsorwhs5tMOgS-byDc4uB0mRPP8PLq04pf7p8Ojuk"}}
  - name: "an unknown user is refused"
    request: {"method": "POST", "path": "/v1/audio/speech", "json": {}, "headers": {"X-Forwarded-For": "10.77.0.5", "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6InBhcml0eSJ9.eyJzdWIiOiI3MENFMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwRkYiLCJleHAiOjQxMDI0NDQ4MDAsImlhdCI6MTc2NzIyNTYwMCwianRpIjoiNzBDRTAwMDAtMDAwMC00MDAwLTkwMDAtMDAwMDAwMDAwMDA1Iiwic2NwIjoiYXVkaW8ifQ.43Gas96LdOuyGBiODLlMn38PgLJ0rjksgEMQy95nCbM"}}
