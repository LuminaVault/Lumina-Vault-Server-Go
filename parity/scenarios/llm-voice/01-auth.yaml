  - name: "an empty scope is refused"
    request: {"method": "POST", "path": "/v1/audio/speech", "json": {}, "headers": {"X-Forwarded-For": "10.77.0.5", "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6InBhcml0eSJ9.eyJzdWIiOiI3MENFMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwQUYiLCJleHAiOjQxMDI0NDQ4MDAsImlhdCI6MTc2NzIyNTYwMCwianRpIjoiNzBDRTAwMDAtMDAwMC00MDAwLTkwMDAtMDAwMDAwMDAwMDAzIiwic2NwIjoiIn0.XcMCOq2sbjXfXdVB0tqZhbqc5MKiGVGPFGac4FdRV38"}}
