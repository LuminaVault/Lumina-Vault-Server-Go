    request: {"method": "POST", "path": "/v1/audio/speech", "json": {}, "headers": {"Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6InBhcml0eSJ9.eyJzdWIiOiI3MENFMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwQzEiLCJleHAiOjQxMDI0NDQ4MDAsImlhdCI6MTc2NzIyNTYwMCwianRpIjoiNzBDRTAwMDAtMDAwMC00MDAwLTkwMDAtMDAwMDAwMDAwMDA4Iiwic2NwIjoiYXVkaW8ifQ.C8slQ5hVm5zWmXZbj3qfxl-XkBBOz5_wlMBJLeUkM30"}}
