  - name: "no iat is refused with an epoch set"
    request: {"method": "POST", "path": "/v1/audio/speech", "json": {}, "headers": {"X-Forwarded-For": "10.77.0.5", "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6InBhcml0eSJ9.eyJzdWIiOiI3MENFMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwQzAiLCJleHAiOjQxMDI0NDQ4MDAsImp0aSI6IjcwQ0UwMDAwLTAwMDAtNDAwMC05MDAwLTAwMDAwMDAwMDAwNyIsInNjcCI6ImF1ZGlvIn0.nxRstroImHYUEsjJqOsQLNP4qXi9-WzEaTqjk7ZH2jk"}}
