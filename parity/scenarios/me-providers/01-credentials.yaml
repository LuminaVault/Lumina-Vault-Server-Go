# PUT and DELETE /v1/me/providers/{provider}, GET list and catalog. ann starts
# with no rows. The secret itself is never echoed and only its presence is
# snapshotted (parity_mp_credentials).
module: me-providers
steps:
  - {name: catalog, as: mp_ann, request: {method: GET, path: /v1/me/providers/catalog}}
  - {name: empty list has every provider, as: mp_ann, request: {method: GET, path: /v1/me/providers}}

  - name: put an api key with a label
    as: mp_ann
    request: {method: PUT, path: /v1/me/providers/openai, json: {kind: apiKey, apiKey: sk-parity-1, label: Main}}
    snapshot: [parity_mp_credentials]
  - name: put again keeps the row and replaces the key, base url and label
    as: mp_ann
    request: {method: PUT, path: /v1/me/providers/openai, json: {kind: apiKey, apiKey: sk-parity-2, baseUrl: "http://127.0.0.1:9/v1"}}
    snapshot: [parity_mp_credentials]
  - name: a host url for ollama
    as: mp_ann
    request: {method: PUT, path: /v1/me/providers/ollama, json: {kind: hostURL, baseUrl: "http://127.0.0.1:9", label: Home}}
  - name: an empty key clears the secret and keeps the base url row
    as: mp_ann
    request: {method: PUT, path: /v1/me/providers/ollama, json: {kind: hostURL, baseUrl: "http://127.0.0.1:9", apiKey: ""}}
    snapshot: [parity_mp_credentials]
  - name: an oauth marker carries no secret
    as: mp_ann
    request: {method: PUT, path: /v1/me/providers/nous, json: {kind: oauth, apiKey: ignored}}
    snapshot: [parity_mp_credentials]

  - {name: api key kind without a key, as: mp_ann, request: {method: PUT, path: /v1/me/providers/xai, json: {kind: apiKey}}}
  - {name: api key kind with an empty key, as: mp_ann, request: {method: PUT, path: /v1/me/providers/xai, json: {kind: apiKey, apiKey: ""}}}
  - {name: host url kind without a url, as: mp_ann, request: {method: PUT, path: /v1/me/providers/custom, json: {kind: hostURL}}}
  - {name: host url kind with an empty url, as: mp_ann, request: {method: PUT, path: /v1/me/providers/custom, json: {kind: hostURL, baseUrl: ""}}}
  - {name: host url that is no url, as: mp_ann, request: {method: PUT, path: /v1/me/providers/custom, json: {kind: hostURL, baseUrl: "http://exa mple.com"}}}
  - {name: unknown provider, as: mp_ann, request: {method: PUT, path: /v1/me/providers/together, json: {kind: apiKey, apiKey: k}}}
  - {name: unknown provider beats a bad body, as: mp_ann, request: {method: PUT, path: /v1/me/providers/bogus, raw: "nope"}}
  - {name: malformed json, as: mp_ann, request: {method: PUT, path: /v1/me/providers/xai, raw: "{\"kind\":"}}
  - {name: empty body, as: mp_ann, request: {method: PUT, path: /v1/me/providers/xai, raw: ""}}
  - {name: array body, as: mp_ann, request: {method: PUT, path: /v1/me/providers/xai, raw: "[]"}}
  - {name: missing kind, as: mp_ann, request: {method: PUT, path: /v1/me/providers/xai, json: {apiKey: k}}}
  - {name: null kind, as: mp_ann, request: {method: PUT, path: /v1/me/providers/xai, json: {kind: null}}}
  - {name: unknown kind, as: mp_ann, request: {method: PUT, path: /v1/me/providers/xai, json: {kind: token}}}
  - {name: kind of the wrong type, as: mp_ann, request: {method: PUT, path: /v1/me/providers/xai, json: {kind: 5}}}
  - {name: key of the wrong type, as: mp_ann, request: {method: PUT, path: /v1/me/providers/xai, json: {kind: apiKey, apiKey: 5}}}

  - name: delete removes the row
    as: mp_ann
    request: {method: DELETE, path: /v1/me/providers/ollama}
    snapshot: [parity_mp_credentials]
  - {name: delete with no row is still 204, as: mp_ann, request: {method: DELETE, path: /v1/me/providers/ollama}}
  - {name: delete unknown provider, as: mp_ann, request: {method: DELETE, path: /v1/me/providers/hermesGateway}}
  - {name: list after the writes, as: mp_ann, request: {method: GET, path: /v1/me/providers}}
