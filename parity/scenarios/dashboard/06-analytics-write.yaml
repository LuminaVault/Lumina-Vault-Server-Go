module: dashboard
steps:
  - {name: "overview before writes", as: dash_wri, request: {method: GET, path: "/v1/analytics/overview?range=90d"}}
  - {name: "event viewed with range", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_dashboard_viewed", "source": "web", "range": "7d", "idempotencyKey": "safe-key-1"}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event same key: event deduped, rollup still bumps", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_dashboard_viewed", "source": "web", "range": "7d", "idempotencyKey": "safe-key-1"}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event viewed without range", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_dashboard_viewed", "source": "ios"}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event viewed null range", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_range_changed", "source": "ios", "range": null, "idempotencyKey": null}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event range changed", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_range_changed", "source": "ios", "range": "90d"}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event extras ignored", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_range_changed", "source": "web", "range": "30d", "recommendationId": "ignored here", "other": 1}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event recommendation opened", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_recommendation_opened", "source": "web", "recommendationId": "memory-organization"}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event recommendation dismissed", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_recommendation_dismissed", "source": "web", "recommendationId": "a_b-1"}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event recommendation snoozed, unicode letters", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_recommendation_snoozed", "source": "web", "recommendationId": "résumé-日本-٣"}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event unicode idempotency key", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_range_changed", "source": "web", "idempotencyKey": "clé-1"}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event unsafe idempotency key", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_dashboard_viewed", "source": "web", "idempotencyKey": "unsafe key"}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event empty idempotency key", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_dashboard_viewed", "source": "web", "idempotencyKey": ""}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event 129 char idempotency key", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_dashboard_viewed", "source": "web", "idempotencyKey": "kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk"}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event 128 char idempotency key", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_dashboard_viewed", "source": "web", "idempotencyKey": "kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk"}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event recommendation without id", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_recommendation_opened", "source": "web"}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event recommendation empty id", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_recommendation_opened", "source": "web", "recommendationId": ""}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event recommendation bad id", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_recommendation_opened", "source": "web", "recommendationId": "bad id"}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event recommendation 97 char id", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_recommendation_opened", "source": "web", "recommendationId": "rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr"}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event recommendation 96 char id", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_recommendation_opened", "source": "web", "recommendationId": "rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr"}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event bad key beats bad vault", as: dash_wri, request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_dashboard_viewed", "source": "web", "idempotencyKey": "!"}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "event bad id without token: identity before dimensions", request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_recommendation_opened", "source": "web", "recommendationId": "bad id"}}}
  - {name: "event bad key without token: key before identity", request: {method: POST, path: "/v1/analytics/events", json: {"name": "analytics_dashboard_viewed", "source": "web", "idempotencyKey": "bad key"}}}
  - {name: "event in a team vault as viewer", as: dash_ben, request: {method: POST, path: "/v1/analytics/events", headers: {X-Vault-ID: "DA5BC000-0000-4000-8000-0000000000C1"}, json: {"name": "analytics_dashboard_viewed", "source": "web"}}, snapshot: [analytics_events, analytics_daily_rollups]}
  - {name: "feedback positive", as: dash_wri, request: {method: POST, path: "/v1/analytics/model-feedback", json: {"provider": "openai", "model": "gpt-test", "rating": "positive", "idempotencyKey": "feedback-1"}}, snapshot: [analytics_events]}
  - {name: "feedback same key deduped", as: dash_wri, request: {method: POST, path: "/v1/analytics/model-feedback", json: {"provider": "openai", "model": "gpt-test", "rating": "negative", "idempotencyKey": "feedback-1"}}, snapshot: [analytics_events]}
  - {name: "feedback negative with path model", as: dash_wri, request: {method: POST, path: "/v1/analytics/model-feedback", json: {"provider": "openrouter", "model": "anthropic/claude-3.5:beta_x", "rating": "negative"}}, snapshot: [analytics_events]}
  - {name: "feedback prompt content forbidden", as: dash_wri, request: {method: POST, path: "/v1/analytics/model-feedback", json: {"provider": "openai", "model": "prompt content is forbidden", "rating": "negative"}}, snapshot: [analytics_events]}
  - {name: "feedback bad provider", as: dash_wri, request: {method: POST, path: "/v1/analytics/model-feedback", json: {"provider": "open ai", "model": "m", "rating": "negative"}}, snapshot: [analytics_events]}
  - {name: "feedback empty provider", as: dash_wri, request: {method: POST, path: "/v1/analytics/model-feedback", json: {"provider": "", "model": "m", "rating": "negative"}}, snapshot: [analytics_events]}
  - {name: "feedback empty model", as: dash_wri, request: {method: POST, path: "/v1/analytics/model-feedback", json: {"provider": "p", "model": "", "rating": "negative"}}, snapshot: [analytics_events]}
  - {name: "feedback 129 char model", as: dash_wri, request: {method: POST, path: "/v1/analytics/model-feedback", json: {"provider": "p", "model": "mmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmm", "rating": "negative"}}, snapshot: [analytics_events]}
  - {name: "feedback 128 char model", as: dash_wri, request: {method: POST, path: "/v1/analytics/model-feedback", json: {"provider": "p", "model": "mmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmm", "rating": "negative"}}, snapshot: [analytics_events]}
  - {name: "feedback bad key", as: dash_wri, request: {method: POST, path: "/v1/analytics/model-feedback", json: {"provider": "p", "model": "m", "rating": "positive", "idempotencyKey": "a b"}}, snapshot: [analytics_events]}
  - {name: "feedback empty key", as: dash_wri, request: {method: POST, path: "/v1/analytics/model-feedback", json: {"provider": "p", "model": "m", "rating": "positive", "idempotencyKey": ""}}, snapshot: [analytics_events]}
  - {name: "feedback identity checked before key", as: dash_wri, request: {method: POST, path: "/v1/analytics/model-feedback", json: {"provider": "bad provider", "model": "m", "rating": "positive", "idempotencyKey": "a b"}}, snapshot: [analytics_events]}
  - {name: "feedback bad identity without token", request: {method: POST, path: "/v1/analytics/model-feedback", json: {"provider": "bad provider", "model": "m", "rating": "positive"}}}
  - {name: "feedback in a team vault", as: dash_ben, request: {method: POST, path: "/v1/analytics/model-feedback", headers: {X-Vault-ID: "DA5BC000-0000-4000-8000-0000000000C1"}, json: {"provider": "anthropic", "model": "claude", "rating": "positive"}}, snapshot: [analytics_events]}
  - {name: "team vault model feedback shows up", as: dash_ann, request: {method: GET, path: "/v1/analytics/models", headers: {X-Vault-ID: "DA5BC000-0000-4000-8000-0000000000C1"}}}
  - {name: "overview: expired snooze keeps never-retrieved visible", as: dash_wri, request: {method: GET, path: "/v1/analytics/overview?range=90d"}}
  - {name: "recommendation dismiss overdue", as: dash_wri, request: {method: PATCH, path: "/v1/analytics/recommendations", json: {"recommendationId": "memory-review-overdue", "disposition": "dismiss"}}, snapshot: [dashboard_recommendation_states_view]}
  - {name: "overview after dismiss overdue", as: dash_wri, request: {method: GET, path: "/v1/analytics/overview?range=90d"}}
  - {name: "recommendation snooze7 pending", as: dash_wri, request: {method: PATCH, path: "/v1/analytics/recommendations", json: {"recommendationId": "memory-moderation-pending", "disposition": "snooze7"}}, snapshot: [dashboard_recommendation_states_view]}
  - {name: "overview after snooze7 pending", as: dash_wri, request: {method: GET, path: "/v1/analytics/overview?range=90d"}}
  - {name: "recommendation snooze30 organization", as: dash_wri, request: {method: PATCH, path: "/v1/analytics/recommendations", json: {"recommendationId": "memory-organization", "disposition": "snooze30"}}, snapshot: [dashboard_recommendation_states_view]}
  - {name: "overview after snooze30 organization", as: dash_wri, request: {method: GET, path: "/v1/analytics/overview?range=90d"}}
  - {name: "recommendation upsert: dismissal becomes a snooze", as: dash_wri, request: {method: PATCH, path: "/v1/analytics/recommendations", json: {"recommendationId": "memory-review-overdue", "disposition": "snooze7"}}, snapshot: [dashboard_recommendation_states_view]}
  - {name: "recommendation unknown id is stored", as: dash_wri, request: {method: PATCH, path: "/v1/analytics/recommendations", json: {"recommendationId": "whatever_1", "disposition": "dismiss"}}, snapshot: [dashboard_recommendation_states_view]}
  - {name: "recommendation empty id", as: dash_wri, request: {method: PATCH, path: "/v1/analytics/recommendations", json: {"recommendationId": "", "disposition": "dismiss"}}, snapshot: [dashboard_recommendation_states_view]}
  - {name: "recommendation bad id", as: dash_wri, request: {method: PATCH, path: "/v1/analytics/recommendations", json: {"recommendationId": "bad id", "disposition": "dismiss"}}, snapshot: [dashboard_recommendation_states_view]}
  - {name: "recommendation 97 chars id", as: dash_wri, request: {method: PATCH, path: "/v1/analytics/recommendations", json: {"recommendationId": "rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr", "disposition": "dismiss"}}, snapshot: [dashboard_recommendation_states_view]}
  - {name: "recommendation bad id without token", request: {method: PATCH, path: "/v1/analytics/recommendations", json: {"recommendationId": "bad id", "disposition": "dismiss"}}}
  - {name: "recommendation per user in a team vault", as: dash_ben, request: {method: PATCH, path: "/v1/analytics/recommendations", headers: {X-Vault-ID: "DA5BC000-0000-4000-8000-0000000000C1"}, json: {"recommendationId": "memory-review-overdue", "disposition": "dismiss"}}, snapshot: [dashboard_recommendation_states_view]}
