module: import
steps:
  - {"name": "bulk import", "as": "imp_dan", "request": {"method": "POST", "path": "/v1/import/vault-bulk", "json": {"space": "My Hermes Vault!", "files": [{"path": "Daily/Notes (2026) — final 🎉.md", "content": "# My Title \n\nBody one.\n"}, {"path": "../../escape.md", "content": "no h1 here\n\n## sub\n"}, {"path": "./a/./b.txt", "content": "text in b\n"}, {"path": "", "content": "path is empty"}, {"path": "/////", "content": "only slashes"}, {"path": "empty.md", "content": "  \n "}, {"path": "crlf.md", "content": "# Not\r\n# Split\r\n"}, {"path": "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.md", "content": "a long name"}]}}, "snapshot": ["parity_import_spaces", "parity_import_files", "parity_import_memories", "parity_import_chunks"], "files": ["imp_dan"]}
  - {"name": "again: unchanged files skip", "as": "imp_dan", "request": {"method": "POST", "path": "/v1/import/vault-bulk", "json": {"space": "My Hermes Vault!", "files": [{"path": "Daily/Notes (2026) — final 🎉.md", "content": "# My Title \n\nBody one.\n"}, {"path": "../../escape.md", "content": "no h1 here\n\n## sub\n"}, {"path": "./a/./b.txt", "content": "text in b\n"}, {"path": "", "content": "path is empty"}, {"path": "/////", "content": "only slashes"}, {"path": "empty.md", "content": "  \n "}, {"path": "crlf.md", "content": "# Not\r\n# Split\r\n"}, {"path": "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.md", "content": "a long name"}]}}, "snapshot": ["parity_import_files"]}
  - {"name": "a changed file updates its row and memory", "as": "imp_dan", "request": {"method": "POST", "path": "/v1/import/vault-bulk", "json": {"space": "  my hermes vault ", "files": [{"path": "empty.md", "content": "now has words"}, {"path": "crlf.md", "content": "# New title\n"}]}}, "snapshot": ["parity_import_spaces", "parity_import_files", "parity_import_memories"], "files": ["imp_dan"]}
  - {"name": "a one-letter space is imported", "as": "imp_dan", "request": {"method": "POST", "path": "/v1/import/vault-bulk", "json": {"space": "x", "files": [{"path": "one.md", "content": "one"}]}}, "snapshot": ["parity_import_spaces"]}
  - {"name": "a space over 31 characters", "as": "imp_dan", "request": {"method": "POST", "path": "/v1/import/vault-bulk", "json": {"space": "a very long space name that keeps on going", "files": [{"path": "two.md", "content": "two"}]}}, "snapshot": ["parity_import_spaces"]}
  - {"name": "a non-ascii slug fails the policy", "as": "imp_dan", "request": {"method": "POST", "path": "/v1/import/vault-bulk", "json": {"space": "日本語 ノート", "files": [{"path": "three.md", "content": "three"}]}}, "snapshot": ["parity_import_spaces"]}
  - {"name": "unknown keys are ignored", "as": "imp_ned", "request": {"method": "POST", "path": "/v1/import/vault-bulk", "raw": "{\"space\":\"keys\",\"files\":[{\"path\":\"k.md\",\"content\":\"k\",\"extra\":true}],\"more\":[]}"}, "snapshot": ["parity_import_memories"]}
