# The OpenAI-shaped surface on the same service. Every response_format, and the envelope on upstream failures.
module: llm-voice
steps:
  - name: "json by default"
    as: vw_c
    request: {"method": "POST", "path": "/v1/audio/transcriptions", "raw": "--zz\r\nContent-Disposition: form-data; name=\"file\"; filename=\"audio.ogg\"\r\nContent-Type: audio/ogg\r\n\r\nOggS\r\n--zz--\r\n", "headers": {"Content-Type": "multipart/form-data; boundary=zz"}}
    snapshot: ["parity_voice_usage"]
  - name: "json"
    as: vw_c
    request: {"method": "POST", "path": "/v1/audio/transcriptions", "raw": "--zz\r\nContent-Disposition: form-data; name=\"file\"; filename=\"audio.ogg\"\r\nContent-Type: audio/ogg\r\n\r\nOggS\r\n--zz\r\nContent-Disposition: form-data; name=\"response_format\"\r\n\r\njson\r\n--zz--\r\n", "headers": {"Content-Type": "multipart/form-data; boundary=zz"}}
  - name: "text"
    as: vw_c
    request: {"method": "POST", "path": "/v1/audio/transcriptions", "raw": "--zz\r\nContent-Disposition: form-data; name=\"file\"; filename=\"audio.ogg\"\r\nContent-Type: audio/ogg\r\n\r\nOggS\r\n--zz\r\nContent-Disposition: form-data; name=\"response_format\"\r\n\r\ntext\r\n--zz--\r\n", "headers": {"Content-Type": "multipart/form-data; boundary=zz"}}
  - name: "verbose_json"
    as: vw_c
    request: {"method": "POST", "path": "/v1/audio/transcriptions", "raw": "--zz\r\nContent-Disposition: form-data; name=\"file\"; filename=\"audio.ogg\"\r\nContent-Type: audio/ogg\r\n\r\nOggS\r\n--zz\r\nContent-Disposition: form-data; name=\"response_format\"\r\n\r\nverbose_json\r\n--zz--\r\n", "headers": {"Content-Type": "multipart/form-data; boundary=zz"}}
  - name: "srt"
    as: vw_c
    request: {"method": "POST", "path": "/v1/audio/transcriptions", "raw": "--zz\r\nContent-Disposition: form-data; name=\"file\"; filename=\"audio.ogg\"\r\nContent-Type: audio/ogg\r\n\r\nOggS\r\n--zz\r\nContent-Disposition: form-data; name=\"response_format\"\r\n\r\nsrt\r\n--zz--\r\n", "headers": {"Content-Type": "multipart/form-data; boundary=zz"}}
  - name: "vtt"
    as: vw_c
    request: {"method": "POST", "path": "/v1/audio/transcriptions", "raw": "--zz\r\nContent-Disposition: form-data; name=\"file\"; filename=\"audio.ogg\"\r\nContent-Type: audio/ogg\r\n\r\nOggS\r\n--zz\r\nContent-Disposition: form-data; name=\"response_format\"\r\n\r\nvtt\r\n--zz--\r\n", "headers": {"Content-Type": "multipart/form-data; boundary=zz"}}
  - name: "case is folded"
    as: vw_c
    request: {"method": "POST", "path": "/v1/audio/transcriptions", "raw": "--zz\r\nContent-Disposition: form-data; name=\"file\"; filename=\"audio.ogg\"\r\nContent-Type: audio/ogg\r\n\r\nOggS\r\n--zz\r\nContent-Disposition: form-data; name=\"response_format\"\r\n\r\nVERBOSE_JSON\r\n--zz--\r\n", "headers": {"Content-Type": "multipart/form-data; boundary=zz"}}
  - name: "an unknown format is json"
    as: vw_c
    request: {"method": "POST", "path": "/v1/audio/transcriptions", "raw": "--zz\r\nContent-Disposition: form-data; name=\"file\"; filename=\"audio.ogg\"\r\nContent-Type: audio/ogg\r\n\r\nOggS\r\n--zz\r\nContent-Disposition: form-data; name=\"response_format\"\r\n\r\nyaml\r\n--zz--\r\n", "headers": {"Content-Type": "multipart/form-data; boundary=zz"}}
  - name: "the format isn't trimmed"
    as: vw_c
    request: {"method": "POST", "path": "/v1/audio/transcriptions", "raw": "--zz\r\nContent-Disposition: form-data; name=\"file\"; filename=\"audio.ogg\"\r\nContent-Type: audio/ogg\r\n\r\nOggS\r\n--zz\r\nContent-Disposition: form-data; name=\"response_format\"\r\n\r\n text\r\n--zz--\r\n", "headers": {"Content-Type": "multipart/form-data; boundary=zz"}}
  - name: "the first format wins"
    as: vw_c
    request: {"method": "POST", "path": "/v1/audio/transcriptions", "raw": "--zz\r\nContent-Disposition: form-data; name=\"response_format\"\r\n\r\ntext\r\n--zz\r\nContent-Disposition: form-data; name=\"response_format\"\r\n\r\njson\r\n--zz\r\nContent-Disposition: form-data; name=\"file\"; filename=\"audio.ogg\"\r\nContent-Type: audio/ogg\r\n\r\nOggS\r\n--zz--\r\n", "headers": {"Content-Type": "multipart/form-data; boundary=zz"}}
