# The stub's audio is a digest of model, input, voice and format, so any difference shows as other bytes.
module: tts
steps:
  - name: "a clip, and its characters on the meter"
    as: vt_a
    request: {"method": "POST", "path": "/v1/tts", "json": {"text": "Hello"}}
    snapshot: ["parity_tts_usage"]
    binary: true
    headers: ["X-LuminaVault-Characters-Billed"]
    waitEmpty: "parity_tts_unmetered"
  - name: "voice 'lumina'"
    as: vt_a
    request: {"method": "POST", "path": "/v1/tts", "json": {"voice": "lumina", "text": "hi"}, "headers": {}}
    binary: true
    headers: ["X-LuminaVault-Characters-Billed"]
  - name: "voice 'alloy'"
    as: vt_a
    request: {"method": "POST", "path": "/v1/tts", "json": {"voice": "alloy", "text": "hi"}, "headers": {}}
    binary: true
    headers: ["X-LuminaVault-Characters-Billed"]
  - name: "voice 'echo'"
