module: vision
steps:
  - name: "no token: the gate asks first"
    request: {method: POST, path: "/v1/vision/embed", base64: "iVBORw0KGgo=", headers: {"Content-Type": "text/plain", "X-Forwarded-For": "10.76.0.4"}}
  - name: "free is under the floor"
    as: vis_free
    request: {method: POST, path: "/v1/vision/embed", base64: "iVBORw0KGgo=", headers: {"Content-Type": "image/png"}}
  - name: "lapsed is under the floor"
    as: vis_lapsed
    request: {method: POST, path: "/v1/vision/search", base64: "iVBORw0KGgo=", headers: {"Content-Type": "image/png"}}
  - name: "archived is under the floor"
    as: vis_arch
    request: {method: POST, path: "/v1/vision/embed", base64: "iVBORw0KGgo=", headers: {"Content-Type": "image/png"}}
  - name: "the gate runs before the type check"
    as: vis_free
    request: {method: POST, path: "/v1/vision/embed", base64: "iVBORw0KGgo=", headers: {"Content-Type": "text/plain"}}
  - name: "under the floor, a bad limit is still a paywall"
    as: vis_free
    request: {method: POST, path: "/v1/vision/search?limit=0", base64: "iVBORw0KGgo=", headers: {"Content-Type": "image/png"}}
  - name: "trial reaches the provider check"
    as: vis_trial
    request: {method: POST, path: "/v1/vision/embed", base64: "iVBORw0KGgo=", headers: {"Content-Type": "image/png"}}
  - name: "pro reaches the provider check"
    as: vis_pro
    request: {method: POST, path: "/v1/vision/search", base64: "iVBORw0KGgo=", headers: {"Content-Type": "image/png"}}
  - name: "a granted tier clears the floor"
    as: vis_over
    request: {method: POST, path: "/v1/vision/embed", base64: "iVBORw0KGgo=", headers: {"Content-Type": "image/png"}}
  - name: "a bad type on a paying tier"
    as: vis_trial
    request: {method: POST, path: "/v1/vision/embed", base64: "iVBORw0KGgo=", headers: {"Content-Type": "text/plain"}}
