# HYBRID_EXECUTION_ENABLED=false: /v1/memory/local-sync is not mounted.
module: memory
steps:
  - {name: the path falls to the id route, as: mem_cur, request: {method: GET, path: /v1/memory/local-sync}}
  - {name: with a cursor too, as: mem_cur, request: {method: GET, path: "/v1/memory/local-sync?limit=1&cursor=garbage"}}
  - {name: bad vault header first, as: mem_cur, request: {method: GET, path: /v1/memory/local-sync, headers: {X-Vault-ID: nope}}}
  - {name: no token, request: {method: GET, path: /v1/memory/local-sync}}
  - {name: the rest is still mounted, as: mem_cur, request: {method: GET, path: /v1/memory}}
  - {name: its subpaths fall to the id route too, as: mem_cur, request: {method: GET, path: /v1/memory/local-sync/lineage}}
  - {name: delete falls to the id route, as: mem_cur, request: {method: DELETE, path: /v1/memory/local-sync}}
