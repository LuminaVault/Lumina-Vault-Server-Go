# The directive sits in the file, so the compile prompt carries it to the stub.
module: kb-compile
steps:
  - {"name": "upload notes/a.md", "as": "kbc_hal", "request": {"method": "POST", "path": "/v1/vault/files?path=notes/a.md", "raw": "# A\n\nAlpha [[stub:reply:{\"memories\":[{\"text\":\"Alpha fact\",\"kind\":\"fact\",\"source\":\"notes/a.md\"},{\"text\":\"Second thing\",\"kind\":\"decision\",\"source\":\"notes/a.md\"},{\"text\":\"  \"}],\"commitments\":[{\"text\":\"Call Bob\",\"due\":\"2030-01-01\",\"source\":\"notes/a.md\"},{\"text\":\"No date\"}]}]]\n", "headers": {"Content-Type": "text/markdown"}}}
  - {"name": "compile: memories, commitments, wiki pages", "as": "kbc_hal", "request": {"method": "POST", "path": "/v1/memory-compile", "json": {"forceFullRecompile": false}}, "ignore": ["$.durationMs"], "snapshot": ["parity_kbc_files", "parity_kbc_memories", "parity_kbc_commitments", "parity_kbc_usage", "parity_kbc_onboarding"], "files": ["kbc_hal"], "filesNormalizeContent": true}
  - {"name": "nothing pending now", "as": "kbc_hal", "request": {"method": "POST", "path": "/v1/memory-compile", "json": {"forceFullRecompile": false}}}
  - {"name": "force again", "as": "kbc_hal", "request": {"method": "POST", "path": "/v1/memory-compile", "json": {"forceFullRecompile": true}}, "ignore": ["$.durationMs"], "snapshot": ["parity_kbc_memories", "parity_kbc_usage"], "files": ["kbc_hal"], "filesNormalizeContent": true}
  - {"name": "upload notes/b.md", "as": "kbc_ian", "request": {"method": "POST", "path": "/v1/vault/files?path=notes/b.md", "raw": "plain words with no directive", "headers": {"Content-Type": "text/markdown"}}}
  - {"name": "a reply that is not json", "as": "kbc_ian", "request": {"method": "POST", "path": "/v1/memory-compile", "json": {"forceFullRecompile": false}}, "ignore": ["$.durationMs"], "snapshot": ["parity_kbc_files", "parity_kbc_memories"], "files": ["kbc_ian"], "filesNormalizeContent": true}
  - {"name": "upload notes/c.md", "as": "kbc_ian", "request": {"method": "POST", "path": "/v1/vault/files?path=notes/c.md", "raw": "[[stub:error:500]]", "headers": {"Content-Type": "text/markdown"}}}
  - {"name": "upstream 500", "as": "kbc_ian", "request": {"method": "POST", "path": "/v1/memory-compile", "json": {"forceFullRecompile": false}}, "snapshot": ["parity_kbc_files", "parity_kbc_usage"]}
  - {"name": "same idempotency key replays", "as": "kbc_dan", "request": {"method": "POST", "path": "/v1/memory-compile", "json": {"forceFullRecompile": false}, "headers": {"Idempotency-Key": "0A000000-0000-4000-8000-000000000001"}}}
  - {"name": "replayed", "as": "kbc_dan", "request": {"method": "POST", "path": "/v1/memory-compile", "json": {"forceFullRecompile": false}, "headers": {"Idempotency-Key": "0A000000-0000-4000-8000-000000000001"}}}
  - {"name": "another body, same key", "as": "kbc_dan", "request": {"method": "POST", "path": "/v1/memory-compile", "json": {"forceFullRecompile": true}, "headers": {"Idempotency-Key": "0A000000-0000-4000-8000-000000000001"}}}
