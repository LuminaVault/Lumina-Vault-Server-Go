module: memory-agent
steps:
  - {"name": "sources, tokens, follow-ups, done", "as": "ma_str", "request": {"method": "POST", "path": "/v1/query/stream", "json": {"query": "uranus [[stub:reply:Uranus tilts over.]]"}}, "ignore": ["$.payload.latencyMs"], "stream": true, "frames": 20, "framesTimeout": "20s", "snapshot": ["parity_ma_output_jobs"]}
  - {"name": "the request itself", "as": "ma_str", "request": {"method": "POST", "path": "/v1/query/stream", "json": {"query": "uranus [[stub:echo]]", "limit": 99}}, "ignore": ["$.payload.latencyMs"], "stream": true, "frames": 4000, "framesTimeout": "20s"}
  - {"name": "no hits, session id", "as": "ma_nil", "request": {"method": "POST", "path": "/v1/query/stream", "json": {"query": "[[stub:reply:Nothing.]]", "session_id": "s-1", "limit": 0}}, "ignore": ["$.payload.latencyMs"], "stream": true, "frames": 20, "framesTimeout": "20s"}
  - {"name": "no directive", "as": "ma_nil", "request": {"method": "POST", "path": "/v1/query/stream", "json": {"query": "hello there"}}, "ignore": ["$.payload.latencyMs"], "stream": true, "frames": 20, "framesTimeout": "20s"}
  - {"name": "follow-ups from the reply", "as": "ma_nil", "request": {"method": "POST", "path": "/v1/query/stream", "json": {"query": "[[stub:reply:{\"follow_ups\":[\"One?\",\"Two?\"]}]]"}}, "ignore": ["$.payload.latencyMs"], "stream": true, "frames": 20, "framesTimeout": "20s"}
  - {"name": "an empty completion", "as": "ma_upd", "request": {"method": "POST", "path": "/v1/query/stream", "json": {"query": "[[stub:reply:]]"}}, "ignore": ["$.payload.latencyMs"], "stream": true, "frames": 20, "framesTimeout": "20s"}
  - {"name": "upstream 500", "as": "ma_upd", "request": {"method": "POST", "path": "/v1/query/stream", "json": {"query": "[[stub:error:500]]"}}, "ignore": ["$.payload.latencyMs"], "stream": true, "frames": 20, "framesTimeout": "20s", "snapshot": ["parity_ma_output_jobs"]}
  - {"name": "upstream 400", "as": "ma_upd", "request": {"method": "POST", "path": "/v1/query/stream", "json": {"query": "[[stub:error:400]]"}}, "ignore": ["$.payload.latencyMs"], "stream": true, "frames": 20, "framesTimeout": "20s"}
  - {"name": "upstream 401", "as": "ma_upd", "request": {"method": "POST", "path": "/v1/query/stream", "json": {"query": "[[stub:error:401]]"}}, "ignore": ["$.payload.latencyMs"], "stream": true, "frames": 20, "framesTimeout": "20s"}
  - {"name": "upstream 429", "as": "ma_upd", "request": {"method": "POST", "path": "/v1/query/stream", "json": {"query": "[[stub:error:429]]"}}, "ignore": ["$.payload.latencyMs"], "stream": true, "frames": 20, "framesTimeout": "20s"}
  - {"name": "bad vault header stays a plain 400", "as": "ma_upd", "request": {"method": "POST", "path": "/v1/query/stream", "json": {"query": "x"}, "headers": {"X-Vault-ID": "nope"}}}
