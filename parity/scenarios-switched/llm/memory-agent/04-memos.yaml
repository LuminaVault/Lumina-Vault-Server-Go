module: memory-agent
steps:
  - {"name": "memo, not saved", "as": "ma_mem", "request": {"method": "POST", "path": "/v1/memos", "json": {"topic": "Sleep Patterns!", "save": false}}, "ignore": ["$.memo"]}
  - {"name": "the request itself", "as": "ma_mem", "request": {"method": "POST", "path": "/v1/memos", "json": {"topic": "[[stub:echo]]", "hint": "be brief", "save": false}}, "ignore": ["$.memo"]}
  - {"name": "saved, with the source memory", "as": "ma_mem", "request": {"method": "POST", "path": "/v1/memos", "json": {"topic": "[[stub:tool:session_search:{\"query\":\"neptune\",\"limit\":50}]]", "hint": "cite it"}}, "ignore": ["$.path", "$.memo"], "snapshot": ["parity_ma_files"], "files": ["ma_mem"], "filesMask": ["memos/\\d{4}-\\d{2}-\\d{2}", "-[0-9a-f]{8}\\.md"], "filesNormalizeContent": true}
  - {"name": "a second memo on the topic gets a suffix", "as": "ma_mem", "request": {"method": "POST", "path": "/v1/memos", "json": {"topic": "[[stub:tool:session_search:{\"query\":\"neptune\"}]]"}}, "ignore": ["$.path", "$.memo"], "snapshot": ["parity_ma_files"], "files": ["ma_mem"], "filesMask": ["memos/\\d{4}-\\d{2}-\\d{2}", "-[0-9a-f]{8}\\.md"], "filesNormalizeContent": true}
  - {"name": "a topic with quotes and nothing sluggable", "as": "ma_mem", "request": {"method": "POST", "path": "/v1/memos", "json": {"topic": "\"?!\""}}, "ignore": ["$.path", "$.memo"], "files": ["ma_mem"], "filesMask": ["memos/\\d{4}-\\d{2}-\\d{2}", "-[0-9a-f]{8}\\.md"], "filesNormalizeContent": true}
  - {"name": "non-ascii topic", "as": "ma_mem", "request": {"method": "POST", "path": "/v1/memos", "json": {"topic": "Ünï códe 日本語 - _ end"}}, "ignore": ["$.path", "$.memo"], "files": ["ma_mem"], "filesMask": ["memos/\\d{4}-\\d{2}-\\d{2}", "-[0-9a-f]{8}\\.md"], "filesNormalizeContent": true}
  - {"name": "list", "as": "ma_mem", "request": {"method": "GET", "path": "/v1/memos"}, "ignore": ["$.memos[*].path"]}
  - {"name": "over 32 KiB is a 413", "as": "ma_mem", "request": {"method": "POST", "path": "/v1/memos", "json": {"topic": "long", "hint": "[[stub:reply:]]"}}}
  - {"name": "never converges", "as": "ma_mem", "request": {"method": "POST", "path": "/v1/memos", "json": {"topic": "[[stub:tool:session_search:{\"query\":\"nothing here\"}]]"}}}
  - {"name": "memory_upsert is not a memo tool", "as": "ma_mem", "request": {"method": "POST", "path": "/v1/memos", "json": {"topic": "[[stub:tool:memory_upsert:{\"content\":\"x\"}]]"}}}
  - {"name": "upstream 500", "as": "ma_mem", "request": {"method": "POST", "path": "/v1/memos", "json": {"topic": "[[stub:error:500]]"}}}
  - {"name": "nothing was written by those", "as": "ma_mem", "request": {"method": "GET", "path": "/v1/memos"}, "ignore": ["$.memos[*].path"], "snapshot": ["parity_ma_memories"]}
