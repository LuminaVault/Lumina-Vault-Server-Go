      security:
        - adminToken: []
      parameters:
        - in: path
          name: userID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Correlation summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCorrelateResponse' }

  /v1/admin/memory/recompute:
    post:
      tags: [Admin]
      operationId: adminMemoryRecomputeAll
      summary: Recompute memory scores for all tenants.
      security:
        - adminToken: []
      responses:
        '200':
          description: Recompute summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMemoryScoreResponse' }

  /v1/admin/memory/recompute/{userID}:
    post:
      tags: [Admin]
      operationId: adminMemoryRecomputeOne
      summary: Recompute memory scores for one tenant.
      security:
        - adminToken: []
      parameters:
        - in: path
          name: userID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Recompute summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMemoryScoreResponse' }

  /v1/admin/memory/prune:
    post:
      tags: [Admin]
      operationId: adminMemoryPruneAll
      summary: Run memory pruning across all tenants.
      security:
        - adminToken: []
      responses:
        '200':
          description: Prune summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMemoryPruneResponse' }

  /v1/admin/memory/prune/{userID}:
    post:
      tags: [Admin]
      operationId: adminMemoryPruneOne
      summary: Prune memories for one tenant.
      security:
        - adminToken: []
      parameters:
        - in: path
          name: userID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Prune summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMemoryPruneResponse' }

  /v1/admin/users/{userID}/tier-override:
    put:
      tags: [Admin]
      operationId: adminTierOverride
      summary: Override a user's billing tier (support / TestFlight).
      security:
        - adminToken: []
      parameters:
        - in: path
          name: userID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TierOverrideRequest' }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TierOverrideResponse' }

  # ─────────────── Hermes Profiles — multi-agent (HER-273) ─────────────

  /v1/reminders:
    get:
      tags: [Reminders]
      operationId: remindersList
      summary: List the caller's reminders.
      description: |
        Returns pending and fired reminders for the authed tenant, newest
        `fireAt` first. Firing is server-side (ReminderScheduler); a fired
        one-shot reminder carries a non-null `firedAt`.
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Reminder list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderListResponse' }
    post:
      tags: [Reminders]
      operationId: remindersCreate
      summary: Create a reminder.
      description: |
        `fireAt` is the first delivery time. Set `recurrenceCron` (a 5-field
        cron expression) for a recurring reminder; omit it for one-shot.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReminderCreateRequest' }
      responses:
        '200':
          description: Created reminder.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderDTO' }
        '400':
          description: Missing title or invalid recurrence cron.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/reminders/detect:
    post:
      tags: [Reminders]
      operationId: remindersDetect
      summary: Classify a chat message for reminder intent (HER-55).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties: { text: { type: string } }
      responses:
        '200':
          description: Reminder proposal (isReminder=false when not a reminder request).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderProposalDTO' }

  /v1/reminders/sync:
    post:
      tags: [Reminders]
      operationId: appleRemindersSync
      summary: Ingest Apple Reminders (EventKit) selective-sync deltas.
      description: |
        Batch-upserts the iOS client's EventKit reminder deltas into the
        server-side `apple_reminders` cache (DISTINCT from the app-scheduled
        `reminders` table). Upsert key is `(tenant_id, externalID)` where
        `externalID` is the EventKit `calendarItemIdentifier`; last-writer-wins
        on `remoteUpdatedAt` keeps overlapping pushes idempotent. Consent-gated
        on the `reminders` Apple data domain. The persisted cache backs the
        Hermes `reminders_list` tool (device-RPC stays as a fallback).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppleRemindersSyncRequest' }
      responses:
        '200':
          description: Sync result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppleSyncResponse' }
        '400':
          description: Empty reminders array.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: Reminders access not allowed by the user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/reminders/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Reminders]
      operationId: remindersPatch
      summary: Update a reminder.
      description: |
        Any unset field is left unchanged. Editing `fireAt` re-arms a
        reminder that had already fired.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReminderPatchRequest' }
      responses:
        '200':
          description: Updated reminder.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderDTO' }
        '400':
          description: Empty title or invalid recurrence cron.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Unknown reminder.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [Reminders]
      operationId: remindersDelete
      summary: Delete a reminder.
      responses:
        '204':
          description: Row deleted.
        '404':
          description: Unknown reminder.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/calendar/status:
    get:
      tags: [Calendar]
      operationId: calendarStatus
      summary: Google Calendar connection state.
      description: |
        Reports whether the authed tenant has a connected Google Calendar,
        the account email, and the last successful sync time. `needsReauth`
        is true when the stored refresh token was rejected (revoked / expired)
        — the client should prompt a reconnect.
      responses:
        '200':
          description: Connection status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarStatusResponse' }

  /v1/calendar/connect:
    post:
      tags: [Calendar]
      operationId: calendarConnect
      summary: Begin the Google Calendar OAuth flow.
      description: |
        Returns the Google consent URL. The client opens it in an in-app
        browser session (ASWebAuthenticationSession, scheme `luminavault`).
        Google redirects to the server callback, which exchanges the code and
        hands back to the app via `luminavault://oauth/google-calendar`.

        A web client passes `returnTo`, the page to land back on. It must be
        on the server's `cors.allowedOrigins`; the callback then redirects
        there with `status=ok` or `status=error&reason=…` appended.
      parameters:
        - in: query
          name: returnTo
          required: false
          description: Web only. Absolute URL on an allowed web origin.
          schema: { type: string, format: uri }
      responses:
        '200':
          description: Consent URL to open.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarConnectStartResponse' }
        '400':
          description: '`returnTo` is not on an allowed web origin.'
        '503':
          description: Google Calendar not configured on this server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/calendar/disconnect:
    post:
      tags: [Calendar]
      operationId: calendarDisconnect
      summary: Disconnect Google Calendar.
      description: |
        Revokes the grant at Google (best-effort), deletes the stored tokens,
        and purges this tenant's cached Google calendar events. When the same
        grant also serves Gmail, only the Calendar scope is dropped
        server-side (and the cached events purged) so Gmail keeps working.
      responses:
        '204':
          description: Disconnected and purged.

  /v1/mail/gmail/status:
    get:
      tags: [Calendar]
      operationId: gmailStatus
      summary: Gmail read access state.
      description: |
        Gmail is an incremental `gmail.readonly` scope on the Google Calendar
        OAuth client and grant — one Google account per tenant.
      responses:
        '200':
          description: Gmail status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GmailStatusResponse' }

  /v1/mail/gmail/connect:
    post:
      tags: [Calendar]
      operationId: gmailConnect
      summary: Begin "Connect Gmail" (read-only metadata).
      description: |
        Returns Google's consent URL asking for `gmail.readonly` with
        `include_granted_scopes=true`, so an existing Calendar grant is kept
        and extended. Google redirects to `/v1/calendar/oauth/callback`, which
        303s to `luminavault://oauth/google-gmail?status=ok` (iOS) or to
        `returnTo` with `status=ok|error&reason=…` (web).

        Gmail is a Google restricted scope: until the OAuth app passes
        Google's verification only test users on the consent screen can
        connect.
      parameters:
        - in: query
          name: returnTo
          required: false
          description: Web only. Absolute URL on an allowed web origin.
          schema: { type: string, format: uri }
      responses:
        '200':
          description: Consent URL to open.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarConnectStartResponse' }
        '400':
          description: '`returnTo` is not on an allowed web origin.'
        '503':
          description: Google OAuth not configured on this server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/mail/gmail/disconnect:
    post:
      tags: [Calendar]
      operationId: gmailDisconnect
      summary: Stop reading Gmail.
      description: |
        When the Google grant also serves Calendar, the Gmail scope is
        dropped server-side (Google has no per-scope revoke) and Calendar
        stays connected. Otherwise the grant is revoked at Google and the
        stored tokens deleted. Mail is never stored, so there is nothing
        else to purge.
      responses:
        '204':
          description: Disconnected.

  /v1/calendar/events:
    get:
      tags: [Calendar]
      operationId: calendarEvents
      summary: Upcoming cached calendar events.
      description: |
        Returns the tenant's non-cancelled events ending at or after now,
        soonest first, from the local sync cache (window −7d…+30d).
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
      responses:
        '200':
          description: Upcoming events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarEventsResponse' }
    post:
      tags: [Calendar]
      operationId: calendarCreateEvent
      summary: Create a calendar event.
      description: |
        Creates an event on the user's Google calendar (the app's explicit
        "Add to Calendar" action), caches it, and returns it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalendarCreateEventRequest' }
      responses:
        '200':
          description: Created event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarEventDTO' }
        '400':
          description: Missing title or end not after start.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Google Calendar not connected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/calendar/events/{id}/brief:
    parameters:
      - name: id
        in: path
        required: true
        description: The calendar event id (`CalendarEventDTO.id`, the id in `luminavault://meeting/<eventId>`).
        schema: { type: string, format: uuid }
    get:
      tags: [Calendar]
      operationId: calendarEventBrief
      summary: The notes that bear on one upcoming meeting (pre-meeting brief).
      description: |
        The event, the caller's notes that match it, and one line on why.
        Matching embeds the event's title, attendee names and notes once and
        keeps only notes within the cosine-distance floor
        (`meeting.brief.maxDistance`, default 0.40 — stricter than "connects
        to"), nearest first, at most five, never rejected ones. When the
        opt-in pre-meeting push went out for this event, these are the notes
        it counted (minus any rejected or deleted since); otherwise they are
        matched now. `memories` is empty when nothing passes the floor.

        The push (opt-in via `meetingBriefEnabled` on
        `PUT /v1/me/apns-categories`, off by default) goes out 25–35 minutes
        before a timed, non-cancelled event, only when at least one note
        passes the floor: `passive`, `aps.category` `meeting`, thread
        `meeting`, deep link `luminavault://meeting/<eventId>`. It is exempt
        from the one-a-day proactive push budget.
      responses:
        '200':
          description: The brief.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingBriefResponse' }
        '400':
          description: The id is not a UUID.
        '404':
          description: No such event in the caller's calendar.

  /v1/calendar/oauth/callback:
    get:
      tags: [Calendar]
      operationId: calendarOAuthCallback
      summary: Google OAuth redirect target (public).
      description: |
        Hit by the user's browser when Google redirects after consent. The
        server exchanges the `code`, stores tokens, kicks an initial sync, and
        303-redirects to the app via `luminavault://oauth/google-calendar`.
        Unauthenticated — correlation + CSRF protection come from `state`.
      security: []
      parameters:
        - in: query
          name: state
          required: true
          schema: { type: string }
        - in: query
          name: code
          required: false
          schema: { type: string }
        - in: query
          name: error
          required: false
          schema: { type: string }
      responses:
        '303':
          description: Redirect back to the app via the luminavault:// scheme.
          headers:
            Location:
              schema: { type: string }

  /v1/projects:
    get:
      tags: [Projects]
      operationId: projectsList
      summary: List the caller's projects.
      description: Projects group note-todos. Each carries a live `todoCount`.
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Project list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectListResponse' }
    post:
      tags: [Projects]
      operationId: projectsCreate
      summary: Create a project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreateRequest' }
      responses:
        '200':
          description: Created project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDTO' }
        '400':
          description: Missing name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/projects/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Projects]
      operationId: projectsPatch
      summary: Update a project (name / description / archived).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectPatchRequest' }
      responses:
        '200':
          description: Updated project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDTO' }
        '404':
          description: Unknown project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [Projects]
      operationId: projectsDelete
      summary: Delete a project. Note-todos that referenced it become unfiled.
      responses:
        '204': { description: Row deleted. }
        '404':
          description: Unknown project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/todos:
    get:
      tags: [Todos]
      operationId: todosList
      summary: List the caller's todos (open first, then by soonest due).
      description: |
        A todo is a vault note whose `metadata.isTodo` is true; this API and
        the note browser are two views of the same store.
      responses:
        '200':
          description: Todo list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoListResponse' }
    post:
      tags: [Todos]
      operationId: todosCreate
      summary: Create a standalone todo (stored as a markdown todo-note).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoCreateRequest' }
      responses:
        '200':
          description: Created todo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoDTO' }
        '400':
          description: Missing title.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /v1/todos/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Todos]
      operationId: todosPatch
      summary: Toggle done / edit title, due date, or project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoPatchRequest' }
      responses:
        '200':
          description: Updated todo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoDTO' }
        '404':
          description: Unknown todo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [Todos]
      operationId: todosDelete
      summary: Delete a todo (soft-deletes the note, cascades its recall memory).
      responses:
        '204': { description: Row deleted. }
        '404':
          description: Unknown todo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/profiles:
    get:
      tags: [Profiles]
      operationId: profilesList
      summary: List the caller's Hermes personas.
      description: |
        Returns every persona owned by the authed tenant plus the slug
        of the row currently flagged as default (`activeSlug`). The
        default persona is the one used when a chat request omits
        `X-Hermes-Profile`.
      responses:
        '200':
          description: Persona list + active slug.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesProfilesListResponse' }
    post:
      tags: [Profiles]
      operationId: profilesCreate
      summary: Create a new Hermes persona.
      description: |
        Slug must match `^[a-z0-9][a-z0-9-]{0,31}$`. `systemPrompt` is
        used verbatim as the persona's seed system prompt unless
        `templateSlug` is also set, in which case the template body
        wins (templates: `personal-assistant`, `stocks-tracker`,
        `news-curator`, `tv-and-movies`, `tech-and-programming`).
        First persona for a tenant is auto-flagged as default.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HermesProfileCreateRequest' }
      responses:
        '200':
          description: Created persona.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesProfileDTO' }
        '400':
          description: |
            Stable codes in `message`:
            `invalid_slug`, `invalid_label`, `system_prompt_too_long`,
            `template_not_found`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Slug already exists for this tenant (`slug_already_exists`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/profiles/{slug}:
    parameters:
      - in: path
        name: slug
        required: true
        schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$' }
    get:
      tags: [Profiles]
      operationId: profilesGet
      summary: Get a single persona by slug.
      responses:
        '200':
          description: Persona detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesProfileDTO' }
        '404':
          description: Unknown persona (`profile_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    patch:
      tags: [Profiles]
      operationId: profilesPatch
      summary: Update a persona's label / system prompt / enabled skills.
      description: |
        Slug and default flag are immutable here; use
        `POST /v1/profiles/{slug}/activate` to switch the default.
        Any unset field is left unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HermesProfilePatchRequest' }
      responses:
        '200':
          description: Updated persona.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesProfileDTO' }
        '400':
          description: |
            Stable codes in `message`:
            `invalid_label`, `system_prompt_too_long`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Unknown persona (`profile_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [Profiles]
      operationId: profilesDelete
      summary: Delete a non-default persona.
      responses:
        '204':
          description: Row deleted.
        '404':
          description: Unknown persona (`profile_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Cannot delete the default persona (`cannot_delete_default`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/profiles/{slug}/activate:
    parameters:
      - in: path
        name: slug
        required: true
        schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$' }
    post:
      tags: [Profiles]
      operationId: profilesActivate
      summary: Set this persona as the tenant's default.
      description: |
        Atomically clears the prior default and flags this slug.
        Subsequent chat requests with no `X-Hermes-Profile` header
        will resolve to this slug. Idempotent: activating the
        already-default persona is a no-op.
      responses:
        '200':
          description: Activation acknowledged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesProfileActivateResponse' }
        '404':
          description: Unknown persona (`profile_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ─────────────────────────── System / Hermes update ──────────────────────
  # HER-330 — owner-triggered "Update Hermes" flow. Every route requires BOTH
  # the owner JWT AND the shared admin token (X-Admin-Token header), since an
  # update affects every tenant on the box.

  /v1/system/hermes/version:
    get:
      tags: [System]
      operationId: systemHermesVersion
      summary: Current central Hermes image + available-update info.
      security:
        - bearerJWT: []
          adminTokenHeader: []
      responses:
        '200':
          description: Version info.
          content:
            application/json:
              schema:
                type: object
                required: [info]
                properties:
                  info: { $ref: '#/components/schemas/HermesVersionInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/system/hermes/update:
    post:
      tags: [System]
      operationId: systemHermesUpdateStart
      summary: Start a Hermes self-update (detached, blue-green).
      security:
        - bearerJWT: []
          adminTokenHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartHermesUpdateRequest' }
      responses:
        '200':
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartHermesUpdateResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: An update is already in progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/system/hermes/update/current:
    get:
      tags: [System]
      operationId: systemHermesUpdateCurrent
      summary: Most recent in-flight (or last) update job, for reconnect.
      security:
        - bearerJWT: []
          adminTokenHeader: []
      responses:
        '200':
          description: Job snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { $ref: '#/components/schemas/HermesUpdateJobStatus' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/system/hermes/update/{jobID}:
    get:
      tags: [System]
      operationId: systemHermesUpdateStatus
      summary: Full status snapshot for one update job (poll fallback).
      security:
        - bearerJWT: []
          adminTokenHeader: []
      parameters:
        - in: path
          name: jobID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Job snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { $ref: '#/components/schemas/HermesUpdateJobStatus' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/system/hermes/update/{jobID}/stream:
    get:
      tags: [System]
      operationId: systemHermesUpdateStream
      summary: SSE stream of HermesUpdateEvent for one job.
      description: >
        `text/event-stream`; each `data:` line is one JSON-encoded
        `HermesUpdateEvent` (discriminated by `type`), blank-line terminated.
      security:
        - bearerJWT: []
          adminTokenHeader: []
      parameters:
        - in: path
          name: jobID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/system/hermes/update/{jobID}/rollback:
    post:
      tags: [System]
      operationId: systemHermesUpdateRollback
      summary: Manually roll a failed update back to its previous version.
      security:
        - bearerJWT: []
          adminTokenHeader: []
      parameters:
        - in: path
          name: jobID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Rollback job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartHermesUpdateResponse' }
        '400':
          description: Rollback unavailable (no recorded previous version).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: An update is already in progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/system/hermes/reprovision:
    post:
      tags: [System]
      operationId: systemHermesReprovision
      summary: Bulk-reprovision all per-tenant Hermes containers onto the current image.
      description: >
        Force-removes then re-creates every per-tenant Hermes container,
        re-seeding `config.yaml` from the latest template. The per-tenant data
        volume (memory DB + auth.json) is bind-mounted and untouched, so no
        data is lost. Idempotent. Does NOT run a central blue-green update.
      security:
        - bearerJWT: []
          adminTokenHeader: []
      responses:
        '200':
          description: Reprovision complete.
          content:
            application/json:
              schema:
                type: object
                required: [reprovisioned]
                properties:
                  reprovisioned:
                    type: integer
                    description: Number of tenant containers reprovisioned.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: Per-tenant containers are disabled on this server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ──────────────────────────────── Kanban ────────────────────────────────

  /v1/community/me:
    get:
      tags: [Community]
      operationId: communityMe
      summary: Whether the board is on, and the caller's community profile.
      description: >-
        Always 200. `enabled: false` means the server has the board switched
        off — hide every community entry point. `postingEnabled: false` means
        read-only. A member without a profile (or with an older
        `termsVersion` than `termsVersionRequired`) must complete profile
        setup before posting.
      responses:
        '200':
          description: Community status for the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityMeDTO' }
  /v1/community/profile:
    put:
      tags: [Community]
      operationId: communityUpsertProfile
      summary: Create or update the caller's public community profile.
      description: >-
        The handle (`^[a-z0-9_]{3,20}$`, not reserved, not the account
        username) and display name are the only things other members ever
        see. Accepting the current Community Guidelines is required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityProfileUpsertRequest' }
      responses:
        '200':
          description: Saved profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityProfileDTO' }
        '409': { description: '`handle_taken`.' }
        '422': { description: '`invalid_handle`, `invalid_display_name` or `terms_required`.' }
        '503': { description: '`community_disabled`.' }
  /v1/community/posts:
    get:
      tags: [Community]
      operationId: communityListThreads
      summary: Threads on the board, most recently active first.
      description: >-
        Keyset-paged. Visible threads plus the caller's own `pending` ones;
        never anything by a member the caller blocked.
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityPostPageDTO' }
        '400': { description: '`invalid_cursor`.' }
        '503': { description: '`community_disabled`.' }
    post:
      tags: [Community]
      operationId: communityCreateThread
      summary: Start a thread.
      description: >-
        Moderated before anyone else sees it. 201 with `status: visible`, or
        `status: pending` when the automatic check could not run (only the
        author sees it until it does). 422 `moderation_rejected:<category>`
        when rejected. Capped at 10 threads a day per member.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityPostCreateRequest' }
      responses:
        '201':
          description: The new thread.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityPostDTO' }
        '403': { description: '`community_profile_required`, `terms_required` or `posting_suspended`.' }
        '422': { description: '`invalid_title`, `invalid_body` or `moderation_rejected:<category>`.' }
        '429': { description: '`daily_limit_reached`.' }
        '503': { description: '`community_disabled` or `community_posting_disabled`.' }
  /v1/community/posts/{postID}:
    parameters:
      - { name: postID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Community]
      operationId: communityGetPost
      summary: One thread or reply.
      responses:
        '200':
          description: The post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityPostDTO' }
        '404': { description: '`post_not_found` (also for hidden posts and blocked authors).' }
    delete:
      tags: [Community]
      operationId: communityDeletePost
      summary: Delete your own post.
      responses:
        '204': { description: Deleted. }
        '404': { description: '`post_not_found`.' }
  /v1/community/posts/{postID}/replies:
    parameters:
      - { name: postID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Community]
      operationId: communityListReplies
      summary: Replies to a thread, oldest first.
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityPostPageDTO' }
        '404': { description: '`post_not_found`.' }
    post:
      tags: [Community]
      operationId: communityCreateReply
      summary: Reply to a thread (one level deep).
      description: Same moderation, statuses and errors as creating a thread; 60 replies a day per member.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityReplyCreateRequest' }
      responses:
        '201':
          description: The new reply.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityPostDTO' }
        '404': { description: '`post_not_found`.' }
        '422': { description: '`invalid_body` or `moderation_rejected:<category>`.' }
  /v1/community/posts/{postID}/report:
    parameters:
      - { name: postID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Community]
      operationId: communityReportPost
      summary: Report a post.
      description: >-
        One report per member per post; a repeat is a no-op. The third
        distinct open report hides the post until a moderator decides.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityReportRequest' }
      responses:
        '202': { description: Report filed. }
        '400': { description: '`cannot_report_own_post`.' }
        '404': { description: '`post_not_found`.' }
  /v1/community/daily/today:
    get:
      tags: [Community]
      operationId: communityTodayDaily
      summary: Today's (UTC) AI Daily Post.
      responses:
        '200':
          description: The Daily Post (`author.kind` `ai`, `isDailyPost` true, `aiLabel` set).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityPostDTO' }
        '204': { description: Not published yet today. }
  /v1/community/blocks:
    get:
      tags: [Community]
      operationId: communityListBlocks
      summary: Members the caller has blocked.
      responses:
        '200':
          description: Blocked members.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityBlockListDTO' }
    post:
      tags: [Community]
      operationId: communityBlock
      summary: Block a member; their posts disappear for the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityBlockRequest' }
      responses:
        '204': { description: Blocked. }
        '400': { description: '`cannot_block_self`.' }
        '404': { description: '`profile_not_found`.' }
  /v1/community/blocks/{profileID}:
    delete:
      tags: [Community]
      operationId: communityUnblock
      summary: Unblock a member.
      parameters:
        - { name: profileID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Unblocked. }
  /v1/community/admin/queue:
    get:
      tags: [Community]
      operationId: communityAdminQueue
      summary: Moderator queue (`isAdmin` only).
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [all, open, pending, hidden], default: all }
      responses:
        '200':
          description: Posts needing a decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityAdminQueueDTO' }
        '403': { description: '`admin_required`.' }
  /v1/community/admin/posts/{postID}/decision:
    post:
      tags: [Community]
      operationId: communityAdminDecision
      summary: Hide, restore or remove a post (`isAdmin` only).
      parameters:
        - { name: postID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityAdminDecisionRequest' }
      responses:
        '204': { description: Applied; open reports resolved. }
        '403': { description: '`admin_required`.' }
        '404': { description: '`post_not_found`.' }
  /v1/community/admin/profiles/{profileID}/suspend:
    post:
      tags: [Community]
      operationId: communityAdminSuspend
      summary: Suspend (or with `until` null, reinstate) a member's posting (`isAdmin` only).
      parameters:
        - { name: profileID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityProfileSuspendRequest' }
      responses:
        '204': { description: Saved. }
        '403': { description: '`admin_required`.' }
  /v1/admin/community/daily/run:
    post:
      tags: [Admin]
      operationId: adminCommunityDailyRun
      summary: Publish today's AI Daily Post now (same path as the worker).
      description: A second call the same UTC day reports the day's row without publishing again.
      security:
        - adminToken: []
      responses:
        '200':
          description: The day's outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCommunityDailyRunResult' }
  /v1/boards:
    get:
      tags: [Kanban]
      operationId: boardsList
      summary: List all boards for the authenticated tenant.
      responses:
        '200':
          description: Array of board summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KanbanBoardSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Kanban]
      operationId: boardsCreate
      summary: Create a new board.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BoardCreateRequest' }
      responses:
        '200':
          description: The created board.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KanbanBoard' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/boards/{boardID}:
    get:
      tags: [Kanban]
      operationId: boardsGet
      summary: Fetch a single board with all its columns and cards.
      parameters:
        - in: path
          name: boardID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Full board snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KanbanBoard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Kanban]
      operationId: boardsPatch
      summary: Update board title and/or archived flag.
      parameters:
        - in: path
          name: boardID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BoardPatchRequest' }
      responses:
        '200':
          description: Updated board snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KanbanBoard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Kanban]
      operationId: boardsDelete
      summary: Delete a board and all its columns and cards.
      parameters:
        - in: path
          name: boardID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Board deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/boards/{boardID}/version:
    get:
      tags: [Kanban]
      operationId: boardsVersion
      summary: Fetch only the current version counter for a board (cheap poll / ETag alternative).
      parameters:
        - in: path
          name: boardID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current board version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardVersionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/boards/{boardID}/columns:
    post:
      tags: [Kanban]
      operationId: columnsCreate
      summary: Append a new column to the board.
      parameters:
        - in: path
          name: boardID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ColumnCreateRequest' }
      responses:
        '200':
          description: Updated board snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KanbanBoard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/boards/{boardID}/columns/{columnID}:
    patch:
      tags: [Kanban]
      operationId: columnsPatch
      summary: Rename a column.
      parameters:
        - in: path
          name: boardID
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: columnID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ColumnPatchRequest' }
      responses:
        '200':
          description: Updated board snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KanbanBoard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Kanban]
      operationId: columnsDelete
      summary: Delete a column and all its cards.
      parameters:
        - in: path
          name: boardID
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: columnID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updated board snapshot (column removed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KanbanBoard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/boards/{boardID}/columns/reorder:
    post:
      tags: [Kanban]
      operationId: columnsReorder
      summary: Reorder a column relative to its siblings using fractional-index ranks.
      parameters:
        - in: path
          name: boardID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ColumnReorderRequest' }
      responses:
        '200':
          description: Updated board snapshot with new column order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KanbanBoard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/boards/{boardID}/cards:
    post:
      tags: [Kanban]
      operationId: cardsCreate
      summary: Create a card in the specified column.
      parameters:
        - in: path
          name: boardID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardCreateRequest' }
      responses:
        '200':
          description: The created card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KanbanCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/cards/{cardID}:
    patch:
      tags: [Kanban]
      operationId: cardsPatch
      summary: Update card fields (title, body, priority, dueAt).
      parameters:
        - in: path
          name: cardID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardPatchRequest' }
      responses:
        '200':
          description: Updated card snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KanbanCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Kanban]
      operationId: cardsDelete
      summary: Delete a card.
      parameters:
        - in: path
          name: cardID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Card deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/cards/{cardID}/move:
    post:
      tags: [Kanban]
      operationId: cardsMove
      summary: Move a card to a different column and/or position using fractional-index ranks.
      parameters:
        - in: path
          name: cardID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardMoveRequest' }
      responses:
        '200':
          description: Updated card snapshot at its new position.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KanbanCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ──────────────────────────────── Teams / shared vaults ────────────────────────────────

  /v1/teams:
    get:
      tags: [Teams]
      operationId: teamsList
      responses:
        '200':
          description: Teams visible to the current user.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TeamSummary' } } } }
    post:
      tags: [Teams]
      operationId: teamsCreate
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TeamCreateRequest' } } }
      responses:
        '200': { description: Created team, content: { application/json: { schema: { $ref: '#/components/schemas/TeamSummary' } } } }

  /v1/teams/{teamID}/vaults:
    parameters: [{ $ref: '#/components/parameters/TeamID' }]
    get:
      tags: [Teams]
      operationId: teamVaultsList
      responses:
        '200': { description: Team vaults, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VaultSummary' } } } } }
    post:
      tags: [Teams]
      operationId: teamVaultsCreate
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SharedVaultCreateRequest' } } }
      responses:
        '200': { description: Created vault, content: { application/json: { schema: { $ref: '#/components/schemas/VaultSummary' } } } }

  /v1/teams/{teamID}/invitations:
    parameters: [{ $ref: '#/components/parameters/TeamID' }]
    get:
      tags: [Teams]
      operationId: teamInvitationsList
      responses:
        '200': { description: Pending invitations, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TeamInvitation' } } } } }
    post:
      tags: [Teams]
      operationId: teamInvitationsCreate
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TeamInviteRequest' } } }
      responses:
        '200': { description: Invitation created, content: { application/json: { schema: { $ref: '#/components/schemas/TeamInvitation' } } } }
        '409': { description: An active invitation already exists. }

  /v1/teams/{teamID}/invitations/{invitationID}:
    parameters:
      - { $ref: '#/components/parameters/TeamID' }
      - { $ref: '#/components/parameters/InvitationID' }
    delete:
      tags: [Teams]
      operationId: teamInvitationsRevoke
      responses: { '204': { description: Invitation revoked. } }

  /v1/teams/{teamID}/invitations/{invitationID}/resend:
    parameters:
      - { $ref: '#/components/parameters/TeamID' }
      - { $ref: '#/components/parameters/InvitationID' }
    post:
      tags: [Teams]
      operationId: teamInvitationsResend
      responses:
        '200': { description: Invitation token rotated and resent, content: { application/json: { schema: { $ref: '#/components/schemas/TeamInvitation' } } } }

  /v1/teams/{teamID}/owner:
    parameters: [{ $ref: '#/components/parameters/TeamID' }]
    put:
      tags: [Teams]
      operationId: teamsTransferOwner
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OwnershipTransferRequest' } } }
      responses:
        '200': { description: Ownership transferred, content: { application/json: { schema: { $ref: '#/components/schemas/TeamSummary' } } } }

  /v1/teams/{teamID}/archive:
    parameters: [{ $ref: '#/components/parameters/TeamID' }]
    post:
      tags: [Teams]
      operationId: teamsArchive
      responses: { '200': { description: Team archived, content: { application/json: { schema: { $ref: '#/components/schemas/TeamSummary' } } } } }

  /v1/teams/{teamID}/restore:
    parameters: [{ $ref: '#/components/parameters/TeamID' }]
    post:
      tags: [Teams]
      operationId: teamsRestore
      responses: { '200': { description: Team restored, content: { application/json: { schema: { $ref: '#/components/schemas/TeamSummary' } } } } }

  /v1/teams/{teamID}/leave:
    parameters: [{ $ref: '#/components/parameters/TeamID' }]
    post:
      tags: [Teams]
      operationId: teamsLeave
      responses: { '204': { description: Current user left the team. } }

  /v1/vaults:
    get:
      tags: [Teams]
      operationId: vaultsList
      responses:
        '200': { description: Personal and shared vaults, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VaultSummary' } } } } }

  /v1/vaults/{vaultID}/members:
    parameters: [{ $ref: '#/components/parameters/VaultID' }]
    get:
      tags: [Teams]
      operationId: vaultMembersList
      responses:
        '200': { description: Vault members, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VaultMember' } } } } }

  /v1/vaults/{vaultID}/members/{userID}:
    parameters:
      - { $ref: '#/components/parameters/VaultID' }
      - { $ref: '#/components/parameters/UserID' }
    put:
      tags: [Teams]
      operationId: vaultMembersUpdate
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VaultMembershipUpdateRequest' } } }
      responses:
        '200': { description: Updated member, content: { application/json: { schema: { $ref: '#/components/schemas/VaultMember' } } } }
    delete:
      tags: [Teams]
      operationId: vaultMembersRemove
      responses: { '204': { description: Member removed. } }

  /v1/vaults/{vaultID}/activity:
    parameters: [{ $ref: '#/components/parameters/VaultID' }]
    get:
      tags: [Teams]
      operationId: vaultActivityList
      responses:
        '200': { description: Recent vault activity, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VaultActivity' } } } } }

  /v1/vaults/{vaultID}/activity/stream:
    parameters: [{ $ref: '#/components/parameters/VaultID' }]
    get:
      tags: [Teams]
      operationId: vaultActivityStream
      responses:
        '200': { description: Server-sent vault activity events, content: { text/event-stream: { schema: { type: string } } } }

  /v1/team-invitations/{token}/accept:
    post:
      tags: [Teams]
      operationId: teamInvitationsAccept
      parameters:
        - { in: path, name: token, required: true, schema: { type: string } }
      responses:
        '200': { description: Invitation accepted, content: { application/json: { schema: { $ref: '#/components/schemas/TeamSummary' } } } }

components:

  securitySchemes:
    bearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HMAC HS256 session token (`SessionToken` — see jwt-kit usage).
    adminToken:
      type: http
      scheme: bearer
      description: Shared-secret bearer (`admin.token` env var).
    adminTokenHeader:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: >
        HER-330 — shared admin secret (`admin.token`) presented in the
        `X-Admin-Token` header. Required (in addition to the owner JWT) on
        the system Hermes-update routes.
    revenueCatWebhookSecret:
      type: http
      scheme: bearer
      description: RevenueCat webhook shared secret (`revenuecat.webhookSecret`).

  parameters:
    LuminaChannelHeader:
      in: header
      name: X-Lumina-Channel
      required: false
      description: >-
        The messaging platform this audio arrived on ("telegram", "discord",
        …), used only to attribute usage metering. Advisory: an absent or
        unrecognised value is recorded as "unknown" and never rejects the
        request, because a voice note must not fail over attribution. The
        value is reduced to a bare [a-z0-9_-] token, truncated at the first
        character outside that set. /v1/transcribe defaults to "app" when the
        header is absent, since that route is the iOS microphone surface.
      schema: { type: string, maxLength: 32, example: telegram }
    TeamID:
      in: path
      name: teamID
      required: true
      schema: { type: string, format: uuid }
    VaultID:
      in: path
      name: vaultID
      required: true
      schema: { type: string, format: uuid }
    UserID:
      in: path
      name: userID
      required: true
      schema: { type: string, format: uuid }
    InvitationID:
      in: path
      name: invitationID
      required: true
      schema: { type: string, format: uuid }
    MemoryId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: >
        HER-39 — client-generated UUIDv4. Retrying a mutating request with the
        same key (within 24 h) replays the cached response instead of
        re-executing the handler. Reusing a key with a different request body
        returns 409. Tenant-scoped: the same key value across different tenants
        does not collide.
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing / invalid credential.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Resource conflict (e.g. duplicate registration).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Rate-limit exceeded; honour `Retry-After`.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InsufficientStorage:
      description: |
        The server's data volume is nearly full, so the write was refused
        before anything was stored (`insufficient_storage`). This is not the
        plan quota (that is a 413), and nothing the user can buy or configure
        fixes it: show the message and let them retry later. No `cta`, no
        `Retry-After`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StructuredAPIErrorEnvelope' }
          examples:
            insufficientStorage:
              value:
                error:
                  code: insufficient_storage
                  message: LuminaVault is short on storage space right now, so this wasn't saved. Please try again later.

  schemas:

    TeamSummary:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        archivedAt: { type: [string, 'null'], format: date-time }

    VaultSummary:
      type: object
      required: [id, name, isPersonal, role, canUseAI]
      properties:
        id: { type: string, format: uuid }
        teamID: { type: [string, 'null'], format: uuid }
        name: { type: string }
        isPersonal: { type: boolean }
        role: { type: string, enum: [viewer, editor, admin] }
        canUseAI: { type: boolean }
        archivedAt: { type: [string, 'null'], format: date-time }

    VaultMember:
      type: object
      required: [id, userID, username, email, role, canUseAI]
      properties:
        id: { type: string, format: uuid }
        userID: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [viewer, editor, admin] }
        canUseAI: { type: boolean }

    TeamInvitation:
      type: object
      required: [id, teamID, email, expiresAt]
      properties:
        id: { type: string, format: uuid }
        teamID: { type: string, format: uuid }
        email: { type: string, format: email }
        expiresAt: { type: string, format: date-time }
        token: { type: [string, 'null'] }

    VaultActivity:
      type: object
      required: [id, vaultID, actorName, action, targetType, createdAt]
      properties:
        id: { type: string, format: uuid }
        vaultID: { type: string, format: uuid }
        actorUserID: { type: [string, 'null'], format: uuid }
        actorName: { type: string }
        action: { type: string }
        targetType: { type: string }
        targetID: { type: [string, 'null'], format: uuid }
        targetTitle: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    TeamCreateRequest:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 2, maxLength: 80 } }

    SharedVaultCreateRequest:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 2, maxLength: 80 } }

    VaultInviteGrant:
      type: object
      required: [role, canUseAI]
      properties:
        role: { type: string, enum: [viewer, editor, admin] }
        canUseAI: { type: boolean }

    TeamInviteRequest:
      type: object
      required: [email, vaultGrants]
      properties:
        email: { type: string, format: email }
        vaultGrants:
          type: object
          additionalProperties: { $ref: '#/components/schemas/VaultInviteGrant' }

    VaultMembershipUpdateRequest:
      type: object
      required: [role, canUseAI]
      properties:
        role: { type: string, enum: [viewer, editor, admin] }
        canUseAI: { type: boolean }

    OwnershipTransferRequest:
      type: object
      required: [userID]
      properties: { userID: { type: string, format: uuid } }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }

    StructuredAPIErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable reason (e.g. `byok_keys_required`).
        message:
          type: string
          description: User-facing copy safe to display in clients.
        cta:
          type: array
          items:
            type: string
            enum: [add_key, switch_to_managed, upgrade]
          description: |
            Optional recovery actions for clients. `upgrade` accompanies
            `free_lane_exhausted` and `usage_cap_exceeded`; `add_key` /
            `switch_to_managed` accompany `byok_keys_required`. On
            `free_lane_exhausted` and `free_lane_unavailable` the set depends
            on the caller's tier and mode (`upgrade` only for free and lapsed
            accounts), so render whatever is present.
        retryAfterSeconds:
          type: integer
          description: |
            Present on `free_lane_exhausted` and `usage_cap_exceeded`, never on
            `free_lane_unavailable`. Seconds
            until the daily allowance resets (UTC midnight). Mirrors the
            `Retry-After` header.

    StructuredAPIErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/StructuredAPIErrorBody'

    # ── HER-330 Hermes self-update ──
    HermesVersionInfo:
      type: object
      required: [currentRef, currentLabel, updateAvailable]
      properties:
        currentRef: { type: string }
        currentDigest: { type: string, nullable: true }
        currentLabel: { type: string }
        availableLabel: { type: string, nullable: true }
        updateAvailable: { type: boolean }
        lastUpdatedAt: { type: string, format: date-time, nullable: true }

    StartHermesUpdateRequest:
      type: object
      properties:
        targetTag:
          type: string
          nullable: true
          description: Release-channel tag to pull; defaults to the server's channel.

    StartHermesUpdateResponse:
      type: object
      required: [jobID, state]
      properties:
        jobID: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/HermesUpdateJobState' }

    HermesUpdateJobState:
      type: string
      enum: [running, succeeded, failed, rolledBack]

    HermesUpdateStepID:
      type: string
      enum: [preflight, pullImage, verifyImage, snapshotCurrent, swapCentral, healthCheckCentral, reprovisionTenants, verifyTenants, promote, rollback]

    HermesUpdateStepState:
      type: string
      enum: [pending, running, succeeded, failed, skipped]

    HermesUpdateStep:
      type: object
      required: [id, state]
      properties:
        id: { $ref: '#/components/schemas/HermesUpdateStepID' }
        state: { $ref: '#/components/schemas/HermesUpdateStepState' }
        detail: { type: string, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }

    HermesUpdateJobStatus:
      type: object
      required: [jobID, state, steps, startedAt, updatedAt]
      properties:
        jobID: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/HermesUpdateJobState' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/HermesUpdateStep' }
        fromVersion: { type: string, nullable: true }
        toVersion: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HermesUpdateEvent:
      type: object
      description: >
        SSE frame discriminated by `type`. `payload` shape depends on `type`:
        step→HermesUpdateStep, status→HermesUpdateJobState string,
        done→HermesUpdateJobStatus, error→string.
      required: [type]
      properties:
        type:
          type: string
          enum: [step, status, done, error]
        payload: {}

    UpstreamError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - upstream_timeout
                - upstream_unreachable
                - upstream_rejected
                - upstream_error
                - rate_limit
                - credit_exhausted
                - network
                - no_providers
              description: Machine-readable reason code. Stable; clients localize via this.
            message:
              type: string
              description: Human-readable explanation safe to display.
            retry_after_ms:
              type: integer
              format: int32
              minimum: 0
              description: Optional client hint for retry delay in milliseconds.

    # ── Auth ──

    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email: { type: string, format: email }
        username: { type: string, minLength: 3 }
        password: { type: string, minLength: 12 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    AuthResponse:
      type: object
      required: [accessToken, userId, vaultInitialized]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer }
        userId: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        vaultInitialized:
          type: boolean
          description: HER-35 — false until `POST /v1/vault/create` runs; clients gate the "Create My Vault" screen on this flag.

    EmailOnlyRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    EmailConfirmRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }

    ResetPasswordRequest:
      type: object
      required: [email, code, newPassword]
      properties:
        email: { type: string, format: email }
        code: { type: string }
        newPassword: { type: string, minLength: 12 }

    MFAVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code: { type: string }

    MFAResendRequest:
      type: object
      required: [challengeId]
      properties:
        challengeId: { type: string }

    OAuthIDTokenRequest:
      type: object
      required: [idToken]
      properties:
        idToken: { type: string }

    OAuthAccessTokenRequest:
      type: object
      required: [accessToken]
      properties:
        accessToken: { type: string }

    PhoneStartRequest:
      type: object
      required: [phoneE164]
      properties:
        phoneE164: { type: string }

    PhoneVerifyRequest:
      type: object
      required: [phoneE164, code]
      properties:
        phoneE164: { type: string }
        code: { type: string }

    EmailMagicVerifyRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string }

    WebAuthnBeginRegistrationRequest:
      type: object
      required: [username]
      properties:
        username: { type: string }
        displayName: { type: string, nullable: true }

    WebAuthnAuthOptionsRequest:
      type: object
      required: [username]
      properties:
        username: { type: string }

    WebAuthnOptions:
      type: object
      description: |
        Opaque PublicKeyCredentialCreationOptions / RequestOptions JSON
        as returned by the WebAuthn relying-party library. Forwarded
        verbatim to the iOS / browser WebAuthn API.
      additionalProperties: true

    WebAuthnFinish:
      type: object
      description: |
        Browser/iOS-returned PublicKeyCredential JSON. Forwarded verbatim
        to the relying-party library for verification.
      additionalProperties: true

    WebAuthnFinishRegistrationResponse:
      type: object
      required: [credentialID]
      properties:
        credentialID: { type: string, description: "Base64url credential ID." }

    WebAuthnCredentialSummary:
      type: object
      required: [id, createdAt]
      properties:
        id: { type: string, description: "Base64url credential ID." }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        nickname: { type: string, nullable: true }

    WebAuthnCredentialListResponse:
      type: object
      required: [credentials]
      properties:
        credentials:
          type: array
          items: { $ref: '#/components/schemas/WebAuthnCredentialSummary' }

    # ── Me ──

    MeResponse:
      type: object
      required: [userId, email, username, isVerified, isAdmin]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: string }
        isVerified: { type: boolean }
        isAdmin: { type: boolean, description: Enables authenticated marketplace moderation UI. }
        privacyNoCNOrigin: { type: boolean }
        contextRouting: { type: boolean }
        autoSaveLinks:
          type: boolean
          description: |
            HER-274 — gates the chat auto-save-link post-processor. When
            `true` (default), URLs detected in chat prompts and replies
            are auto-captured to the vault and surfaced as `link_saved`
            SSE events.
        mnemosyneEnabled:
          type: boolean
          description: |
            Mnemosyne default-memory toggle for the tenant's managed Hermes.
            When `true` (default), Mnemosyne is the memory layer and Hermes'
            native file memory is disabled; when `false`, Hermes falls back to
            its built-in file memory. Applied on the container's next restart.

    UpdatePrivacyRequest:
      type: object
      properties:
        privacyNoCNOrigin: { type: boolean }
        contextRouting: { type: boolean }
        autoSaveLinks:
          type: boolean
          description: HER-274 — opt out of the chat auto-save-link behavior.
        mnemosyneEnabled:
          type: boolean
          description: |
            Toggle Mnemosyne as the tenant's default memory layer. `false`
            falls back to Hermes' native file memory; applied on next restart.

    PaywallResponse:
      type: object
      description: |
        Body of every `402` raised by `EntitlementMiddleware`.

        `requiredTier` is the lowest tier a user could *buy* to clear the gate
        — never `free` or `trial`, which are not purchasable. Clients decoded
        this field long before the server sent it, so a missing value must
        stay tolerable: decode it as optional and fall back to generic copy.
      required: [paywall, paywallId, requiredTier]
      properties:
        paywall: { type: boolean }
        paywallId: { type: string, enum: [default, ultimate_upsell] }
        requiredTier: { type: string, enum: [pro, ultimate] }

    MeBillingResponse:
      type: object
      required: [tier, tierOverride, inTrial, daysRemaining, enforcementEnabled]
      properties:
        # The *effective* tier: `tierOverride` is already folded in by the
        # server. Clients render this directly and never resolve the ladder.
        tier: { type: string, enum: [free, trial, pro, ultimate, lapsed, archived] }
        tierExpiresAt: { type: string, format: date-time }
        tierOverride: { type: string }
        inTrial: { type: boolean }
        daysRemaining: { type: integer }
        enforcementEnabled: { type: boolean }

    MeTodayResponse:
      type: object
      description: Widget + daily-review digest (HER-206).
      properties:
        date: { type: string, format: date }
        memories:
          type: array
          items: { $ref: '#/components/schemas/MemoryDTO' }
        achievements:
          type: array
          items: { $ref: '#/components/schemas/AchievementDTO' }
        soulExcerpt: { type: string }
        suggestedActions:
          type: array
          items: { type: string }

    # ── Dashboard (HER-244) ──

    # ── Self improvement ──

    ImprovementModelMode:
      type: string
      enum: [economy, main]

    ImprovementAvailability:
      type: string
      enum: [managed, compatible_byo, read_only, unavailable]

    ImprovementChangeKind:
      type: string
      enum: [curator, soul]

    ImprovementChangeState:
      type: string
      enum: [pending, approved, rejected, applied, stale, failed]

    ImprovementTrigger:
      type: string
      enum: [manual, weekly, complex_session]

    ImprovementRunStatus:
      type: string
      enum: [queued, running, succeeded, failed, rolled_back]

    ImprovementResourceKind:
      type: string
      enum: [skill, job]

    ImprovementResourceState:
      type: string
      enum: [active, stale, archived]

    ImprovementSettingsDTO:
      type: object
      required: [enabled, curatorEnabled, intervalHours, minimumIdleHours, consolidate, pruneBuiltins, backupKeep, soulReviewEnabled, reviewComplexSessions, soulReviewWindowDays, soulReviewCooldownHours, modelMode]
      properties:
        enabled: { type: boolean, default: true }
        curatorEnabled: { type: boolean, default: true }
        intervalHours: { type: integer, minimum: 24, maximum: 720, default: 168 }
        minimumIdleHours: { type: integer, minimum: 0, maximum: 72, default: 2 }
        consolidate: { type: boolean, default: true }
        pruneBuiltins: { type: boolean, default: false }
        backupKeep: { type: integer, minimum: 1, maximum: 20, default: 5 }
        soulReviewEnabled: { type: boolean, default: true }
        reviewComplexSessions: { type: boolean, default: true }
        soulReviewWindowDays: { type: integer, minimum: 7, maximum: 14, default: 14 }
        soulReviewCooldownHours: { type: integer, minimum: 1, maximum: 168, default: 24 }
        modelMode: { $ref: '#/components/schemas/ImprovementModelMode' }

    ImprovementSettingsUpdateRequest:
      type: object
      required: [settings]
      properties:
        settings: { $ref: '#/components/schemas/ImprovementSettingsDTO' }

    ImprovementStatusDTO:
      type: object
      required: [settings, availability, economyModelAvailable, pendingChanges]
      properties:
        settings: { $ref: '#/components/schemas/ImprovementSettingsDTO' }
        availability: { $ref: '#/components/schemas/ImprovementAvailability' }
        economyModelAvailable: { type: boolean }
        pendingChanges: { type: integer }
        lastCuratorReviewAt: { type: string, format: date-time }
        lastSoulReviewAt: { type: string, format: date-time }
        nextReviewAt: { type: string, format: date-time }
        message: { type: string }

    ImprovementRunDTO:
      type: object
      required: [id, kind, status, trigger, dryRun, actionsApplied, actionsSkipped, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ImprovementChangeKind' }
        status: { $ref: '#/components/schemas/ImprovementRunStatus' }
        trigger: { $ref: '#/components/schemas/ImprovementTrigger' }
        dryRun: { type: boolean }
        modelUsed: { type: string }
        reportMarkdown: { type: string }
        actionsApplied: { type: integer }
        actionsSkipped: { type: integer }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        failureReason: { type: string }

    ImprovementRunsResponse:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: '#/components/schemas/ImprovementRunDTO' }

    ImprovementRunRequest:
      type: object
      required: [dryRun]
      properties:
        dryRun: { type: boolean, default: true }

    ImprovementRunAcceptedResponse:
      type: object
      required: [run]
      properties:
        run: { $ref: '#/components/schemas/ImprovementRunDTO' }

    ImprovementRollbackResponse:
      type: object
      required: [run]
      properties:
        run: { $ref: '#/components/schemas/ImprovementRunDTO' }

    SoulReviewRequest:
      type: object
      required: [trigger]
      properties:
        trigger: { $ref: '#/components/schemas/ImprovementTrigger' }

    ImprovementChangeDTO:
      type: object
      required: [id, kind, state, trigger, title, summary, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ImprovementChangeKind' }
        state: { $ref: '#/components/schemas/ImprovementChangeState' }
        trigger: { $ref: '#/components/schemas/ImprovementTrigger' }
        title: { type: string }
        summary: { type: string }
        patch: { type: string }
        baseSHA256: { type: string }
        reportMarkdown: { type: string }
        failureReason: { type: string }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        appliedAt: { type: string, format: date-time }

    ImprovementChangesResponse:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items: { $ref: '#/components/schemas/ImprovementChangeDTO' }

    ImprovementDecisionResponse:
      type: object
      required: [change]
      properties:
        change: { $ref: '#/components/schemas/ImprovementChangeDTO' }

    ImprovementSkillDTO:
      type: object
      required: [name, title, kind, state, pinned, curatorManaged]
      properties:
        name: { type: string }
        title: { type: string }
        kind: { $ref: '#/components/schemas/ImprovementResourceKind' }
        state: { $ref: '#/components/schemas/ImprovementResourceState' }
        pinned: { type: boolean }
        curatorManaged: { type: boolean }
        lastActivityAt: { type: string, format: date-time }

    ImprovementSkillsResponse:
      type: object
      required: [skills]
      properties:
        skills:
          type: array
          items: { $ref: '#/components/schemas/ImprovementSkillDTO' }

    ImprovementSkillPinRequest:
      type: object
      required: [pinned]
      properties:
        pinned: { type: boolean }

    # ── Skills (HER-247 / HER-177 / HER-178 / HER-179) ──

    SkillSource:
      type: string
      description: >-
        `hermes` = mirrored from the tenant's own Hermes (id `hermes-<name>`);
        runs on Hermes, `/run` answers 400 `hermes_skill_runs_on_hermes`.
      enum: [builtin, vault, hermes]

    SkillRunStatus:
      type: string
      enum: [pending, running, success, error]

    SkillCapability:
      type: string
      enum: [low, medium, high]

    APNSCategory:
      type: string
      enum: [chat, nudge, digest]

    SkillDTO:
      type: object
      required: [id, source, name, title, descriptionText, capability, enabled, dailyRunCount, dailyRunCap, bodyExcerpt]
      properties:
        id: { type: string }
        source: { $ref: '#/components/schemas/SkillSource' }
        name: { type: string }
        title: { type: string }
