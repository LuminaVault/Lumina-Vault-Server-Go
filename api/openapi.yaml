    MemoryRelatedResponse:
      type: object
      required: [memoryId, items]
      properties:
        memoryId: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/RelatedMemoryDTO' }

    MeetingBriefEventDTO:
      type: object
      required: [id, title, startsAt, endsAt, attendees]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        location: { type: string }
        attendees:
          type: array
          items: { $ref: '#/components/schemas/CalendarAttendeeDTO' }
    MeetingBriefMemoryDTO:
      type: object
      required: [id, snippet, createdAt, similarity]
      properties:
        id: { type: string, format: uuid }
        snippet: { type: string, description: 'First ~160 characters, one line.' }
        kind: { type: string, description: 'Raw memory kind (preference, decision, fact, note, …).' }
        createdAt: { type: string, format: date-time }
        similarity: { type: number, format: double, minimum: 0, maximum: 1, description: 'Cosine similarity.' }
    MeetingBriefResponse:
      type: object
      required: [event, memories, why]
      properties:
        event: { $ref: '#/components/schemas/MeetingBriefEventDTO' }
