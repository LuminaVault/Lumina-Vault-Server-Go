        lastUsedAt: { type: string, format: date-time }
        allowPersonalData: { type: boolean }
        access: { $ref: '#/components/schemas/AgentConnectionAccess' }

    AgentConnectionsListResponse:
      type: object
      required: [connections]
      properties:
        connections:
          type: array
          items: { $ref: '#/components/schemas/AgentConnectionDTO' }

