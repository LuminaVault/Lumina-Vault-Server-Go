    OnboardingStateDTO:
      type: object
      properties:
        signupCompleted: { type: boolean }
        signupCompletedAt: { type: string, format: date-time }
        emailVerifiedCompleted: { type: boolean }
        emailVerifiedCompletedAt: { type: string, format: date-time }
        soulConfiguredCompleted: { type: boolean }
        soulConfiguredCompletedAt: { type: string, format: date-time }
        firstCaptureCompleted: { type: boolean }
        firstCaptureCompletedAt: { type: string, format: date-time }
        firstKBCompileCompleted: { type: boolean }
        firstKBCompileCompletedAt: { type: string, format: date-time }
        firstQueryCompleted: { type: boolean }
        firstQueryCompletedAt: { type: string, format: date-time }
        brainConfiguredCompleted:
          type: boolean
          description: HER-300 — true once user completes "Choose Your Brain".
        brainConfiguredCompletedAt: { type: string, format: date-time }
        guidedStartDismissedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the user dismissed the guided-start card, null when it is
            not dismissed. Two-way, unlike the latches above.

    OnboardingPatchRequest:
      type: object
      description: |
        All fields optional. Only `true` is accepted for the seven
        completion flags — `false` is rejected with 400 because they are
        one-way latches. `guidedStartDismissed` is the sole exception and
        accepts both values.
      properties:
        signupCompleted: { type: boolean }
        emailVerifiedCompleted: { type: boolean }
        soulConfiguredCompleted: { type: boolean }
        firstCaptureCompleted: { type: boolean }
        firstKBCompileCompleted: { type: boolean }
        firstQueryCompleted: { type: boolean }
        brainConfiguredCompleted: { type: boolean }
        guidedStartDismissed:
          type: boolean
          description: |
            The only two-way field on this endpoint. `true` stamps
            `guidedStartDismissedAt`, `false` clears it back to null.

    # ── Devices ──

    DeviceRegistrationRequest:
      type: object
      required: [token, platform]
      properties:
        token: { type: string }
        platform: { type: string, enum: [ios, android] }
        bundleId:
          type: string
          description: |
            The app's bundle id (e.g. `com.lumina.fernando.beta`). Pushes to
            this device use it as the APNs topic when it is the server's
            configured bundle id or a variant of it; any other value is
            ignored. Omit it to keep a previously stored value.

    DeviceRegistrationResponse:
      type: object
      required: [id, token, platform]
      properties:
        id: { type: string, format: uuid }
        token: { type: string }
        platform: { type: string }

    # ── Account ──

    AccountDeleteRequest:
      type: object
      properties:
        password:
          type: string
          description: Optional re-auth; bypassed for OAuth-only accounts.

    # ── Billing ──

    RevenueCatWebhookBody:
      type: object
      description: Opaque RevenueCat event envelope; forwarded verbatim.
      additionalProperties: true

    # ── LLM / Chat ──

    ChatRequest:
      type: object
      required: [messages]
      properties:
        model: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
        temperature: { type: number, minimum: 0, maximum: 2 }
        stream: { type: boolean, default: false }

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant, tool] }
        content: { type: string }
        toolCalls:
          type: array
          items: { type: object, additionalProperties: true }

    ChatResponse:
      type: object
      required: [id, choices]
      properties:
        id: { type: string }
        model: { type: string }
        choices:
          type: array
          items: { $ref: '#/components/schemas/ChatChoice' }
        usage: { $ref: '#/components/schemas/ChatUsage' }

    ChatChoice:
      type: object
      required: [index, message]
      properties:
        index: { type: integer }
        message: { $ref: '#/components/schemas/ChatMessage' }
        finishReason: { type: string }

    ChatUsage:
      type: object
      properties:
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        totalTokens: { type: integer }

    # ── Transcribe (HER-203) ──

    # OpenAI's audio-transcription form. The file field is named `file`, not
    # `audio` — it was previously documented with the wrong field name, and
    # with no implementation reading it the error went unnoticed.
    TranscribeMultipartRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: >-
            Audio bytes. The filename matters: the format is resolved from its
            extension before the part's Content-Type, because upstream
            providers dispatch on the extension.
        model: { type: string }
        language: { type: string }
        prompt: { type: string }
        temperature: { type: number }
        response_format:
          type: string
          enum: [json, text, verbose_json, srt, vtt]
          default: json

    # Mirrors the server DTO, which carries more than the text.
    TranscribeResponse:
      type: object
      required: [id, text, language, confidence, duration_seconds]
      properties:
        id: { type: string }
        text: { type: string }
        language: { type: string }
        confidence: { type: number }
        duration_seconds: { type: number }
        segments:
          type: array
          items:
            type: object
            required: [start, end, text]
            properties:
              start: { type: number }
              end: { type: number }
              text: { type: string }

    # ── OpenAI-shaped audio surface ──

    OpenAIErrorEnvelope:
      type: object
      required: [error]
      description: >-
        OpenAI's error shape. Load-bearing rather than cosmetic: the OpenAI SDK
        builds APIStatusError.message from error.message, and callers relay
        that text to end users.
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: string, nullable: true }
            param: { type: string, nullable: true }

    OpenAITranscriptionJSON:
      type: object
      required: [text]
      properties:
        text: { type: string }

    OpenAISpeechRequest:
      type: object
      required: [input]
      properties:
        model: { type: string }
        input: { type: string }
        voice: { type: string }
        response_format:
          type: string
          enum: [mp3, opus]
          default: mp3
        speed: { type: number }

    # ── TTS (HER-204) ──

    TTSRequest:
      type: object
      required: [text]
      properties:
        text: { type: string }
        voice: { type: string }
        model: { type: string }
        format: { type: string, enum: [mp3], default: mp3 }

    # ── Vision embed (HER-205) ──

    VisionEmbedRequest:
      type: object
      required: [image]
      properties:
        image:
          type: string
          format: byte
          description: Base64-encoded image bytes.
        mimeType:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        model: { type: string }

    VisionEmbedResponse:
      type: object
      required: [embedding]
      properties:
        embedding:
          type: array
          items: { type: number }

    VisionSearchResponse:
      type: object
      required: [hits, model]
      properties:
        hits:
          type: array
          items: { $ref: '#/components/schemas/VisionSearchHit' }
        model:
          type: string
          description: Which provider answered; results are only comparable within one model.

    VisionSearchHit:
      type: object
      required: [id, content, distance]
      properties:
        id: { type: string, format: uuid }
        content: { type: string }
        distance:
          type: number
          description: pgvector cosine distance — smaller is closer.
        createdAt: { type: [string, 'null'], format: date-time }

    # ── Memory ──

    MemoryDTO:
      type: object
      required: [id, content, reviewState]
      properties:
        id: { type: string, format: uuid }
        content: { type: string }
        tags:
          type: array
          items: { type: string }
        score: { type: number }
        accessCount: { type: integer }
        queryHitCount: { type: integer }
        lastAccessedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        sourceVaultFileId: { type: string, format: uuid }
        reviewState:
          type: string
          enum: [auto, pending, approved, rejected]
          description: |
            HER-290 — moderation state. `auto` for manual upserts + backfill;
            `pending` for kb-compile-produced memories awaiting approve/reject;
            `approved` / `rejected` after the user acts. Reject also lands the
            content hash on the per-tenant `kb_compile_reject_list` so future
            compile runs skip the same content.
        provenance: { $ref: '#/components/schemas/MemoryProvenanceSummaryDTO' }
        kind: { $ref: '#/components/schemas/MemoryKind' }
        spaceId:
          type: string
          format: uuid
          description: The Space the memory is filed in. Absent when unfiled.

    MemoryKind:
      type: string
      enum: [preference, decision, fact, note]
      description: |
        What kind of statement a memory is. Absent when unclassified, which
        is every memory saved before kinds existed. Clients must treat an
        unknown value as unclassified.

    MemoryActorKindDTO:
      type: string
      enum: [user, model, system]

    MemoryContributionOperationDTO:
      type: string
      enum: [create, update]

    MemorySourceKindDTO:
      type: string
      enum: [manual, chat, query, knowledge_compile, skill, vault, import, link, legacy]

    ModelProvenanceDTO:
      type: object
      required: [provider, model]
      properties:
        provider: { type: string }
        model: { type: string }

    MemoryContributionDTO:
      type: object
      required: [id, operation, actor, source, createdAt]
      properties:
        id: { type: string, format: uuid }
        operation: { $ref: '#/components/schemas/MemoryContributionOperationDTO' }
        actor: { $ref: '#/components/schemas/MemoryActorKindDTO' }
        source: { $ref: '#/components/schemas/MemorySourceKindDTO' }
        model: { $ref: '#/components/schemas/ModelProvenanceDTO' }
        sourceReference: { type: string }
        createdAt: { type: string, format: date-time }

    MemoryProvenanceSummaryDTO:
      type: object
      required: [contributors]
      properties:
        createdBy: { $ref: '#/components/schemas/MemoryContributionDTO' }
        lastUpdatedBy: { $ref: '#/components/schemas/MemoryContributionDTO' }
        contributors:
          type: array
          items: { $ref: '#/components/schemas/ModelProvenanceDTO' }

    MemoryProvenanceResponse:
      type: object
      required: [memoryID, contributions]
      properties:
        memoryID: { type: string, format: uuid }
        contributions:
          type: array
          items: { $ref: '#/components/schemas/MemoryContributionDTO' }

    MemoryFacetDTO:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }

    MemoryFacetsResponse:
      type: object
      required: [providers, models, sources]
      properties:
        providers: { type: array, items: { $ref: '#/components/schemas/MemoryFacetDTO' } }
        models: { type: array, items: { $ref: '#/components/schemas/MemoryFacetDTO' } }
        sources: { type: array, items: { $ref: '#/components/schemas/MemoryFacetDTO' } }
        oldestAt: { type: string, format: date-time }
        newestAt: { type: string, format: date-time }

    MemoryListResponse:
      type: object
      required: [memories]
      properties:
        memories:
          type: array
          items: { $ref: '#/components/schemas/MemoryDTO' }
        limit: { type: integer }
        offset: { type: integer }

    MemoryUpsertRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }
        tags:
          type: array
          items: { type: string }
        sourceVaultFileId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/MemoryKind' }

    MemorySearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        limit: { type: integer, default: 20 }
        filters:
          type: object
          additionalProperties: true

    MemorySearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/MemorySearchResult' }

    MemorySearchResult:
      type: object
      required: [memory, score]
      properties:
        memory: { $ref: '#/components/schemas/MemoryDTO' }
        score: { type: number }

    MemoryPatchRequest:
      type: object
      properties:
        content: { type: string }
        tags:
          type: array
          items: { type: string }
        reviewState:
          type: string
          enum: [approved, rejected]
          description: |
            HER-290 — only `pending → approved` and `pending → rejected`
            transitions are legal. Other source/target combinations return
            422. On `rejected` the server records the source + content_hash
            so future kb-compile runs skip the same content.
        kind:
          allOf: [{ $ref: '#/components/schemas/MemoryKind' }]
          description: Set or change the kind; omit to leave it as it is.
        spaceId:
          type: [string, 'null']
          format: uuid
          description: |
            Move the memory. A Space id files it there, `null` takes it out of
            every Space, and omitting the key leaves it where it is. A memory
            compiled from a note moves with its note: the note is moved into
            the target Space's folder.

    MemoryLineageResponse:
      type: object
      properties:
        memory: { $ref: '#/components/schemas/MemoryDTO' }
        vaultFile: { $ref: '#/components/schemas/VaultFileDTO' }
        ancestors:
          type: array
          items: { $ref: '#/components/schemas/MemoryDTO' }

    # ── Memory Graph (HER-235) ──

    GraphNodeKindDTO:
      type: string
      enum: [memory, wikiPage, space]
      description: "Which store the node's id belongs to: memory, wikiPage (vault_files source page), or space (synthetic Space hub node, id = Space UUID)."

    GraphPosition3D:
      type: object
      required: [x, y, z]
      description: "Precomputed stable 3D layout coordinate (HER-235 3D viz), from note embeddings (PCA top-3), normalized to a bounded cube."
      properties:
        x: { type: number, format: double }
        y: { type: number, format: double }
        z: { type: number, format: double }

    MemoryGraphNodeDTO:
      type: object
      required: [id, title, tags, createdAt, score]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, description: "Memory content snippet or wiki-page title; used as node label." }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        score: { type: number, format: double, description: "Drives node radius client-side. Memory uses memories.score; wiki pages use a constant." }
        kind:
          allOf: [{ $ref: '#/components/schemas/GraphNodeKindDTO' }]
          description: "Defaults to memory when omitted (pre-enrich payloads)."
        spaceID:
          type: string
          format: uuid
          description: "Optional Space the node is filed under; powers space edges."
        activity:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          description: "HER-235 3D viz — activity/heat in [0,1] (last-access recency blended with score). Drives the cyan→amber color ramp. Omitted by pre-enrich servers."
        position:
          allOf: [{ $ref: '#/components/schemas/GraphPosition3D' }]
          description: "HER-235 3D viz — precomputed stable 3D coordinate. Omitted until the layout worker has run for this node → client force-directed fallback."
        provenance: { $ref: '#/components/schemas/MemoryProvenanceSummaryDTO' }

    MemoryEdgeKindDTO:
      type: string
      enum: [wikilink, tag, space, semantic, temporal]

    MemoryGraphEdgeDTO:
      type: object
      required: [from, to, kind, weight]
      properties:
        from: { type: string, format: uuid }
        to: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/MemoryEdgeKindDTO' }
        tag:
          type: string
          description: "Populated when kind == tag: the shared tag that produced the edge."
        similarity:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          description: "Populated when kind == semantic: cosine similarity in [0, 1]."
        weight:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          description: "Normalised edge strength used for visual alpha/thickness."

    MemoryGraphResponse:
      type: object
      required: [nodes, edges, generatedAt]
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/MemoryGraphNodeDTO' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/MemoryGraphEdgeDTO' }
        generatedAt: { type: string, format: date-time }

    KnowledgeNodeKindDTO:
      type: string
      enum: [claim, entity, event]

    KnowledgeEdgePredicateDTO:
      type: string
      enum: [mentions, about, supports, contradicts, causes, precedes, related_to, derived_from]

    KnowledgeEdgeStateDTO:
      type: string
      enum: [asserted, suggested, confirmed, dismissed, stale]

    KnowledgeEvidenceDTO:
      type: object
      required: [id, memoryID, quote]
      properties:
        id: { type: string, format: uuid }
        memoryID: { type: string, format: uuid }
        sourceVaultFileID: { type: string, format: uuid }
        quote: { type: string }
        startOffset: { type: integer }
        endOffset: { type: integer }

    KnowledgeNodeDTO:
      type: object
      required: [id, kind, label, confidence, evidence]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/KnowledgeNodeKindDTO' }
        label: { type: string }
        summary: { type: string }
        occurredAt: { type: string, format: date-time }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeEvidenceDTO' }

    KnowledgeEdgeDTO:
      type: object
      required: [id, from, to, predicate, state, confidence, evidence]
      properties:
        id: { type: string, format: uuid }
        from: { type: string, format: uuid }
        to: { type: string, format: uuid }
        predicate: { $ref: '#/components/schemas/KnowledgeEdgePredicateDTO' }
        state: { $ref: '#/components/schemas/KnowledgeEdgeStateDTO' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        rationale: { type: string }
        counterEvidence: { type: string }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeEvidenceDTO' }

    KnowledgeGraphResponse:
      type: object
      required: [nodes, edges, generatedAt]
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeNodeDTO' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeEdgeDTO' }
        generatedAt: { type: string, format: date-time }

    KnowledgePathDTO:
      type: object
      required: [id, nodes, edges, confidence]
      properties:
        id: { type: string, format: uuid }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeNodeDTO' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeEdgeDTO' }
        confidence: { type: number, minimum: 0, maximum: 1 }

    ConnectionExplanationRequest:
      type: object
      required: [fromNodeID, toNodeID]
      properties:
        fromNodeID: { type: string, format: uuid }
        toNodeID: { type: string, format: uuid }
        maxDepth: { type: integer, minimum: 1, maximum: 4 }

    ConnectionExplanationResponse:
      type: object
      required: [explanation, paths, confidence, caveats]
      properties:
        explanation: { type: string }
        paths:
          type: array
          items: { $ref: '#/components/schemas/KnowledgePathDTO' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        caveats:
          type: array
          items: { type: string }

    ReasoningQueryRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        maxDepth: { type: integer, minimum: 1, maximum: 4 }
        limit: { type: integer, minimum: 1, maximum: 2000 }

    ReasoningQueryResponse:
      type: object
      required: [answer, paths, evidence, confidence, caveats, suggestions]
      properties:
        answer: { type: string }
        paths:
          type: array
          items: { $ref: '#/components/schemas/KnowledgePathDTO' }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeEvidenceDTO' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        caveats:
          type: array
          items: { type: string }
        suggestions:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeEdgeDTO' }

    ReasoningStreamEventDTO:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [context, token, suggestions, result, done, error] }
        response: { $ref: '#/components/schemas/ReasoningQueryResponse' }
        message: { type: string }

    InferenceReviewRequest:
      type: object
      properties:
        note: { type: string }

    # ── Capture / URL Enrichment ──

    CaptureSafariRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        notes: { type: string }
        # snake_case on the wire. `AppRequestContext` decodes with no
        # convertFromSnakeCase and CaptureSafariRequest maps this field
        # explicitly, so a client sending `spaceId` has it decode as nil and the
        # link lands unfiled with no error.
        space_id: { type: string, format: uuid }

    CaptureSafariResponse:
      type: object
      required: [id, path, status]
      properties:
        id: { type: string, format: uuid }
        # The vault path, already allocated. Returned with the 202 so a client
        # can show the captured row before enrichment has rewritten the file.
        path: { type: string }
        status: { type: string }

    # ── Query ──

    QueryRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        limit: { type: integer, default: 10 }

    VaultLintFinding:
      type: object
      required: [message]
      properties:
        path: { type: string }
        line:
          type: integer
          description: Present for line-scoped findings (wiki links).
        message: { type: string }

    VaultLintCheck:
      type: object
      required: [name, severity, message, findings]
      properties:
        name:
          type: string
          enum:
            [broken-links, ambiguous-links, duplicate-slugs, orphans, stale-index,
             oversized-files, empty-documents, unreadable-files]
        severity:
          type: string
          enum: [error, warning, pass]
          description: |
            `error` — retrieval is affected. `warning` — worth fixing, retrieval
            still works. `pass` — nothing found.
        message:
          type: string
          description: Summary with exact counts, even when `findings` is truncated.
        findings:
          type: array
          description: At most 50 per check.
          items: { $ref: '#/components/schemas/VaultLintFinding' }

    VaultLintReport:
      type: object
      required: [checks, passed, warned, failed, hasFindings]
      properties:
        checks:
          type: array
          description: One entry per check, including the ones that passed.
          items: { $ref: '#/components/schemas/VaultLintCheck' }
        passed: { type: integer }
        warned: { type: integer }
        failed: { type: integer }
        hasFindings: { type: boolean }

    VaultIndexStatus:
      type: object
      required:
        [documentCount, memoryCount, chunkCount, resolvedLinkCount, unresolvedLinkCount,
         ambiguousLinkCount, unindexedDocumentCount, staleDocumentCount,
         unindexedSample, staleSample, stale, staleReasons]
      description: Index freshness for one tenant's vault.
      properties:
        documentCount: { type: integer }
        memoryCount: { type: integer }
        chunkCount: { type: integer }
        resolvedLinkCount: { type: integer }
        unresolvedLinkCount:
          type: integer
          description: Links pointing at notes that do not exist yet — the vault's to-do list.
        ambiguousLinkCount:
          type: integer
          description: Links whose name matches more than one document.
        unindexedDocumentCount:
          type: integer
          description: Documents with no chunks — invisible to citation-bearing search.
        staleDocumentCount:
          type: integer
          description: Documents edited after they were last indexed.
        unindexedSample:
          type: array
          description: First 20 unindexed paths; the count above is exact.
          items: { type: string }
        staleSample:
          type: array
          description: First 20 stale paths; the count above is exact.
          items: { type: string }
        lastIndexedAt: { type: string, format: date-time }
        stale: { type: boolean }
        staleReasons:
          type: array
          description: One human-readable line per distinct kind of drift. Empty when fresh.
          items: { type: string }

    VaultContextHeading:
      type: object
      required: [path, startLine]
      properties:
        path:
          type: array
          description: 'Full heading ancestry, outermost first.'
          items: { type: string }
        startLine: { type: integer }

    VaultContextNeighbour:
      type: object
      required: [vaultFileID, path]
      properties:
        vaultFileID: { type: string, format: uuid }
        path: { type: string }

    VaultContextPacket:
      type: object
      required: [vaultFileID, path, chunkCount, headings, siblings, linksTo, linkedFrom, danglingLinks]
      description: Deterministic structure and neighbourhood of one document.
      properties:
        vaultFileID: { type: string, format: uuid }
        path: { type: string }
        spaceID: { type: string, format: uuid }
        chunkCount: { type: integer }
        headings:
          type: array
          items: { $ref: '#/components/schemas/VaultContextHeading' }
        siblings:
          type: array
          description: Other documents in the same Space. Empty for an unfiled document.
          items: { $ref: '#/components/schemas/VaultContextNeighbour' }
        linksTo:
          type: array
          items: { $ref: '#/components/schemas/VaultContextNeighbour' }
        linkedFrom:
          type: array
          description: Backlinks.
          items: { $ref: '#/components/schemas/VaultContextNeighbour' }
        danglingLinks:
          type: array
          description: Links that resolve to nothing or to more than one document, as written.
          items: { type: string }

    VaultOutgoingLink:
      type: object
      required: [sourceLine, rawTarget, targetSlug, resolutionState]
      properties:
        sourceLine: { type: integer }
        rawTarget:
          type: string
          description: Everything between the brackets, verbatim.
        targetSlug: { type: string }
        targetHeading: { type: string }
        label: { type: string }
        resolutionState:
          type: string
          enum: [resolved, unresolved, ambiguous]
        targetPath:
          type: string
          description: Present only when resolved.

    VaultIncomingLink:
      type: object
      required: [sourceLine, rawTarget, targetSlug, resolutionState]
      properties:
        sourcePath: { type: string }
        sourceLine: { type: integer }
        rawTarget: { type: string }
        targetSlug: { type: string }
        resolutionState:
          type: string
          enum: [resolved, unresolved, ambiguous]

    VaultLinksResponse:
      type: object
      required: [vaultFileID, path, outgoing, incoming]
      properties:
        vaultFileID: { type: string, format: uuid }
        path: { type: string }
        outgoing:
          type: array
          items: { $ref: '#/components/schemas/VaultOutgoingLink' }
        incoming:
          type: array
          description: Backlinks.
          items: { $ref: '#/components/schemas/VaultIncomingLink' }

    MemoryCitationDTO:
      type: object
      required: [chunkID, documentID, headingPath, startLine, endLine]
      description: |
        Where a retrieval hit physically came from, precise enough to re-read
        by hand. Present when the hit came from the chunk index; absent on the
        document-level retrieval path, which has no line information.

        Clients should treat it as optional and render the hit unchanged when
        it is missing.
      properties:
        chunkID:
          type: string
          description: Stable while the chunk's text and position are unchanged.
        documentID:
          type: string
          description: |
            Stable across edits and reindexing — safe to persist in a saved
            answer and resolve later.
        path:
          type: string
          description: |
            Vault-relative source path. Absent for memories with no backing
            file (direct API upserts, chat-derived memories).
        headingPath:
          type: array
          description: 'Heading ancestry, outermost first: ["Routing", "Fallbacks"].'
          items: { type: string }
        startLine:
          type: integer
          description: 1-based inclusive first line within `path`.
        endLine:
          type: integer
          description: 1-based inclusive last line within `path`.

    QueryHitDTO:
      type: object
      required: [id, content, distance]
      description: A single retrieved memory snippet returned by `/v1/query`.
      properties:
        id: { type: string, format: uuid }
        content: { type: string }
        distance: { type: number, format: float }
        createdAt: { type: string, format: date-time }
        snippet:
          type: string
          description: |
            Match-highlighted excerpt with `[` / `]` around matched terms.
            Absent when the hit came from a path that produces no highlight.
        citation:
          allOf: [{ $ref: '#/components/schemas/MemoryCitationDTO' }]
          description: Absent on the document-level retrieval path.

    QueryResponse:
      type: object
      required: [summary, hits]
      description: |
        Non-streaming response for `POST /v1/query`. The streaming variant
        emits `QueryStreamEvent` over SSE — see `/v1/query/stream`.
        `followUps` is server-generated and optional for backward
        compatibility with pre-HER-37 clients.
      properties:
        summary: { type: string }
        hits:
          type: array
          items: { $ref: '#/components/schemas/QueryHitDTO' }
        followUps:
          type: array
          items: { type: string }

    QueryStreamEvent:
      type: object
      required: [type]
      description: |
        Discriminated-union event emitted on `POST /v1/query/stream` and
        `POST /v1/conversations/{id}/messages/stream` Server-Sent-Event
        streams. Each SSE `data:` line carries one JSON object of this
        shape. The `payload` shape depends on `type`:

        - `source` — `QueryHitDTO`
        - `token` — `string` (incremental LLM delta, concatenate in order)
        - `summary` — `string` (final summary, sent after all tokens)
        - `follow_ups` — `array<string>` (server-generated follow-up chips)
        - `done` — no payload (stream terminator)
        - `error` — `string` (stream-level error; client surfaces and aborts).
          When the user can act on it, `code` and `cta` sit beside
          `payload` — the same code and recovery actions the HTTP
          `StructuredAPIErrorBody` would carry (e.g. `free_lane_exhausted`,
          `[add_key, switch_to_managed]`). Clients that ignore them keep the
          message.
        - `fallback` — `ProviderFallbackNoticeDTO` (HER-252 routing failover)
        - `routing` — `RouterRoutingEventDTO` (Cerberus route/phase)
        - `usage` — `RouterUsageDTO` (prompt-free terminal usage)
        - `parallel` — `ParallelStreamEventDTO` (multi-model candidate progress)
        - `link_saved` — `LinkSavedDTO` (HER-274 auto-saved chat link)
        - `hermes_run` — `ChatHermesRunRefDTO` (this turn escalated to an agent run)

        **`done` does not always mean the turn finished.** When `hermes_run`
        is emitted, the stream sends it and then `done` and closes; the
        answer and the tool trail arrive on the run's own event feed at
        `GET /v1/hermes/runs/{runID}/events`. A client that finalizes its
        assistant bubble on `done` will commit it empty.

        `hermes_run` is only sent to clients that declared `chat.hermes_run`
        in `X-LV-Client-Caps`. Clients predating that capability abort the
        whole stream on an event type they do not know, so everyone else
        keeps the classic token stream.
      properties:
        type:
          type: string
          enum: [source, token, summary, follow_ups, done, error, fallback, routing, usage, parallel, link_saved, hermes_run]
        payload:
          description: Case-specific payload; absent for `done`.
        code:
          type: string
          description: |
            `error` events only, and only when the user can act on the
            error: its machine reason (e.g. `free_lane_exhausted`,
            `byok_keys_required`).
        cta:
          type: array
          items:
            type: string
            enum: [add_key, switch_to_managed, upgrade]
          description: |
            `error` events only, alongside `code`: the recovery actions that
            are real for this caller. Render the ones you know.

    HermesWorkspaceRepoDTO:
      type: object
      required: [root, isDetached]
      properties:
        root: { type: string }
        branch:
          type: string
          nullable: true
          description: Absent on a detached HEAD or mid-rebase. Clients should say so rather than showing a blank branch.
        isDetached: { type: boolean }

    HermesWorkspaceBranchDTO:
      type: object
      required: [name, isCurrent]
      properties:
        name: { type: string }
        isCurrent: { type: boolean }

    HermesWorkspaceWorktreeDTO:
      type: object
      required: [path, isPrimary]
      properties:
        path: { type: string }
        branch: { type: string, nullable: true }
        isPrimary: { type: boolean }

    HermesWorkspaceChangeDTO:
      type: object
      required: [path, added, removed, status]
      properties:
        path: { type: string }
        added: { type: integer }
        removed: { type: integer }
        status:
          type: string
          description: |
            Upstream's own word — `modified`, `added`, `deleted`, `renamed`,
            `untracked`. A free string rather than an enum so a state this
            build has never heard of shows as itself instead of collapsing
            into "modified".

    HermesWorkspaceDiffDTO:
      type: object
      required: [path, diff, truncated]
      properties:
        path: { type: string }
        diff:
          type: string
          description: |
            A unified diff, as text. Not parsed into hunks on the server:
            clients render the patch, and parsing here would mean inventing a
            hunk model every consumer then has to agree with.
        truncated:
          type: boolean
          description: The diff was cut short by a size cap. Clients must say so rather than presenting it as the whole change.

    HermesWorkspaceFileEntryDTO:
      type: object
      required: [name, path, isDirectory]
      properties:
        name: { type: string }
        path: { type: string }
        isDirectory: { type: boolean }

    HermesWorkspaceListingDTO:
      type: object
      required: [path, entries]
      properties:
        path: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/HermesWorkspaceFileEntryDTO' }

    HermesWorkspaceFileDTO:
      type: object
      required: [path, content, truncated]
      properties:
        path: { type: string }
        content: { type: string }
        truncated: { type: boolean }

    HermesWorkspaceStatusDTO:
      type: object
      required: [repo, branches, worktrees, changes]
      properties:
        repo: { $ref: '#/components/schemas/HermesWorkspaceRepoDTO' }
        branches:
          type: array
          items: { $ref: '#/components/schemas/HermesWorkspaceBranchDTO' }
        worktrees:
          type: array
          items: { $ref: '#/components/schemas/HermesWorkspaceWorktreeDTO' }
        changes:
          type: array
          items: { $ref: '#/components/schemas/HermesWorkspaceChangeDTO' }

    ChatHermesRunRefDTO:
      type: object
      required: [runID, afterSeq, startedAt]
      description: |
        Payload of the `hermes_run` event. Points the client at the agent run
        answering this turn.

        A pointer rather than the events themselves because the run feed is
        the only one with a durable cursor: its events are persisted with a
        monotonic `seq`, replayed from `?after=`, and keepalived, and it
        carries approvals and stop. The chat stream has neither cursor nor
        keepalive, so carrying run events on it would put an unreplayable
        copy of a durable log on a connection that cannot resume.
      properties:
        runID: { type: string, format: uuid }
        sessionID:
          type: string
          nullable: true
          description: |
            The Hermes session backing the run. Artifacts are keyed by
            session, so this is how a chat surface scopes its artifact strip
            to this turn (`GET /v1/hermes/artifacts?sessionID=`).
        afterSeq:
          type: integer
          description: Where to start reading the run's event feed. Normally 0.
        startedAt: { type: string, format: date-time }

    ChatAgentModeDTO:
      type: string
      enum: [off, auto, force]
      description: |
        Whether a turn may escalate to a Hermes agent run. Absent means
        `auto`. The server owns the decision; this is the user's standing
        preference, not an instruction to start a run.

    ChatAttachmentDTO:
      type: object
      required: [kind, name]
      description: |
        Something attached to a turn. Flattened into the prompt server-side
        so web and iOS cannot drift into two prompt shapes for one
        attachment. Text and vault references only — there is no chat
        blob-upload endpoint, and images reach a conversation through the
        capture and ingestion path as `vault_file`.
      properties:
        kind: { type: string, enum: [text, vault_file, link] }
        name: { type: string, description: What to call it in the prompt and on the chip. }
        text: { type: string, nullable: true }
        vaultPath: { type: string, nullable: true }
        url: { type: string, nullable: true }

    LinkSavedDTO:
      type: object
      required: [url, vaultPath, capturedAt, fromUserMessage]
      description: |
        HER-274 — payload of the `link_saved` SSE event. One emitted per
        unique URL the server auto-captured to the vault while processing
        a chat turn, after tokens and before `.done`.
      properties:
        url: { type: string, format: uri }
        vaultPath:
          type: string
          description: Tenant-relative vault path (e.g. `captures/2026-05-24-103045-news-ycombinator-com.md`).
        capturedAt: { type: string, format: date-time }
        fromUserMessage:
          type: boolean
          description: |
            `true` when the URL appeared in the user prompt; `false` when
            it appeared only in the assistant reply. Drives client toast
            copy variant.

    # ── Conversations (HER-37 multi-turn chat) ──

    ConversationMessageRole:
      type: string
      enum: [user, assistant, system]

    ConversationDTO:
      type: object
      required: [id, title, createdAt, updatedAt]
      description: |
        A persisted multi-turn chat thread. Backs the "thinking workspace"
        continuity surface on the Think tab.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        spaceId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        pinnedMemoryIDs:
          type: array
          items: { type: string, format: uuid }
        routeOverride: { $ref: '#/components/schemas/RouterModelRouteDTO' }

    ConversationMessageDTO:
      type: object
      required: [id, conversationId, role, content, createdAt]
      description: |
        A single persisted turn within a Conversation. Durable record;
        distinct from the transient `ChatMessage` used on the Hermes
        upstream wire.
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/ConversationMessageRole' }
        content: { type: string }
        sourceMemoryIDs:
          type: array
          items: { type: string, format: uuid }
        parallelExecutionID: { type: string, format: uuid }
        provider:
          allOf: [{ $ref: '#/components/schemas/ProviderID' }]
          nullable: true
          description: Which provider produced this turn. Absent on user turns.
        model:
          type: string
          nullable: true
          description: |
            Which model produced this turn.

            Previously the wire carried neither this nor `toolCallCount`, so a
            client could show a model badge only for turns the device itself
            produced and a thread reopened elsewhere lost it.
        toolCallCount:
          type: integer
          nullable: true
          description: |
            How many tools the assistant invoked. Zero is a real answer — the
            turn ran without tools — and null means unknown.
        origin:
          $ref: '#/components/schemas/ConversationMessageOrigin'
        sourceLabel:
          type: [string, 'null']
          description: |
            Who sent a proactive message — the skill or job name
            (`daily-brief`, `job-weather-watch`). Clients caption the bubble
            with it ("From daily-brief"). Null for ordinary replies.
        createdAt: { type: string, format: date-time }

    ConversationMessageOrigin:
      type: string
      enum: [reply, proactive]
      default: reply
      description: |
        `proactive` marks a message the server appended without a user turn:
        a scheduled skill or job with a `chat_message` output (the morning
        brief, a standing watch). It lands in the tenant's Hermie thread and
        is pushed with category `chat`. Always sent by servers since 5.20.0;
        absent from older servers, and clients treat absent or unknown values
        as `reply`.

    AgentTurnTraceDTO:
      type: object
      required: [id, provider, model, toolNames, toolCallCount, failoverCount, tokensIn, tokensOut, estimatedCostUsdMicros, latencyMs, occurredAt]
      properties:
        id: { type: string, format: uuid }
        conversationMessageId:
          type: string
          format: uuid
          nullable: true
          description: |
            Null for routed calls that are not conversation turns — skill runs,
            workflow nodes, one-shot classifiers.
        provider: { $ref: '#/components/schemas/ProviderID' }
        model: { type: string }
        toolNames:
          type: array
          items: { type: string }
          description: Tool names in call order; may be empty when only a count is known.
        toolCallCount: { type: integer }
        failoverCount:
          type: integer
          description: |
            Candidates tried before this one succeeded. Greater than zero means
            the preferred provider failed and we fell over.
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        estimatedCostUsdMicros:
          type: integer
          description: |
            Micro-USD. Whose money depends on `credentialMode` — ours for
            `managed`, the user's own provider balance for `byok`.
        latencyMs: { type: integer }
        credentialMode:
          allOf: [{ $ref: '#/components/schemas/LLMBrainMode' }]
          nullable: true
        occurredAt: { type: string, format: date-time }

    AgentTurnTracesResponse:
      type: object
      required: [traces]
      properties:
        traces:
          type: array
          items: { $ref: '#/components/schemas/AgentTurnTraceDTO' }

    ConversationCreateRequest:
      type: object
      properties:
        title: { type: string }
        spaceId: { type: string, format: uuid }
        pinnedMemoryIDs:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
        routeOverride: { $ref: '#/components/schemas/RouterModelRouteDTO' }

    ConversationListResponse:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items: { $ref: '#/components/schemas/ConversationDTO' }
        nextCursor: { type: string }

    ConversationDetailResponse:
      type: object
      required: [conversation, messages]
      properties:
        conversation: { $ref: '#/components/schemas/ConversationDTO' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ConversationMessageDTO' }

    MessageStreamRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }
        multiModel: { $ref: '#/components/schemas/ChatMultiModelOptionsDTO' }
        agentMode: { $ref: '#/components/schemas/ChatAgentModeDTO' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/ChatAttachmentDTO' }

    HybridExecutionProfile:
      type: string
      enum: [private, balanced, quality]

    ExecutionLocation:
      type: string
      enum: [on_device, local_endpoint, cloud]

    LocalEndpointKind:
      type: string
      enum: [ollama, lm_studio, mlx_server, openai_compatible]

    HybridRoutingPreferencesDTO:
      type: object
      required: [profile, localFallbackEnabled, cloudFallbackEnabled, syncLocalConversations]
      properties:
        profile: { $ref: '#/components/schemas/HybridExecutionProfile' }
        localFallbackEnabled: { type: boolean }
        cloudFallbackEnabled: { type: boolean }
        syncLocalConversations: { type: boolean }

    ConversationPrepareRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 100000 }

    ConversationPrepareResponse:
      type: object
      required: [executionID, messages, sources, expiresAt, allowedTools]
      properties:
        executionID: { type: string, format: uuid }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/QueryHitDTO' }
        expiresAt: { type: string, format: date-time }
        allowedTools:
          type: array
          items: { $ref: '#/components/schemas/LocalExecutionToolDTO' }

    LocalExecutionToolName:
      type: string
      enum: [memory_search]

    LocalExecutionToolDTO:
      type: object
      required: [name, description]
      properties:
        name: { $ref: '#/components/schemas/LocalExecutionToolName' }
        description: { type: string }

    LocalToolInvokeRequest:
      type: object
      required: [name, query]
      properties:
        name: { $ref: '#/components/schemas/LocalExecutionToolName' }
        query: { type: string, minLength: 1, maxLength: 10000 }
        limit: { type: integer, minimum: 1, maximum: 10, default: 5 }

    LocalToolInvokeResponse:
      type: object
      required: [name, content, sources]
      properties:
        name: { $ref: '#/components/schemas/LocalExecutionToolName' }
        content: { type: string }
        sources:
          type: array
          items: { $ref: '#/components/schemas/QueryHitDTO' }

    LocalExecutionUsageDTO:
      type: object
      required: [inputTokens, outputTokens, latencyMs]
      properties:
        inputTokens: { type: integer, minimum: 0 }
        outputTokens: { type: integer, minimum: 0 }
        latencyMs: { type: integer, minimum: 0 }

    ConversationCommitRequest:
      type: object
      required: [executionID, content, location, provider, model]
      properties:
        executionID: { type: string, format: uuid }
        content: { type: string, minLength: 1, maxLength: 500000 }
        location: { $ref: '#/components/schemas/ExecutionLocation' }
        provider: { type: string, minLength: 1, maxLength: 100 }
        model: { type: string, minLength: 1, maxLength: 200 }
        usage: { $ref: '#/components/schemas/LocalExecutionUsageDTO' }

    ConversationCommitResponse:
      type: object
      required: [message, followUps]
      properties:
        message: { $ref: '#/components/schemas/ConversationMessageDTO' }
        followUps:
          type: array
          items: { type: string }

    LocalMemorySyncItemDTO:
      type: object
      required: [id, content, source, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        content: { type: string }
        source: { $ref: '#/components/schemas/MemorySourceKindDTO' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LocalMemorySyncResponse:
      type: object
      required: [memories, deletedIDs]
      properties:
        memories:
          type: array
          items: { $ref: '#/components/schemas/LocalMemorySyncItemDTO' }
        deletedIDs:
          type: array
          items: { type: string, format: uuid }
        nextCursor: { type: string, description: Opaque stable pagination cursor. }

    ChatInboxItemDTO:
      type: object
      required: [id, title, preview, messageCount, lastMessageAt, pinned, archived]
      description: Summary row for the primary Chats inbox.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        preview: { type: string }
        messageCount: { type: integer, minimum: 0 }
        lastMessageAt: { type: string, format: date-time }
        workspaceID: { type: string, format: uuid }
        sourceLabel: { type: string }
        providerID: { $ref: '#/components/schemas/ProviderID' }
        model: { type: string }
        pinned: { type: boolean }
        archived: { type: boolean }

    ChatInboxResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ChatInboxItemDTO' }
        nextCursor: { type: string }

    ChatPreferencesDTO:
      type: object
      required: [autoExpandThinking, sendOnReturn]
      properties:
        autoExpandThinking:
          type: boolean
          default: true
        sendOnReturn:
          type: boolean
          default: false

    ChatPreferencesGetResponse:
      type: object
      required: [preferences]
      properties:
        preferences: { $ref: '#/components/schemas/ChatPreferencesDTO' }

    ChatPreferencesPutRequest:
      type: object
      required: [preferences]
      properties:
        preferences: { $ref: '#/components/schemas/ChatPreferencesDTO' }

    # ── Memos ──

    MemoGenerateRequest:
      type: object
      required: [topic]
      properties:
        topic: { type: string }
        depth: { type: string, enum: [quick, deep] }

    MemoGenerateResponse:
      type: object
      required: [vaultFileId, markdown]
      properties:
        vaultFileId: { type: string, format: uuid }
        markdown: { type: string }

    MemoSummaryDTO:
      type: object
      required: [id, title, path, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        path: { type: string }
        createdAt: { type: string, format: date-time }
        summary: { type: string }

    MemoListResponse:
      type: object
      required: [memos]
      properties:
        memos:
          type: array
          items: { $ref: '#/components/schemas/MemoSummaryDTO' }

    SuggestionsResponse:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items: { type: string }

    # ── Vault ──

    VaultFileDTO:
      type: object
      required: [id, path, contentType, sizeBytes]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        sha256: { type: string }
        processedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        metadata: { $ref: '#/components/schemas/VaultNoteMetadataDTO' }

    # The note sidecar. Any markdown file can carry it; `isTodo` is what makes
    # a note a todo, and `enrichmentStatus` is set only on captured links.
    VaultNoteMetadataDTO:
      type: object
      properties:
        title: { type: string }
        tags:
          type: array
          items: { type: string }
        isTodo: { type: boolean }
        done: { type: boolean }
        dueAt: { type: string, format: date-time }
        # pending | done | failed. A captured link is written as a placeholder
        # and rewritten once the server has fetched the page.
        enrichmentStatus: { type: string }
        suggestedSpaceId:
          type: string
          format: uuid
          description: |
            A Space the server suggests for this unfiled capture
            (`capture.autoFile.enabled`). Only a suggestion: nothing moves until
            the user files it with `POST /v1/vault/files/move`. Absent once the
            file has a `spaceId`.

    VaultListResponse:
      type: object
      required: [files, limit]
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/VaultFileDTO' }
        limit: { type: integer }
        # Keyset cursor: pass back as `?before=` for the next page. Absent or
        # null means the listing is exhausted.
        nextBefore: { type: string, format: date-time, nullable: true }

    VaultUploadResponse:
      type: object
      required: [path, size, contentType, sha256]
      properties:
        path: { type: string }
        size: { type: integer }
        contentType: { type: string }
        sha256: { type: string }
        memoryId:
          type: string
          format: uuid
          description: |
            The memory a note upload (`note=true`) created or updated, for
            `GET /v1/memory/{id}/related`. Absent for plain files.

    VaultMoveRequest:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }

    # ── KB ──

    KBCompileRequest:
      type: object
      properties:
        vaultFileIds:
          type: array
          items: { type: string, format: uuid }
        forceFullRecompile: { type: boolean, default: false }

    KBCompileResponse:
      type: object
      required: [memoriesIngested, runId, pendingMemoryIds]
      properties:
        memoriesIngested: { type: integer }
        memoriesUpdated: { type: integer }
        durationMs: { type: integer }
        runId:
          type: string
          format: uuid
          description: |
            HER-288 — UUID correlation handle. Same value appears in every
            kb-compile WS progress event (`KBCompileProgressEvent`) emitted
            during this run.
        pendingMemoryIds:
          type: array
          items: { type: string, format: uuid }
          description: |
            HER-290 — IDs of the freshly-saved memories this run produced
            that are now awaiting approve/reject. Empty when the compile
