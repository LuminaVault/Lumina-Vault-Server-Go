openapi: '3.1.0'

# HER-224 — full API contract for LuminaVaultServer. Hand-written
# Hummingbird routes are authoritative for routing; this YAML is the
# documentation contract + the source for `swift-openapi-generator`
# `types` output (DTOs only). A contract test enforces parity between
# this file and the live router. See plan: cuddly-baking-cake.md.

info:
  title: LuminaVaultServer
  version: 0.1.0
  description: |
    The LuminaVault second-brain backend. Hummingbird + Postgres + pgvector.
    Every authenticated route requires `Authorization: Bearer <jwt>` unless
    explicitly marked otherwise. Admin routes require `Authorization: Bearer
    <admin-token>` (the `admin.token` env var). The RevenueCat webhook
    requires `Authorization: Bearer <revenuecat-webhook-secret>`.

  contact:
    name: LuminaVault
    url: https://github.com/LuminaVault/LuminaVaultServer

servers:
  - url: http://localhost:8080
    description: Local development.
  - url: https://api.luminavault.example
    description: Production (placeholder).

tags:
  - name: Root
  - name: Auth
  - name: Me
  - name: Settings
    description: Per-user config — currently BYO Hermes gateway (HER-217/223).
  - name: Hermes Runs
    description: >
      Agent runs on the tenant's own Hermes — start, follow live over SSE,
      approve or deny tool calls from a push notification, stop (Phase 1).
  - name: Self Improvement
    description: Tenant-scoped curator, SOUL review proposals, pinning, reports, and rollback.
  - name: Onboarding
  - name: Devices
    description: APNS / FCM device-token registration (HER-214).
  - name: Account
  - name: Billing
  - name: LLM
    description: Chat (HER-161/165), transcribe (HER-203), TTS (HER-204), vision/embed (HER-205).
  - name: Memory
  - name: Capture
    description: URL capture with async enrichment (HER-149).
  - name: Query
  - name: Conversations
    description: Multi-turn "thinking workspace" chat persistence (HER-37).
  - name: Memos
  - name: Vault
  - name: KB
    description: Knowledge-base compile (Hermes learning loop).
  - name: Import
    description: Feed Your Brain bulk import (links, bookmarks, files into Spaces).
  - name: Community
    description: Global community board shared across vaults, and the AI Daily Post.
  - name: Plugins
    description: Declarative plugin foundation — catalog, per-tenant installs, connector sync (HER-43).
  - name: Marketplace
    description: Public plugin discovery, publishing, moderation, ratings, and version-pinned installs.
  - name: Spaces
  - name: Teams
    description: Team membership, shared vault permissions, invitations, and activity.
  - name: Soul
    description: SOUL.md CRUD (HER-85).
  - name: Achievements
    description: Usage-driven unlocks (HER-196).
  - name: Health
    description: Health-data ingest (HER-146) + read (HER-202).
  - name: Skills
    description: Skills hub (HER-247), Today outputs (HER-177), Automations (HER-178).
  - name: Profiles
    description: Multi-Hermes-persona CRUD per user (HER-273).
  - name: WebSocket
  - name: Admin
  - name: Dashboard
    description: OS Shell home/dashboard surface (HER-244).
  - name: Agents
    description: The Agents page — where the user's agents run, their sessions and logs.
  - name: Analytics
    description: Vault-scoped usage intelligence, memory health, and recommendations.
  - name: Kanban
    description: Native Kanban boards, columns, and cards.
  - name: Calendar
    description: Google Calendar integration — OAuth connect, sync, events.

security:
  - bearerJWT: []

paths:

  # ──────────────────────────────── Root ────────────────────────────────

  /:
    get:
      tags: [Root]
      operationId: getHello
      summary: Hello.
      security: []
      responses:
        '200':
          description: Plaintext greeting.
          content:
            text/plain:
              schema: { type: string }

  /health:
    get:
      tags: [Root]
      operationId: getRootHealth
      summary: Readiness probe.
      security: []
      responses:
        '200':
          description: "ok"
          content:
            text/plain:
              schema: { type: string }

  /internal/metrics:
    get:
      tags: [Root]
      operationId: getInternalMetrics
      summary: Operator-only user count for the portfolio board (facorreia.com/apps).
      description: >-
        Guarded by the METRICS_SECRET shared secret presented as a Bearer token.
        Returns 404 when the secret is not configured, 401 when it does not match.
      security: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
          description: "`Bearer <METRICS_SECRET>`"
      responses:
        '200':
          description: Total registered users.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users: { type: integer }
        '401':
          description: Secret missing or wrong.
        '404':
          description: Endpoint disabled (no secret configured).

  # ──────────────────────────────── Auth ────────────────────────────────

  /v1/auth/register:
    post:
      tags: [Auth]
      operationId: authRegister
      summary: Email + password registration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: Account created, session token issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: Email + password login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session token issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: authRefresh
      summary: Exchange a refresh token for a new access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New access + refresh token pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: Revoke the active refresh token.
      responses:
        '204':
          description: Logged out.

  /v1/auth/mfa/verify:
    post:
      tags: [Auth]
      operationId: authMfaVerify
      summary: Verify a TOTP / OTP second factor.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MFAVerifyRequest' }
      responses:
        '200':
          description: Session token issued after second factor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/mfa/resend:
    post:
      tags: [Auth]
      operationId: authMfaResend
      summary: Re-send the MFA challenge.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MFAResendRequest' }
      responses:
        '204':
          description: Challenge re-sent.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: authForgotPassword
      summary: Start password-reset flow.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailOnlyRequest' }
      responses:
        '204':
          description: Reset email sent (idempotent).
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/resend-reset:
    post:
      tags: [Auth]
      operationId: authResendReset
      summary: Re-send the password-reset OTP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailOnlyRequest' }
      responses:
        '204':
          description: Reset OTP re-sent.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/reset-password:
    post:
      tags: [Auth]
      operationId: authResetPassword
      summary: Complete password reset with OTP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204':
          description: Password reset.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/email/send-verify:
    post:
      tags: [Auth]
      operationId: authEmailSendVerify
      summary: Send email-verification OTP to the authenticated user.
      responses:
        '204':
          description: Verification OTP sent.

  /v1/auth/email/confirm:
    post:
      tags: [Auth]
      operationId: authEmailConfirm
      summary: Confirm email with the verification OTP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailConfirmRequest' }
      responses:
        '204':
          description: Email confirmed.

  /v1/auth/oauth/apple/exchange:
    post:
      tags: [Auth]
      operationId: authOAuthAppleExchange
      summary: Exchange Apple Sign-In ID token for a LuminaVault session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthIDTokenRequest' }
      responses:
        '200':
          description: Session issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/oauth/google/exchange:
    post:
      tags: [Auth]
      operationId: authOAuthGoogleExchange
      summary: Exchange Google ID token for a LuminaVault session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthIDTokenRequest' }
      responses:
        '200':
          description: Session issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/oauth/x/exchange:
    post:
      tags: [Auth]
      operationId: authOAuthXExchange
      summary: Exchange X (Twitter) access token for a LuminaVault session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthAccessTokenRequest' }
      responses:
        '200':
          description: Session issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }

  /v1/auth/phone/start:
    post:
      tags: [Auth]
      operationId: authPhoneStart
      summary: Send SMS OTP to a phone number.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneStartRequest' }
      responses:
        '204':
          description: SMS sent.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/phone/verify:
    post:
      tags: [Auth]
      operationId: authPhoneVerify
      summary: Verify phone OTP, issue session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneVerifyRequest' }
      responses:
        '200':
          description: Session issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }

  /v1/auth/email/start:
    post:
      tags: [Auth]
      operationId: authEmailStart
      summary: Send magic-link OTP to email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailOnlyRequest' }
      responses:
        '204':
          description: Magic link sent.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/email/verify:
    post:
      tags: [Auth]
      operationId: authEmailVerify
      summary: Verify magic-link OTP, issue session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailMagicVerifyRequest' }
      responses:
        '200':
          description: Session issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }

  /v1/auth/webauthn/register/begin:
    post:
      tags: [Auth]
      operationId: authWebAuthnRegisterBegin
      summary: Begin WebAuthn passkey registration — returns PublicKeyCredentialCreationOptions.
      description: >-
        Authenticated. The credential is bound to the bearer token's user;
        `username` in the body is accepted for wire compatibility and must
        match that user, but is never used to look an account up.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebAuthnBeginRegistrationRequest' }
      responses:
        '200':
          description: PublicKeyCredentialCreationOptions JSON.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnOptions' }
        '401':
          description: Not authenticated.
        '403':
          description: Body `username` does not match the authenticated user.
        '503':
          description: WebAuthn disabled (WEBAUTHN_ENABLED=false).

  /v1/auth/webauthn/register/finish:
    post:
      tags: [Auth]
      operationId: authWebAuthnRegisterFinish
      summary: Finalise WebAuthn credential registration.
      description: >-
        Authenticated. See `authWebAuthnRegisterBegin` — the credential is
        bound to the bearer token's user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebAuthnFinish' }
      responses:
        '200':
          description: Credential registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnFinishRegistrationResponse' }
        '401':
          description: Not authenticated.
        '403':
          description: Body `username` does not match the authenticated user.

  /v1/auth/webauthn/authenticate/begin:
    post:
      tags: [Auth]
      operationId: authWebAuthnAuthenticateBegin
      summary: Begin WebAuthn passkey authentication — returns PublicKeyCredentialRequestOptions.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebAuthnAuthOptionsRequest' }
      responses:
        '200':
          description: PublicKeyCredentialRequestOptions JSON.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnOptions' }

  /v1/auth/webauthn/authenticate/finish:
    post:
      tags: [Auth]
      operationId: authWebAuthnAuthenticateFinish
      summary: Finalise WebAuthn authentication, issue session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebAuthnFinish' }
      responses:
        '200':
          description: Session issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }

  /v1/auth/webauthn/credentials:
    get:
      tags: [Auth]
      operationId: authWebAuthnListCredentials
      summary: List enrolled WebAuthn passkeys for the authenticated user.
      responses:
        '200':
          description: Credential summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnCredentialListResponse' }
        '401':
          description: Not authenticated.

  /v1/auth/webauthn/credentials/{credentialId}:
    delete:
      tags: [Auth]
      operationId: authWebAuthnDeleteCredential
      summary: Revoke a WebAuthn passkey for the authenticated user.
      parameters:
        - name: credentialId
          in: path
          required: true
          schema: { type: string }
          description: Base64url credential ID.
      responses:
        '204':
          description: Credential revoked.
        '404':
          description: Credential not found.

  # ──────────────────────────────── Me ──────────────────────────────────

  /v1/auth/me:
    get:
      tags: [Me]
      operationId: meGet
      summary: Get the authenticated user's profile.
      responses:
        '200':
          description: User profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }

  /v1/auth/me/privacy:
    put:
      tags: [Me]
      operationId: mePrivacyUpdate
      summary: Update privacy flags.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePrivacyRequest' }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }

  /v1/auth/me/billing:
    get:
      tags: [Me]
      operationId: meBilling
      summary: Tier + trial status + days remaining.
      responses:
        '200':
          description: Billing snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeBillingResponse' }

  /v1/me/today:
    get:
      tags: [Me]
      operationId: meToday
      summary: Widget + daily-review digest (HER-206).
      responses:
        '200':
          description: Today snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeTodayResponse' }
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/me/recap:
    get:
      tags: [Me]
      operationId: meRecap
      summary: What the user did over their last 7 or 30 local days.
      description: |
        Days are the user's own calendar days in `users.timezone`, oldest
        first, with empty days included. `previousTotals` is the same-length
        window just before, for deltas. `captures` are memories the user put
        in (notes, links, files, chat saves); `learned` are memories Lumina
        distilled (Sync & Learn, kept replies); `asked` are messages the user
        sent in chat; `reviewed` are memory reviews. `shareText` holds numbers
        only, never memory content.
      parameters:
        - name: range
          in: query
          required: false
          description: '`7d` (default) or `30d`. Anything else is a 400.'
          schema:
            type: string
            enum: [7d, 30d]
            default: 7d
      responses:
        '200':
          description: Recap for the range.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeRecapResponse' }
        '400':
          description: Range is not `7d` or `30d`.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/me/resurface:
    get:
      tags: [Me]
      operationId: meResurface
      summary: A few memories worth another look today.
      description: |
        Deterministic, no model call. Lanes are filled in priority order and
        deduped by memory: `due` (the user asked to see it again via
        `soon`/`later` on `POST /v1/memory/{id}/review` and that time has
        passed, oldest first), `onThisDay` (saved exactly a month, six months
        or a year ago — or this month/day two or more years ago — on the
        user's own calendar in `users.timezone`, longest ago first), and
        `fading` (a decision or preference not looked at for more than 30
        days, oldest first). Never returned: rejected or muted memories,
        model-made memories still pending approval, anything reviewed in the
        last 24 hours, and anything scheduled for a later review.
      parameters:
        - name: limit
          in: query
          required: false
          description: 1 to 10 (default 3). Anything else is a 400.
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 3
      responses:
        '200':
          description: Up to `limit` memories, in lane order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResurfaceResponse' }
        '400':
          description: Limit is not an integer between 1 and 10.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/me/learned:
    get:
      tags: [Me]
      operationId: meLearned
      summary: What Lumina learned about the user and is waiting for them to confirm.
      description: |
        Deterministic, no model call. `soulChanges` are proposed SOUL.md
        changes (`kind: soul`, still `pending`), and `memories` are
        preference and decision memories still `pending` or `auto` — never
        rejected, never already approved — both created since `since`, newest
        first, at most 20 each. Keep / edit / forget go through the existing
        endpoints: `PATCH /v1/memory/{id}`, `DELETE /v1/memory/{id}` and
        `POST /v1/me/improvement/changes/{id}/approve|reject`.

        The weekly "What I learned this week" push (Sunday 18:00 local, at
        most once a week, only when this is non-empty) opens
        `luminavault://learned`, which reads this endpoint.
      parameters:
        - name: since
          in: query
          required: false
          description: |
            ISO 8601 date-time, with or without fractional seconds. Default
            seven days ago. In the future, more than 90 days ago, or not a
            date is a 400.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The digest; both lists may be empty.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearnedDigestResponse' }
        '400':
          description: "`since` is not a date-time, is in the future, or is more than 90 days ago."
        '401':
          description: Missing or invalid token.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/me/commitments:
    get:
      tags: [Me]
      operationId: meCommitmentsList
      summary: The user's commitments (open loops kb-compile found in their notes).
      description: |
        First-person promises ("I'll…", "I need to…", "I promised…") that
        kb-compile extracted from the user's own notes. Deterministic read, no
        model call. Open ones come due first (soonest), then oldest; done and
        dropped ones most recently closed first. At most 200.

        Up to three open ones ride in the daily brief's "Open loops" card,
        each in at most three briefs (`surfacedCount`); after that they live
        only here.
      parameters:
        - name: state
          in: query
          required: false
          description: Which commitments to list. Default `open`; anything else is a 400.
          schema:
            type: string
            enum: [open, done, dropped, all]
            default: open
      responses:
        '200':
          description: The commitments; may be empty.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommitmentsResponse' }
        '400':
          description: "`state` is not open, done, dropped or all."
        '401':
          description: Missing or invalid token.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/me/commitments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Me]
      operationId: meCommitmentUpdate
      summary: Mark a commitment done, dropped, or open again.
      description: |
        `done` and `dropped` stamp `doneAt`; `open` clears it. Done and
        dropped commitments never appear in a brief again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitmentUpdateRequest' }
      responses:
        '200':
          description: The updated commitment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommitmentDTO' }
        '400':
          description: Invalid id, or `state` is not open, done or dropped.
        '401':
          description: Missing or invalid token.
        '404':
          description: No such commitment for this user (another user's id is a 404 too).
        '409':
          description: Reopening it would duplicate a commitment that is already open with the same text.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/me/brief:
    get:
      tags: [Me]
      operationId: meBrief
      summary: The day's brief as cards, with a why on each and an end.
      description: |
        Written when the `daily-brief` skill runs (07:00 local by default).
        Deterministic cards first — `today` (calendar), `openLoops` (≤3
        open commitments), `toRevisit` (one resurfaced memory), `learned`
        (while the "What I learned" digest has something waiting) — then the
        skill's own sections (`weather`, `inbox`, `onYourMind`, `other`).
        Empty cards are left out. A card kind the user marked down (net
        up − down − dismiss ≤ −2 over 14 days) moves to the bottom.

        One brief per local day; re-running the skill the same day replaces
        the cards and keeps the brief's id. The daily-brief chat message and
        its quiet push open `luminavault://brief`, which reads this endpoint.
      parameters:
        - name: date
          in: query
          required: false
          description: Local day `yyyy-MM-dd`. Default today in the user's timezone. Not a real day is a 400.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: "The brief, or `{\"brief\": null}` when there is none for that day (not a 404)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeBriefResponse' }
        '400':
          description: "`date` is not `yyyy-MM-dd`."
        '401':
          description: Missing or invalid token.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/me/brief/{briefId}/cards/{cardId}/feedback:
    parameters:
      - name: briefId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: cardId
        in: path
        required: true
        description: The card's `id` within that brief (e.g. `weather`, `openLoops`).
        schema: { type: string, maxLength: 64 }
    post:
      tags: [Me]
      operationId: meBriefCardFeedback
      summary: React to one card of a brief (up, down or dismiss).
      description: |
        One reaction per card per brief; a second one replaces the first.
        Feeds the ordering of later briefs (see `GET /v1/me/brief`). A
        `down` on a `toRevisit` card also means "later" for its memory: the
        same 30-day snooze as `POST /v1/memory/{id}/review` with
        `{"action": "later"}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BriefCardFeedbackRequest' }
      responses:
        '204':
          description: Recorded.
        '400':
          description: Invalid brief id, card id or action.
        '401':
          description: Missing or invalid token.
        '404':
          description: No such brief for this user, or no such card in it.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/me/recap/period:
    get:
      tags: [Me]
      operationId: mePeriodRecap
      summary: The user's year or month in review, as a deck of cards.
      description: |
        Counts follow `/v1/me/recap`: `captures` are memories the user put
        in, `learned` memories Lumina distilled, and `messagesSent` the
        user's chat messages. Days, weekdays and hours are local to
        `users.timezone`. A running period covers up to today
        (`isComplete=false`) and is compared with the same stretch one
        period earlier.

        `order` is the deck to play; clients skip kinds they do not know and
        kinds whose card is absent. `available=false` comes with an
        `unavailableReason` and no cards.

        `themes` is the one card written by a model. The first view returns
        `status=pending` with a counted `fallbackSentence`, and the response
        is `Cache-Control: no-cache` so a later fetch picks up the written
        card. `shareText` holds numbers only, never memory content.
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [year, month]
            default: year
        - name: year
          in: query
          required: false
          description: Four-digit year. Defaults to the current local year.
          schema: { type: integer, minimum: 2000, maximum: 9999 }
        - name: month
          in: query
          required: false
          description: 1–12, only with `period=month`. Defaults to the current local month.
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: The recap, or `available=false` with a reason.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodRecapResponse' }
        '400':
          description: Unknown period, a bad year or month, or `month` with `period=year`.
        '429':
          $ref: '#/components/responses/RateLimited'

  # ────────────────── Dashboard — OS Shell Home (HER-244) ───────────────

  # ───────────────────────── Me — Suggestions (HER-37) ──────────────────

  /v1/me/location:
    get:
      tags: [Me]
      operationId: meLastKnownLocation
      summary: The location fix kept for offline scheduled jobs.
      description: |
        Whenever a live device location read succeeds (the `location_recent`
        or `weather_forecast` tools), the server keeps that one fix so a
        scheduled job — the 07:00 weather check — still works while the phone
        is asleep. It is overwritten, never a history, used only while
        Location access is on, and cleared when Location access is turned off.
      responses:
        '200':
          description: The stored fix, or `cached=false`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LastKnownLocationResponse' }
    delete:
      tags: [Me]
      operationId: meForgetLastKnownLocation
      summary: Forget the kept location fix.
      responses:
        '204':
          description: Forgotten.

  /v1/me/suggestions:
    get:
      tags: [Me]
      operationId: meSuggestions
      summary: Context-aware natural-language query suggestions (HER-37).
      responses:
        '200':
          description: Suggestions list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestionsResponse' }
        '429':
          $ref: '#/components/responses/RateLimited'

  # ─────────────────── Skills (HER-247 / HER-177 / HER-178) ────────────

  /v1/skills:
    get:
      tags: [Skills]
      operationId: skillsList
      summary: List skills + per-tenant state for the Skills hub (HER-247).
      responses:
        '200':
          description: Skill list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillListResponse' }

  /v1/apple/consent:
    get:
      tags: [Apple]
      operationId: appleConsentGet
      summary: Per-domain Apple data-access consent snapshot.
      responses:
        '200':
          description: Consent snapshot (every domain; absent = not allowed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppleConsentResponse' }
    put:
      tags: [Apple]
      operationId: appleConsentPut
      summary: Set one domain's consent; disallow purges the synced server copy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppleConsentUpdateRequest' }
      responses:
        '200':
          description: Updated snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppleConsentResponse' }

  /v1/photos/index:
    post:
      tags: [Apple]
      operationId: photosIndex
      summary: Ingest derived photo text (OCR + scene tags + metadata) into the semantic index.
      description: >
        Apple Photos derived-text index. Privacy-critical: only OCR text,
        on-device scene tags, and metadata are accepted — never pixel data.
        Consent-gated on the `photos` domain. Each item is embedded and
        upserted by `assetLocalID` (PHAsset localIdentifier).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhotoIndexSyncRequest' }
      responses:
        '200':
          description: Per-batch insert/update/skip counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppleSyncResponse' }
        '403':
          description: Photos access not allowed by the user.

  /v1/calendar/sync:
    post:
      tags: [Apple]
      operationId: appleCalendarSync
      summary: Batch-upsert Apple Calendar (EventKit) event deltas into the server cache.
      description: >-
        Promotes Calendar from on-demand device-RPC to a persisted server cache
        (`calendar_events`, source `apple_eventkit`) that the `calendar_query`
        Hermes tool reads in the background. Consent-gated on the `calendar`
        domain. Upsert key is `(tenant_id, source, external_id)`; last-writer-wins
        on `remoteUpdatedAt`. Cancelled events are tombstoned, not deleted.
        `attendees` replaces the stored attendees when present (an empty array
        clears them) and leaves them alone when absent, so an older client
        does not wipe them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppleCalendarSyncRequest' }
      responses:
        '200':
          description: Sync result counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppleSyncResponse' }
        '403':
          description: Calendar access not allowed by the user.

  /v1/jobs/detect:
    post:
      tags: [Skills]
      operationId: jobsDetect
      summary: Classify a chat message for recurring-job intent (Lumina Jobs P3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties: { text: { type: string } }
      responses:
        '200':
          description: Job proposal (isJob=false when not a recurring job).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobProposalDTO' }

  /v1/jobs:
    post:
      tags: [Skills]
      operationId: jobsCreate
      summary: Create a scheduled job (authored as a vault cron skill).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobCreateRequest' }
      responses:
        '200':
          description: The created job, as a SkillDTO.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillDTO' }

  /v1/workflows:
    get:
      tags: [Workflows]
      operationId: workflowsList
      summary: List the tenant's visual workflows.
      responses:
        '200':
          description: Workflow summaries.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowListResponse' } } }
    post:
      tags: [Workflows]
      operationId: workflowsCreate
      summary: Create a workflow draft.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowCreateRequest' } } }
      responses:
        '200':
          description: Created workflow.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDetailDTO' } } }
        '402':
          description: Workflow creation requires Pro or Ultimate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaywallResponse' }

  /v1/workflows/{id}:
    get:
      tags: [Workflows]
      operationId: workflowsGet
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Workflow draft., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDetailDTO' } } } }

  /v1/workflows/{id}/draft:
    put:
      tags: [Workflows]
      operationId: workflowsUpdateDraft
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDraftUpdateRequest' } } } }
      responses:
        '200': { description: Updated draft., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDetailDTO' } } } }
        '409': { description: Draft revision conflict. }

  /v1/workflows/{id}/publish:
    post:
      tags: [Workflows]
      operationId: workflowsPublish
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Published immutable version., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDetailDTO' } } } }

  /v1/workflows/validate:
    post:
      tags: [Workflows]
      operationId: workflowValidate
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDefinitionDTO' } } } }
      responses:
        '200': { description: Validation result., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowValidationResponse' } } } }

  /v1/workflows/limits:
    get:
      tags: [Workflows]
      operationId: workflowLimits
      responses:
        '200': { description: Tier capacity and managed-inference allowance., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowLimitsDTO' } } } }

  /v1/workflows/{id}/webhook/rotate:
    post:
      tags: [Workflows]
      operationId: workflowWebhookRotate
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: New write-only webhook credential., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowWebhookCredentialDTO' } } } }

  /v1/workflow-hooks/{hookID}:
    post:
      tags: [Workflows]
      operationId: workflowWebhookIngest
      security: []
      parameters:
        - { in: path, name: hookID, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-Lumina-Timestamp, required: true, schema: { type: string } }
        - { in: header, name: X-Lumina-Signature, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: Queued or previously queued run., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRunDTO' } } } }
        '401': { description: Invalid signature or replay window. }

  /v1/workflows/{id}/runs:
    get:
      tags: [Workflows]
      operationId: workflowRunsList
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Workflow run history., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRunsResponse' } } } }
    post:
      tags: [Workflows]
      operationId: workflowRunCreate
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRunRequest' } } } }
      responses:
        '200': { description: Queued run., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRunDTO' } } } }

  /v1/workflows/runs:
    get:
      tags: [Workflows]
      operationId: workflowRunsAll
      responses:
        '200': { description: Tenant run history., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRunsResponse' } } } }

  /v1/workflows/runs/{runID}:
    get:
      tags: [Workflows]
      operationId: workflowRunGet
      parameters: [{ in: path, name: runID, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Run detail., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRunDTO' } } } }

  /v1/workflows/runs/{runID}/events:
    get:
      tags: [Workflows]
      operationId: workflowRunEvents
      parameters:
        - { in: path, name: runID, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: after, required: false, schema: { type: integer, format: int64, default: 0 } }
      responses:
        '200': { description: Persisted replayable run events., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRunEventsResponse' } } } }

  /v1/workflows/runs/{runID}/events/stream:
    get:
      tags: [Workflows]
      operationId: workflowRunEventsStream
      parameters:
        - { in: path, name: runID, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Last-Event-ID, required: false, schema: { type: integer, format: int64 } }
        - { in: query, name: after, required: false, schema: { type: integer, format: int64, default: 0 } }
      responses:
        '200': { description: Replay followed by live Server-Sent Events., content: { text/event-stream: { schema: { type: string } } } }

  /v1/workflows/runs/{runID}/cancel:
    post:
      tags: [Workflows]
      operationId: workflowRunCancel
      parameters: [{ in: path, name: runID, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Run cancelled or already terminal. }
        '404': { description: Workflow run not found. }

  /v1/workflows/runs/{runID}/retry:
    post:
      tags: [Workflows]
      operationId: workflowRunRetry
      parameters: [{ in: path, name: runID, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: New queued run., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRunDTO' } } } }

  /v1/workflows/runs/{runID}/resume:
    post:
      tags: [Workflows]
      operationId: workflowRunResume
      parameters: [{ in: path, name: runID, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Paused run re-queued., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRunDTO' } } } }

  /v1/workflows/{id}/versions:
    get:
      tags: [Workflows]
      operationId: workflowVersionsList
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Immutable published versions., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowVersionsResponse' } } } }

  /v1/workflows/{id}/versions/{version}/restore:
    post:
      tags: [Workflows]
      operationId: workflowVersionRestore
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: version, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Version copied into a new draft revision., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDetailDTO' } } } }

  /v1/workflow-templates:
    get:
      tags: [Workflows]
      operationId: workflowTemplatesList
      responses:
        '200': { description: Curated first-party templates., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowTemplatesResponse' } } } }

  /v1/workflow-templates/{templateID}/instantiate:
    post:
      tags: [Workflows]
      operationId: workflowTemplateInstantiate
      parameters: [{ in: path, name: templateID, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowTemplateInstantiateRequest' } } } }
      responses:
        '200': { description: Workflow draft created from template., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDetailDTO' } } } }

  /v1/workflow-templates/{templateID}/runs:
    post:
      tags: [Workflows]
      operationId: workflowTemplateRun
      parameters: [{ in: path, name: templateID, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRunRequest' } } } }
      responses:
        '200': { description: "Template instantiated, published, and queued.", content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRunDTO' } } } }

  /v1/workflows/approvals:
    get:
      tags: [Workflows]
      operationId: workflowApprovalsList
      responses:
        '200': { description: Pending approvals., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowApprovalsResponse' } } } }

  /v1/workflows/approvals/{approvalID}/decision:
    post:
      tags: [Workflows]
      operationId: workflowApprovalDecide
      parameters: [{ in: path, name: approvalID, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowApprovalDecisionRequest' } } } }
      responses:
        '204': { description: Decision accepted. }

  /v1/skills/{name}:
    patch:
      tags: [Skills]
      operationId: skillPatch
      summary: Toggle enable/disable, set schedule override, or pick APNS category (HER-247 / HER-178).
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillPatchRequest' }
      responses:
        '200':
          description: Updated skill snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillDTO' }
        '400':
          description: Invalid cron expression or category.
        '404':
          description: Skill not found.

  /v1/skills/{name}/runs:
    get:
      tags: [Skills]
      operationId: skillRuns
      summary: Paginated run history + 14-day sparkline for the Skills hub detail view (HER-247).
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Run history + sparkline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillRunsResponse' }

  /v1/skills/outputs:
    get:
      tags: [Skills]
      operationId: skillOutputs
      summary: Today-tab skill outputs feed (HER-177) — local skill runs and collected Hermes job runs, newest first.
      description: |
        Unions `skill_run_log` runs that produced markdown with the
        `hermes_job_runs` collected from the tenant's Hermes (Phase 2), newest
        first. Hermes runs are mirrored into `skill_run_log` for the skill
        surfaces; the feed reads them from the job-runs side instead, which
        also carries `vaultFilePath`. A failed run with no markdown falls back
        to its error text. `since` and `before` are both exclusive; page
        backwards by passing the previous response's `nextCursor` as `before`
        (present only when the page was full).
      parameters:
        - in: query
          name: since
          required: false
          description: Exclusive lower bound — return only outputs newer than this.
          schema: { type: string, format: date-time }
        - in: query
          name: before
          required: false
          description: Exclusive upper bound — the previous page's `nextCursor`.
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Outputs feed + streak + active-run flag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillOutputListResponse' }

  /v1/me/apns-categories:
    get:
      tags: [Me]
      operationId: apnsPrefsGet
      summary: Per-tenant APNS category opt-out (HER-179).
      responses:
        '200':
          description: Current preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APNSCategoryPrefsResponse' }
    put:
      tags: [Me]
      operationId: apnsPrefsPut
      summary: Update per-tenant APNS category opt-out (HER-179).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/APNSCategoryPrefsPutRequest' }
      responses:
        '200':
          description: Updated preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APNSCategoryPrefsResponse' }

  /v1/sessions:
    get:
      tags: [Dashboard]
      operationId: sessionsList
      summary: List chat-history sessions for the OS Shell Sessions tab (HER-245 / HER-259).
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: workspace
          required: false
          description: HER-261 — scope to a single Workspace (Space) ID.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Session list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionListResponse' }

  /v1/agents/instances:
    get:
      tags: [Agents]
      operationId: agentsInstances
      summary: Where the caller's agents run — LuminaVault's own agent and their BYO Hermes.
      description: |
        `central` is always present. `byo` appears when the caller has linked
        their own Hermes gateway; its `status` is `outdated` for a Hermes too
        old to list profiles and `unreachable` when it does not answer.
      responses:
        '200':
          description: Agent instances.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentInstancesResponse' }

  /v1/agents/sessions:
    get:
      tags: [Agents]
      operationId: agentsSessions
      summary: Sessions across every agent and profile, newest activity first.
      description: |
        `central` sessions are the caller's own conversations. `byo` sessions
        come from the caller's Hermes gateway, every profile on that machine.
        An instance that cannot be read is listed in `errors`; the rest of
        the list still returns.
      parameters:
        - in: query
          name: instance
          required: false
          schema: { type: string, enum: [central, byo] }
        - in: query
          name: profile
          required: false
          description: Hermes profile name. Never matches `central`.
          schema: { type: string }
        - in: query
          name: source
          required: false
          description: Where the conversation happened — `app`, `telegram`, `discord`, `cron`, …
          schema: { type: string }
        - in: query
          name: live
          required: false
          description: Only sessions open with activity in the last five minutes.
          schema: { type: boolean, default: false }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Sessions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSessionsResponse' }
        '400':
          description: Unknown `instance`.

  /v1/agents/instances/{instance}/sessions/{session}/messages:
    get:
      tags: [Agents]
      operationId: agentsSessionMessages
      summary: One session's log — messages, tool calls and tool results.
      parameters:
        - in: path
          name: instance
          required: true
          schema: { type: string, enum: [central, byo] }
        - in: path
          name: session
          required: true
          schema: { type: string }
        - in: query
          name: profile
          required: false
          description: Hermes profile holding the session. Omit for `central` and for older Hermes.
          schema: { type: string }
      responses:
        '200':
          description: The session's messages, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSessionMessagesResponse' }
        '400':
          description: A session id or profile that cannot be a path segment.
        '404':
          description: No such instance or session for the caller.
        '502':
          description: The caller's Hermes could not be read.

  /v1/agents/room-candidates:
    get:
      tags: [Agents]
      operationId: agentsRoomCandidates
      summary: Agents the caller can seat in a room — each LuminaVault persona, and their own Hermes when linked.
      responses:
        '200':
          description: Candidates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRoomCandidatesResponse' }

  /v1/agents/rooms:
    get:
      tags: [Agents]
      operationId: agentsRoomsList
      summary: The caller's agent rooms, most recently active first.
      responses:
        '200':
          description: Rooms.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRoomsResponse' }
    post:
      tags: [Agents]
      operationId: agentsRoomsCreate
      summary: Create a room with 1–8 of the caller's agents.
      description: |
        Members must come from `/v1/agents/room-candidates`. Handles are
        unique in the room and match `^[a-z0-9][a-z0-9_-]{0,30}$`. The
        caller's own Hermes can hold one seat.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentRoomCreateRequest' }
      responses:
        '200':
          description: The new room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRoomDetailResponse' }
        '400':
          description: Invalid title, member count, member, or handle.

  /v1/agents/rooms/{room}:
    get:
      tags: [Agents]
      operationId: agentsRoomsGet
      summary: A room and its latest 200 messages, oldest first.
      parameters:
        - { in: path, name: room, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRoomDetailResponse' }
        '404':
          description: No such room for the caller.
    delete:
      tags: [Agents]
      operationId: agentsRoomsDelete
      summary: Delete a room and its messages.
      parameters:
        - { in: path, name: room, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Deleted.
        '404':
          description: No such room for the caller.

  /v1/agents/rooms/{room}/messages:
    post:
      tags: [Agents]
      operationId: agentsRoomsPost
      summary: Post as the user and stream the agent turns it starts.
      description: |
        Server-sent events, `event: agent.room`, each an `AgentRoomStreamEvent`:
        the user's message, then `thinking` and `message` per agent turn, then
        `done` with why the chain ended. Whoever the message names as
        `@handle` answers; an unaddressed message goes to members set to
        `every_human_message`. An agent reply that names another member hands
        the turn over. At most 6 agent replies per post, never the same agent
        twice in a row, and never past the room's token budget. Closing the
        stream ends the chain before the next agent turn.
      parameters:
        - { in: path, name: room, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentRoomPostRequest' }
      responses:
        '200':
          description: The chain, as it happens.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/AgentRoomStreamEvent' }
        '400':
          description: Empty or over-long message.
        '404':
          description: No such room for the caller.
        '409':
          description: A chain is already running in this room.

  /v1/agents/rooms/{room}/stop:
    post:
      tags: [Agents]
      operationId: agentsRoomsStop
      summary: Stop the running chain after the agent turn in flight.
      parameters:
        - { in: path, name: room, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: Stop recorded.
        '404':
          description: No such room for the caller.

