        - name: featured
          in: query
          required: false
          description: When true, returns only Featured marketplace entries.
          schema: { type: boolean }
        - name: premium
          in: query
          required: false
          description: When true, returns only premium (paid-tier) entries.
          schema: { type: boolean }
      responses:
        '200':
          description: Catalog entries (connectors + LV predefined skills).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginCatalogListResponse' }

  /v1/plugins/hermes-skills:
    get:
      tags: [Plugins]
      operationId: pluginHermesSkills
      summary: Read-only list of skills installed in the tenant's Hermes agent.
      description: |
