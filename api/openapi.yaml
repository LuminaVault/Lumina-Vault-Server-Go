      properties:
        hitRate: { type: number, format: double, minimum: 0, maximum: 1, description: Share of retrieval events whose results were used/grounded. Absent when no events. }
        meanTopDistance: { type: number, format: double, minimum: 0, description: Mean cosine distance of the best hit per retrieval (lower = closer). }
        eventsCount: { type: integer, minimum: 0 }
        leakCount: { type: integer, minimum: 0, description: Open leaks from the latest weekly leak report. }
        trend: { type: string, enum: [improving, steady, declining] }

    UsageSummaryResponse:
      type: object
      required: [llmTokensIn, llmTokensOut, embeddingTokens, sessionsCount, estimatedCostCents, periodStart, periodEnd]
      description: Month-to-date usage analytics for the caller.
      properties:
        llmTokensIn: { type: integer, minimum: 0 }
        llmTokensOut: { type: integer, minimum: 0 }
        embeddingTokens: { type: integer, minimum: 0 }
        sessionsCount: { type: integer, minimum: 0 }
        estimatedCostCents: { type: integer, minimum: 0, description: Coarse blended estimate, not billing-accurate. }
        voice: { $ref: '#/components/schemas/VoiceUsageSummary' }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }

    VoiceUsageSummary:
      type: object
      required: [calls, failedCalls, audioMinutes, realCostCents, imputedCostCents, byChannel]
      description: >-
        Speech-to-text usage for the period, from the per-request usage_events
        rows. Absent when the caller has transcribed nothing — an empty block
        of zeroes would imply a feature that ran and did nothing.
      properties:
        calls: { type: integer, minimum: 0 }
        failedCalls:
          type: integer
          minimum: 0
          description: >-
            Attempts whose outcome was not "ok". Counted because metering only
            successes makes a failing provider look like a drop in demand.
        audioMinutes: { type: number, minimum: 0 }
        realCostCents:
          type: integer
          minimum: 0
          description: >-
            Money actually spent. Zero while transcription runs on the
            cluster's own whisper, which bills nothing per request.
        imputedCostCents:
          type: integer
          minimum: 0
          description: >-
            What the same audio would have cost at a hosted provider's
            published rate, when one is configured. Not money owed, and never
            to be added to realCostCents — it is the self-hosting saving.
        byChannel:
          type: array
          items: { $ref: '#/components/schemas/VoiceChannelUsage' }

    VoiceChannelUsage:
      type: object
      required: [channel, calls, failedCalls, audioMinutes, realCostCents, imputedCostCents]
      properties:
        channel:
          type: string
          description: >-
            Platform the audio arrived on — telegram, discord, app, or
            "unknown" when the client did not say. See the X-Lumina-Channel
            request header.
          example: telegram
        calls: { type: integer, minimum: 0 }
        failedCalls: { type: integer, minimum: 0 }
        audioMinutes: { type: number, minimum: 0 }
        realCostCents: { type: integer, minimum: 0 }
        imputedCostCents: { type: integer, minimum: 0 }

