      properties:
        provider: { $ref: '#/components/schemas/ProviderID' }
        model: { type: string }
        displayName: { type: string }
        taskQuality:
          type: object
          additionalProperties: { type: integer }
        inputPerMillionUsdMicros: { type: integer, format: int64 }
        outputPerMillionUsdMicros: { type: integer, format: int64 }
        defaultLatencyMs: { type: integer }
        capabilities:
          type: array
          items: { type: string }

    RouterCatalogResponse:
      type: object
      required: [models, taskTypes, surfaces, customProfilesAllowed, ensemblesAllowed]
      properties:
        models:
          type: array
          items: { $ref: '#/components/schemas/RouterModelCatalogEntryDTO' }
        taskTypes:
          type: array
          items: { $ref: '#/components/schemas/RouterTaskType' }
        surfaces:
          type: array
          items: { $ref: '#/components/schemas/RouterSurface' }
        customProfilesAllowed: { type: boolean }
        ensemblesAllowed: { type: boolean }

    RouterDashboardResponse:
      type: object
      required: [periodStart, periodEnd, requests, successfulRequests, fallbackCount, tokensIn, tokensOut, estimatedCostUsdMicros, averageLatencyMs]
      properties:
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        requests: { type: integer }
        successfulRequests: { type: integer }
        fallbackCount: { type: integer }
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        estimatedCostUsdMicros: { type: integer, format: int64 }
        averageLatencyMs: { type: integer }
        monthlySoftLimitUsdMicros: { type: integer, format: int64 }
        monthlyHardLimitUsdMicros: { type: integer, format: int64 }

    RouterEventPhase:
      type: string
      enum: [selected, attemptStarted, synthesisStarted, completed]

    RouterRoutingEventDTO:
      type: object
      required: [executionID, phase, profileID, profileName, taskType, strategy, activeRoutes]
      properties:
        executionID: { type: string, format: uuid }
        phase: { $ref: '#/components/schemas/RouterEventPhase' }
        profileID: { type: string, format: uuid }
        profileName: { type: string }
        taskType: { $ref: '#/components/schemas/RouterTaskType' }
        strategy: { $ref: '#/components/schemas/RouterActionKind' }
        activeRoutes:
          type: array
          items: { $ref: '#/components/schemas/RouterModelRouteDTO' }
        displayLabel:
          type: string
          description: >-
            Generic routing label for managed tenants (e.g. "Auto · coding").
            When present and activeRoutes is empty, clients must render this
            instead of any provider/model identity.
        promptTokens:
          type: integer
          nullable: true
          description: |
            Size of the assembled prompt. This is what makes a live context
            gauge possible: `routing` is the only event that fires BEFORE
            tokens stream, so it is the only source of a live numerator —
            `usage` arrives once the answer is already finished.

            Absent means the server could not count it. Clients must then
            show the receipt and no gauge, never a percentage inferred from
            the previous turn.
        contextWindowTokens:
          type: integer
          nullable: true
          description: |
            The routed model's context window. Clients can look this up from
            their model catalogue; this covers a model the catalogue has not
            caught up with. Stripped for managed tenants, because a window
            size is a model fingerprint.
        droppedHistoryTurns:
          type: integer
          nullable: true
          description: |
            Earlier turns dropped to fit the window. Makes silent history
            trimming visible instead of leaving the user wondering why the
            assistant forgot something.

    RouterUsageDTO:
      type: object
      required: [executionID, tokensIn, tokensOut, estimatedCostUsdMicros, latencyMs, usageEstimated]
      properties:
        executionID: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/ProviderID' }
        model: { type: string }
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        estimatedCostUsdMicros: { type: integer, format: int64 }
        latencyMs: { type: integer }
        usageEstimated: { type: boolean }
        contextWindowTokens:
          type: integer
          nullable: true
          description: >-
            Same denominator the live gauge used, so the end-of-turn receipt
            agrees with it. Stripped for managed tenants.
        toolCallCount:
          type: integer
          nullable: true
          description: >-
            Tools this turn actually ran, so the receipt shows a real count
            rather than one recovered from persisted messages after a reload.

    ConnectionKind:
      type: string
      enum: [llm_provider, hermes_server, hermes_gateway, linked_account, calendar, nous, plugin, server]

    ConnectionHealth:
      type: string
      enum: [connected, needs_setup, degraded, error, unknown, testing]

    ConnectionActionHint:
      type: string
      enum:
        - configure_provider
        - configure_hermes
        - configure_gateway
        - connect_account
        - open_plugin
        - open_server_settings
        - view_diagnostics

    AgentClientKind:
      type: string
      enum: [claude_code, codex, hermes, other]

    AgentConnectionAccess:
      type: string
      description: |
        `read` keys can only call MCP tools that change nothing; `read_write`
        keys can also call the tools that write. Keys issued before this
        field existed were migrated to `read_write`.
      enum: [read, read_write]

    AgentConnectionDTO:
      type: object
