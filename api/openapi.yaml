            "Nothing in your notes matches this meeting yet".

    RecapTotalsDTO:
      type: object
      required: [captures, learned, asked, reviewed, activeDays, streakDays]
      properties:
        captures: { type: integer }
        learned: { type: integer }
        asked: { type: integer }
        reviewed: { type: integer }
        activeDays: { type: integer }
        streakDays: { type: integer }
    RecapDayDTO:
      type: object
      required: [date, captures, learned, asked, reviewed]
      properties:
        date: { type: string, format: date, description: 'Local day, `yyyy-MM-dd`.' }
        captures: { type: integer }
        learned: { type: integer }
        asked: { type: integer }
        reviewed: { type: integer }
    RecapKindsDTO:
      type: object
      required: [preference, decision, fact, note]
      properties:
        preference: { type: integer }
        decision: { type: integer }
        fact: { type: integer }
        note: { type: integer }
    RecapHighlightKind:
      type: string
      enum: [decision, preference, achievement, mostRevisited]
      description: Clients must read an unknown value as `unknown`.
    RecapHighlightDTO:
      type: object
      required: [kind, refId, title, date]
      properties:
        kind: { $ref: '#/components/schemas/RecapHighlightKind' }
        refId: { type: string, description: 'A memory id, or an achievement key for `achievement`.' }
        title: { type: string }
        date: { type: string, format: date-time }
    MeRecapResponse:
      type: object
      required: [range, start, end, timezone, totals, previousTotals, daily, kinds, highlights, shareText]
      properties:
        range: { type: string, enum: [7d, 30d] }
        start: { type: string, format: date, description: 'First local day of the range, `yyyy-MM-dd`.' }
        end: { type: string, format: date, description: 'Last local day (today), `yyyy-MM-dd`.' }
        timezone: { type: string, description: 'IANA zone the days are cut in.' }
        totals: { $ref: '#/components/schemas/RecapTotalsDTO' }
        previousTotals: { $ref: '#/components/schemas/RecapTotalsDTO' }
        daily:
          type: array
          description: One entry per local day, oldest first, zero days included.
          items: { $ref: '#/components/schemas/RecapDayDTO' }
        kinds: { $ref: '#/components/schemas/RecapKindsDTO' }
        highlights:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/RecapHighlightDTO' }
        shareText: { type: string, description: 'Numbers only, never memory content.' }

    RecapPeriodKind:
      type: string
      enum: [year, month]
    RecapUnavailableReason:
      type: string
      enum: [periodInFuture, beforeAccount, notEnoughActivity]
      description: Clients must read an unknown value as `unknown`.
    RecapCardKind:
      type: string
      enum: [intro, captures, peak, rhythm, topics, chats, skills, streak, achievements, themes, summary]
      description: Clients must skip an unknown value.
    RecapPersona:
      type: string
      enum: [earlyBird, daytime, evening, nightOwl, balanced]
      description: |
        The band with the most activity per hour: earlyBird 05–09,
        daytime 10–16, evening 17–21, nightOwl 22–04; balanced under ten
        events. Clients must read an unknown value as `unknown`.
    RecapThemesStatus:
      type: string
      enum: [ready, pending, fallback, disabled]
      description: Clients must read an unknown value as `unknown`.
    RecapCountDTO:
      type: object
      required: [label, count]
      properties:
        label: { type: string }
        count: { type: integer }
    RecapBucketDTO:
      type: object
      required: [key, count]
      properties:
        key: { type: string, description: '`yyyy-MM` in a year recap, `yyyy-MM-dd` in a month recap.' }
        count: { type: integer }
    RecapFirstCaptureDTO:
      type: object
      required: [memoryId, date, title]
      properties:
        memoryId: { type: string, format: uuid }
        date: { type: string, format: date }
        title: { type: string, description: 'First line of the memory. App only, never the share card.' }
    RecapCapturesCardDTO:
      type: object
      required: [captures, learned, previousCaptures, previousLearned, series, byKind]
      properties:
        captures: { type: integer }
        learned: { type: integer }
        previousCaptures: { type: integer }
        previousLearned: { type: integer }
        series:
          type: array
          description: Captures + learned per month (year) or day (month), zero buckets included, oldest first.
          items: { $ref: '#/components/schemas/RecapBucketDTO' }
        byKind:
          type: array
          items: { $ref: '#/components/schemas/RecapCountDTO' }
        firstCapture: { $ref: '#/components/schemas/RecapFirstCaptureDTO' }
    RecapPeakCardDTO:
      type: object
      required: [busiest, weekdayCounts, busiestWeekday]
      properties:
        busiest: { $ref: '#/components/schemas/RecapBucketDTO' }
        weekdayCounts:
          type: array
          description: Seven counts, Monday first.
          items: { type: integer }
        busiestWeekday: { type: integer, minimum: 1, maximum: 7, description: '1 = Monday … 7 = Sunday.' }
    RecapRhythmCardDTO:
      type: object
      required: [hourCounts, peakHour, persona]
      properties:
        hourCounts:
          type: array
          description: Twenty-four counts, local hour 0 first.
          items: { type: integer }
        peakHour: { type: integer, minimum: 0, maximum: 23 }
        persona: { $ref: '#/components/schemas/RecapPersona' }
    RecapTopicsCardDTO:
      type: object
      required: [topTags]
      properties:
        topTags:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/RecapCountDTO' }
        topSpace: { $ref: '#/components/schemas/RecapCountDTO' }
    RecapChatsCardDTO:
      type: object
      required: [conversations, messagesSent, previousMessagesSent]
      properties:
        conversations: { type: integer }
        messagesSent: { type: integer }
        previousMessagesSent: { type: integer }
    RecapSkillsCardDTO:
      type: object
      required: [runs]
      properties:
        runs: { type: integer }
        topSkill: { $ref: '#/components/schemas/RecapCountDTO' }
    RecapStreakCardDTO:
      type: object
      required: [longestDays, activeDays, totalDays]
      properties:
        longestDays: { type: integer }
        longestStart: { type: string, format: date }
        longestEnd: { type: string, format: date }
        activeDays: { type: integer }
        totalDays: { type: integer }
    RecapAchievementDTO:
      type: object
      required: [key, title, unlockedAt]
      properties:
        key: { type: string }
        title: { type: string }
        unlockedAt: { type: string, format: date-time }
    RecapAchievementsCardDTO:
      type: object
      required: [unlocked, items]
      properties:
        unlocked: { type: integer }
        items:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/RecapAchievementDTO' }
    RecapThemesCardDTO:
      type: object
      required: [status, themes, fallbackSentence]
      properties:
        status: { $ref: '#/components/schemas/RecapThemesStatus' }
        headline: { type: string }
        sentence: { type: string }
        themes:
          type: array
          maxItems: 3
          items: { type: string }
        fallbackSentence: { type: string, description: Built from counts and tags; always present. }
    PeriodRecapResponse:
      type: object
      required: [period, year, start, end, timezone, isComplete, available, order, shareText, generatedAt]
      properties:
        period: { $ref: '#/components/schemas/RecapPeriodKind' }
        year: { type: integer }
        month: { type: integer, minimum: 1, maximum: 12 }
        start: { type: string, description: 'First local day covered, `yyyy-MM-dd`; empty for a future period.' }
        end: { type: string, description: 'Last local day covered (today while running).' }
        timezone: { type: string }
        isComplete: { type: boolean }
        available: { type: boolean }
        unavailableReason: { $ref: '#/components/schemas/RecapUnavailableReason' }
        order:
          type: array
          items: { $ref: '#/components/schemas/RecapCardKind' }
        captures: { $ref: '#/components/schemas/RecapCapturesCardDTO' }
        peak: { $ref: '#/components/schemas/RecapPeakCardDTO' }
        rhythm: { $ref: '#/components/schemas/RecapRhythmCardDTO' }
        topics: { $ref: '#/components/schemas/RecapTopicsCardDTO' }
        chats: { $ref: '#/components/schemas/RecapChatsCardDTO' }
        skills: { $ref: '#/components/schemas/RecapSkillsCardDTO' }
        streak: { $ref: '#/components/schemas/RecapStreakCardDTO' }
        achievements: { $ref: '#/components/schemas/RecapAchievementsCardDTO' }
        themes: { $ref: '#/components/schemas/RecapThemesCardDTO' }
        shareText: { type: string, description: 'Numbers only, never memory content.' }
        generatedAt: { type: string, format: date-time }

    TaskState:
      type: string
      enum: [running, queued, completed, failed]

    TaskDTO:
      type: object
      required: [id, kind, label, state]
      description: A long-running server-side operation (HER-244 / HER-246).
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: Stable identifier for the kind of work (e.g. "kb-compile").
        label:
          type: string
          description: Human-readable label rendered in the iOS Tasks card.
        state: { $ref: '#/components/schemas/TaskState' }
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
        startedAt: { type: string, format: date-time }
        elapsedSeconds: { type: integer, minimum: 0 }
        error: { type: string }

    TaskListResponse:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items: { $ref: '#/components/schemas/TaskDTO' }
        nextCursor: { type: string }

    InsightSection:
      type: string
      enum: [this_week, this_month, patterns, contradictions, connections]

    InsightDTO:
      type: object
      required: [id, headline, summary, section, createdAt]
      description: |
        A proactive finding surfaced by Hermes (HER-244 / HER-248 / HER-37).
        For `this_week` / `this_month` synthesis rows the `periodStart` /
        `periodEnd` fields demarcate the analytical window. Pattern rows
        leave both nil.
      properties:
        id: { type: string, format: uuid }
        headline: { type: string }
        summary: { type: string }
        section: { $ref: '#/components/schemas/InsightSection' }
        createdAt: { type: string, format: date-time }
        sourceMemoryIDs:
          type: array
          items: { type: string, format: uuid }
        dismissed: { type: boolean, default: false }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }

    InsightListResponse:
      type: object
      required: [insights]
      properties:
        insights:
          type: array
          items: { $ref: '#/components/schemas/InsightDTO' }
        nextCursor: { type: string }

    # ── Reminders (HER-Reminders) ──

    ReminderDTO:
      type: object
      required: [id, title, body, fireAt, createdAt]
      description: |
        A user-scheduled timed message. When `fireAt` arrives the server
        fires an APNS push (category `reminder`) and stamps `firedAt`.
        One-shot unless `recurrenceCron` is set.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        fireAt: { type: string, format: date-time }
        recurrenceCron: { type: string }
        firedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    ReminderListResponse:
      type: object
      required: [reminders]
      properties:
        reminders:
          type: array
          items: { $ref: '#/components/schemas/ReminderDTO' }
        nextCursor: { type: string }

    ReminderCreateRequest:
      type: object
      required: [title, body, fireAt]
      properties:
        title: { type: string }
        body: { type: string }
        fireAt: { type: string, format: date-time }
        recurrenceCron: { type: string }

    ReminderPatchRequest:
      type: object
      properties:
        title: { type: string }
        body: { type: string }
        fireAt: { type: string, format: date-time }
        recurrenceCron: { type: string }

    ReminderProposalDTO:
      type: object
      required: [isReminder]
      description: "HER-55 — reminder intent classification result (chat→reminder)."
      properties:
        isReminder: { type: boolean }
        title: { type: string }
        body: { type: string }
        fireAt: { type: string, format: date-time }
        recurrenceCron: { type: string }
        scheduleHuman: { type: string }

    # ── Projects (HER-Projects) ──

    ProjectDTO:
      type: object
      required: [id, name, archived, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        archived: { type: boolean, default: false }
        todoCount: { type: integer }
        createdAt: { type: string, format: date-time }

    ProjectListResponse:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items: { $ref: '#/components/schemas/ProjectDTO' }
        nextCursor: { type: string }

    ProjectCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }

    ProjectPatchRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        archived: { type: boolean }

    # ── Todos (HER-Notes/Todos merge — note-backed) ──

    TodoDTO:
      type: object
      required: [id, title, done, createdAt]
      description: A user to-do. Backed by a vault note (`metadata.isTodo`).
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        done: { type: boolean, default: false }
        dueAt: { type: string, format: date-time }
        projectID: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    TodoListResponse:
      type: object
      required: [todos]
      properties:
        todos:
          type: array
          items: { $ref: '#/components/schemas/TodoDTO' }
        nextCursor: { type: string }

    TodoCreateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        dueAt: { type: string, format: date-time }
        projectID: { type: string, format: uuid }

    TodoPatchRequest:
      type: object
      properties:
        title: { type: string }
        done: { type: boolean }
        dueAt: { type: string, format: date-time }
        projectID: { type: string, format: uuid }

    # ── BYO Hermes ──

    HermesDomainAvailability:
      type: string
      enum: [live, read_only, unsupported, managed]
      description: |
        Availability of a settings domain against the connected Hermes.
        `live` = read/write the remote box; `read_only` = display only;
        `unsupported` = remote doesn't expose it; `managed` = owned by the
        LuminaVault-managed container (tenant not on BYO Hermes).

    HermesCapabilities:
      type: object
      required: [isUserOverride, chat, sessions, jobs, skills, soul, gateways, memory, providers]
      properties:
        isUserOverride: { type: boolean }
        remoteVersion: { type: string }
        chat: { $ref: '#/components/schemas/HermesDomainAvailability' }
        sessions: { $ref: '#/components/schemas/HermesDomainAvailability' }
        jobs: { $ref: '#/components/schemas/HermesDomainAvailability' }
        skills: { $ref: '#/components/schemas/HermesDomainAvailability' }
        soul: { $ref: '#/components/schemas/HermesDomainAvailability' }
        gateways: { $ref: '#/components/schemas/HermesDomainAvailability' }
        memory: { $ref: '#/components/schemas/HermesDomainAvailability' }
        providers: { $ref: '#/components/schemas/HermesDomainAvailability' }
        multimodalIngestion: { $ref: '#/components/schemas/HermesDomainAvailability' }
        ingestionSupportedMimeTypes:
          type: array
          items: { type: string }
        ingestionMaxSourceBytes: { type: integer, format: int64 }
        ingestionRemoteSourceURL: { type: boolean }
        dashboard: { $ref: '#/components/schemas/HermesDashboardCapabilitiesDTO' }

    HermesCapabilitiesResponse:
      type: object
      required: [capabilities]
      properties:
        capabilities: { $ref: '#/components/schemas/HermesCapabilities' }
        checkedAt: { type: string, format: date-time }

    HermesConfigGetResponse:
      type: object
      required: [baseUrl, hasAuthHeader]
      properties:
        baseUrl: { type: string, format: uri }
        hasAuthHeader: { type: boolean }
        verifiedAt: { type: string, format: date-time }

    HermesConfigPutRequest:
      type: object
      required: [baseUrl]
      properties:
        baseUrl: { type: string, format: uri }
        authHeader:
          type: string
          description: Full Authorization header value (e.g. `Bearer xyz`).

    HermesConfigTestResponse:
      type: object
      required: [verifiedAt]
      properties:
        verifiedAt: { type: string, format: date-time }

    # ── BYO Hermes cron bridge (/v1/me/hermes/cron) ──
    HermesCronConfigRequest:
      type: object
      required: [dashboardUrl, dashboardToken]
      properties:
        dashboardUrl:
          type: string
          format: uri
          description: >-
            Base URL of the Hermes **dashboard** (not the `api_server` on 8642).
            Validated by `SSRFGuard` before it is stored.
        dashboardToken:
          type: string
          description: >-
            Static bearer the dashboard accepts. Write-only — sealed at rest and
            never returned by any read endpoint.

    HermesCronJob:
      type: object
      required: [id]
      properties:
        id: { type: string }
        name: { type: string }
        schedule: { type: string }
        deliver: { type: string }
        lastRun: { type: string }
        status: { type: string }
        mode: { type: string }

    HermesCronListResponse:
      type: object
      required: [source, jobs]
      properties:
        source:
          type: string
          description: Where the jobs came from — a managed container or the linked dashboard.
          enum: [managed, byo]
        jobs:
          type: array
          items: { $ref: '#/components/schemas/HermesCronJob' }

    # ── Hermes Mirror ──
    HermesDashboardAuthMode:
      type: string
      description: >-
        `bearer` = dashboard accepts the static token (loopback bind behind your
        own proxy/tunnel); `oauth_only` = dashboard is behind the OAuth/password
        gate and cannot be driven by LuminaVault; `unauthorized` = token rejected;
        `unreachable` = no answer.
      enum: [bearer, oauth_only, unauthorized, unreachable]

    HermesDashboardCapabilitiesDTO:
      type: object
      required: [reachable, authMode, skillsWrite, cron, fs, sessions]
      properties:
        reachable: { type: boolean }
        authMode: { $ref: '#/components/schemas/HermesDashboardAuthMode' }
        skillsWrite: { type: boolean }
        cron: { type: boolean }
        fs: { type: boolean }
        sessions: { type: boolean }
        version: { type: string }
        kbVaultPath: { type: string }

    HermesMirrorSyncScope:
      type: string
      enum: [skills, jobs, vault, artifacts]

    HermesMirrorSyncRequest:
      type: object
      properties:
        scope:
          type: array
          items: { $ref: '#/components/schemas/HermesMirrorSyncScope' }

    HermesMirrorSyncStatus:
      type: string
      enum: [never, ok, partial, failed]

    HermesMirrorVaultState:
      type: string
      enum: [absent, detected, created, imported]

    HermesMirrorTransportKind:
      type: string
      enum: [managed, remote, none]

    HermesMirrorStatusDTO:
      type: object
      required: [transport, lastStatus, skillsCount, jobsCount, vaultFilesCount, vaultState, sessionsImported]
      properties:
        transport: { $ref: '#/components/schemas/HermesMirrorTransportKind' }
        lastSyncAt: { type: string, format: date-time }
        lastStatus: { $ref: '#/components/schemas/HermesMirrorSyncStatus' }
        lastError: { type: string }
        skillsCount: { type: integer }
        jobsCount: { type: integer }
        vaultFilesCount: { type: integer }
        vaultPath: { type: string }
        vaultState: { $ref: '#/components/schemas/HermesMirrorVaultState' }
        sessionsImported: { type: integer }
        compileJobID: { type: string }
        dashboard: { $ref: '#/components/schemas/HermesDashboardCapabilitiesDTO' }

    HermesMirroredSkillSource:
      type: string
      enum: [builtin, hub, custom]

    HermesMirroredSkillDTO:
      type: object
      required: [name, description, enabled, source]
      properties:
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        source: { $ref: '#/components/schemas/HermesMirroredSkillSource' }
        updatedAt: { type: string, format: date-time }

    HermesMirroredSkillsResponse:
      type: object
      required: [skills]
      properties:
        skills:
          type: array
          items: { $ref: '#/components/schemas/HermesMirroredSkillDTO' }

    HermesMirroredSkillToggleRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    HermesMirroredJobDTO:
      type: object
      required: [hermesJobID, paused]
      properties:
        hermesJobID: { type: string }
        name: { type: string }
        schedule: { type: string }
        prompt: { type: string }
        paused: { type: boolean }
        lastRunAt: { type: string, format: date-time }
        nextRunAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HermesMirroredJobsSource:
      type: string
      enum: [live, snapshot]

    HermesMirroredJobsResponse:
      type: object
      required: [source, jobs]
      properties:
        source: { $ref: '#/components/schemas/HermesMirroredJobsSource' }
        jobs:
          type: array
          items: { $ref: '#/components/schemas/HermesMirroredJobDTO' }

    HermesVaultImportRequest:
      type: object
      properties:
        vaultPath:
          type: string
          description: Absolute path on the Hermes host; overrides detection.

    HermesVaultImportResultDTO:
      type: object
      required: [vaultPath, scanned, imported, skipped, failed, truncated]
      properties:
        vaultPath: { type: string }
        scanned: { type: integer }
        imported: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }
        truncated: { type: boolean }
        cursor: { type: string }

    HermesVaultCreateResultDTO:
      type: object
      required: [vaultPath, alreadyExisted, createdDirectories, installedSkills]
      properties:
        vaultPath: { type: string }
        alreadyExisted: { type: boolean }
        createdDirectories:
          type: array
          items: { type: string }
        installedSkills:
          type: array
          items: { type: string }

    HermesSessionsImportResultDTO:
      type: object
      required: [sessionsImported, sessionsSkipped, filesWritten, truncated, compileTriggered]
      properties:
        sessionsImported: { type: integer }
        sessionsSkipped: { type: integer }
        filesWritten: { type: integer }
        truncated: { type: boolean }
        cursor: { type: string }
        compileTriggered: { type: boolean }

    HermesCompileJobInstallResultDTO:
      type: object
      required: [jobID, schedule, created]
      properties:
        jobID: { type: string }
        schedule: { type: string }
        created: { type: boolean }

    # ── Hermes agent runs (Phase 1 — act from your pocket) ──

    HermesRunStatus:
      type: string
      description: >
        Lifecycle as LuminaVault tracks it. Hermes' own `cancelled` maps to
        `stopped`; `lost` is LuminaVault-only — the run watcher could not
        re-attach after a restart because Hermes had already expired the run
        from its 300 s in-memory store.
      enum: [queued, running, waiting_for_approval, completed, failed, stopped, lost]

    HermesApprovalChoice:
      type: string
      description: >
        `once` allows this one command, `session` allows it for the rest of
        the run's session, `always` allows it permanently on that Hermes.
      enum: [once, session, always, deny]

    HermesRunPendingApproval:
      type: object
      description: The tool call Hermes is waiting on. `command` is redacted upstream by Hermes.
      required: [choices, requestedAt]
      properties:
        command: { type: [string, 'null'] }
        choices:
          type: array
          items: { $ref: '#/components/schemas/HermesApprovalChoice' }
        requestedAt: { type: string, format: date-time }
        extra:
          type: [object, 'null']
          additionalProperties: true
          description: Any other fields from the `approval.request` event (tool name, risk hints).

    HermesRun:
      type: object
      required: [id, hermesRunID, status, prompt, startedAt, lastSeq]
      properties:
        id:
          type: string
          format: uuid
          description: LuminaVault row id — the id used in every `/v1/hermes/runs/{id}` path.
        hermesRunID:
          type: string
          description: Hermes-side `run_id`, for cross-referencing Hermes logs.
        status: { $ref: '#/components/schemas/HermesRunStatus' }
        prompt: { type: string }
        sessionID: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        conversationID: { type: [string, 'null'], format: uuid }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        lastEvent:
          type: [string, 'null']
          description: Name of the last Hermes event seen (`tool.started`, `approval.request`, …).
        lastSeq:
          type: integer
          description: Highest persisted event `seq`; pass as `?after=` to resume the events feed.
        pendingApproval:
          oneOf:
            - $ref: '#/components/schemas/HermesRunPendingApproval'
            - type: 'null'
        summary: { type: [string, 'null'] }
        error: { type: [string, 'null'] }

    HermesRunEvent:
      type: object
      description: >
        One persisted Hermes event. `payload` is the event object exactly as
        Hermes sent it. Delivered as the `data:` line of the run SSE feed
        under the SSE event name `hermes.run.event`.
      required: [runID, seq, event, payload, at]
      properties:
        runID: { type: string, format: uuid }
        seq: { type: integer, description: Monotonic per run, starting at 1. }
        event:
          type: string
          description: >
            `run.started`, `message.delta`, `tool.started`, `tool.completed`,
            `approval.request`, `approval.responded`, `run.completed`,
            `run.failed`, `run.cancelled`, `error`, or a `watcher.*` event
            synthesised by LuminaVault for a terminal state Hermes never sent.
        payload: { description: Raw Hermes event object. }
        at: { type: string, format: date-time }

    HermesRunListResponse:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: '#/components/schemas/HermesRun' }

    HermesRunStartRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
        sessionID:
          type: [string, 'null']
          description: Hermes session to continue; a fresh one is created when absent.
        model: { type: [string, 'null'] }
        conversationID:
          type: [string, 'null']
          format: uuid
          description: When set, a system message linking to the run is appended to that conversation.

    HermesRunApprovalRequest:
      type: object
      required: [choice]
      properties:
        choice: { $ref: '#/components/schemas/HermesApprovalChoice' }

    # ── Hermes job runs (Phase 2 "Collect") ──

    HermesJobCreateRequest:
      type: object
      required: [name, schedule]
      description: |
        Hermes' own `CronJobCreate` body. Absent fields are left out of the
        upstream request so Hermes applies its own defaults.
      properties:
        name: { type: string }
        schedule:
          type: string
          description: Cron expression, interval (`every 2h`) or one-shot time.
        prompt: { type: string }
        deliver:
          type: string
          description: '`origin`, `local`, `all`, or `platform[:chat_id[:thread]]`; comma-separated.'
        skills:
          type: array
          items: { type: string }
        model: { type: string }
        provider: { type: string }
        baseURL: { type: string }
        script: { type: string }
        contextFrom:
          type: array
          items: { type: string }
        enabledToolsets:
          type: array
          items: { type: string }
        workdir: { type: string }
        noAgent: { type: boolean }

    HermesJobUpdateRequest:
      type: object
      description: |
        Partial update — only present fields are sent to Hermes. An empty
        body is refused (`hermes_job_update_empty`).
      properties:
        name: { type: string }
        schedule: { type: string }
        prompt: { type: string }
        deliver: { type: string }
        skills:
          type: array
          items: { type: string }
        model: { type: string }
        provider: { type: string }
        baseURL: { type: string }
        script: { type: string }
        contextFrom:
          type: array
          items: { type: string }
        enabledToolsets:
          type: array
          items: { type: string }
        workdir: { type: string }
        noAgent: { type: boolean }
        enabled:
          type: boolean
          description: '`false` pauses without clearing the schedule.'

    HermesJobRunStatus:
      type: string
      enum: [running, ok, error]

    HermesJobRunTokensDTO:
      type: object
      properties:
        input: { type: integer }
        output: { type: integer }

    HermesJobRunDTO:
      type: object
      required: [id, hermesJobID, runKey, status, startedAt]
      properties:
        id: { type: string, format: uuid }
        hermesJobID: { type: string }
        runKey:
          type: string
          description: Hermes' own identity for the run; unique per tenant and the collector's idempotency key.
        status: { $ref: '#/components/schemas/HermesJobRunStatus' }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        output:
          type: string
          description: Markdown the run produced, truncated at 256 KiB. The vault file holds the same body.
        error: { type: string }
        tokens: { $ref: '#/components/schemas/HermesJobRunTokensDTO' }
        vaultFilePath:
          type: string
          description: '`raw/jobs/<job-slug>/<yyyy-MM-dd-HHmm>.md` when the output was filed.'
        skillRunLogID: { type: string, format: uuid }
        collectedAt: { type: string, format: date-time }

    HermesJobRunsResponse:
      type: object
      required: [hermesJobID, runs]
      properties:
        hermesJobID: { type: string }
        runs:
          type: array
          items: { $ref: '#/components/schemas/HermesJobRunDTO' }
        collectedAt:
          type: string
          format: date-time
          description: When the collector last pulled runs for this job.

    HermesArtifactKind:
      type: string
      enum: [image, file, link]

    HermesArtifactDTO:
      type: object
      required: [id, kind, value, href, label, sessionID, sessionTitle, occurredAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/HermesArtifactKind' }
        value: { type: string }
        href: { type: string }
        label: { type: string }
        sessionID: { type: string }
        sessionTitle: { type: string }
        occurredAt: { type: string, format: date-time }

    HermesArtifactListResponse:
      type: object
      required: [artifacts]
      properties:
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/HermesArtifactDTO' }
        nextCursor:
          type: string
          description: ISO-8601 `occurredAt` of the last row; pass as `before` for the next page.

    HermesMirrorWebhookDTO:
      type: object
      required: [path, token, signatureHeader, timestampHeader, replayWindowSeconds]
      properties:
        path:
          type: string
          description: Route to POST to, e.g. `/v1/hermes/mirror/webhook/<token>`.
        token: { type: string }
        secret:
          type: string
          description: Returned only by the rotate route, once. LuminaVault seals it and never returns it again.
        signatureHeader:
          type: string
          description: Header carrying `hex(HMAC-SHA256(secret, "<timestamp>.<body>"))`.
        timestampHeader:
          type: string
          description: Header carrying the unix-seconds timestamp bound into the signature.
        replayWindowSeconds:
          type: integer
          description: How long a signed request stays valid.
        rotatedAt: { type: string, format: date-time }

    HermesJobWebhookPayload:
      type: object
      required: [job_id]
      description: |
        Body the tenant's Hermes posts when a cron job finishes. Only
        `job_id` is acted on today — it names the job to collect now.
      properties:
        job_id: { type: string }
        run_key: { type: string }
        status: { $ref: '#/components/schemas/HermesJobRunStatus' }
        output: { type: string }
        error: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    HermesJobCollectResultDTO:
      type: object
      required: [hermesJobID, fetched, inserted, skipped, filesWritten, truncated]
      properties:
        hermesJobID: { type: string }
        fetched:
          type: integer
          description: Runs Hermes listed for this job, bounded by the per-call cap of 50.
        inserted:
          type: integer
          description: New `hermes_job_runs` rows written by this call.
        skipped:
          type: integer
          description: Runs already collected (same run key) or still in flight.
        filesWritten:
          type: integer
          description: Vault files written under `raw/jobs/<job-slug>/`.
        truncated:
          type: boolean
          description: The listing filled the per-call cap; the job is busier than one pass.
        highWaterMark:
          type: string
          format: date-time
          description: Start time of the newest finished run collected so far.

    # ── Provider credentials + LLM preferences (HER-252) ──

    ProviderID:
      type: string
      enum: [xai, anthropic, openai, ollama, openRouter, nvidia, gemini, nous, custom]
      description: |
        Wire identifier for an external LLM provider the user can attach
        credentials to. `hermesGateway` is intentionally excluded — it's
        deployment infrastructure, not user-credential surface. `nous` is
        the OpenAI-compatible Nous Research portal inference API (rotating
        free models), distinct from the container-scoped Nous OAuth flow.

    ProviderCredentialKind:
      type: string
      enum: [apiKey, oauth, hostURL]

    ProviderCredentialDTO:
      type: object
      required: [provider, kind, hasCredential]
      properties:
        provider: { $ref: '#/components/schemas/ProviderID' }
        kind: { $ref: '#/components/schemas/ProviderCredentialKind' }
        hasCredential: { type: boolean }
        baseUrl: { type: string, format: uri }
        label: { type: string }
        verifiedAt: { type: string, format: date-time }
        lastFailureAt: { type: string, format: date-time }
        lastFailureCode:
          type: string
          description: |
            Stable code from the last failed /test or runtime failover:
            `credit_exhausted` / `rate_limit` / `upstream_error` /
            `upstream_rejected` / `network` / `tls_error` / `timeout`.

            Only set by an actual auth rejection (401/403) or credit
            exhaustion. A rate limit, a 5xx or a timeout is evidence about
            the provider's health, not about the key, and does not stamp it.
        supportsTools:
          type: boolean
          nullable: true
          description: |
            Whether this endpoint was observed to honour tool calls.

            Three-valued: `true` the probe saw a tool call, `false` the
            endpoint answered without calling one, and **absent/null** means
            unprobed or no verdict reached. Null must be read as permissive —
            it does not mean "no tools".

            A credential that authenticates is not the same as an endpoint
            that works: an OpenAI-compatible gateway can accept a `tools`
            block, ignore it, and answer from the model's own knowledge.
        toolsProbedAt:
          type: string
          format: date-time
          nullable: true
          description: When the tool probe last reached this credential.

    ProviderCredentialsListResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/ProviderCredentialDTO' }

    ProviderCatalogEntryDTO:
      type: object
      required: [provider, displayName, requiresBaseURL, requiresAPIKey, available]
      properties:
        provider: { $ref: '#/components/schemas/ProviderID' }
        displayName: { type: string }
        defaultBaseURL: { type: string, nullable: true }
        requiresBaseURL: { type: boolean }
        requiresAPIKey: { type: boolean }
        keyHint: { type: string, nullable: true }
        keysURL: { type: string, nullable: true }
        available: { type: boolean }

    ProviderCatalogResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/ProviderCatalogEntryDTO' }

    LLMModelInfo:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          description: Wire model id sent to the provider (e.g. `stepfun/step-3.7-flash:free`).
        displayName: { type: string }
        contextWindow:
          type: integer
          description: Approximate context window in tokens, when known. UI hint only.

    ProviderModelsResponse:
      type: object
      required: [provider, models, fetchedLive]
      properties:
        provider: { $ref: '#/components/schemas/ProviderID' }
        models:
          type: array
          items: { $ref: '#/components/schemas/LLMModelInfo' }
        fetchedLive:
          type: boolean
          description: |
            `true` when the list came from the provider's live `/v1/models`;
            `false` when it fell back to the offline curated catalog.

    ProviderCredentialPutRequest:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/ProviderCredentialKind' }
        apiKey: { type: string }
        baseUrl: { type: string, format: uri }
        label: { type: string }

    ProviderTestResponse:
      type: object
      required: [verifiedAt]
      properties:
        verifiedAt: { type: string, format: date-time }
        model: { type: string }

    # ─── Hermes Gateways (HER-241) ──────────────────────────────────────

    HermesGatewayID:
      type: string
      enum: [telegram, discord, slack, whatsapp, email, matrix, ntfy, mattermost]
      description: |
        Identifier for a Hermes messaging gateway the user can configure.
        Outbound-connecting platforms only (no inbound public webhook).
        Webhook-based platforms (Teams, LINE) and file-credential ones
        (Google Chat) land in follow-up tickets.

    HermesGatewayStatus:
      type: string
      enum: [not_configured, configured, verified, error]
      description: |
        Lifecycle of a per-user gateway. `not_configured` means no row.
        `configured` is the terminal state today — Hermes exposes no
        HTTP API to confirm a gateway is actually live, so we cannot
        promote past `configured` until upstream ships introspection.

    HermesGatewayFieldKind:
      type: string
      enum: [text, secret, url]

    HermesGatewayField:
      type: object
      required: [key, label, kind, isRequired]
      properties:
        key: { type: string }
        label: { type: string }
        placeholder: { type: string }
        kind: { $ref: '#/components/schemas/HermesGatewayFieldKind' }
        isRequired: { type: boolean }

    HermesGatewayCatalogEntry:
      type: object
      required: [id, displayName, iconSlug, description, requiredFields, status, hasConfig]
      properties:
        id: { $ref: '#/components/schemas/HermesGatewayID' }
        displayName: { type: string }
        iconSlug: { type: string }
        description: { type: string }
        requiredFields:
          type: array
          items: { $ref: '#/components/schemas/HermesGatewayField' }
        status: { $ref: '#/components/schemas/HermesGatewayStatus' }
        hasConfig: { type: boolean }
        verifiedAt: { type: string, format: date-time }
        lastFailureCode:
          type: string
          description: |
            Stable code from the last failed /test probe:
            `hermes_unauthorized` / `hermes_unreachable:<reason>`.
        pairingKind:
          allOf: [{ $ref: '#/components/schemas/HermesGatewayPairingKind' }]
          description: |
            Non-null → this gateway uses an interactive pairing flow instead
            of a credential form (WhatsApp). Absent/null for credential
            gateways. The client branches its detail screen on this.

    HermesGatewayPairingKind:
      type: string
      enum: [whatsappQR]

    HermesGatewaysListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HermesGatewayCatalogEntry' }

    HermesGatewayPutRequest:
      type: object
      required: [config]
      properties:
        config:
          type: object
          additionalProperties: { type: string }
          description: |
            Map of gateway field key → value. Required fields per
            gateway are advertised in the catalog entry's
            `requiredFields`. Secrets are sealed via SecretBox at rest
            and never echoed back.

    HermesGatewayTestResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        verifiedAt: { type: string, format: date-time }
        errorCode: { type: string }
        errorMessage: { type: string }

    # ─── Hermes Gateway Apply (actuation) ───────────────────────────

    HermesGatewayApplyStepID:
      type: string
      enum: [writeEnv, restartContainer, healthCheck]

    HermesGatewayApplyStepState:
      type: string
      enum: [pending, running, succeeded, failed, skipped]

    HermesGatewayApplyStep:
      type: object
      required: [id, state]
      properties:
        id: { $ref: '#/components/schemas/HermesGatewayApplyStepID' }
        state: { $ref: '#/components/schemas/HermesGatewayApplyStepState' }
        detail: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    HermesGatewayApplyJobState:
      type: string
      enum: [running, succeeded, failed]

    HermesGatewayApplyJobStatus:
      type: object
      required: [jobID, state, steps, startedAt, updatedAt]
      properties:
        jobID: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/HermesGatewayApplyJobState' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/HermesGatewayApplyStep' }
        errorMessage: { type: string }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StartHermesGatewayApplyResponse:
      type: object
      required: [jobID, state]
      properties:
        jobID: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/HermesGatewayApplyJobState' }

    # ─── Hermes WhatsApp QR Pairing ─────────────────────────────────

    HermesWhatsAppPairStatus:
      type: string
      enum: [starting, awaitingScan, linking, linked, expired, failed]

    HermesWhatsAppPairEvent:
      type: object
      description: >
        Discriminated-union SSE frame. `type` selects the case; `payload`
        carries the case value (absent for `linked`).
      required: [type]
      properties:
        type:
          type: string
          enum: [qr, status, linked, error]
        payload:
          description: >
            `qr` → QR block-art string; `status` → HermesWhatsAppPairStatus;
            `error` → message string; `linked` → omitted.
          oneOf:
            - type: string
            - { $ref: '#/components/schemas/HermesWhatsAppPairStatus' }

    StartWhatsAppPairResponse:
      type: object
      required: [sessionID]
      properties:
        sessionID: { type: string, format: uuid }

    # ─── Hermes Profiles (HER-273) ──────────────────────────────────

    HermesProfileDTO:
      type: object
      required: [id, slug, label, systemPrompt, isDefault, skillsEnabled, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$' }
        label: { type: string, minLength: 1, maxLength: 80 }
        systemPrompt: { type: string }
        isDefault: { type: boolean }
        skillsEnabled:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HermesProfilesListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HermesProfileDTO' }
        activeSlug:
          type: string
          description: Slug of the persona currently flagged as the tenant default.

    HermesProfileCreateRequest:
      type: object
      required: [slug, label]
      properties:
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$' }
        label: { type: string, minLength: 1, maxLength: 80 }
        systemPrompt: { type: string }
        templateSlug:
          type: string
          description: |
            Optional preset SOUL template slug. Wins over `systemPrompt`
            when both are set. Catalogue: `personal-assistant`,
            `stocks-tracker`, `news-curator`, `tv-and-movies`,
            `tech-and-programming`. Replaced by HER-273-B5 once
            `/v1/soul/templates` ships.
        skillsEnabled:
          type: array
          items: { type: string }

