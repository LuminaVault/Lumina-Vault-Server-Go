            application/json:
              schema: { $ref: '#/components/schemas/PluginSyncResponse' }

  /v1/marketplace/plugins:
    get:
      tags: [Marketplace]
      operationId: marketplaceList
      summary: Browse published marketplace plugins.
      parameters:
        - { name: query, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/PluginCategory' } }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 24 } }
      responses:
        '200': { description: Published plugins., content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceListResponse' } } } }

  /v1/marketplace/plugins/{slug}:
    get:
      tags: [Marketplace]
      operationId: marketplaceDetail
      summary: Get a published marketplace listing.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Marketplace plugin., content: { application/json: { schema: { $ref: '#/components/schemas/MarketplacePluginDTO' } } } }
        '404': { description: Listing or approved version not found. }

  /v1/marketplace/plugins/{slug}/reviews:
    get:
      tags: [Marketplace]
      operationId: marketplaceReviews
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Published reviews., content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceReviewsResponse' } } } }

  /v1/marketplace/plugins/{slug}/rating:
    put:
      tags: [Marketplace]
      operationId: marketplaceRate
      summary: Create or replace the caller's verified-install rating.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceRatingRequest' } } }
      responses:
        '200': { description: Saved review., content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceReviewDTO' } } } }
        '403': { description: A verified install is required; publishers cannot rate their own plugin. }

  /v1/marketplace/plugins/{slug}/install:
    post:
      tags: [Marketplace]
      operationId: marketplaceInstall
      summary: Install an approved immutable version with explicit permission grants.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceInstallRequest' } } }
      responses:
        '200': { description: Installed., content: { application/json: { schema: { $ref: '#/components/schemas/PluginInstallDTO' } } } }

  /v1/marketplace/plugins/{slug}/upgrade:
    post:
      tags: [Marketplace]
      operationId: marketplaceUpgrade
      summary: Upgrade an installed plugin with an optimistic version lock and renewed permission consent.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceUpgradeRequest' } } }
      responses:
        '200': { description: Upgraded., content: { application/json: { schema: { $ref: '#/components/schemas/PluginInstallDTO' } } } }
        '409': { description: The installed version changed or is already current. }

  /v1/marketplace/plugins/{slug}/tools/{toolName}/run:
    post:
      tags: [Marketplace]
      operationId: marketplaceRunTool
      summary: Execute an installed approved WASM tool in the isolated runner.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: toolName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PluginToolRunRequest' } } }
      responses:
        '200': { description: Sandboxed tool output., content: { application/json: { schema: { $ref: '#/components/schemas/PluginToolRunResponse' } } } }

  /v1/marketplace/publisher/apply:
    post:
      tags: [Marketplace]
      operationId: marketplacePublisherApply
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublisherApplicationRequest' } } }
      responses:
        '200': { description: Publisher application., content: { application/json: { schema: { $ref: '#/components/schemas/MarketplacePublisherDTO' } } } }

  /v1/marketplace/publisher:
    get:
      tags: [Marketplace]
      operationId: marketplacePublisherGet
      responses:
        '200': { description: Caller publisher profile., content: { application/json: { schema: { $ref: '#/components/schemas/MarketplacePublisherDTO' } } } }

  /v1/marketplace/publisher/plugins:
    post:
      tags: [Marketplace]
      operationId: marketplacePublisherCreatePlugin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceListingCreateRequest' } } }
      responses:
        '200': { description: Draft listing., content: { application/json: { schema: { $ref: '#/components/schemas/MarketplacePluginDTO' } } } }

  /v1/marketplace/publisher/plugins/{slug}/versions:
    post:
      tags: [Marketplace]
      operationId: marketplacePublisherCreateVersion
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceVersionCreateRequest' } } }
      responses:
        '200': { description: Draft immutable version., content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceVersionDTO' } } } }

  /v1/marketplace/publisher/plugins/{slug}/artifacts:
    post:
      tags: [Marketplace]
      operationId: marketplacePublisherUploadArtifact
      summary: Upload a WASM module into the immutable content-addressed artifact store.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceArtifactUploadRequest' } } }
      responses:
        '200': { description: Stored artifact reference., content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceArtifactUploadResponse' } } } }

  /v1/marketplace/publisher/plugins/{slug}/versions/{versionID}/submit:
    post:
      tags: [Marketplace]
      operationId: marketplacePublisherSubmitVersion
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: versionID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Validation/submission result., content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceSubmissionDTO' } } } }

  /v1/marketplace/publisher/submissions:
    get:
      tags: [Marketplace]
      operationId: marketplacePublisherSubmissions
      responses:
        '200': { description: Caller submissions., content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceSubmissionsResponse' } } } }

  /v1/marketplace/admin/submissions:
    get:
      tags: [Marketplace]
      operationId: marketplaceAdminSubmissions
      responses:
        '200': { description: Moderation queue., content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceSubmissionsResponse' } } } }
        '403': { description: Admin required. }

  /v1/marketplace/admin/publishers:
    get:
      tags: [Marketplace]
      operationId: marketplaceAdminPublishers
      responses:
        '200': { description: Pending publisher applications., content: { application/json: { schema: { $ref: '#/components/schemas/MarketplacePublishersResponse' } } } }
        '403': { description: Admin required. }

  /v1/marketplace/admin/submissions/{submissionID}/decision:
    post:
      tags: [Marketplace]
      operationId: marketplaceAdminDecision
      parameters:
        - { name: submissionID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceModerationRequest' } } }
      responses:
        '200': { description: Reviewed submission., content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceSubmissionDTO' } } } }

  /v1/marketplace/admin/publishers/{publisherID}/decision:
    post:
      tags: [Marketplace]
      operationId: marketplaceAdminPublisherDecision
      parameters:
        - { name: publisherID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceModerationRequest' } } }
      responses:
        '200': { description: Reviewed publisher., content: { application/json: { schema: { $ref: '#/components/schemas/MarketplacePublisherDTO' } } } }

  /v1/marketplace/admin/versions/{versionID}/revoke:
    post:
      tags: [Marketplace]
      operationId: marketplaceAdminRevokeVersion
      parameters:
        - { name: versionID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceRevokeVersionRequest' } } }
      responses:
        '200': { description: Revoked version., content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceVersionDTO' } } } }

  /v1/kb-compile:
    post:
      tags: [KB]
      operationId: kbCompileLegacy
      deprecated: true
      summary: Deprecated. Use POST /v1/memory-compile.
      description: |
        Returns 308 Permanent Redirect to `/v1/memory-compile`. Kept one
        milestone after the rename for client-migration safety. Will be
        removed once telemetry shows zero callers remaining.
      responses:
        '308':
          description: Permanent redirect to the canonical path.
          headers:
            Location:
              schema: { type: string }
              description: Always `/v1/memory-compile`.

  /v1/kb-compile/pending:
    get:
      tags: [KB]
      operationId: kbCompilePendingLegacy
      deprecated: true
      summary: Deprecated. Use GET /v1/memory-compile/pending.
      description: |
        Returns 308 Permanent Redirect to `/v1/memory-compile/pending`.
        Kept one milestone after the rename for client-migration safety.
      responses:
        '308':
          description: Permanent redirect to the canonical path.
          headers:
            Location:
              schema: { type: string }
              description: Always `/v1/memory-compile/pending`.

  # ─────────────────────────────── Spaces ───────────────────────────────

  /v1/spaces:
    get:
      tags: [Spaces]
      operationId: spacesList
      summary: List spaces (user-defined organising folders).
      responses:
        '200':
          description: Spaces.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceListResponse' }
    post:
      tags: [Spaces]
      operationId: spacesCreate
      summary: Create a space.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaceCreateRequest' }
      responses:
        '200':
          description: Created space.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDTO' }

  /v1/spaces/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Spaces]
      operationId: spacesGet
      summary: Get one space.
      responses:
        '200':
          description: Space.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDTO' }
    put:
      tags: [Spaces]
      operationId: spacesUpdate
      summary: Update a space.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaceUpdateRequest' }
      responses:
        '200':
          description: Updated space.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDTO' }
    delete:
      tags: [Spaces]
      operationId: spacesDelete
      summary: Delete a space.
      responses:
        '204':
          description: Deleted.

  # ─────────────────────────────── Soul ─────────────────────────────────

  /v1/soul:
    get:
      tags: [Soul]
      operationId: soulGet
      summary: Read SOUL.md (HER-85).
      responses:
        '200':
          description: SOUL.md.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoulResponse' }
    put:
      tags: [Soul]
      operationId: soulPut
      summary: Write SOUL.md (full document replace).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SoulPutRequest' }
      responses:
        '200':
          description: Updated SOUL.md.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoulResponse' }
    delete:
      tags: [Soul]
      operationId: soulDelete
      summary: Reset SOUL.md to the bootstrap template.
      responses:
        '204':
          description: Reset.

  /v1/soul/compose:
    post:
      tags: [Soul]
      operationId: composeSoul
      summary: Compose a SOUL.md from structured agent traits.
      description: >-
        Renders the onboarding quiz answers into the canonical template
        (locked core covenant + editable sections) and persists it, unless
        `dry_run: true` is set, in which case the composition is returned
        without being written.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SoulComposeRequest' }
      responses:
        '200':
          description: Composed SOUL.md.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoulResponse' }
        '413':
          description: Composed document exceeds the maximum allowed size.

  # ──────────────────────────── Achievements ────────────────────────────

  /v1/achievements:
    get:
      tags: [Achievements]
      operationId: achievementsList
      summary: Full achievements catalog joined to per-tenant progress.
      responses:
        '200':
          description: Achievements catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AchievementsListResponse' }

  /v1/achievements/recent:
    get:
      tags: [Achievements]
      operationId: achievementsRecent
      summary: Recently unlocked achievements.
      responses:
        '200':
          description: Recent unlocks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AchievementsRecentResponse' }

  # ─────────────────────────────── Health ───────────────────────────────

  /v1/health:
    post:
      tags: [Health]
      operationId: healthIngest
      summary: Ingest health events (Apple Health / Withings / manual).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HealthIngestRequest' }
      responses:
        '200':
          description: Ingested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthIngestResponse' }
    get:
      tags: [Health]
      operationId: healthRead
      summary: Read ingested health events (HER-202).
      parameters:
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Health events page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthListResponse' }

  /v1/health/daily:
    get:
      tags: [Health]
      operationId: healthDaily
      summary: Per-day aggregation window for a single event type (HER-118 sparkline source).
      description: |
        Returns a fixed-length chronological window of daily aggregates for the
        given `type`. Sum aggregation for accumulating metrics (`steps`,
        `active_energy`, `mindful_minutes`, `sleep_session`); average for
        instantaneous metrics (`hr_bpm`, `hrv_ms`, `weight_kg`, `blood_oxygen`,
        etc.). Gap-days are returned with `value: 0, sampleCount: 0` so the
        client can render sparklines without local bucketing or gap-fill logic.
      parameters:
        - in: query
          name: type
          required: true
          schema: { type: string }
          description: Lowercased event type identifier.
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
      responses:
        '200':
          description: Daily aggregation window.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthDailyResponse' }

  # ─────────────────────────────── Skills ───────────────────────────────

  /v1/skills/slash:
    post:
      tags: [Skills]
      operationId: skillsSlash
      summary: Dispatch a chat slash command to a skill or built-in service.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillSlashCommandRequest' }
      responses:
        '200':
          description: Slash command completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillRunResponse' }
        '400':
          description: Not a slash command.
        '402':
          description: Tier entitlement or daily-cap exhaustion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaywallResponse' }
        '404':
          description: Unknown skill.

  /v1/skills/{name}/run:
    post:
      tags: [Skills]
      operationId: skillsRun
      summary: Manually trigger a skill run.
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillRunRequest' }
      responses:
        '200':
          description: Skill dispatched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillRunResponse' }
        '402':
          description: Tier entitlement or daily-cap exhaustion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaywallResponse' }
        '404':
          description: Unknown skill.

  # ───────────────────────────── WebSocket ──────────────────────────────

  /v1/ws:
    get:
      tags: [WebSocket]
      operationId: wsUpgrade
      summary: Per-tenant WebSocket upgrade (broadcast channel).
      parameters:
        - in: header
          name: Upgrade
          required: true
          schema: { type: string, enum: [websocket] }
      responses:
        '101':
          description: Switching Protocols.
        '401':
          description: Missing / invalid JWT.

