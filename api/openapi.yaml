  # ─────────────────────── Settings — BYO Hermes ────────────────────────

  /v1/settings/hermes:
    get:
      tags: [Settings]
      operationId: hermesConfigGet
      summary: Get the per-user Hermes gateway override (HER-217).
      responses:
        '200':
          description: Override config.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesConfigGetResponse' }
        '404':
          description: No row — falling back to managed default.
    put:
      tags: [Settings]
      operationId: hermesConfigPut
      summary: Upsert the Hermes gateway override.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HermesConfigPutRequest' }
      responses:
        '200':
          description: Updated config (verifiedAt reset to null).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesConfigGetResponse' }
        '400':
          description: SSRFGuard rejection (invalid_base_url:<reason>).
    delete:
      tags: [Settings]
      operationId: hermesConfigDelete
      summary: Drop the override; revert to managed default.
      responses:
        '204':
          description: Row deleted.

  /v1/settings/hermes/test:
    post:
      tags: [Settings]
      operationId: hermesConfigTest
      summary: Probe the configured gateway and bump verified_at on success.
      responses:
        '200':
          description: Verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesConfigTestResponse' }
        '404':
          description: No config to test.
        '502':
          description: |
            Probe failed. `message` is a stable TestError code:
            `timeout` / `tls_error` / `http_4xx` / `http_5xx` /
            `ssrf_rejected` / `decrypt_failed` / `unreachable`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/me/hermes/capabilities:
    get:
      tags: [Settings]
      operationId: hermesCapabilitiesGet
      summary: What the tenant's connected Hermes exposes, per settings domain (P3).
      description: |
        Managed tenants report every domain as `managed`. BYO-Hermes tenants
        get a cached probe of their remote `api_server` (`/v1/capabilities`
        + `/api/jobs`), mapping each domain to `live` / `read_only` /
        `unsupported` so clients can gate panes. Pass `?refresh=true` to
        force a re-probe past the cache TTL.
      parameters:
        - name: refresh
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: Capabilities view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesCapabilitiesResponse' }

  /v1/me/hermes/cron/config:
    put:
      tags: [Settings]
      operationId: hermesCronConfigPut
      summary: Link the tenant's own Hermes dashboard (URL + token) for BYO cron.
      description: |
        Stores the BYO Hermes **dashboard** endpoint and its static bearer
        token, then immediately lists the tenant's cron jobs through it — so
        the response doubles as a probe of the credentials just saved.

        `dashboardToken` is write-only: it is sealed with `SecretBox` into the
        `cron_dashboard` columns and never returned by any read endpoint. To
        change it, send the pair again.

        The dashboard only honours a static bearer when it is **bound to
        loopback behind the operator's own TLS proxy or tunnel**. A
        non-loopback bind falls back to an OAuth/password gate that has no
        bearer path, and this route answers
        `502 hermes_dashboard_auth_mode_unsupported` — the credentials are
        saved, but nothing can be driven through them until the bind changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HermesCronConfigRequest' }
      responses:
        '200':
          description: |
            Credentials stored and accepted. Body is the now-listable jobs,
            with `source` = `managed` when a managed container exists for the
            tenant (it wins over BYO) or `byo` otherwise.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesCronListResponse' }
        '400':
          description: Body missing or not decodable as `HermesCronConfigRequest`.
        '401':
          description: No tenant identity on the request (missing or invalid JWT).
        '500':
          description: |
            `dashboardUrl` failed `SSRFGuard.validate` (bad URL, disallowed
            scheme, missing host, loopback / private / link-local / unresolvable
            address). The guard's rejection is not translated here, so it
            surfaces as an untyped 500 rather than the
            `invalid_base_url:<reason>` 400 that `PUT /v1/settings/hermes`
            returns.
        '502':
          description: |
            Saved, but the follow-up list against the dashboard failed.
            `message` is a stable code:
            `hermes_dashboard_auth_mode_unsupported` (dashboard behind its
            OAuth/password gate — bind it to loopback behind your own TLS proxy
            or tunnel), `byo_cron_http_401` (token rejected),
            `byo_cron_http_<status>` (any other upstream status),
            `hermes_dashboard_unreachable`, `hermes_mirror_invalid_response`,
            `hermes_mirror_body_too_large`, `hermes_mirror_unsupported`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }


  /v1/hermes/workspace/status:
    get:
      tags: [Hermes Workspace]
      operationId: hermesWorkspaceStatus
      summary: The agent's checkout — branch, branches, worktrees and changed files.
      description: |
        A read-only view of the repository the tenant's Hermes is working in.
        Proxies the Hermes dashboard rather than reimplementing git, so what a
        client sees is what the agent sees.

        **Read-only, deliberately.** The same upstream API can stage, commit,
        push and open pull requests. None of that is reachable here: those need
        an auth scope, an audit trail and a confirmation model before a browser
        session can reach them.

        `501 hermes_mirror_unsupported` when the tenant has no remote Hermes — a
        filesystem-mirrored tenant has no checkout to inspect. Verified
        against staging rather than assumed: the code comes from the shared
        mirror error mapper, not from a workspace-specific one.
      parameters:
        - name: path
          in: query
          required: true
          description: Absolute path of the repository on the agent's machine.
          schema: { type: string }
      responses:
        '200':
          description: Repository state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesWorkspaceStatusDTO' }
        '400': { description: 'Missing or malformed path (`hermes_mirror_invalid_path`).' }
        '501': { description: 'This tenant has no remote Hermes (`hermes_mirror_unsupported`).' }

  /v1/hermes/workspace/files:
    get:
      tags: [Hermes Workspace]
      operationId: hermesWorkspaceFiles
      summary: One directory of the agent's filesystem.
      parameters:
        - name: path
          in: query
          required: true
          description: |
            Absolute directory path. Required rather than defaulting to the
            agent's working directory: a typo that silently lists somewhere
            else reads as data loss to whoever is looking at the tree.
          schema: { type: string }
      responses:
        '200':
          description: Directory entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesWorkspaceListingDTO' }
        '400': { description: 'Missing or malformed path.' }
        '404': { description: 'No such directory.' }
        '501': { description: 'This tenant has no remote Hermes.' }

  /v1/hermes/workspace/file:
    get:
      tags: [Hermes Workspace]
      operationId: hermesWorkspaceFile
      summary: One file's text from the agent's filesystem.
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: File contents.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesWorkspaceFileDTO' }
        '400': { description: 'Missing or malformed path.' }
        '404': { description: 'No such file.' }
        '501': { description: 'This tenant has no remote Hermes.' }

  /v1/hermes/workspace/diff:
    get:
      tags: [Hermes Workspace]
      operationId: hermesWorkspaceDiff
      summary: The unified diff for one changed file.
      parameters:
        - name: path
          in: query
          required: true
          description: Absolute path of the repository.
          schema: { type: string }
        - name: file
          in: query
          required: true
          description: |
            Repository-relative path of the file. Traversal segments are
            rejected: a file parameter that walked upward would let a caller
            read anything the agent can reach by asking for a diff of it.
          schema: { type: string }
      responses:
        '200':
          description: Unified diff, as text.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesWorkspaceDiffDTO' }
        '400': { description: 'Missing or malformed path.' }
        '501': { description: 'This tenant has no remote Hermes.' }

  /v1/hermes/artifacts:
    get:
      tags: [Settings]
      operationId: hermesArtifactsList
      summary: Images, files and links harvested from the tenant's Hermes sessions.
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [image, file, link] }
        - name: q
          in: query
          schema: { type: string }
        - name: before
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: sessionID
          in: query
          required: false
          description: |
            Narrow to one Hermes session, so a chat surface can show just the
            artifacts produced by the run behind the conversation on screen.
            Artifacts are keyed by session rather than conversation, so the
            join is conversation → run `sessionID` → artifacts; read the run's
            `sessionID` from `GET /v1/hermes/runs?conversationID=`. An empty
            value means no filter, which is what a client sends for a
            conversation that has not started a run yet.
          schema: { type: string }
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesArtifactListResponse' }

  /v1/hermes/artifacts/{id}:
    get:
      tags: [Settings]
      operationId: hermesArtifactsGet
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: One artifact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesArtifactDTO' }
        '404':
          description: '`hermes_artifact_not_found`.'

  # ── Hermes Mirror — the tenant's Hermes (skills, cron jobs, KB vault, sessions) mirrored into LuminaVault ──
  /v1/hermes/mirror/status:
    get:
      tags: [Settings]
      operationId: hermesMirrorStatus
      summary: Mirror status for the tenant's Hermes (counts, last sync, vault state, dashboard probe).
      responses:
        '200':
          description: Current mirror state; `dashboard` carries the cached dashboard probe when a dashboard URL is linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesMirrorStatusDTO' }

  /v1/hermes/mirror/sync:
    post:
      tags: [Settings]
      operationId: hermesMirrorSync
      summary: Sync skills, cron jobs and vault detection from the tenant's Hermes.
      description: |
        Each scope runs independently; failures are recorded on the status
        (`lastStatus` `partial` / `failed`, `lastError`) rather than thrown.
        An empty or absent `scope` syncs everything.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HermesMirrorSyncRequest' }
      responses:
        '200':
          description: Refreshed status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesMirrorStatusDTO' }

  /v1/hermes/mirror/skills:
    get:
      tags: [Settings]
      operationId: hermesMirrorSkillsList
      summary: Skills mirrored from the tenant's Hermes (last sync).
      responses:
        '200':
          description: Mirrored skills.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesMirroredSkillsResponse' }

  /v1/hermes/mirror/skills/{name}:
    put:
      tags: [Settings]
      operationId: hermesMirrorSkillToggle
      summary: Enable or disable a skill on the tenant's Hermes (dashboard `/api/skills/toggle`).
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HermesMirroredSkillToggleRequest' }
      responses:
        '200':
          description: Updated skill.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesMirroredSkillDTO' }
        '404':
          description: Skill not in the mirror (`hermes_skill_not_found`).
        '502':
          description: |
            Hermes refused or was unreachable. `message` is a stable code:
            `hermes_dashboard_auth_mode_unsupported` (dashboard behind the OAuth gate —
            bind it to loopback behind your own TLS proxy or tunnel),
            `hermes_dashboard_unauthorized`, `hermes_dashboard_unreachable`,
            `hermes_mirror_upstream_error`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/hermes/mirror/jobs:
    get:
      tags: [Settings]
      operationId: hermesMirrorJobsList
      summary: Cron jobs on the tenant's Hermes — live when reachable, else the last snapshot.
      responses:
        '200':
          description: Jobs with `source` = `live` or `snapshot`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesMirroredJobsResponse' }
    post:
      tags: [Settings]
      operationId: hermesMirrorJobCreate
      summary: Create a cron job on the tenant's Hermes.
      description: |
        The full Hermes `CronJobCreate` body. `schedule` accepts a cron
        expression, an interval (`every 2h`) or a one-shot time; `deliver`
        follows Hermes' grammar (`origin`, `local`, `all`,
        `platform[:chat_id[:thread]]`, comma-separated). The job is created on
        Hermes first and mirrored from the response, so a rejected create
        leaves the mirror untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HermesJobCreateRequest' }
      responses:
        '200':
          description: The job as Hermes stores it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesMirroredJobDTO' }
        '400':
          description: '`hermes_job_name_required` or `hermes_job_schedule_required`.'
        '502':
          description: Hermes refused or was unreachable (stable code in `message`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/hermes/mirror/jobs/{id}:
    put:
      tags: [Settings]
      operationId: hermesMirrorJobUpdate
      summary: Partially update a mirrored cron job on the tenant's Hermes.
      description: |
        Only the fields present in the body are sent to Hermes as `updates`;
        an empty body is refused (`hermes_job_update_empty`) rather than sent
        on as a no-op write. `enabled: false` pauses without clearing the
        schedule — prefer the `pause` / `resume` routes for that.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HermesJobUpdateRequest' }
      responses:
        '200':
          description: The job as Hermes stores it afterwards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesMirroredJobDTO' }
        '400':
          description: '`hermes_mirror_invalid_path` or `hermes_job_update_empty`.'
        '404':
          description: The job is not mirrored for this tenant (`hermes_job_not_found`).
        '502':
          description: Hermes refused or was unreachable (stable code in `message`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [Settings]
      operationId: hermesMirrorJobDelete
      summary: Delete a cron job on the tenant's Hermes.
      description: |
        Deletes upstream first, then drops the mirrored row. Runs already
        collected into `hermes_job_runs` are kept — the outputs are in the
        vault and on the Today feed, and deleting a schedule is not a request
        to forget what it produced.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted.
        '400':
          description: '`hermes_mirror_invalid_path`.'
        '404':
          description: The job is not mirrored for this tenant (`hermes_job_not_found`).
        '502':
          description: Hermes refused or was unreachable (stable code in `message`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/hermes/mirror/jobs/{id}/pause:
    post:
      tags: [Settings]
      operationId: hermesMirrorJobPause
      summary: Pause a mirrored cron job on the tenant's Hermes.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'The job with `paused: true`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesMirroredJobDTO' }
        '404':
          description: The job is not mirrored for this tenant (`hermes_job_not_found`).

  /v1/hermes/mirror/jobs/{id}/resume:
    post:
      tags: [Settings]
      operationId: hermesMirrorJobResume
      summary: Resume a paused cron job on the tenant's Hermes.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'The job with `paused: false`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesMirroredJobDTO' }
        '404':
          description: The job is not mirrored for this tenant (`hermes_job_not_found`).

  /v1/hermes/mirror/jobs/{id}/trigger:
    post:
      tags: [Settings]
      operationId: hermesMirrorJobTrigger
      summary: Run a mirrored cron job on Hermes' next scheduler tick.
      description: |
        Returns as soon as Hermes has scheduled the run; it does not wait for
        output. The run is collected the usual way — poll
        `/v1/hermes/mirror/jobs/{id}/runs`, or let the refresh worker collect it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The job as Hermes stores it afterwards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesMirroredJobDTO' }
        '404':
          description: The job is not mirrored for this tenant (`hermes_job_not_found`).

  /v1/hermes/mirror/jobs/{id}/runs:
    get:
      tags: [Settings]
      operationId: hermesMirrorJobRuns
      summary: Runs LuminaVault has collected for this job, newest first.
      description: |
        Reads stored `hermes_job_runs` rows only, so it answers while the
        tenant's Hermes is offline. `vaultFilePath` is the file the run's
        output was filed as; `collectedAt` is when the collector last pulled
        this job. Use `POST /v1/hermes/mirror/jobs/{id}/collect` to refresh
        before reading.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Collected runs, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesJobRunsResponse' }
        '400':
          description: '`hermes_mirror_invalid_path`.'

  /v1/hermes/mirror/jobs/install-compile:
    post:
      tags: [Settings]
      operationId: hermesMirrorInstallCompileJob
      summary: Install the nightly `luminavault-nightly-compile` kb-compile job on the tenant's Hermes (idempotent by name).
      responses:
        '200':
          description: Job id and schedule; `created` is false when it already existed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesCompileJobInstallResultDTO' }
        '502':
          description: Hermes refused or was unreachable (stable code in `message`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/hermes/mirror/jobs/{id}/collect:
    post:
      tags: [Settings]
      operationId: hermesMirrorCollectJobRuns
      summary: Pull this job's finished runs from the tenant's Hermes now.
      description: |
        Idempotent — runs already stored (matched on Hermes' own run key) are
        skipped, so calling this repeatedly costs one listing and no output
        reads. Each new run's non-empty output is written to the vault as
        `raw/jobs/<job-slug>/<yyyy-MM-dd-HHmm>.md` (provenance `hermes-job`)
        and logged as a `hermes` skill run so it appears on the Today feed.
        Caps: 50 runs per job per call, 256 KiB of stored output per run —
        `truncated: true` means the listing filled the cap. Runs still in
        flight are left for a later call. The background refresh worker runs
        the same pass every tick; this route only shortens the wait.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Counts for this pass and the job's new high-water mark.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesJobCollectResultDTO' }
        '400':
          description: '`hermes_job_id_required` or `hermes_mirror_invalid_path`.'
        '404':
          description: The job is not mirrored for this tenant (`hermes_job_not_found`).
        '409':
          description: Another mirror operation is running for this tenant (`hermes_mirror_busy`).
        '502':
          description: Hermes refused or was unreachable (stable code in `message`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/hermes/mirror/vault/import:
    post:
      tags: [Settings]
      operationId: hermesMirrorVaultImport
      summary: Import the KB vault on the tenant's Hermes into LuminaVault (markdown only, resumable).
      description: |
        Detects the vault (`.kb/manifest.json`, or `raw/` + `wiki/`, under the
        dashboard working directory; `kb-config.json` pointer) unless
        `vaultPath` is given. Caps: 5000 files, 2 MiB each, 200 files per call
        — `truncated: true` means call again (or let the refresh worker
        continue) from `cursor`. Paths containing `..` are rejected.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HermesVaultImportRequest' }
      responses:
        '200':
          description: Import counts for this run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesVaultImportResultDTO' }
        '400':
          description: '`hermes_mirror_invalid_path` or `hermes_vault_path_not_found`.'
        '404':
          description: No vault detected (`hermes_vault_not_found`).
        '409':
          description: An import for this tenant is already running (`hermes_mirror_busy`).

  /v1/hermes/mirror/vault/create:
    post:
      tags: [Settings]
      operationId: hermesMirrorVaultCreate
      summary: Create the KB skeleton (`raw/`, `wiki/`, `.kb/`) on the tenant's Hermes and install the kb-* skills.
      responses:
        '200':
          description: Created (or already existing) vault; `installedSkills` lists skills added this call.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesVaultCreateResultDTO' }
        '502':
          description: Hermes refused or was unreachable (stable code in `message`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/hermes/mirror/vault/import-sessions:
    post:
      tags: [Settings]
      operationId: hermesMirrorImportSessions
      summary: Import past Hermes sessions as markdown transcripts and compile them into memory.
      description: |
        Newest-first; empty sessions are skipped; each transcript lands under
        the "Hermes Sessions" space as `sessions/<date>-<id>.md`. Caps 2000
        sessions / 1 MiB each / 100 per call — `truncated: true` means call
        again from `cursor`. A high-water mark keeps later runs incremental.
      responses:
        '200':
          description: Sessions imported this run and whether a compile was triggered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesSessionsImportResultDTO' }
        '409':
          description: An import for this tenant is already running (`hermes_mirror_busy`).
        '502':
          description: Hermes refused or was unreachable (stable code in `message`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/hermes/mirror/webhook:
    get:
      tags: [Settings]
      operationId: hermesMirrorWebhookGet
      summary: The tenant's inbound push credential (without the secret).
      responses:
        '200':
          description: Path, token and signing envelope. `secret` is never returned here.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesMirrorWebhookDTO' }
        '404':
          description: No webhook has been minted for this tenant (`hermes_webhook_not_configured`).
    post:
      tags: [Settings]
      operationId: hermesMirrorWebhookRotate
      summary: Mint (or replace) the inbound push credential for the tenant's Hermes.
      description: |
        Returns the signing `secret` exactly once — LuminaVault seals it and
        never hands it back. Store it, and the `path`, on the tenant's Hermes.

        Requires that Hermes to report `admin_config_rw`: without it the user
        cannot save the URL and secret on their own side, so a credential
        would be a dead end. Tenants on the managed Hermes always qualify;
        anything else degrades to `hermes_admin_config_rw_required` and keeps
        polling, which is the source of truth either way.
      responses:
        '200':
          description: The new credential, including the one-time `secret`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesMirrorWebhookDTO' }
        '409':
          description: The tenant's Hermes does not report `admin_config_rw` (`hermes_admin_config_rw_required`).

  /v1/hermes/mirror/webhook/{token}:
    post:
      tags: [Settings]
      operationId: hermesMirrorWebhookPush
      summary: Push endpoint for the tenant's Hermes — collect this job now.
      description: |
        Unauthenticated by construction: the sender is the user's own Hermes
        and holds no LuminaVault session, so the token in the path plus
        `X-Webhook-Signature-V2` — `hex(HMAC-SHA256(secret, "<timestamp>.<body>"))`
        over the raw body, with `X-Webhook-Timestamp` in unix seconds and a
        300 s window — is the whole gate. An unknown token, a bad signature
        and a stale or missing timestamp all answer the same 401 so a sender
        cannot probe for live tokens.

        This only shortens the wait: the push runs the same idempotent
        collect the background worker runs, keyed on Hermes' own run key, so
        a webhook that never arrives, arrives late or arrives twice changes
        latency and nothing else. A collect that could not run answers 200
        with zero counts rather than an error, because a 5xx would invite a
        retry loop over work the poller will do anyway.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HermesJobWebhookPayload' }
      responses:
        '200':
          description: Counts for the collect this push triggered; zeroes when it was deferred to the poller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesJobCollectResultDTO' }
        '400':
          description: '`hermes_webhook_invalid_payload` or `hermes_mirror_invalid_path`.'
        '401':
          description: Unknown token, bad signature, or a stale/missing timestamp (`hermes_webhook_unauthorized`).

  /v1/hermes/runs:
    post:
      tags: [Hermes Runs]
      operationId: hermesRunStart
      summary: Start an agent run on the tenant's Hermes.
      description: |
        Proxies `POST /v1/runs` on the tenant's Hermes gateway and persists
        the run — LuminaVault owns run history because the gateway keeps runs
        in memory for 300 s only. Returns as soon as Hermes has accepted the
        run; a server-side watcher then follows its SSE feed, persists every
        event, and pushes an `approval` notification when a tool call needs a
        decision. `501 hermes_runs_unsupported` when the tenant's Hermes does
        not report both `approval_events` and `run_events_sse`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HermesRunStartRequest' }
      responses:
        '202':
          description: Run accepted by Hermes and persisted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesRun' }
        '400': { description: 'Empty prompt (`prompt_required`).' }
        '402':
          description: Chat entitlement required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaywallResponse' }
        '404': { description: 'Referenced conversation not found (`conversation_not_found`).' }
        '429': { description: 'Rate limited, or too many concurrent runs (`hermes_runs_limit`).' }
        '501': { description: 'This Hermes has no runs API (`hermes_runs_unsupported`).' }
        '502': { description: 'Hermes gateway error (`hermes_runs_upstream_error`).' }
    get:
      tags: [Hermes Runs]
      operationId: hermesRunList
      summary: List the tenant's Hermes runs, newest first.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
        - name: conversationID
          in: query
          required: false
          description: |
            Narrow to the runs started by one conversation. This is how a chat
            client recovers after losing the stream that carried a run's id —
            it asks which runs belong to the conversation instead of scanning
            the tenant's whole history. Runs started from the Agent Runs screen
            have no conversation and never match. An unparseable value is
            treated as absent rather than rejected, so a malformed link
            degrades to the full list instead of a 400.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Persisted runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesRunListResponse' }

  /v1/hermes/runs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Hermes Runs]
      operationId: hermesRunGet
      summary: Read one run, including any pending approval.
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesRun' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/hermes/runs/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Hermes Runs]
      operationId: hermesRunEvents
      summary: Server-sent events for one run — persisted replay, then live.
      description: |
        `text/event-stream`. Every record is `event: hermes.run.event` with a
        JSON `HermesRunEvent` on the `data:` line; `: keepalive` comments hold
        the connection open while a run is thinking. Persisted events with
        `seq > after` are replayed first, so a client reconnecting with the
        `lastSeq` it already holds loses nothing and sees nothing twice. The
        stream closes once the run is terminal and fully drained.

        Terminal output. On a Hermes with LuminaVaultHermesAgent#14, the
        `terminal` tool's events carry extra payload fields, relayed verbatim:
        `tool.started` has `command` and `background`; `tool.completed` has
        `output` (the last 16k characters), `exit_code` and
        `output_truncated`. A background process the run started streams
        `terminal.output` events with `process_id` and `chunk`, coalesced by
        Hermes, and one final `truncated: true` once the run's 256k-character
        budget is spent. All of it is redacted upstream. An older Hermes sends
        none of these, so a client renders the tool row alone.
      parameters:
        - name: after
          in: query
          required: false
          description: Resume cursor — the highest `seq` the client already has.
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: SSE stream of run events.
          content:
            text/event-stream:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/hermes/runs/{id}/approval:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Hermes Runs]
      operationId: hermesRunApprove
      summary: Answer the tool-call approval a run is waiting on.
      description: |
        Forwards the choice to `POST /v1/runs/{hermesRunID}/approval` and
        clears the pending approval. `409 hermes_approval_not_pending` when
        nothing is waiting (including when the approval was already answered
        on another surface).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HermesRunApprovalRequest' }
      responses:
        '200':
          description: Choice accepted; the run resumes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesRun' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'No approval pending (`hermes_approval_not_pending`).' }
        '410': { description: 'Hermes expired the run (`hermes_run_expired`).' }
        '502': { description: 'Hermes gateway error (`hermes_runs_upstream_error`).' }

  /v1/hermes/runs/{id}/stop:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Hermes Runs]
      operationId: hermesRunStop
      summary: Stop a running agent run.
      description: |
        Hermes answers `stopping`; the terminal `run.cancelled` arrives on the
        watcher, so the returned run may still read `running`. When Hermes has
        already forgotten the run, LuminaVault marks it `stopped` itself.
      responses:
        '200':
          description: Stop requested (or the run was already terminal).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesRun' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { description: 'Hermes gateway error (`hermes_runs_upstream_error`).' }

  /v1/me/improvement:
    get:
      tags: [Self Improvement]
      operationId: improvementStatusGet
      summary: Read curator and SOUL reviewer settings and status.
      responses:
        '200':
          description: Current self-improvement status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprovementStatusDTO' }
    put:
      tags: [Self Improvement]
      operationId: improvementSettingsPut
      summary: Replace tenant self-improvement settings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImprovementSettingsUpdateRequest' }
      responses:
        '200':
          description: Updated status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprovementStatusDTO' }

  /v1/me/improvement/curator/runs:
    post:
      tags: [Self Improvement]
      operationId: improvementCuratorRun
      summary: Queue a live or dry-run curator pass.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImprovementRunRequest' }
      responses:
        '202':
          description: Run queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprovementRunAcceptedResponse' }

  /v1/me/improvement/runs:
    get:
      tags: [Self Improvement]
      operationId: improvementRunsList
      summary: List curator and SOUL review reports.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Run history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprovementRunsResponse' }

  /v1/me/improvement/runs/{id}:
    get:
      tags: [Self Improvement]
      operationId: improvementRunGet
      summary: Read one run and its report.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: Run detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprovementRunDTO' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/improvement/runs/{id}/rollback:
    post:
      tags: [Self Improvement]
      operationId: improvementRunRollback
      summary: Restore the guarded backup for a completed curator run.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: Run marked rolled back.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprovementRollbackResponse' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/me/improvement/resources:
    get:
      tags: [Self Improvement]
      operationId: improvementResourcesList
      summary: List curator-managed skills and jobs, including pinned state.
      responses:
        '200':
          description: Curator resources.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprovementSkillsResponse' }

  /v1/me/improvement/resources/{kind}/{name}:
    patch:
      tags: [Self Improvement]
      operationId: improvementResourcePin
      summary: Pin or unpin a skill or job. Pinning a job also protects its backing skill.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ImprovementResourceKind' }
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImprovementSkillPinRequest' }
      responses:
        '200':
          description: Updated resource.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprovementSkillDTO' }

  /v1/me/improvement/soul/reviews:
    post:
      tags: [Self Improvement]
      operationId: improvementSoulReview
      summary: Queue a conservative SOUL.md review. Changes always require approval.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SoulReviewRequest' }
      responses:
        '202':
          description: Review queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprovementRunAcceptedResponse' }

  /v1/me/improvement/changes:
    get:
      tags: [Self Improvement]
      operationId: improvementChangesList
      summary: List pending and historical SOUL proposals.
      responses:
        '200':
          description: Change proposals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprovementChangesResponse' }

  /v1/me/improvement/changes/{id}/approve:
    post:
      tags: [Self Improvement]
      operationId: improvementChangeApprove
      summary: Apply a non-stale SOUL.md proposal.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: Applied proposal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprovementDecisionResponse' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/me/improvement/changes/{id}/reject:
    post:
      tags: [Self Improvement]
      operationId: improvementChangeReject
      summary: Reject a pending SOUL.md proposal.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: Rejected proposal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprovementDecisionResponse' }

  # ─────────── Me — External LLM provider credentials (HER-252) ──────────

  /v1/me/providers:
    get:
      tags: [Me]
      operationId: providersList
      summary: List per-user external LLM provider credentials (HER-252).
      description: |
        Returns one row per supported provider. Plaintext credentials are
        never echoed — only `hasCredential` and metadata. Providers with
        no row are returned with `hasCredential: false`.
      responses:
        '200':
          description: List of provider credential records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderCredentialsListResponse' }

  /v1/me/providers/catalog:
    get:
      tags: [Me]
      operationId: providersCatalog
      summary: Static per-provider facts for rendering a BYO key form.
      description: |
        Display name, default base URL, whether a base URL or an API key is
        actually required, an example key format, and where keys are issued.

        Carries no tenant state — pair it with `GET /v1/me/providers`, which
        says what this user has stored. `available` is false when this
        deployment has no adapter registered for the provider, so a client
        should not offer to collect a key that nothing here can spend.
      responses:
        '200':
          description: The provider catalog for this deployment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderCatalogResponse' }

  /v1/me/providers/{provider}:
    parameters:
      - in: path
        name: provider
        required: true
        schema: { $ref: '#/components/schemas/ProviderID' }
    put:
      tags: [Me]
      operationId: providerCredentialPut
      summary: Upsert credentials for a provider.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderCredentialPutRequest' }
      responses:
        '200':
          description: Updated record (verifiedAt + lastFailure* reset).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderCredentialDTO' }
        '400':
          description: Validation error (api_key_required / base_url_required / invalid_base_url).
    delete:
      tags: [Me]
      operationId: providerCredentialDelete
      summary: Drop credentials for a provider.
      responses:
        '204':
          description: Row deleted (idempotent — 204 even if absent).

  /v1/me/providers/{provider}/test:
    parameters:
      - in: path
        name: provider
        required: true
        schema: { $ref: '#/components/schemas/ProviderID' }
    post:
      tags: [Me]
      operationId: providerCredentialTest
      summary: Probe the credential with a 1-token chat request.
      description: |
        Builds a one-off adapter using the stored credential and sends a
        `max_tokens: 1` request. On 2xx the row's `verifiedAt` is stamped
        and `lastFailure*` cleared. On any other outcome the row is
        marked failed and a stable code is returned.
      responses:
        '200':
          description: Verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderTestResponse' }
        '400':
          description: |
            Stable code in `message`:
            `no_credential` (no stored row) /
            `unsupported_provider` (unknown path param).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502':
          description: |
            Probe failed. Stable code in `message`:
            `credit_exhausted` / `rate_limit` / `upstream_error` /
            `upstream_rejected` / `network` / `tls_error` / `timeout`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/me/providers/{provider}/models:
    parameters:
      - in: path
        name: provider
        required: true
        schema: { $ref: '#/components/schemas/ProviderID' }
    get:
      tags: [Me]
      operationId: providerModelsList
      summary: List models for a provider, fetched live when possible.
      description: |
        For OpenAI-compatible providers (xai, nvidia, openai, openRouter,
        nous) the server fetches the upstream `/v1/models` using the user's
        stored credential and returns the live list (`fetchedLive: true`) —
        keeping the client picker current with rotating model lists such as
        Nous free models. On any failure, or for providers without a
        standard `/v1/models` (anthropic, gemini, ollama), it returns the
        offline curated catalog with `fetchedLive: false`. Always 200.
      responses:
        '200':
          description: Model list (live or fallback).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderModelsResponse' }
        '404':
          description: '`unsupported_provider` — unknown path param.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ─────────────── Me — Hermes Messaging Gateways (HER-241) ────────────────

  /v1/me/hermes-gateways:
    get:
      tags: [Me]
      operationId: hermesGatewaysList
      summary: List supported Hermes messaging gateways + per-user status (HER-241).
      description: |
        Returns one row per supported gateway (telegram, discord, slack,
        whatsapp). Plaintext config is never echoed — only `hasConfig`
        and metadata. Gateways with no stored row are returned with
        `status: not_configured` and `hasConfig: false`.
      responses:
        '200':
          description: List of gateway catalog entries with status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesGatewaysListResponse' }

  /v1/me/hermes-gateways/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { $ref: '#/components/schemas/HermesGatewayID' }
    get:
      tags: [Me]
      operationId: hermesGatewayGet
      summary: Get a single gateway's catalog entry + status.
      responses:
        '200':
          description: Gateway catalog entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesGatewayCatalogEntry' }
        '404':
          description: Unsupported gateway id (`unsupported_gateway`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    put:
      tags: [Me]
      operationId: hermesGatewayPut
      summary: Upsert encrypted config for a gateway.
      description: |
        Validates every required field for the chosen gateway. On
        success the row is created or updated and `status` becomes
        `configured`. `verifiedAt` and `lastFailure*` are reset so a
        new /test call is required to confirm reachability.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HermesGatewayPutRequest' }
      responses:
        '200':
          description: Updated catalog entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesGatewayCatalogEntry' }
        '400':
          description: |
            Stable code in `message`:
            `missing_field:<key>` (required field empty).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [Me]
      operationId: hermesGatewayDelete
      summary: Drop a gateway's stored config.
      responses:
        '204':
          description: Row deleted (idempotent — 204 even if absent).

  /v1/me/hermes-gateways/{id}/test:
    parameters:
      - in: path
        name: id
        required: true
        schema: { $ref: '#/components/schemas/HermesGatewayID' }
    post:
      tags: [Me]
      operationId: hermesGatewayTest
      summary: Probe the user's Hermes server's `/v1/health` for reachability.
      description: |
        Hermes today exposes no gateway-admin HTTP API; this endpoint
        only confirms the user's Hermes server is reachable and
        responds 2xx on `/v1/health`. On success `verifiedAt` is
        stamped; on failure `lastFailureCode` is recorded. The
        gateway's own operational state must be checked via the
        `hermes gateway status` CLI on the Hermes host.
      responses:
        '200':
          description: Probe result (200 even on failure — see `ok`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesGatewayTestResponse' }
        '400':
          description: |
            Stable code in `message`:
            `hermes_not_configured` (user has no resolved Hermes endpoint).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/me/hermes-gateways/apply:
    post:
      tags: [Me]
      operationId: hermesGatewaysApply
      summary: Apply all configured gateways to the running Hermes container.
      description: |
        Re-seeds the tenant's `/opt/data/.env` from the saved gateway rows
        (token env-vars) and recreates the container so the new config takes
        effect, streaming progress over SSE. Detached: returns a job id
        immediately; observe via the stream or by polling the status route.
      responses:
        '200':
          description: Apply job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartHermesGatewayApplyResponse' }
        '404':
          description: '`apply_unavailable` — per-tenant containers are disabled.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: An apply is already in progress for this tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/me/hermes-gateways/apply/current:
    get:
      tags: [Me]
      operationId: hermesGatewaysApplyCurrent
      summary: Most recent in-flight (or last) apply job, for reconnect.
      responses:
        '200':
          description: Job snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesGatewayApplyJobStatus' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/hermes-gateways/apply/{jobID}:
    get:
      tags: [Me]
      operationId: hermesGatewaysApplyStatus
      summary: Full status snapshot for one apply job (poll fallback).
      parameters:
        - in: path
          name: jobID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Job snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesGatewayApplyJobStatus' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/hermes-gateways/apply/{jobID}/stream:
    get:
      tags: [Me]
      operationId: hermesGatewaysApplyStream
      summary: SSE stream of HermesGatewayApplyEvent for one job.
      description: >
        `text/event-stream`; each `data:` line is one JSON-encoded
        `HermesGatewayApplyEvent` (discriminated by `type`), blank-line
        terminated.
      parameters:
        - in: path
          name: jobID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/hermes-gateways/whatsapp/pair:
    post:
      tags: [Me]
      operationId: hermesGatewaysWhatsAppPair
      summary: Start a WhatsApp QR pairing session.
      description: |
        WhatsApp has no enterable credential — it pairs via the interactive
        `hermes whatsapp` CLI. This runs that CLI inside the tenant's Hermes
        container and returns a `sessionID`; the client then opens the SSE
        stream to receive the QR (Unicode block-art) and live status until the
        device is linked. The user scans the QR with their phone's
        *WhatsApp → Linked Devices*.
      responses:
        '200':
          description: Pairing session started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartWhatsAppPairResponse' }
        '404':
          description: '`whatsapp_pairing_unavailable` — per-tenant containers are disabled.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/me/hermes-gateways/whatsapp/pair/{sessionID}/stream:
    get:
      tags: [Me]
      operationId: hermesGatewaysWhatsAppPairStream
      summary: SSE stream of HermesWhatsAppPairEvent for a pairing session.
      description: >
        `text/event-stream`; each `data:` line is one JSON-encoded
        `HermesWhatsAppPairEvent` (discriminated by `type`: `qr` | `status` |
        `linked` | `error`), blank-line terminated. The latest QR + status are
        replayed on connect.
      parameters:
        - in: path
          name: sessionID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        '400':
          description: '`invalid_session_id`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/me/hermes-gateways/whatsapp/session:
    delete:
      tags: [Me]
      operationId: hermesGatewaysWhatsAppUnlink
      summary: Unlink WhatsApp (delete the persisted session) and restart.
      description: |
        Deletes the tenant's persisted WhatsApp session from the container
        volume and recreates the container so Hermes drops the connection.
        Returns the refreshed gateway entry (status back to `not_configured`).
      responses:
        '200':
          description: Updated WhatsApp gateway entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HermesGatewayCatalogEntry' }
        '404':
          description: '`whatsapp_pairing_unavailable` — per-tenant containers are disabled.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ─────────────── Me — LLM routing preferences (HER-252) ────────────────

  /v1/me/preferences/llm:
    get:
      tags: [Me]
      operationId: llmPreferencesGet
      summary: Get per-user primary model + fallback chain (HER-252).
      description: |
        Always returns 200. If no row exists, returns a deployment-default
        primary so clients have something sensible to render.
      responses:
        '200':
          description: Preference snapshot (real or default).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LLMPreferencesGetResponse' }
    put:
      tags: [Me]
      operationId: llmPreferencesPut
      summary: Upsert the primary model + ordered fallback chain.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LLMPreferencesPutRequest' }
      responses:
        '200':
          description: Updated snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LLMPreferencesGetResponse' }
        '400':
          description: |
            Validation error in `message`:
            `primary_model_required` / `fallback_model_required`, or
            `primary_model_placeholder` / `fallback_model_placeholder` when a
            BYOK save carries what a managed read shows in place of a model
            (the brain label, or `openRouter/auto`). A BYOK primary carrying it
            keeps the user's stored BYOK model on the same provider instead,
            when there is one; the managed model is never substituted.

  # ─────────────── Cerberus Router ─────────────────

  /v1/router:
    get:
      tags: [LLM]
      operationId: routerProfilesList
      summary: List routing profiles and the active user default.
      responses:
        '200':
          description: Router profiles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterProfilesResponse' }
    post:
      tags: [LLM]
      operationId: routerProfilesCreate
      summary: Create a custom routing profile (Pro or Ultimate).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouterProfileWriteRequest' }
      responses:
        '200':
          description: Created profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterProfileDTO' }
        '400':
          description: |
            Validation failed. `router_placeholder_route` means a BYOK save
            carried the `openRouter/auto` placeholder that this API shows in
            place of a managed profile's routes, and the tenant has no saved
            BYOK model to put in its place. When one is saved, the placeholder
            is replaced by that primary and its fallbacks instead.

  /v1/router/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [LLM]
      operationId: routerProfilesUpdate
      summary: Replace a routing profile using optimistic revision checking.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouterProfileWriteRequest' }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterProfileDTO' }
        '400':
          description: |
            Validation failed. `router_placeholder_route` means a BYOK save
            carried the `openRouter/auto` placeholder that this API shows in
            place of a managed profile's routes, and the tenant has no saved
            BYOK model to put in its place. When one is saved, the placeholder
            is replaced by that primary and its fallbacks instead.
        '409': { description: Revision conflict or attempt to delete the default profile. }
    delete:
      tags: [LLM]
      operationId: routerProfilesDelete
      summary: Delete a non-default custom profile.
      responses:
        '204': { description: Deleted. }

  /v1/router/catalog:
    get:
      tags: [LLM]
      operationId: routerCatalog
      summary: Versioned model/task catalog and caller entitlements.
      responses:
        '200':
          description: Router catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterCatalogResponse' }

  /v1/router/bindings:
    get:
      tags: [LLM]
      operationId: routerBindingsList
      summary: List user, Space, and Job profile bindings.
      responses:
        '200':
          description: Bindings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterBindingsResponse' }

  /v1/router/bindings/{scope}/{scopeID}:
    parameters:
      - in: path
        name: scope
        required: true
        schema: { $ref: '#/components/schemas/RouterBindingScope' }
      - in: path
        name: scopeID
        required: true
        schema: { type: string }
    put:
      tags: [LLM]
      operationId: routerBindingPut
      summary: Assign a profile to a Space or Job.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouterBindingPutRequest' }
      responses:
        '200':
          description: Binding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterBindingDTO' }
    delete:
      tags: [LLM]
      operationId: routerBindingDelete
      summary: Remove a Space or Job profile override.
      responses:
        '204': { description: Removed. }

  /v1/router/dashboard:
    get:
      tags: [LLM]
      operationId: routerDashboard
      summary: Month-to-date prompt-free routing, cost, and performance analytics.
      responses:
        '200':
          description: Router analytics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterDashboardResponse' }

  /v1/router/parallel/executions/stream:
    post:
      tags: [LLM]
      operationId: parallelExecutionStream
      summary: Run an Ultimate-tier multi-model execution and stream progress.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParallelExecutionRequestDTO' }
      responses:
        '200':
          description: Server-Sent Events stream of `QueryStreamEvent`.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/QueryStreamEvent' }

  /v1/router/parallel/executions:
    get:
      tags: [LLM]
      operationId: parallelExecutionsList
      summary: List the caller's recent multi-model executions.
      responses:
        '200':
          description: Execution history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParallelExecutionsResponse' }

  /v1/router/parallel/executions/{executionID}:
    parameters:
      - in: path
        name: executionID
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [LLM]
      operationId: parallelExecutionDetail
      summary: Fetch candidates, revisions, and synthesis for one execution.
      responses:
        '200':
          description: Execution detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParallelExecutionDetailDTO' }
    delete:
      tags: [LLM]
      operationId: parallelExecutionDelete
      summary: Delete an execution and all persisted outputs.
      responses:
        '204': { description: Deleted. }

  /v1/router/synthesis-presets:
    get:
      tags: [LLM]
      operationId: synthesisPresetsList
      responses:
        '200':
          description: Saved synthesis prompts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SynthesisPresetsResponse' }
    post:
      tags: [LLM]
      operationId: synthesisPresetCreate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SynthesisPresetWriteRequest' }
      responses:
        '200':
          description: Created preset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SynthesisPresetDTO' }

  /v1/router/synthesis-presets/{presetID}:
    parameters:
      - in: path
        name: presetID
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [LLM]
      operationId: synthesisPresetUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SynthesisPresetWriteRequest' }
      responses:
        '200':
          description: Updated preset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SynthesisPresetDTO' }
    delete:
      tags: [LLM]
      operationId: synthesisPresetDelete
      responses:
        '204': { description: Deleted. }

  # ─────────────── Me — Chat preferences + connections UX ───────────────

  /v1/me/chat-preferences:
    get:
      tags: [Me]
      operationId: chatPreferencesGet
      summary: Get cross-device chat behavior preferences.
      responses:
        '200':
          description: Chat preference snapshot, defaulted when no row exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatPreferencesGetResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Me]
      operationId: chatPreferencesPut
      summary: Upsert cross-device chat behavior preferences.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatPreferencesPutRequest' }
      responses:
        '200':
          description: Updated chat preference snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatPreferencesGetResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/me/preferences/hybrid-execution:
    get:
      tags: [Me]
      operationId: hybridExecutionPreferencesGet
      summary: Get the cross-device local/cloud routing profile.
      responses:
        '200':
          description: Hybrid execution preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HybridRoutingPreferencesDTO' }
    put:
      tags: [Me]
      operationId: hybridExecutionPreferencesPut
      summary: Replace the cross-device local/cloud routing profile.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HybridRoutingPreferencesDTO' }
      responses:
        '200':
          description: Updated hybrid execution preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HybridRoutingPreferencesDTO' }
  /v1/me/agent-connections:
    get:
      tags: [Me]
      operationId: agentConnectionsList
      summary: List the caller's live agent keys for MCP.
      description: |
        Revoked keys are omitted. The plaintext token is never returned
        after the response that issued it; rows carry only `tokenPrefix`.
      responses:
        '200':
          description: Live keys, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConnectionsListResponse' }
    post:
      tags: [Me]
      operationId: agentConnectionIssue
      summary: Issue a new agent key and its setup snippet.
      description: |
        The response is the only place the plaintext `token` ever appears.
        `access` defaults to `read` and `allowPersonalData` to `false`: a new
        key can search and read the vault and nothing more until the user
        grants more.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentConnectionIssueRequest' }
      responses:
        '200':
          description: The new key, its plaintext token, and setup instructions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConnectionIssuedResponse' }
        '400':
          description: "`name_required` or `name_too_long`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/me/agent-connections/preview:
    get:
      tags: [Me]
      operationId: agentConnectionPreview
      summary: Setup snippet for a client kind, with a placeholder token.
      description: Issues nothing. Used to show the steps before a key exists.
      parameters:
        - in: query
          name: clientKind
          required: false
          schema: { $ref: '#/components/schemas/AgentClientKind' }
      responses:
        '200':
          description: Setup instructions carrying `AgentConnectionService.placeholderToken`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConnectionSetupDTO' }
        '400':
          description: "`invalid_client_kind`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/me/agent-connections/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Me]
      operationId: agentConnectionUpdate
      summary: Change a key's personal-data grant, its access, or both.
      description: |
        Fields left out stay as they are. A body naming neither field is
        rejected. A `read` key gets an MCP tool error from every tool that
        writes (`index`, `calendar_create`, `reminder_create`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentConnectionUpdateRequest' }
      responses:
        '200':
          description: The updated key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConnectionDTO' }
        '400':
          description: "`invalid_id` or `nothing_to_update`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: No live key with this id for the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [Me]
      operationId: agentConnectionRevoke
      summary: Revoke a key. It stops authenticating immediately.
      responses:
        '204':
          description: Revoked.
        '404':
          description: No live key with this id for the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/me/connections:
    get:
      tags: [Me]
      operationId: connectionsSummary
      summary: Unified Settings connections summary.
      responses:
        '200':
          description: Provider, gateway, linked-account, calendar, plugin, and server connection statuses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionsSummaryResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/me/connections/test-all:
    post:
      tags: [Me]
      operationId: connectionsTestAll
      summary: Run the unified connection status check and record diagnostic events.
      responses:
        '200':
          description: Per-connection test/status results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionsTestAllResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/me/connections/events:
    get:
      tags: [Me]
      operationId: connectionDiagnosticEvents
      summary: Recent unified connection diagnostic events.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Recent diagnostic events, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionDiagnosticEventsResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ───────────────────────────── Onboarding ─────────────────────────────

  /v1/onboarding:
    get:
      tags: [Onboarding]
      operationId: onboardingGet
      summary: Server-tracked resumable onboarding state (HER-93).
      responses:
        '200':
          description: Onboarding state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingStateDTO' }
    patch:
      tags: [Onboarding]
      operationId: onboardingPatch
      summary: Latch onboarding flags (one-way) or set the guided-start dismissal (two-way).
      description: |
        The seven completion flags are one-way latches: only `true` is
        accepted and `false` is rejected with 400.

        `guidedStartDismissed` is the one exception — it is two-way.
        `true` stamps `guidedStartDismissedAt`, `false` clears it back to
        null so Settings > "Show me around" can bring the card back.

        Note that clients must never PATCH `firstCaptureCompleted`,
        `firstKBCompileCompleted` or `firstQueryCompleted` for the guided
        start card: the server latches those itself as a side effect of
        the real work (upload/link capture, memory compile, chat reply).
        See `LuminaVaultShared/docs/guided-start.md`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingPatchRequest' }
      responses:
        '200':
          description: Updated state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingStateDTO' }
        '400':
          description: Attempted to set a flag to false (latches are one-way).

  # ────────────────────────────── Devices ───────────────────────────────

  /v1/devices:
    post:
      tags: [Devices]
      operationId: deviceRegister
      summary: Register an APNS / FCM device token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegistrationRequest' }
      responses:
        '200':
          description: Registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRegistrationResponse' }

  /v1/devices/command/{id}/result:
    post:
      tags: [Devices]
      operationId: deviceCommandResult
      summary: App posts a device-RPC command's result (Apple Integration P0b).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCommandResult' }
      responses:
        '200': { description: Result accepted. }

  /v1/devices/commands/pending:
    get:
      tags: [Devices]
      operationId: deviceCommandsPending
      summary: Phone writes queued while the app was closed, oldest first.
      description: |
        A `reminder_create` or `calendar_create` that could not reach the
        phone live is queued for 24 hours and announced with a push. The app
        reads this on open, runs each command once, and posts each result to
        `/v1/devices/command/{id}/result`, which removes it from this list.
      responses:
        '200':
          description: Pending commands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingDeviceCommandsResponse' }

  /v1/devices/{token}:
    delete:
      tags: [Devices]
      operationId: deviceUnregister
      summary: Unregister a device token.
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Unregistered.

  # ────────────────────────────── Account ───────────────────────────────

  /v1/account:
    delete:
      tags: [Account]
      operationId: accountDelete
      summary: GDPR right-to-erasure (HER-92).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountDeleteRequest' }
      responses:
        '204':
          description: Account wiped.
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ────────────────────────────── Billing ───────────────────────────────

  /v1/billing/revenuecat-webhook:
    post:
      tags: [Billing]
      operationId: billingRevenueCatWebhook
      summary: RevenueCat server-to-server webhook (HER-184).
      security:
        - revenueCatWebhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevenueCatWebhookBody' }
      responses:
        '204':
          description: Event ingested.
        '401':
          description: Bad webhook secret.
        '503':
          description: Webhook disabled (revenuecat.webhookSecret empty).

  # ──────────────────────────────── LLM ─────────────────────────────────

  /v1/llm/chat:
    post:
      tags: [LLM]
      operationId: llmChat
      summary: Chat completion. Routes via TableModelRouter; BYO Hermes-aware.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: OpenAI-compatible chat-completions response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
        '402':
          description: Entitlement / billing block.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaywallResponse' }
        '403':
          description: |
            Policy block before upstream LLM call. When BYOK mode is active and
            the tenant has no usable provider credentials, returns
            `byok_keys_required` with CTA hints (`add_key`, `switch_to_managed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredAPIErrorEnvelope'
              examples:
                byokKeysRequired:
                  value:
                    error:
                      code: byok_keys_required
                      message: Add an LLM API key in Settings (OpenRouter recommended for Auto) or switch to Managed mode.
                      cta: [add_key, switch_to_managed]
        '429':
          description: |
            Rate-limit exceeded; the free fallback lane's daily allowance is
            spent (`free_lane_exhausted`); or a trial account's daily token
            allowance is spent (`usage_cap_exceeded`). The free lane is the
            forced route for users who are neither paying nor using their own
            key. Both allowances reset at UTC midnight. Honour `Retry-After`.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredAPIErrorEnvelope'
              examples:
                freeLaneExhausted:
                  value:
                    error:
                      code: free_lane_exhausted
                      message: You've used today's free messages. Upgrade for the full brain, or add your own API key in Settings to keep going now.
                      cta: [upgrade, add_key]
                      retryAfterSeconds: 18000
                usageCapExceeded:
                  value:
                    error:
                      code: usage_cap_exceeded
                      message: You've reached today's usage limit. Upgrade for more, or add your own API key in Settings to keep going now.
                      cta: [upgrade, add_key]
                      retryAfterSeconds: 18000
        '502':
          description: LLM upstream rejected, was unreachable, or all providers exhausted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamError'
        '503':
          description: |
            The free fallback lane was the only route open to this caller and
            none of its providers is configured (`free_lane_unavailable`). This
            is not exhaustion: no allowance was spent and nothing resets, so
            there is no `Retry-After` and no `retryAfterSeconds`. `cta` holds
            only the actions that would work for this caller: `upgrade` for
            free and lapsed accounts, `switch_to_managed` for paying accounts
            in BYOK mode, and `add_key` always. On the streaming endpoints the
            same condition arrives as an SSE `error` event carrying `message`
            only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredAPIErrorEnvelope'
              examples:
                freeLaneUnavailable:
                  value:
                    error:
                      code: free_lane_unavailable
                      message: Free messages are unavailable right now. Add your own API key in Settings to keep going.
                      cta: [upgrade, add_key]
        '504':
          description: LLM upstream timed out. Safe to retry once after retry_after_ms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamError'

  /v1/transcribe:
    post:
      tags: [LLM]
      operationId: llmTranscribe
      # The spec previously declared multipart/form-data here while the
      # implementation has always read a raw body. Corrected in favour of the
      # implementation: no client generated from this spec was calling it, and
      # the OpenAI-shaped /v1/audio/transcriptions below now covers the
      # multipart case properly.
      summary: Speech-to-text (HER-203). Raw audio body, 10 MB cap.
      description: >-
        Backed by the cluster's own transcription service by default
        (whisper.horus.svc.cluster.local), which is free per request and keeps
        audio inside the cluster. The provider is an OpenAI-compatible base
        URL, so moving to a hosted endpoint is configuration, not code.
      parameters:
        - $ref: '#/components/parameters/LuminaChannelHeader'
      requestBody:
        required: true
        content:
          audio/m4a:   { schema: { type: string, format: binary } }
          audio/mp4:   { schema: { type: string, format: binary } }
          audio/wav:   { schema: { type: string, format: binary } }
          audio/mpeg:  { schema: { type: string, format: binary } }
          audio/mpga:  { schema: { type: string, format: binary } }
          audio/webm:  { schema: { type: string, format: binary } }
          audio/ogg:   { schema: { type: string, format: binary } }
          audio/opus:  { schema: { type: string, format: binary } }
          audio/flac:  { schema: { type: string, format: binary } }
      responses:
        '200':
          description: Transcription result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscribeResponse' }
        '413':
          description: Audio body exceeded the 10 MB cap.
        '415':
          description: Content-Type was not an accepted audio format.

  /v1/audio/transcriptions:
    post:
      tags: [LLM]
      operationId: openAIAudioTranscriptions
      summary: >-
        Speech-to-text in OpenAI's wire format. Lets a tenant's Hermes
        container point its OpenAI speech client at LuminaVault instead of at
        a provider directly, so voice spend passes through entitlement, rate
        limiting and usage metering.
      description: >-
        Errors use OpenAI's envelope ({"error":{"message",...}}) rather than
        the LuminaVault error shape, because the OpenAI SDK reads
        error.message and callers surface it to end users. Audio format is
        resolved from the file part's filename extension first and its
        Content-Type second. Accepts up to 25 MB.
      parameters:
        - $ref: '#/components/parameters/LuminaChannelHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/TranscribeMultipartRequest' }
      responses:
        '200':
          description: >-
            Transcript. Shape follows the request's response_format:
            {"text": ...} for json, the verbose object for verbose_json, and a
            text/plain body for text, srt and vtt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAITranscriptionJSON' }
            text/plain:
              schema: { type: string }
        '400':
          description: Malformed multipart body, missing file part, or unsupported format.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIErrorEnvelope' }
        '413':
          description: Audio file exceeded the 25 MB cap.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIErrorEnvelope' }
        '429':
          description: Voice rate limit or daily allowance exhausted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIErrorEnvelope' }

  /v1/audio/speech:
    post:
      tags: [LLM]
      operationId: openAIAudioSpeech
      summary: Text-to-speech in OpenAI's wire format. Not yet implemented.
      description: >-
        Mounted but returns 501. Tenant containers are configured to send
        synthesis here on purpose: Hermes treats any unrecognised TTS provider
        name as its free, unmetered Edge TTS fallback, so pointing at a route
        that refuses cleanly is what makes "spoken replies are off" actually
        true.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenAISpeechRequest' }
      responses:
        '501':
          description: Spoken replies are not enabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIErrorEnvelope' }

  /v1/tts:
    post:
      tags: [LLM]
      operationId: llmTTS
      summary: Text-to-speech (HER-204). Returns audio/mpeg.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TTSRequest' }
      responses:
        '200':
          description: MP3 audio stream.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary

  /v1/vision/embed:
    post:
      tags: [LLM]
      operationId: llmVisionEmbed
      summary: Image embedding (HER-205). Returns a float vector.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisionEmbedRequest' }
      responses:
        '200':
          description: Embedding vector.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisionEmbedResponse' }

  /v1/vision/search:
    post:
      tags: [LLM]
      operationId: llmVisionSearch
      summary: Find the memories nearest an image (HER-205 follow-up).
      description: |
        Embeds the image and runs its vector against `memories.embedding`,
        which `/v1/vision/embed` already documents itself as compatible with.
        No OCR step: image and memory vectors share a space by construction,
        so there is no text in the middle to mistranslate the picture.

        Raw image body, same media types and 8 MB cap as `/v1/vision/embed`.
      parameters:
        - in: query
          name: limit
          description: 1–50, default 10. Out-of-range values are rejected rather than clamped.
          schema: { type: integer, default: 10 }
      requestBody:
        required: true
        content:
          image/png:  { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          image/heic: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: Nearest memories, closest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisionSearchResponse' }
        '400':
          description: limit out of range.
        '415':
          description: Unsupported image media type.
        '413':
          description: Image body exceeded the 8 MB cap.
        '503':
          description: No vision embed provider configured.

  # ────────────────────────────── Memory ────────────────────────────────

  /v1/memory:
    get:
      tags: [Memory]
      operationId: memoryList
      summary: List memories for the authenticated user.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: tag
          schema: { type: string }
          description: HER-18 — filter to memories carrying this tag.
        - in: query
          name: reviewState
          schema: { type: string }
          description: |
            HER-290 — comma-separated subset of `auto | pending | approved | rejected`
            (e.g. `pending` or `pending,approved`). When omitted, the default
            returns all states except `rejected`.
        - in: query
          name: healthFilter
          schema:
            type: string
            enum: [review-overdue, pending, unorganized, unused]
          description: Actionable memory-health queue used by analytics recommendations.
        - in: query
          name: kind
          schema: { $ref: '#/components/schemas/MemoryKind' }
          description: Only memories of this kind. Unclassified memories never match.
        - in: query
          name: space
          schema: { type: string }
          description: A Space slug, or `inbox` for unfiled memories. 404 for an unknown slug.
      responses:
        '200':
          description: Memory page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryListResponse' }

  /v1/memory/upsert:
    post:
      tags: [Memory]
      operationId: memoryUpsert
      summary: Capture a memory (creates or updates by content hash).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryUpsertRequest' }
      responses:
        '200':
          description: Stored memory.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryDTO' }

  /v1/memory/search:
    post:
      tags: [Memory]
      operationId: memorySearch
      summary: Semantic + lexical memory search.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemorySearchRequest' }
      responses:
        '200':
          description: Ranked results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemorySearchResponse' }

  /v1/memory/{id}:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    get:
      tags: [Memory]
      operationId: memoryGet
      summary: Fetch a single memory.
      responses:
        '200':
          description: Memory.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryDTO' }
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Memory]
      operationId: memoryPatch
      summary: Partial update.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryPatchRequest' }
      responses:
        '200':
          description: Updated memory.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryDTO' }
    delete:
      tags: [Memory]
      operationId: memoryDelete
      summary: Hard delete (does not archive).
      responses:
        '204':
          description: Deleted.

  /v1/memory/{id}/lineage:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    get:
      tags: [Memory]
      operationId: memoryLineage
      summary: Trace a memory's source vault file + enrichment chain.
      responses:
        '200':
          description: Lineage tree.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryLineageResponse' }

  /v1/memory/{id}/related:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    get:
      tags: [Memory]
      operationId: memoryRelated
      summary: Memories close to this one in meaning ("connects to N").
      description: |
        Nearest first, by the embedding already stored on the memory. Leaves
        out the memory itself, rejected memories, and anything past the
        cosine-distance floor (`memory.related.maxDistance`, default 0.45),
        so an empty list means nothing is really connected. Reading this
        does not count as a search hit.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 10, default: 5 }
      responses:
        '200':
          description: Related memories.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryRelatedResponse' }
        '404':
          description: No such memory in the caller's vault.

  /v1/memory/{id}/provenance:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    get:
      tags: [Memory]
      operationId: memoryProvenance
      summary: Append-only creator and updater history for a memory.
      responses:
        '200':
          description: Contribution timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryProvenanceResponse' }

  /v1/memory/{id}/review:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    post:
      tags: [Memory]
      operationId: memoryReview
      summary: Mark a memory as explicitly reviewed now.
      description: |
        Always sets `reviewedAt`, bumps `reviewCount` and records a
        `memory_reviewed` event. The optional body decides when it resurfaces
        in `GET /v1/me/resurface`: `kept` (the default, also what an empty
        body means) clears any schedule; `soon` schedules it 3 days out and
        `later` 30 days out (both lift an earlier `never`); `never` mutes it
        for good. The memory itself is never changed or removed.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryReviewRequest' }
      responses:
        '200':
          description: Updated review metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryReviewResponse' }
        '400':
          description: Body is present but not a valid `MemoryReviewRequest`.
        '404':
          description: No such memory in this vault.

  /v1/memory/facets:
    get:
      tags: [Memory]
      operationId: memoryFacets
      summary: Provider, model, source, and date filter options.
      responses:
        '200':
          description: Available memory facets for the current tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryFacetsResponse' }

  /v1/memory/graph:
    get:
      tags: [Memory]
      operationId: memoryGraph
      summary: Derived second-brain graph for the current tenant (HER-235).
      description: |
        Nodes are memories and (optionally) wiki pages — one per text-like
        vault file. Edges are derived on read: wikilink (memory→source page
        lineage), tag, space (shared Space), semantic (pgvector cosine), and
        temporal (same-day proximity). No edges are persisted in v1.
      parameters:
        - in: query
          name: limit
          description: Max number of nodes returned per source (memories, and wiki pages).
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
        - in: query
          name: similarityThreshold
          description: |
            Minimum cosine similarity (1 - pgvector distance) required for a
            semantic edge. Values in [0, 1]; 0 keeps every comparable pair.
          schema: { type: number, format: double, minimum: 0.0, maximum: 1.0, default: 0.78 }
        - in: query
          name: maxEdgesPerNode
          description: |
            After all edge kinds are merged, each node is pruned to its top-K
            strongest edges (undirected); explicit links win over inferred.
          schema: { type: integer, minimum: 1, maximum: 50, default: 8 }
        - in: query
          name: includeWikiPages
          description: When true (default), text-like vault files are added as wiki-page nodes.
          schema: { type: boolean, default: true }
        - in: query
          name: kinds
          description: |
            CSV of edge kinds to compute (wikilink,tag,space,semantic,temporal).
            Absent or empty computes every kind.
          schema: { type: string }
          example: wikilink,space,semantic
        - { in: query, name: providers, schema: { type: string }, description: "CSV provider identifiers." }
        - { in: query, name: models, schema: { type: string }, description: "CSV model identifiers." }
        - { in: query, name: sources, schema: { type: string }, description: "CSV memory source kinds." }
        - { in: query, name: createdAfter, schema: { type: string, format: date-time } }
        - { in: query, name: createdBefore, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Derived graph for the current tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryGraphResponse' }

  /v1/knowledge/graph:
    get:
      tags: [Memory]
      operationId: knowledgeGraph
      summary: Evidence-backed claim, entity, and event graph.
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 2000, default: 800 } }
        - { in: query, name: kinds, schema: { type: string }, description: "CSV node kinds." }
        - { in: query, name: predicates, schema: { type: string }, description: "CSV edge predicates." }
        - { in: query, name: states, schema: { type: string }, description: "CSV edge review states." }
        - { in: query, name: minimumConfidence, schema: { type: number, minimum: 0, maximum: 1, default: 0 } }
      responses:
        '200':
          description: Tenant-scoped reasoning graph.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeGraphResponse' }

  /v1/knowledge/reason:
    post:
      tags: [Memory]
      operationId: knowledgeReason
      summary: Run an evidence-backed reasoning query.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasoningQueryRequest' }
      responses:
        '200':
          description: Grounded reasoning result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReasoningQueryResponse' }

  /v1/knowledge/reason/stream:
    post:
      tags: [Memory]
      operationId: knowledgeReasonStream
      summary: Stream an evidence-backed reasoning query over SSE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasoningQueryRequest' }
      responses:
        '200':
          description: SSE stream of ReasoningStreamEventDTO objects.
          content:
            text/event-stream:
              schema: { type: string }

  /v1/knowledge/connections/explain:
    post:
      tags: [Memory]
      operationId: explainKnowledgeConnection
      summary: Explain the strongest bounded paths between two knowledge nodes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectionExplanationRequest' }
      responses:
        '200':
          description: Ranked paths, evidence, confidence, and caveats.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionExplanationResponse' }

  /v1/knowledge/edges/{id}/confirm:
    post:
      tags: [Memory]
      operationId: confirmKnowledgeEdge
      summary: Confirm a suggested connection.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InferenceReviewRequest' }
      responses:
        '200':
          description: Confirmed edge.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeEdgeDTO' }

  /v1/knowledge/edges/{id}/dismiss:
    post:
      tags: [Memory]
      operationId: dismissKnowledgeEdge
      summary: Dismiss a suggested connection without deleting its audit record.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InferenceReviewRequest' }
      responses:
        '200':
          description: Dismissed edge.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeEdgeDTO' }

  # ────────────────────────────── Capture ───────────────────────────────

  /v1/capture/safari:
    post:
      tags: [Capture]
      operationId: captureSafari
      summary: Capture a URL with async OG / YouTube / X enrichment (HER-149).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureSafariRequest' }
      responses:
        '200':
          description: Capture queued; vault file id returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureSafariResponse' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  # ─────────────────────────────── Query ────────────────────────────────

  /v1/query:
    post:
      tags: [Query]
      operationId: query
      summary: Natural-language semantic search across memories + vault.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryRequest' }
      responses:
        '200':
          description: Query result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryResponse' }

  /v1/query/stream:
    post:
      tags: [Query]
      operationId: queryStream
      summary: Streaming natural-language semantic query (SSE).
      description: |
        Returns `text/event-stream` — each event is a JSON-encoded
        `QueryStreamEvent` on a single SSE `data:` line.

        Streams an answer in this order:

        1. One `source` event per top-N retrieved memory hit (client may
           render source chips immediately).
        2. Many `token` events as the LLM produces output deltas.
        3. Optional `summary` event with the final concatenated answer.
        4. One `follow_ups` event with server-generated follow-up chips.
        5. One `done` event to terminate the stream.

        On stream-level failures an `error` event is emitted in lieu of
        `done`. Clients should abort the read loop on either terminator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryRequest' }
      responses:
        '200':
          description: Server-Sent Events stream of `QueryStreamEvent`.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/QueryStreamEvent' }

  # ─────────────────────────── Conversations ────────────────────────────

  /v1/chat/inbox:
    get:
      tags: [Conversations]
      operationId: chatInbox
      summary: Primary Chats inbox summary list.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: workspace
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Chat inbox items with preview, count, source, and recency metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatInboxResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/conversations:
    post:
      tags: [Conversations]
      operationId: conversationCreate
      summary: Create a new chat conversation (HER-37).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationCreateRequest' }
      responses:
        '200':
          description: Created conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationDTO' }
    get:
      tags: [Conversations]
      operationId: conversationList
      summary: List the caller's conversations, newest first (HER-37).
      responses:
        '200':
          description: Conversation list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationListResponse' }

  /v1/conversations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Conversations]
      operationId: conversationGet
      summary: Conversation detail with full message transcript (HER-37).
      responses:
        '200':
          description: Conversation + ordered messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationDetailResponse' }
        '404':
          description: Conversation not found.
    delete:
      tags: [Conversations]
      operationId: conversationDelete
      summary: Delete a conversation and its messages (HER-37).
      responses:
        '204':
          description: Conversation deleted.
        '404':
          description: Conversation not found.

  /v1/conversations/{id}/traces:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Conversations]
      operationId: conversationTraces
      summary: What each turn in this thread actually did.
      description: |
        The expansion behind the summary on `ConversationMessageDTO`: which
        tools ran, whether the preferred provider failed and we fell over to
        another, tokens, cost and latency.

        A separate call so opening a thread does not pay for detail nobody has
        asked to see. `toolNames` may be empty while `toolCallCount` is not —
        the streaming path observes tool invocations without seeing their
        names.
      responses:
        '200':
          description: Traces for this conversation's turns, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTurnTracesResponse' }
        '404':
          description: Conversation not found.

  /v1/conversations/{id}/messages/stream:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Conversations]
      operationId: conversationStreamReply
      summary: Stream an assistant turn over SSE (HER-37).
      description: |
        Persists the user's message immediately, then streams the
        assistant reply as `QueryStreamEvent`s (`source` → `token`s →
        `follow_ups` → `done`). The assistant turn is persisted exactly
        once on `done`; mid-flight failures emit `error` and abort
        persistence.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageStreamRequest' }
      responses:
        '200':
          description: Server-Sent Events stream of `QueryStreamEvent`.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/QueryStreamEvent' }
        '403':
          description: |
            BYOK mode with no provider keys — same envelope as `POST /v1/llm/chat`
            (`byok_keys_required`). May also appear as an SSE `error` event mid-stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredAPIErrorEnvelope'
        '404':
          description: Conversation not found.

  /v1/conversations/{id}/messages/prepare:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Conversations]
      operationId: conversationPrepareLocalReply
      summary: Persist a user turn and prepare grounded context for local inference.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationPrepareRequest' }
      responses:
        '200':
          description: Expiring local-execution context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationPrepareResponse' }

  /v1/conversations/{id}/messages/commit:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Conversations]
      operationId: conversationCommitLocalReply
      summary: Idempotently commit a locally generated assistant turn.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationCommitRequest' }
      responses:
        '200':
          description: Persisted assistant turn and follow-up suggestions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationCommitResponse' }

  /v1/conversations/{id}/local-executions/{executionID}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: executionID
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Conversations]
      operationId: conversationCancelLocalReply
      summary: Cancel an uncommitted prepared local execution.
      responses:
        '204': { description: Cancelled. }
        '409': { description: Execution was already committed. }

  /v1/conversations/{id}/local-executions/{executionID}/tools:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: executionID
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Conversations]
      operationId: localExecutionToolInvoke
      summary: Invoke an allow-listed read-only tool for an active local execution.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalToolInvokeRequest' }
      responses:
        '200':
          description: Read-only tool result and cited memory sources.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalToolInvokeResponse' }
        '404': { description: Tool broker disabled or execution not found. }
        '409': { description: Execution was already committed. }
        '410': { description: Execution expired. }

  /v1/memory/local-sync:
    get:
      tags: [Memory]
      operationId: localMemorySync
      summary: Incrementally synchronize memories for an encrypted client cache.
      parameters:
        - in: query
          name: cursor
          description: Opaque stable pagination cursor. Legacy ISO-8601 cursors remain accepted.
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Updated memories and the next synchronization cursor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalMemorySyncResponse' }

  # ──────────────────────────────── Memos ───────────────────────────────

  /v1/memos:
    post:
      tags: [Memos]
      operationId: memoGenerate
      summary: Generate a memo (agent loop → markdown synthesis → vault save).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoGenerateRequest' }
      responses:
        '200':
          description: Memo generated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoGenerateResponse' }
    get:
      tags: [Memos]
      operationId: memoList
      summary: List memos saved under memos/<date>/<slug>.md for the caller (HER-37).
      responses:
        '200':
          description: Memo list (most-recent first, max 200).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoListResponse' }

  # ─────────────────────────────── Vault ────────────────────────────────

  /v1/vault/files:
    post:
      tags: [Vault]
      operationId: vaultUpload
      summary: Upload a vault file (markdown / image / arbitrary blob).
      description: |
        Raw-body upload. The relative path under `<rawRoot>/` is supplied via
        the `path` query param; the body bytes are written verbatim. The
        optional `space_id` query param associates the row with a Space the
        caller owns — used by the iOS Capture tab so first-tap captures land
        directly into the active Space without a separate move call.
      parameters:
        - in: query
          name: path
          required: true
          description: Tenant-relative file path (e.g. `notes/today.md`).
          schema: { type: string }
        - in: query
          name: space_id
          description: |
            Optional Space association (HER-CaptureTab). Must belong to the
            caller's tenant; cross-tenant UUIDs and malformed UUIDs both
            return 400. Omit to leave the file unfiled. On re-upload to an
            existing path, a provided value overwrites the prior link; an
            omitted value leaves the existing link intact.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: File stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultUploadResponse' }
        '400':
          description: Malformed `path`, malformed `space_id`, cross-tenant space, empty body, or content-type mismatch.
        '507': { $ref: '#/components/responses/InsufficientStorage' }
    get:
      tags: [Vault]
      operationId: vaultList
      summary: List vault files.
      parameters:
        - in: query
          name: space
          description: >-
            Filter by Space slug (HER-9 binding). The reserved value `inbox`
            returns unfiled notes (space_id IS NULL) instead of resolving a
            Space row.
          schema: { type: string }
        - in: query
          name: unfiled
          description: >-
            When `true`, returns only unfiled notes (space_id IS NULL). Alias
            for `space=inbox`. The Inbox bucket uses this.
          schema: { type: boolean }
        - in: query
          name: q
          description: Case-insensitive substring match on file path (HER-105).
          schema: { type: string }
        - in: query
          name: before
          description: Cursor — ISO-8601 createdAt; returns rows older than this.
          schema: { type: string, format: date-time }
        - in: query
          name: after
          description: Cursor — ISO-8601 createdAt; returns rows newer than this.
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, default: 100 }
      responses:
        '200':
          description: Vault file index.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultListResponse' }

  /v1/vault/files/move:
    post:
      tags: [Vault]
      operationId: vaultMove
      summary: Rename / move a vault file.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaultMoveRequest' }
      responses:
        '200':
          description: Updated file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultFileDTO' }

  /v1/vault/files/{path}:
    get:
      tags: [Vault]
      operationId: vaultRead
      summary: Stream raw bytes for a single tenant-owned vault file (HER-105).
      parameters:
        - in: path
          name: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: File body with the stored `Content-Type`.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Vault]
      operationId: vaultDelete
      summary: Delete a vault file by tenant-relative path.
      parameters:
        - in: path
          name: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/vault/export:
    get:
      tags: [Vault]
      operationId: vaultExport
      summary: Stream the full per-tenant vault as a ZIP (HER-91).
      parameters:
        - in: query
          name: since
          schema: { type: string, format: date-time }
          description: Optional incremental cutoff.
      responses:
        '200':
          description: ZIP stream.
          content:
            application/zip:
              schema:
                type: string
                format: binary

  /v1/vault/create:
    post:
      tags: [Vault]
      operationId: vaultCreate
      summary: HER-35 — initialize the tenant vault (folders, SOUL.md, default Spaces). Idempotent.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaultCreateRequest' }
      responses:
        '200':
          description: Vault status after create.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultStatusResponse' }

  /v1/vault/index:
    get:
      tags: [Vault]
      operationId: vaultIndexStatus
      summary: Is the retrievable index up to date with the vault?
      description: |
        Reports how much of the vault is actually searchable with citations.

        Two kinds of drift are counted separately because they need different
        fixes: `unindexedDocumentCount` are documents with no chunks at all
        (run the chunk backfill), `staleDocumentCount` are documents edited
        after they were last indexed (re-index those documents).

        Read-only: calling this never indexes, embeds, or re-resolves anything.

        Distinct from `/v1/vault/status`, which reports vault *provisioning*
        state (has this tenant's vault been created?).
      security: [{ bearerJWT: [] }]
      responses:
        '200':
          description: Index freshness and counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultIndexStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/mcp:
    post:
      tags: [Vault]
      operationId: mcpJsonRpc
      summary: Model Context Protocol endpoint (JSON-RPC 2.0)
      description: |
        Lets an MCP client — Claude Code, Cursor, or any other — ground on this
        user's vault.

        Transport is Streamable HTTP: a JSON-RPC 2.0 request per POST.
        Supported methods are `initialize`, `ping`, `tools/list`, `tools/call`,
        and the `notifications/*` acknowledgements. Notifications return 202
        with no body.

        Eight tools: `status`, `search`, `browse`, `read`, `recent`, `links`,
        `context`, `index`. All are read-only except `index`, which writes
        derived state (chunks and links) and never modifies the user's
        markdown. Call `tools/list` for the current schemas — they are the
        authority, and they are strict, so unknown arguments are rejected
        rather than ignored.

        Tenancy: unlike a loopback single-user MCP server, every call resolves
        its vault from the caller's JWT (and `X-Vault-ID` for shared vaults).
        A tool argument can never select a different tenant.

        Tool-level failures — a path that does not exist, for example — come
        back as a normal result with `isError: true` so the agent can retry,
        not as a JSON-RPC error. JSON-RPC errors are reserved for protocol
        problems: malformed envelope, unknown method, out-of-range argument.
      security: [{ bearerJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, enum: ['2.0'] }
                id:
                  description: Omit for notifications.
                  oneOf: [{ type: string }, { type: integer }]
                method: { type: string }
                params: { type: object, additionalProperties: true }
      responses:
        '200':
          description: JSON-RPC response envelope.
          content:
            application/json:
              schema:
                type: object
                required: [jsonrpc]
                properties:
                  jsonrpc: { type: string, enum: ['2.0'] }
                  id:
                    oneOf: [{ type: string }, { type: integer }, { type: 'null' }]
                  result: { type: object, additionalProperties: true }
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: integer
                        description: JSON-RPC code (-32700 parse, -32600 request, -32601 method, -32602 params, -32603 internal).
                      message: { type: string }
        '202':
          description: Notification accepted; no body.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/vault/lint:
    get:
      tags: [Vault]
      operationId: vaultLint
      summary: Health checks over the vault and its index
      description: |
        Turns "my notes feel messy" into a specific list: broken and ambiguous
        wiki links, duplicate document names, orphans, stale index entries,
        oversized files, empty documents, and unreadable files.

        A GET because it changes nothing — the linter reads files and index
        rows and never rewrites either.

        Severities: `error` means retrieval is affected (a document is
        unreachable or a row claims a file the vault cannot produce);
        `warning` means worth fixing but retrieval still works — a link to a
        note you have not written yet is intent, not damage; `pass` means the
        check found nothing.

        File-derived checks scan at most 2000 documents per call and say so in
        their message when truncated. Each check lists at most 50 findings;
        the counts in `message` remain exact.
      security: [{ bearerJWT: [] }]
      responses:
        '200':
          description: One entry per check, including the ones that passed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultLintReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/vault/context/{vaultFileID}:
    get:
      tags: [Vault]
      operationId: vaultContext
      summary: Deterministic evidence packet for one document
      description: |
        What should be understood alongside this document: its heading
        structure, its neighbours in the same Space, and the documents it
        links to and from.

        No LLM, no scoring, no ranking — every field is a direct read of the
        index, so two calls against an unchanged vault return identical
        results. `danglingLinks` surfaces links that resolve to nothing or to
        more than one document, verbatim as written, rather than hiding them.
      security: [{ bearerJWT: [] }]
      parameters:
        - name: vaultFileID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: siblingLimit
          in: query
          required: false
          description: Same-Space neighbours to return (1-100, default 25).
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: The evidence packet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultContextPacket' }
        '400':
          description: Malformed vaultFileID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/vault/links/{vaultFileID}:
    get:
      tags: [Vault]
      operationId: vaultDocumentLinks
      summary: Outgoing wiki links and backlinks for one document
      description: |
        `outgoing` is every `[[wikilink]]` written in this document, with its
        resolution state. `incoming` is every link elsewhere that resolves to
        this document — backlinks.

        `resolutionState` is `resolved`, `unresolved` (points at a note that
        does not exist yet), or `ambiguous` (the name matches more than one
        document). Ambiguous links are reported rather than guessed.
      security: [{ bearerJWT: [] }]
      parameters:
        - name: vaultFileID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Links in both directions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultLinksResponse' }
        '400':
          description: Malformed vaultFileID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/vault/status:
    get:
      tags: [Vault]
      operationId: vaultStatus
      summary: HER-35 — report whether the tenant vault has been initialized.
      responses:
        '200':
          description: Vault status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultStatusResponse' }

  # ─────────────────────────────── KB ───────────────────────────────────

  /v1/memory-compile:
    post:
      tags: [KB]
      operationId: memoryCompile
      summary: Compile vault rows through the Hermes learning loop ("Sync & Learn").
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      description: |
        Reads `vault_files` rows for the caller and runs the per-tenant Hermes
        agent loop over them. Three input modes:

          * `vaultFileIds == null` (default) — compile every row where
            `processed_at` is null. This is the one-tap UX behind the iOS
            "Sync & Learn" button.
          * `vaultFileIds == [ids]` — compile exactly those rows (tenant-scoped).
          * `forceFullRecompile == true` — compile every row for the tenant,
            ignoring `processed_at` and any explicit IDs.

        Tap-with-nothing-pending is a no-op success: `memoriesIngested: 0` and
        no side effects. First successful compile flips
        `OnboardingState.firstKBCompileCompleted` (wire-format field name
        preserved for backward compat) and emits the `kb_compiled` achievement
        event.

        HER-240 / spec ticket #2 — renamed from `/v1/kb-compile`. The legacy
        path returns 308 Permanent Redirect to this one through one milestone
        for client-migration safety.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KBCompileRequest' }
      responses:
        '200':
          description: Compile result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KBCompileResponse' }

  /v1/memory-compile/pending:
    get:
      tags: [KB]
      operationId: memoryCompilePending
      summary: Cheap count of vault rows with `processed_at` IS NULL (HER-293).
      description: |
        Drives the disabled state and microcopy of the iOS "Sync & Learn"
        button (HER-108). Returns `{ pendingFiles: 0 }` when nothing is
        pending so the client can disable the CTA instead of letting users
        tap into the empty `memoriesIngested: 0` no-op response.

        Tenant-scoped via the standard auth middleware. Backed by a single
        indexed `COUNT(*)` against `vault_files` filtered by tenant + NULL
        `processed_at`, so the endpoint is cheap to poll on screen focus.

        HER-240 / spec ticket #2 — renamed from `/v1/kb-compile/pending`.
        Legacy path 308-redirects to this one for one milestone.
      responses:
        '200':
          description: Pending count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KBCompilePendingResponse' }

  /v1/import:
    post:
      tags: [Import]
      operationId: importLinks
      summary: Stage a batch of URLs into the import inbox ("Feed Your Brain").
      description: |
        Stages each http(s) URL as a vault file in the reserved `imported`
        Space (deduped by URL), tracked under a new import session. Follow with
        POST /v1/import/{id}/categorize, then /approve.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportCreateRequest' }
      responses:
        '200':
          description: Import session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportCreateResponse' }

  /v1/import/bookmarks:
    post:
      tags: [Import]
      operationId: importBookmarks
      summary: Stage links from a Netscape bookmarks HTML export.
      description: |
        Raw bookmarks HTML body (Safari / Chrome "Export Bookmarks"). Parses
        out http(s) links and stages them like POST /v1/import.
      requestBody:
        required: true
        content:
          text/html:
            schema: { type: string }
      responses:
        '200':
          description: Import session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportCreateResponse' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /v1/import/files:
    post:
      tags: [Import]
      operationId: importFiles
      summary: Open an import session over already-uploaded vault files.
      description: |
        For photos / documents / EventKit-rendered notes: the client first
        uploads each via POST /v1/vault/files, then registers the returned ids
        here so they flow through categorize → approve.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportFilesRequest' }
      responses:
        '200':
          description: Import session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportCreateResponse' }

  /v1/import/{id}:
    get:
      tags: [Import]
      operationId: importStatus
      summary: Import session status + items (with proposed Spaces).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Session status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportStatusResponse' }

  /v1/import/{id}/categorize:
    post:
      tags: [Import]
      operationId: importCategorize
      summary: Run Smart Import LLM categorization; returns the proposal.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updated session with proposed Spaces per item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportStatusResponse' }

  /v1/import/{id}/approve:
    post:
      tags: [Import]
      operationId: importApprove
      summary: Apply the Space mapping — file items, enrich links, scoped compile.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportApproveRequest' }
      responses:
        '200':
          description: Import filed and compiled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportApproveResponse' }

  /v1/ingestions:
    post:
      tags: [Ingestion]
      operationId: ingestionCreate
      summary: Create a multimodal ingestion batch.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestionCreateRequest' }
      responses:
        '200':
          description: Batch created; URL items may already be processing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionBatchDTO' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
    get:
      tags: [Ingestion]
      operationId: ingestionList
      summary: List recent multimodal ingestion batches.
      responses:
        '200':
          description: Recent batches.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionBatchListDTO' }

  /v1/ingestion-sources/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string, minLength: 64, maxLength: 64 } }
    get:
      tags: [Ingestion]
      operationId: ingestionSourceDownload
      summary: Stream a short-lived BYO Hermes source with optional byte ranges.
      security: []
      parameters:
        - { name: Range, in: header, required: false, schema: { type: string, example: bytes=0-1048575 } }
      responses:
        '200':
          description: Complete source stream.
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '206':
          description: Requested byte range.
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }
        '416': { description: Requested range is outside the source. }
    head:
      tags: [Ingestion]
      operationId: ingestionSourceHead
      summary: Inspect short-lived BYO Hermes source metadata.
      security: []
      responses:
        '200': { description: Source metadata headers. }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/ingestions/{batchID}:
    get:
      tags: [Ingestion]
      operationId: ingestionDetail
      summary: Get one ingestion batch and item progress.
      parameters:
        - { name: batchID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Batch detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionBatchDTO' }

  /v1/ingestions/{batchID}/events:
    get:
      tags: [Ingestion]
      operationId: ingestionEvents
      summary: Stream durable ingestion progress and terminal events.
      parameters:
        - { name: batchID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: after, in: query, required: false, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: Last-Event-ID, in: header, required: false, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '200':
          description: Server-sent event stream; each ingestion event is durable and resumable by ID.
          content:
            text/event-stream:
              schema: { type: string }

  /v1/ingestions/{batchID}/items/{itemID}/chunks/{index}:
    put:
      tags: [Ingestion]
      operationId: ingestionUploadChunk
      summary: Upload one idempotent chunk (maximum 8 MiB).
      parameters:
        - { name: batchID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: itemID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: index, in: path, required: true, schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204': { description: Chunk accepted. }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /v1/ingestions/{batchID}/items/{itemID}/complete:
    post:
      tags: [Ingestion]
      operationId: ingestionCompleteUpload
      summary: Assemble, validate, vault, and process a completed upload.
      parameters:
        - { name: batchID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: itemID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Updated batch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionBatchDTO' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /v1/ingestions/{batchID}/items/{itemID}/retry:
    post:
      tags: [Ingestion]
      operationId: ingestionRetry
      summary: Retry a failed or capability-blocked item.
      parameters:
        - { name: batchID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: itemID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Updated batch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionBatchDTO' }

  /v1/ingestions/{batchID}/items/{itemID}:
    delete:
      tags: [Ingestion]
      operationId: ingestionCancelItem
      summary: Cancel an unfinished ingestion item and discard temporary chunks.
      parameters:
        - { name: batchID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: itemID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Updated batch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionBatchDTO' }

  /v1/news/ticker:
    get:
      tags: [Plugins]
      operationId: newsTicker
      summary: Breaking-news headlines for the installed news-ticker plugin.
      description: >-
        Curated general-news feeds plus the tenant's own (the plugin's
        `feed_urls` config), read through the cluster's shared feed
        aggregator. Headline, source, time and link only — never a body.
        404 `plugin_not_installed` when the tenant has not installed the
        plugin; 409 `plugin_disabled` when it is installed but off; 503
        `news_ticker_not_configured` when the server has no aggregator.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Headlines.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsTickerResponse' }
        '404': { description: Plugin not installed. }
        '409': { description: Plugin disabled. }
        '502': { description: Feed aggregator unavailable. }
        '503': { description: News ticker not configured on this server. }
  /v1/plugins/catalog:
    get:
      tags: [Plugins]
      operationId: pluginCatalog
