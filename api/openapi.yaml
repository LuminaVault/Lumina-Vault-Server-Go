    KBCompileProgressEvent:
      type: object
      description: |
        HER-288 — message sent over `/v1/ws` while a kb-compile run is in
        flight. WebSocket messages aren't formalized in OpenAPI 3.0; this
        component exists for client codegen + contract documentation.
        Server emits one started, one preparing, one or more thinking,
        zero or more memorySaved, then exactly one completed or error.
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [started, preparing, thinking, memorySaved, completed, error]
        payload:
          description: |
            Shape depends on `type` — refer to the corresponding `KBCompile*DTO`.
          oneOf:
            - $ref: '#/components/schemas/KBCompileStartedDTO'
            - $ref: '#/components/schemas/KBCompilePreparingDTO'
            - $ref: '#/components/schemas/KBCompileThinkingDTO'
            - $ref: '#/components/schemas/KBCompileMemorySavedDTO'
            - $ref: '#/components/schemas/KBCompileCompletedDTO'
            - $ref: '#/components/schemas/KBCompileErrorDTO'

    # ── Spaces ──

    SpaceDTO:
      type: object
      required: [id, name, slug, noteCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        color: { type: string }
        icon: { type: string }
        category:
          type: string
          description: HER-35 — free-form bucket label (e.g. "ai", "stocks") rendered as a segmented chip on the client.
        noteCount:
          type: integer
          description: HER-35 — denormalized memo count for the Space card. Default 0; updated by the ingest path.
        lastCompiledAt:
          type: string
          format: date-time
          description: HER-35 — timestamp of the last KB compile that included this Space; null if never compiled.
        createdAt: { type: string, format: date-time }

    SpaceListResponse:
      type: object
      required: [spaces]
      properties:
        spaces:
          type: array
          items: { $ref: '#/components/schemas/SpaceDTO' }

    SpaceCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        color: { type: string }
        icon: { type: string }
        category: { type: string }

    SpaceUpdateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        color: { type: string }
        icon: { type: string }
        category: { type: string }

    # ── Vault Init (HER-35) ──

    VaultCreateRequest:
      type: object
      description: HER-35 — `POST /v1/vault/create` has no body. Defined as an empty schema so generated clients keep a typed Encodable.
      properties: {}

    VaultStatusResponse:
      type: object
      required: [initialized, defaultSpaceSlugs]
      properties:
        initialized:
          type: boolean
          description: True once the tenant has run `POST /v1/vault/create`.
        createdAt:
          type: string
          format: date-time
        defaultSpaceSlugs:
          type: array
          items: { type: string }
          description: Slugs of Spaces seeded on first vault create.

    # ── Soul ──

    SoulResponse:
      type: object
      required: [markdown]
      properties:
        markdown: { type: string }
        updatedAt: { type: string, format: date-time }

    SoulPutRequest:
      type: object
      required: [markdown]
      properties:
        markdown: { type: string }

    SoulComposeRequest:
      type: object
      description: >-
        Template v2: every field is optional — absent fields get deterministic
        server defaults, so legacy 4-field clients keep working. The composed
        document always embeds the locked core covenant block
        (`<!-- lv:core:vN:start -->` … `<!-- lv:core:vN:end -->`), which the
        server strips and re-injects on every write.
      properties:
        agent_name: { type: string }
        tone:
          type: string
          enum: [warm, concise_technical, playful, coach, formal, casual, dry]
        role:
          type: string
          enum: [assistant, coworker, coach, second_brain]
        autonomy:
          type: string
          enum: [ask_first, suggest, act]
        priorities:
          type: array
          items:
            type: string
            enum: [focus, health, learning, family, money, creative, other]
        other_priority: { type: string, maxLength: 256 }
        format:
          type: string
          enum: [bullets, prose]
        length:
          type: string
          enum: [short, long]
        emojis: { type: boolean }
        voice_samples:
          type: array
          maxItems: 3
          items: { type: string }
        dry_run:
          type: boolean
          description: >-
            When true, returns the composed markdown without persisting it
            (no SOUL.md write, no achievement) — used by onboarding to
            preview the draft before the user edits and saves via PUT.

    # ── Achievements ──

    AchievementDTO:
      type: object
      required: [key, title]
      properties:
        key: { type: string }
        title: { type: string }
        description: { type: string }
        tier: { type: string }
        progressCount: { type: integer }
        targetCount: { type: integer }
        unlockedAt: { type: string, format: date-time }

    AchievementsListResponse:
      type: object
      required: [achievements]
      properties:
        achievements:
          type: array
          items: { $ref: '#/components/schemas/AchievementDTO' }

    AchievementsRecentResponse:
      type: object
      required: [unlocks]
      properties:
        unlocks:
          type: array
          items: { $ref: '#/components/schemas/AchievementDTO' }

    # ── Health ──

    HealthEventDTO:
      type: object
      required: [id, eventType, recordedAt]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string }
        valueNumeric: { type: number }
        valueText: { type: string }
        unit: { type: string }
        recordedAt: { type: string, format: date-time }
        source: { type: string }
        metadata:
          type: object
          additionalProperties: true

    HealthIngestRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/HealthEventInput' }

    HealthEventInput:
      type: object
      required: [eventType, recordedAt]
      properties:
        eventType: { type: string }
        valueNumeric: { type: number }
        valueText: { type: string }
        unit: { type: string }
        recordedAt: { type: string, format: date-time }
        source: { type: string }
        metadata:
          type: object
          additionalProperties: true

    HealthIngestResponse:
      type: object
      required: [ingested]
      properties:
        ingested: { type: integer }

    AppleReminderInput:
      type: object
      required: [externalID, title, completed]
      properties:
        externalID:
          type: string
          description: EventKit `calendarItemIdentifier` — upsert key.
        title: { type: string }
        notes: { type: string }
        dueAt: { type: string, format: date-time }
        completed: { type: boolean }
        completedAt: { type: string, format: date-time }
        listName: { type: string }
        priority:
          type: integer
          description: EventKit priority 0–9 (0 = none).
        remoteUpdatedAt:
          type: string
          format: date-time
          description: EventKit `lastModifiedDate`; drives last-writer-wins on upsert.

    AppleRemindersSyncRequest:
      type: object
      required: [reminders]
      properties:
        reminders:
          type: array
          items: { $ref: '#/components/schemas/AppleReminderInput' }

    AppleSyncResponse:
      type: object
      required: [inserted, updated, skipped]
      properties:
        inserted: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }

    HealthListResponse:
      type: object
      required: [events, limit, offset]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/HealthEventDTO' }
        limit: { type: integer }
        offset: { type: integer }

    HealthDayAggregateDTO:
      type: object
      required: [date, type, value, sampleCount]
      properties:
        date:
          type: string
          format: date-time
          description: Start of the day in UTC.
        type: { type: string }
        value:
          type: number
          format: double
          description: Sum or average over the day per the metric's aggregation policy.
        sampleCount:
          type: integer
          minimum: 0
          description: Contributing sample count for this day. Zero indicates a gap-fill placeholder.

    HealthDailyResponse:
      type: object
      required: [type, days]
      properties:
        type: { type: string }
        days:
          type: array
          items: { $ref: '#/components/schemas/HealthDayAggregateDTO' }
          description: Chronologically ascending; always exactly `days` entries long (gaps filled).

    # ── Skills ──

    SkillRunRequest:
      type: object
      properties:
        input:
          type: string
        arguments:
          type: object
          additionalProperties: { type: string }
        save:
          type: boolean

    SkillRunResponse:
      type: object
      required: [id, skillName, status, markdown, startedAt]
      properties:
        id: { type: string, format: uuid }
        skillName: { type: string }
        status: { $ref: '#/components/schemas/SkillRunStatus' }
        markdown: { type: string }
        savedPath: { type: [string, 'null'] }
        modelUsed: { type: [string, 'null'] }
        mtokIn: { type: [integer, 'null'] }
        mtokOut: { type: [integer, 'null'] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }

    SkillSlashCommandRequest:
      type: object
      required: [command]
      properties:
        command: { type: string }

    # ── Admin ──

    AdminHermesProfilesHealth:
      type: object
      properties:
        totalUsers: { type: integer }
        provisioned: { type: integer }
        errored: { type: integer }
        provisioning: { type: integer }

    AdminReconcileResponse:
      type: object
      properties:
        retried: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }

    AdminReapResponse:
      type: object
      properties:
        orphansReaped: { type: integer }

    AdminLLMHealthResponse:
      type: object
      properties:
        providers:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              enabled: { type: boolean }
              lastSuccessAt: { type: string, format: date-time }
              lastErrorAt: { type: string, format: date-time }
              lastErrorClass: { type: string }

    AdminCorrelateResponse:
      type: object
      properties:
        tenantsProcessed: { type: integer }
        correlationsFound: { type: integer }
        durationMs: { type: integer }

    AdminMemoryScoreResponse:
      type: object
      properties:
        memoriesScored: { type: integer }
        durationMs: { type: integer }

    AdminMemoryPruneResponse:
      type: object
      properties:
        memoriesPruned: { type: integer }
        memoriesArchived: { type: integer }
        durationMs: { type: integer }

    TierOverrideRequest:
      type: object
      required: [override]
      properties:
        # A `TierOverride`, not a `UserTier`: `BillingAdminController`
        # rejects anything outside this set with a 400. The spec used to list
        # the `UserTier` cases here, which documented four values the endpoint
        # has never accepted.
        override: { type: string, enum: [none, pro, ultimate] }
        expiresAt: { type: string, format: date-time }

    TierOverrideResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }
        tier: { type: string }
        tierOverride: { type: string }
        tierExpiresAt: { type: string, format: date-time }

    # ── Kanban ──

    KanbanCardPriority:
      type: string
      enum: [low, medium, high, urgent]

    KanbanCard:
      type: object
      required: [id, columnID, title, rank]
      properties:
        id: { type: string, format: uuid }
        columnID: { type: string, format: uuid }
        title: { type: string }
        body: { type: string, nullable: true }
        priority:
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/KanbanCardPriority' }
        dueAt: { type: string, format: date-time, nullable: true }
        rank: { type: string }
        updatedAt: { type: string, format: date-time, nullable: true }

    KanbanColumn:
      type: object
      required: [id, title, rank, cards]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        rank: { type: string }
        cards:
          type: array
          items: { $ref: '#/components/schemas/KanbanCard' }

    KanbanBoard:
      type: object
      required: [id, title, version, columns]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        version: { type: integer, format: int64 }
        columns:
          type: array
          items: { $ref: '#/components/schemas/KanbanColumn' }

    KanbanBoardSummary:
      type: object
      required: [id, title, version, columnCount, cardCount]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        version: { type: integer, format: int64 }
        columnCount: { type: integer }
        cardCount: { type: integer }
        updatedAt: { type: string, format: date-time, nullable: true }

    BoardVersionResponse:
      type: object
      required: [version]
      properties:
        version: { type: integer, format: int64 }

    BoardCreateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }

    BoardPatchRequest:
      type: object
      properties:
        title: { type: string, nullable: true }
        archived: { type: boolean, nullable: true }

    ColumnCreateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }

    ColumnPatchRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }

    ColumnReorderRequest:
      type: object
      required: [columnID]
      properties:
        columnID: { type: string, format: uuid }
        beforeID: { type: string, format: uuid, nullable: true }
        afterID: { type: string, format: uuid, nullable: true }

    CardCreateRequest:
      type: object
      required: [columnID, title]
      properties:
        columnID: { type: string, format: uuid }
        title: { type: string }
        body: { type: string, nullable: true }
        priority:
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/KanbanCardPriority' }
        dueAt: { type: string, format: date-time, nullable: true }

    CardPatchRequest:
      type: object
      properties:
        title: { type: string, nullable: true }
        body: { type: string, nullable: true }
        priority:
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/KanbanCardPriority' }
        dueAt: { type: string, format: date-time, nullable: true }

    CardMoveRequest:
      type: object
      required: [toColumnID]
      properties:
        toColumnID: { type: string, format: uuid }
        beforeID: { type: string, format: uuid, nullable: true }
        afterID: { type: string, format: uuid, nullable: true }
