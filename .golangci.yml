version: "2"

linters:
  enable:
    - gosec
    - revive
    - misspell
    - errorlint
    - bodyclose
    - noctx
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
      # The parity harness reads scenario/fixture paths the operator passes in.
      - path: ^parity/
        linters: [gosec]
        text: G304
      # Generated code (oapi-codegen, sqlc).
      - path: \.gen\.go$
        linters: [revive, gosec]

formatters:
  enable:
    - gofumpt
    - goimports
