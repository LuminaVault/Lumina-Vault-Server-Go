# Parity environment (Phase 2 Task 2.3). Bring up with scripts/parity-up.sh, not
# `docker compose up`, because the databases must exist first:
#   parity_template  migrated by the Swift image's `migrate`, plus parity/seed/*.sql (base.sql first)
#   parity_swift / parity_go / parity_swift2  CREATE DATABASE ... TEMPLATE parity_template
#
# The Swift image defaults to the one apps/api/values-staging.yaml pins. A
# locally built image works too: PARITY_SWIFT_IMAGE=lv-swift:<sha>.
# Capture's enrichment always tries Jina's reader after the page itself, at a URL
# Swift hard-codes. Refusing the connection keeps real traffic out of a run and
# makes that step fail the same way on every server. The provider hosts below are
# refused for the same reason, so a mistake fails the scenario rather than bills.
# Gemini's chat and model list, and Anthropic's model list, hard-code their hosts,
# so refusal is the only state those paths can be compared in.
x-no-external: &no-external
  - "r.jina.ai:127.0.0.1"
  - "api.anthropic.com:127.0.0.1"
  - "api.openai.com:127.0.0.1"
  - "openrouter.ai:127.0.0.1"
  - "generativelanguage.googleapis.com:127.0.0.1"
  - "api.together.xyz:127.0.0.1"
  - "api.groq.com:127.0.0.1"
  - "api.fireworks.ai:127.0.0.1"
  - "api.deepinfra.com:127.0.0.1"
  - "api.deepseek.com:127.0.0.1"
  - "api.x.ai:127.0.0.1"
  - "integrate.api.nvidia.com:127.0.0.1"
  - "inference-api.nousresearch.com:127.0.0.1"
  - "api.cohere.com:127.0.0.1"
  - "api-atlas.nomic.ai:127.0.0.1"

x-common-env: &common-env
  POSTGRES_HOST: pg
  POSTGRES_PORT: "5432"
  POSTGRES_USER: lv
  POSTGRES_PASSWORD: lv
  JWT_HMAC_SECRETS: parity:parity-secret-parity-secret-0000
  # base64 of 32 bytes of 0x01 (the golden-fixture key; never a real key)
  LV_SECRET_MASTER_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
  FLUENT_AUTOMIGRATE: "false"
  OTEL_ENABLED: "false"
  LOG_LEVEL: warning
  # "test" keeps the schedulers and workers off so DB snapshots only change
  # because of the request under test (Swift App+build.swift `lvEnvironment != "test"`).
  LV_ENVIRONMENT: test
  CORS_ALLOWED_ORIGINS: https://app.luminavault.fyi
  HERMES_API_KEY: parity-hermes-key-not-real-0000000000
  # Unroutable: no scenario may depend on an external service by accident. LLM
  # success paths use the stub below, in a switch state (scripts/parity-switches.sh).
  HERMES_GATEWAY_URL: http://127.0.0.1:9
  # Both servers read these, in this spelling, for every provider that takes a base
  # URL. The legacy LLM_PROVIDER_<KEY>_BASEURL reaches only some adapters. A state
  # puts them all on the stub with SWITCH_LLM_BASE_URL=http://llmstub:8080. No
  # provider has a key here, so they only matter once a state supplies one. Chat needs
  # SWITCH_OPENROUTER_API_KEY as well, a fake one: with no OpenRouter key, FreeLanePolicy
  # puts every tier on the free lane, which has no legs, and the gateway is never called.
  LLM_PROVIDER_OPEN_ROUTER_API_KEY: ${SWITCH_OPENROUTER_API_KEY:-}
  LLM_PROVIDER_ANTHROPIC_BASE_URL: ${SWITCH_LLM_BASE_URL:-http://127.0.0.1:9}
  LLM_PROVIDER_OPENAI_BASE_URL: ${SWITCH_LLM_BASE_URL:-http://127.0.0.1:9}
  LLM_PROVIDER_OPEN_ROUTER_BASE_URL: ${SWITCH_LLM_BASE_URL:-http://127.0.0.1:9}
  LLM_PROVIDER_NVIDIA_BASE_URL: ${SWITCH_LLM_BASE_URL:-http://127.0.0.1:9}
  LLM_PROVIDER_TOGETHER_BASE_URL: ${SWITCH_LLM_BASE_URL:-http://127.0.0.1:9}
  LLM_PROVIDER_GROQ_BASE_URL: ${SWITCH_LLM_BASE_URL:-http://127.0.0.1:9}
  LLM_PROVIDER_FIREWORKS_BASE_URL: ${SWITCH_LLM_BASE_URL:-http://127.0.0.1:9}
  LLM_PROVIDER_DEEP_INFRA_BASE_URL: ${SWITCH_LLM_BASE_URL:-http://127.0.0.1:9}
  LLM_PROVIDER_DEEPSEEK_DIRECT_BASE_URL: ${SWITCH_LLM_BASE_URL:-http://127.0.0.1:9}
  LLM_PROVIDER_XAI_BASE_URL: ${SWITCH_LLM_BASE_URL:-http://127.0.0.1:9}
  LLM_PROVIDER_NOUS_BASE_URL: ${SWITCH_LLM_BASE_URL:-http://127.0.0.1:9}
  LLM_PROVIDER_OLLAMA_BASE_URL: ${SWITCH_LLM_BASE_URL:-http://127.0.0.1:9}
  # Swift's default, which has no DNS here. The base URL carries the version prefix.
  TRANSCRIBE_PROVIDER_OPENAI_BASE_URL: ${SWITCH_TRANSCRIBE_BASE_URL:-http://whisper.horus.svc.cluster.local:8000/v1}
  # Each server has its own container filesystem and no volume, so this one path
  # is a separate tree per server. `parity compare --swift-files/--go-files` reads
  # it with `docker cp`; recreating a container (scripts/parity-up.sh) empties it.
  VAULT_ROOT_PATH: /tmp/luminavault
  BOOTSTRAP_ADMIN_EMAIL: golden@example.test
  BOOTSTRAP_ADMIN_PASSWORD: correct horse battery staple
  # News ticker: the deterministic stub aggregator below (parity/stubs/feeds),
  # plus one curated feed so the curated + user merge is exercised.
  FEEDS_BASE_URL: http://feeds:8080
  FEEDS_DEFAULT_FEEDS: "https://news.parity.test/world.json"
  # Community board on (the other switch states: scripts/parity-switches.sh).
  COMMUNITY_ENABLED: "true"
  COMMUNITY_POSTING_ENABLED: "true"
  ADMIN_TOKEN: parity-admin-token
  # Marketplace: the stub also answers as the plugin runner.
  PLUGIN_RUNNER_URL: http://feeds:8080
  PLUGIN_RUNNER_TOKEN: parity-runner-token
  PLUGIN_ARTIFACT_ROOT: /tmp/lv-plugin-artifacts
  PLUGIN_ARTIFACT_SIGNING_KEY: parity-signing-key-parity-signing-key-0000

services:
  pg:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: lv
      POSTGRES_PASSWORD: lv
      POSTGRES_DB: postgres
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lv -d postgres"]
      interval: 2s
      retries: 30

  swift:
    image: ${PARITY_SWIFT_IMAGE:-lv-swift:fdbed9b0}
    extra_hosts: *no-external
    environment:
      <<: *common-env
      POSTGRES_DATABASE: ${SWIFT_DB:-parity_swift}
    ports: ["18080:8080"]
    depends_on: { pg: { condition: service_healthy }, feeds: { condition: service_started } }
    profiles: [servers]

  swift2:
    image: ${PARITY_SWIFT_IMAGE:-lv-swift:fdbed9b0}
    extra_hosts: *no-external
    environment:
      <<: *common-env
      POSTGRES_DATABASE: parity_swift2
    ports: ["18082:8080"]
    depends_on: { pg: { condition: service_healthy }, feeds: { condition: service_started } }
    profiles: [servers]

  go:
    build: .
    extra_hosts: *no-external
    environment:
      <<: *common-env
      POSTGRES_DATABASE: parity_go
    ports: ["18081:8080"]
    depends_on: { pg: { condition: service_healthy }, feeds: { condition: service_started } }
    profiles: [servers]

  # A second pair with the switches overridden, on their own databases
  # (scripts/parity-switches.sh).
  swift-switched:
    image: ${PARITY_SWIFT_IMAGE:-lv-swift:fdbed9b0}
    extra_hosts: *no-external
    environment:
      <<: *common-env
      POSTGRES_DATABASE: parity_swift_switched
      HERMES_GATEWAY_URL: ${SWITCH_HERMES_GATEWAY_URL:-http://127.0.0.1:9}
      CAPTURE_AUTO_FILE_ENABLED: ${SWITCH_CAPTURE_AUTO_FILE_ENABLED:-false}
      COMMUNITY_ENABLED: ${SWITCH_COMMUNITY_ENABLED:-true}
      COMMUNITY_POSTING_ENABLED: ${SWITCH_COMMUNITY_POSTING_ENABLED:-true}
      ADMIN_TOKEN: ${SWITCH_ADMIN_TOKEN-parity-admin-token}
      PLUGIN_ARTIFACT_SIGNING_KEY: ${SWITCH_SIGNING_KEY-parity-signing-key-parity-signing-key-0000}
      PLUGIN_RUNNER_TOKEN: ${SWITCH_RUNNER_TOKEN-parity-runner-token}
      HYBRID_EXECUTION_ENABLED: ${SWITCH_HYBRID_EXECUTION_ENABLED:-true}
      STORAGE_MIN_FREE_BYTES: ${SWITCH_STORAGE_MIN_FREE_BYTES:-3221225472}
      BILLING_ENFORCEMENT_ENABLED: ${SWITCH_BILLING_ENFORCEMENT_ENABLED:-false}
      VISION_EMBED_PROVIDER: ${SWITCH_VISION_EMBED_PROVIDER:-cohere}
      VISION_EMBED_PROVIDER_COHERE_API_KEY: ${SWITCH_VISION_COHERE_API_KEY-}
      VISION_EMBED_PROVIDER_COHERE_BASE_URL: ${SWITCH_VISION_COHERE_BASE_URL:-https://api.cohere.com}
    ports: ["18083:8080"]
    depends_on: { pg: { condition: service_healthy }, feeds: { condition: service_started } }
    profiles: [switched]

  go-switched:
    image: lvparity-go
    pull_policy: never
    extra_hosts: *no-external
    environment:
      <<: *common-env
      POSTGRES_DATABASE: parity_go_switched
      HERMES_GATEWAY_URL: ${SWITCH_HERMES_GATEWAY_URL:-http://127.0.0.1:9}
      CAPTURE_AUTO_FILE_ENABLED: ${SWITCH_CAPTURE_AUTO_FILE_ENABLED:-false}
      COMMUNITY_ENABLED: ${SWITCH_COMMUNITY_ENABLED:-true}
      COMMUNITY_POSTING_ENABLED: ${SWITCH_COMMUNITY_POSTING_ENABLED:-true}
      ADMIN_TOKEN: ${SWITCH_ADMIN_TOKEN-parity-admin-token}
      PLUGIN_ARTIFACT_SIGNING_KEY: ${SWITCH_SIGNING_KEY-parity-signing-key-parity-signing-key-0000}
      PLUGIN_RUNNER_TOKEN: ${SWITCH_RUNNER_TOKEN-parity-runner-token}
      HYBRID_EXECUTION_ENABLED: ${SWITCH_HYBRID_EXECUTION_ENABLED:-true}
      STORAGE_MIN_FREE_BYTES: ${SWITCH_STORAGE_MIN_FREE_BYTES:-3221225472}
      BILLING_ENFORCEMENT_ENABLED: ${SWITCH_BILLING_ENFORCEMENT_ENABLED:-false}
      VISION_EMBED_PROVIDER: ${SWITCH_VISION_EMBED_PROVIDER:-cohere}
      VISION_EMBED_PROVIDER_COHERE_API_KEY: ${SWITCH_VISION_COHERE_API_KEY-}
      VISION_EMBED_PROVIDER_COHERE_BASE_URL: ${SWITCH_VISION_COHERE_BASE_URL:-https://api.cohere.com}
    ports: ["18084:8080"]
    depends_on: { pg: { condition: service_healthy }, feeds: { condition: service_started } }
    profiles: [switched]

  # A second Swift for the LLM stub self-test (scripts/parity-switches.sh).
  swift2-switched:
    image: ${PARITY_SWIFT_IMAGE:-lv-swift:fdbed9b0}
    extra_hosts: *no-external
    environment:
      <<: *common-env
      POSTGRES_DATABASE: parity_swift2_switched
      HERMES_GATEWAY_URL: ${SWITCH_HERMES_GATEWAY_URL:-http://127.0.0.1:9}
      CAPTURE_AUTO_FILE_ENABLED: ${SWITCH_CAPTURE_AUTO_FILE_ENABLED:-false}
    ports: ["18086:8080"]
    depends_on: { pg: { condition: service_healthy }, feeds: { condition: service_started } }
    profiles: [switched]

  # Stub upstream for LLM, Hermes and Whisper, see parity/stubs/llm/main.go.
  llmstub:
    build: { context: ., dockerfile: parity/stubs/llm/Dockerfile }
    ports: ["18085:8080"]
    profiles: [switched]

  # Stub feed aggregator for the news ticker; fixed answers, see main.go.
  feeds:
    build: { context: ., dockerfile: parity/stubs/feeds/Dockerfile }
    profiles: [servers]
